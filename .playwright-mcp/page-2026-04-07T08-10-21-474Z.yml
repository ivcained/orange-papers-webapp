                    - paragraph [ref=e276]:
                      - generic [ref=e277]: What are the authors really saying here? What are they campaigning for? Do they want us to support a law that demands that all treatment programs teach the Spirituality of the Twelve Steps? Are they really getting that upset over the tiny percentage of treatment programs that are not based on the Twelve Steps?
                    - paragraph [ref=e278]: The reason appears to be both a lack of 'understanding of the role of spirituality in rehabilitation and a reluctance to become involved in what is presumed to be religion' (Booth, 1984a; Kohn, 1984).
                    - paragraph [ref=e279]:
                      - generic [ref=e280]:
                        - text: Excuse me, but we haven't even established that the A.A. and N.A. members who run the treatment programs are not shoving cult religion down the throats of the patients.
                        - link "They usually do that, you know" [ref=e281] [cursor=pointer]:
                          - /url: /content/cult-slogans#ca_mind_control
                        - text: . The Twelve-Step true believers work at counselling jobs in those treatment programs just so that they can convert patients into members of their Twelve-Step religion. So it is absurd to be looking for the cause of why the 12-Step counselors are not doing it.
                    - paragraph [ref=e282]: The result is an incomplete and relapse-prone recovery for the alcoholic.
                    - paragraph [ref=e283]:
                      - generic [ref=e284]:
                        - text: That is some more standard A.A. cult dogma and fear mongering — "
                        - link "phobia induction" [ref=e285] [cursor=pointer]:
                          - /url: orange-cult_a3.html#ca_phobias
                        - text: "\":"
                    - list [ref=e286]:
                      - generic [ref=e288]:
                        - listitem [ref=e289]: "\"You aren't really 'recovering' if you aren't doing the Twelve Steps, you are only 'abstaining'.\""
                        - listitem [ref=e290]: "\"You can't recover from alcoholism if you don't do the Twelve Steps.\""
                        - listitem [ref=e291]:
                          - text: "\"You will turn into a"
                          - link "dry drunk" [ref=e292] [cursor=pointer]:
                            - /url: /content/dry-drunk
                          - text: if you don't do the Twelve Steps."
                        - listitem [ref=e293]: "\"You will relapse if you don't do the Twelve Steps.\""
                        - listitem [ref=e294]:
                          - generic [ref=e295]: "\"If we skip this vital step, we may not overcome drinking.\""
                          - generic [ref=e296]: (The Big Book, 3rd and 4th Editions, William G. Wilson, page 72.)
                    - paragraph [ref=e297]: "Carl Jung observed of one of his patients, \"his craving for alcohol was the equivalent, on a low level, of the spiritual thirst of our being for wholeness, expressed in medieval language: the union with God\" (cited in Sikorsky, 1990, p. 14). Did he mean that spirituality is the same as what we today call religion? Probably not; for the more prominent thinkers of medieval times religion encompassed all aspects of life, both sacred and worldly (Moore, 1992). This broad view of spirituality is similar to that recognized by Booth (1984b) and Whitfield (1984a) as the essential but largely missing element in alcoholism treatment."
                    - paragraph [ref=e298]:
                      - generic [ref=e299]:
                        - text: This is a bunch of ludicrous double-talk. The authors have no idea whether
                        - link "Carl Jung" [ref=e300] [cursor=pointer]:
                          - /url: /content/letters-2#Carl_Jung
                        - text: "was hair-splitting and yammering the A.A. line, \"it's spiritual, not religious.\" They just wish he had. And poor Carl was pretty addled in his old age: He praised the spirituality of the Nazi movement, and allowed himself to be used in radio programs that bragged about the spirituality of the Aryan race and the racial purity programs, breeding tall, blond-haired, blue-eyed Germans for Heinrich Himmler's SS... And Jung said that Jews and women were inherently dishonest and spiritually inferior... So it's hard to guess exactly what Carl Jung might have meant by \"spirituality.\""
                    - paragraph [ref=e301]: Again, how can their much-vaunted "spirituality" be "largely missing" from alcoholism treatment when A.A. totally dominates and controls the alcoholism treatment field? How can the authors possibly think they have something to complain about?
                    - paragraph [ref=e302]: Spirituality is concerned with whomever or whatever is most important in a person's life (George, 1990).
                    - paragraph [ref=e303]: "They really do make some ridiculous statements, don't they? Their description of \"spirituality\" is becoming less and less clear. It seems to be everything to everybody:"
                    - list [ref=e304]:
                      - generic [ref=e305]:
                        - listitem [ref=e306]: If someone is obsessed with getting more money, and that is the most important thing in his life, are his money-grubbing habits "spirituality"?
                        - listitem [ref=e307]: Were the Enron executives "spiritual" when they defrauded the public and stole all of their employees' retirement funds? Why not? Enriching themselves seems to have been the most important thing in their lives...
                        - listitem [ref=e308]: What about a compulsive sex fiend? Are his sexual practices "spirituality"? Why not, when they are the most important thing in his life?
                    - paragraph [ref=e309]: Essentially, spirituality involves attitudes that are based on beliefs about our relationships with our self, with other human beings, with our world (including our physical and social environments), with life (as to its meaning and purpose), and ultimately, with God, a Higher Power, or "Universal Consciousness" (Whitfield, 1984a).
                    - paragraph [ref=e310]: This description of "spirituality" is just a mixture of psychology and religion. What is the difference between my "religious" view and my "spiritual" view of my relationship with God?
                    - paragraph [ref=e311]:
                      - generic [ref=e312]:
                        - text: "The answer is: \"There isn't any difference.\" There is no firewall separating religion and spirituality. In A.A.,"
                        - link "it is all cult religion" [ref=e313] [cursor=pointer]:
                          - /url: /content/cult
                        - text: ", period, in spite of the constantly-repeated slogan about how \""
                        - link "It's spiritual, not religious" [ref=e314] [cursor=pointer]:
                          - /url: /content/spirrel
                        - text: ."
                    - paragraph [ref=e315]: When you strip off the excess verbosity, the authors are saying, "spirituality involves attitudes". What is so spiritual about having an attitude?
                    - paragraph [ref=e316]: If those beliefs were formed in circumstances of unconditional love, acceptance, and trust, we probably exhibit attitudes of unconditional love, acceptance, and trust in all of our relationships. Prezioso called this positive spirituality, which, he said, reflects, "a sense of gratitude and acceptance, a sense of connectedness with others and with a benevolent power greater than self. .. anchored in the belief that life has meaning and purpose and that, although imperfect, each of us is acceptable, lovable, and worthwhile" (1987, p. 239).
                    - paragraph [ref=e317]: "Meaning: if you weren't an abused child, you will have a better, more positive attitude towards life in general. That is hardly a great discovery... Prezioso may have called this \"positive spirituality\" but that doesn't make it so. It isn't spirituality at all, it's just good psychology, and the proper, loving way to raise children, giving them good attitudes about themselves, life, and everything."
                    - paragraph [ref=e318]:
                      - generic [ref=e319]: Note that the authors never used the word "childhood". They just said, "If those beliefs were formed in circumstances of unconditional love..." Well, early childhood is when all of our attitudes about life, the Universe, and everything are formed. A child has formed his or her basic core personality by the age of four. If you treat them good during those years, then they get a positive attitude towards life and their relationships with other people, and they feel good about themselves too. But if you abuse them and mistreat them during those years, then they come out of those first four years bitter and angry, resentful and hateful, and have very negative attitudes towards themselves and other people. They become callous and unfeeling, and cannot be compassionate or considerate of other people's feelings. It is very difficult for them to even feel good. And it is extremely difficult to change those feelings later.
                    - paragraph [ref=e320]: "It's just like baby birds imprinting the image of \"mother\". The baby birds just think that the first big moving thing they see after they hatch out is their mother, and they memorize the picture of it. Once the baby birds imprint, it's impossible to change their minds. Some researchers did a goofy experiment once: They fooled baby birds into thinking that ping-pong balls were their mothers, because ping-pong balls were the first big moving thing that the birds saw after they hatched out. And those poor birds spent the rest of their lives pushing around ping-pong balls... Let us hope that we are not just as blind about some of our imprinting."
                    - paragraph [ref=e321]: When we experience positive spirituality, we tend to view ourselves as lovable, capable, and deserving. We allow others to enter and enrich our lives without feeling a need to manipulate, use, or abuse them. We find our world (job, school, community) to be a largely safe place wherein we are able to develop toward our full potential. Life has positive meaning and purpose, and many of us find a loving God who guides our lives, shares our joys, and sustains us when we are in pain or in need. When positive spirituality dominates our lives, we have no need to alter our moods with addictive substances or behaviors.
                    - paragraph [ref=e322]: "Again, meaning: if you weren't an abused child, you will have a better, more positive attitude towards life in general."
                    - paragraph [ref=e323]: The authors claim that many of us will find a loving God because we weren't abused children? I suppose there is some truth to that. Those children are less likely to believe that a hateful, malicious God runs the Universe. But that isn't "spirituality", that's just somebody's opinion... And it is true that when you feel good, you have less need to make yourself feel good by using drugs or alcohol, but that isn't spirituality either. That's just very simple logic, a truism. If you already feel good, then you don't need to make yourself feel good.
                    - paragraph [ref=e324]: The opposite is true for active alcoholics and sober but nonrecovering alcoholics referred to in AA as "dry drunks." Their lives are dominated by a negative spirituality (Prezioso, 1987). They are insecure, defensive, and lacking in self-esteem. They try to fill their unmet relationship needs by using and abusing others whom they fear and distrust. They see the world as unsafe and use that as justification for conning and manipulating their way through it. Life for them is not only devoid of positive purpose; to quote an often-heard comment, "Life sucks, and then you die." And the god, if any, of their understanding is either harsh and unforgiving or has no relevance to them.
                    - paragraph [ref=e325]: "Meaning: if you were an abused child, you will have a bad, negative attitude towards life in general. That is hardly a great discovery... And, like before, Prezioso calls this \"negative spirituality\", but it still isn't \"spirituality.\" It's just simple, every-day psychology."
                    - paragraph [ref=e326]: According to the authors' logic, positive or negative "spirituality" is basically the kind of mind-set or attitude towards life that comes from being loved or abused as a child... So what is the difference between the authors' ideas of "spirituality" and a psychologist's concepts of "outlook on life" or "attitude towards life"? Apparently none. It would appear that this idea of "spirituality" is quite unnecessary, and can be replaced with simple non-supernatural psychological terms.
                    - paragraph [ref=e327]: But the term "a positive approach to life" doesn't sound nearly as grandiose and ego-pleasing as "positive spirituality", does it? Apparently, the authors and also a lot of A.A. members like to think that God really cares whether they are in a good mood or not... And they like to imagine that they are getting closer to God by being cheerful. — Now actually, there might be something to that. I won't challenge that attitude, because it has a ring of truth to it. You are certainly distancing yourself from God by being hateful. But isn't all of this yammering about "spirituality" just a big self-congratulatory ego trip? Isn't it just the kind of egotism that Bill Wilson and A.A. hate, or claim to hate, and insist must be destroyed?
                    - paragraph [ref=e328]:
                      - generic [ref=e329]:
                        - text: And note how the authors slipped
                        - link "the standard A.A. negative stereotype" [ref=e330] [cursor=pointer]:
                          - /url: /content/us-stupid-drunks
                        - text: "of The Alcoholic into that paragraph: \"They see the world as unsafe and use that as justification for conning and manipulating their way through it. Life for them is ... devoid of positive purpose\"..."
                        - text: The majority of alcoholics are not like that. In fact, the majority of alcoholics eventually quit drinking, and the vast majority of the successful quitters
                        - link "do it by themselves" [ref=e331] [cursor=pointer]:
                          - /url: /content/effectiveness#Harvard_Mental
                        - text: ", without A.A. or any other treatment program, precisely because they have a positive view of life and believe that life is worth living."
                    - paragraph
                    - paragraph [ref=e332]:
                      - generic [ref=e333]:
                        - text: How can you possibly be "sober but nonrecovering" when alcohol was the thing that was killing you, and you aren't drinking it any more?
                        - text: "Simple:"
                        - link "A.A. redefines the word \"recovery\"" [ref=e334] [cursor=pointer]:
                          - /url: /content/cult-answers#ca_cult_speak
                        - text: to mean "doing the Twelve Steps, going to A.A. meetings, and abstaining from drinking alcohol".
                    - paragraph [ref=e335]:
                      - generic [ref=e336]:
                        - text: Also note how the authors managed to slip in that imaginary A.A. bogeyman, the "
                        - link "dry drunk" [ref=e337] [cursor=pointer]:
                          - /url: /content/dry-drunk
                        - text: "\" —"
                        - generic [ref=e338]: "\"sober but nonrecovering alcoholics referred to in AA as 'dry drunks.'\""
                        - text: The A.A. true-believer cult members say that you will turn into a bitterly unhappy dry drunk if you quit drinking alcohol without practicing Bill Wilson's Twelve Steps. There is absolutely no scientific or medical evidence to support that statement. There is no such thing as a
                        - link "dry drunk" [ref=e339] [cursor=pointer]:
                          - /url: /content/dry-drunk#dry_drunk
                        - text: ", the way that A.A. describes it. The \"dry drunk\" story is just more cult-religion dogma —"
                        - generic [ref=e340]: "\"Those people who don't belong to our religion and do our practices are bad. They are seeking an easier, softer way.\""
                        - text: That is also some
                        - link "Phobia Induction" [ref=e341] [cursor=pointer]:
                          - /url: orange-cult_a3.html#ca_phobias
                        - text: ", another standard practice of cult religions. Cults say: \"If you don't join our cult and follow all of our rules, then you will go insane, or Satan will get you, or some other really nasty thing will happen to you.\""
                        - text: In the case of Alcoholics Anonymous, the story is, of course, that your fate is "Jails, Institutions, or Death" if you won't do it the A.A. way.
                    - paragraph [ref=e342]:
                      - generic [ref=e343]:
                        - text: "So the authors say:"
