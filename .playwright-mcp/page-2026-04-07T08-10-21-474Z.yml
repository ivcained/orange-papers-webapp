                        - listitem [ref=e901]: or "belief in God"?
                    - generic [ref=e902]:
                      - paragraph [ref=e903]: How do we measure the "effectiveness" of those things? Effect on what? That will be a very interesting study.
                      - paragraph [ref=e904]:
                        - text: But it really would be interesting to see a good, large, long, controlled study of the "increased spirituality" that is supposedly caused by practicing the Twelve Steps. And let's also measure
                        - generic [ref=e905]: the success rate in actually quitting drinking and staying quit
                        - text: while we are at it. (Remember that quitting drinking is what Alcoholics Anonymous was supposed to be about. But the authors here are now telling us that A.A. is about "the therapeutic effectiveness of positive spirituality".)
                      - paragraph [ref=e906]: "While we are doing that big clinical study, I'd like to see these things measured or counted, too:"
                      - list [ref=e907]:
                        - generic [ref=e908]:
                          - listitem [ref=e909]: economic improvement or decline
                          - listitem [ref=e910]: mental health
                          - listitem [ref=e911]: physical health
                          - listitem [ref=e912]: leaving Alcoholics Anonymous
                          - listitem [ref=e913]: total abstinence from alcohol and drugs
                          - listitem [ref=e914]: relapse
                          - listitem [ref=e915]: moderate, controlled drinking
                          - listitem [ref=e916]: binge drinking
                          - listitem [ref=e917]: drunk-driving arrests
                          - listitem [ref=e918]: other arrests
                          - listitem [ref=e919]: imprisonment
                          - listitem [ref=e920]: child abuse and molestation
                          - listitem [ref=e921]: 13th-Stepping of A.A. newcomers
                          - listitem [ref=e922]: people being told to not take their doctor-prescribed medications
                          - listitem [ref=e923]: hospitalization
                          - listitem [ref=e924]: divorce
                          - listitem [ref=e925]: neurosis
                          - listitem [ref=e926]: psychosis
                          - listitem [ref=e927]: suicide
                          - listitem [ref=e928]: and other deaths
                      - paragraph [ref=e929]: All of those things should be measured or counted often, at the same time, over a period of many years, like 10 or 20 years, to see how those things really correlate with the practice of the Twelve Steps and A.A.'s "positive spirituality". And those patients who stop going to A.A. should still be included in the study, to track what happens with the A.A. drop-outs.
                    - paragraph [ref=e930]:
                      - generic [ref=e931]:
                        - generic [ref=e933]: And all such studies or experiments must have control groups, of course.
                        - text: That means, you have another group that gets no treatment, so that you can do a side-by-side comparison between the treated group and the untreated group, to see what effect the treatment really has.
                    - paragraph [ref=e934]: The hope of the authors is that more reliable scientific proofs will be accumulated to buttress the voluminous anecdotal and heuristic evidence already documenting the central role of spirituality in treating alcoholism.
                    - paragraph [ref=e935]:
                      - generic [ref=e936]:
                        - text: More reliable? There haven't been
                        - generic [ref=e937]: any
                        - text: yet, so we don't just need "more reliable" scientific proofs, or more "reliable" scientific proofs, either. As the authors admit in that sentence, all that exists is rumor, anecdotal stories, and cult belief in the program. But I'm all for us conducting a bunch of valid medical studies, to show everyone what the real truth is. Just make sure that they are real studies, honest and fair studies, not some faked, fudged studies like Project MATCH...
                        - text: And make sure that those studies have control groups, something that Project MATCH failed to do.
                    - paragraph [ref=e938]: Perhaps then, the concept of spiritual awakening promised by Alcoholics Anonymous and other similar twelve step programs will be better understood, accepted, and effectively applied by addiction sufferers as well as those who would aid in their recovery.
                    - paragraph [ref=e939]: And then again, maybe people will start to believe that the Moon really is made of blue cheese.
