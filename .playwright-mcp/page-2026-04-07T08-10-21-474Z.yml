                      - text: A commitment is made to transcend the narrow ego-self and embark on a course of spiritual growth by giving up one's willfulness and surrendering to a power greater than self.
                    - paragraph [ref=e560]:
                      - generic [ref=e561]: More grandiose bull. Very very few people get to transcend the ego, and it is usually the culmination of many years of study and practice. Sometimes, an entire lifetime of study and practice. Declaring that you will quit drinking and transcend the ego instead is just as stupid as declaring that you are going to quit drinking and become a world-class concert violinist instead. Oh, and you are going to do it in just one year, too, even though you have never played a note before in your whole life.
                    - paragraph [ref=e562]: Actually, here is where you are supposed to surrender to the cult. You turn your will and your life over to the control of your sponsor and other old-timers in the group while pretending that you are surrendering to God.
                    - paragraph [ref=e563]:
                      - text: Step 4. Made a searching and fearless moral inventory of ourselves.
                      - text: An honest accounting is made of "character defects." Personal assets and strengths are also noted. An awareness of acceptability despite one's imperfections is created and is reinforced by an accepting fellowship. Ego defenses begin to be surrendered.
                    - paragraph [ref=e564]: No, personal assets, strengths, and positive qualities are never counted. Only bad things, like "character defects", "moral shortcomings" and "resentments" are counted. The goal is to make you feel guilty, inadequate, inferior, powerless, hopeless, and depressed, so that you can be more easily controlled by others.
                    - paragraph [ref=e565]:
                      - generic [ref=e566]:
                        - text: Besides, alcoholics have a "disease", don't they? They should be getting a searching and fearless medical examination, not a moral inventory.
                        - text: (But a medical examination won't induce enough guilt to make you surrender to the cult...)
                    - paragraph [ref=e567]:
                      - text: Step 5. Admitted to God, to ourselves, and to another human being the exact nature of our wrongs.
                      - text: "Responsibility for \"character defects\" is accepted and acknowledged. The ego shrinks as its defenses are overcome: honesty increases self-esteem."
                    - paragraph
                    - paragraph [ref=e568]: See, you confess "the exact nature of your wrongs" here, not your assets and good qualities. The goal is to induce guilt and self-doubt.
                    - paragraph [ref=e569]:
                      - generic [ref=e570]: "They say that \"The ego shrinks as its defenses are overcome: honesty increases self-esteem.\" No, actually, self-respect and self-esteem shrink as you wallow in guilt, self-rating, and self-condemnation."
                    - paragraph [ref=e571]: The authors shove some strange logic on us. The discussion above talked at length — albeit indirectly — about how child abuse and bad childhoods cause "negative spirituality" and "character defects", and now we are being told that our character defects are all our own fault, so we will "accept and acknowledge the responsibility." How is it our own fault if we were abused children?
                    - paragraph [ref=e572]: Now there is nothing wrong with doing an honest self-assessment and figuring out who you really are, and maybe whom you would like to become. I recommend it, in fact. But A.A. twists this all around, and won't let you talk about your good qualities. It is really just a very ordinary cult guilt-induction process, disguised as honesty and self-improvement.
                    - paragraph [ref=e573]: This is actually a bait-and-switch stunt. In the beginning, they tell newcomers that they have a disease, a very dangerous, progressive, usually-fatal disease that is something like an allergy to alcohol, and that they are powerless over it, and that it isn't their fault. So they don't need to feel guilty about being alcoholics.
                    - paragraph [ref=e574]:
                      - generic [ref=e575]:
                        - text: But then they pull a medical-to-moral morph, and demand that the newcomers list all of their sins, everything they ever did wrong in their entire lives, all of their defects of character and moral shortcomings, and wallow in guilt and confess it all, confessing
                        - generic [ref=e576]: the exact nature of their wrongs
                        - text: ","
                        - link "sometimes on their knees in front of their sponsors." [ref=e577] [cursor=pointer]:
                          - /url: orange-cult_a1.html#ca_surrender2cult2Bob
                        - generic [ref=e578]: So what do sins have to do with an allergy?
                        - text: Finally, the new convert is supposed to believe that everything that ever went wrong is his own fault. Bill Wilson wrote that "bottles were only a symbol", and that "our problems were of our own making."
                    - paragraph [ref=e579]: A.A. won't use the "disease" word again until they are trying to hoodwink another newcomer into joining. From here on out, you are guilty of everything.
