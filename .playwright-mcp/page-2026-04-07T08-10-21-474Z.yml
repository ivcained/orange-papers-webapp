                    - text: Alcoholics Anonymous World Services, Inc. (AAWS), New York, 1957, 1986.
                    - text: Harper, New York, 1957.
                    - text: "ISBN: 0-91-685602-X"
                    - text: "LC: HV5278 .A78A4"
                    - text: "Dewey: 178.1 A1c"
                    - text: This is Bill's history of Alcoholics Anonymous. It suspiciously differs from known history
                    - link "here and there" [ref=e1022] [cursor=pointer]:
                      - /url: /content/aacoa
                    - text: .
                    - paragraph [ref=e1023]:
                      - text: "'PASS IT ON', The story of Bill Wilson and how the A.A. message reached the world 'anonymous'"
                      - text: Alcoholics Anonymous World Services, Inc. (AAWS), New York, 1984.
                      - text: "ISBN: 0-916856-12-7"
                      - text: "LC: HV5032 .W19P37x 1984"
                      - text: "LCCN: 84-072766"
                      - text: "Dewey: 362.29/286/O92"
                      - text: This is the official, council-approved version of the history of A.A.. Strangely enough, there is some very interesting stuff in here, including chapter 16, which describes Bill's spook sessions and séances, talking with the spirits of the dead, and communicating with spirits through spirit rapping and the Ouija board. See pages 275 to 285.
                    - paragraph [ref=e1024]:
                      - text: Language Of The Heart William G. Wilson
                      - text: A.A. Grapevine, New York, 1988.
                      - text: "ISBN: 0-933-68516-5"
                      - text: "LC: HV5278 .W15 1988"
                      - text: "LCCN: 88-71930"
                      - text: This is a collection of Bill's writings, speeches, and letters, assembled after his death.
                    - paragraph [ref=e1025]:
                      - text: Bill W. Robert Thomsen
                      - text: Harper & Rowe, New York, 1975.
                      - text: "ISBN: 0-06-014267-7"
                      - text: "Dewey: 362.29 W112t"
                      - text: This is a good biography of William G. Wilson, even if it is very positively slanted towards Mr. Wilson, because the author knew Mr. Wilson and worked beside him for the last 12 years of Mr. Wilson's life. And rumor has it that this book was prepared from autobiographical tapes that Bill Wilson made before he died. So expect it to praise Mr. Wilson a lot. Still, this book will also tell you about some of Bill Wilson's warts, his fat ego, his publicity-hound behavior, and his years-long "dry drunks"...
                    - paragraph [ref=e1026]:
                      - text: Bill W. My First 40 Years 'An Autobiography By The Cofounder of Alcoholics Anonymous'
                      - text: (This is Bill Wilson's autobiography, supposedly published anonymously.)
                      - text: Hazelden, Center City, Minnesota 55012-0176, 2000.
                      - text: "ISBN: 1-56838-373-8"
                      - text: "Dewey: B W11w 2000"
                      - text: This book was reputedly assembled by ghost writers at Hazelden from the same autobiographical tapes of Bill Wilson that Robert Thomsen used for his book.
                    - paragraph [ref=e1027]:
                      - text: Bill W. A Biography of Alcoholics Anonymous Cofounder Bill Wilson Francis Hartigan
                      - text: Thomas Dunne Books, An imprint of St. Martin's Press, 175 Fifth Avenue, New York, NY 10010, 2000.
                      - text: "ISBN: 0-312-20056-0"
                      - text: "Dewey: B W11h 2000"
                      - text: Francis Hartigan was the secretary of and confidant to Bill Wilson's wife Lois. This book is pretty much a white-wash and tells the whole story from Bill's point of view. But it does contain a few surprises, like the chapter "The Other Woman" which details Bill's love affair with Helen Wynn, and hints at all of his other affairs where he cheated on Lois, both before and after sobriety, all of his married life.
                    - paragraph [ref=e1028]:
                      - text: Bill W. and Mr. Wilson — The Legend and Life of A.A.'s Cofounder Matthew J. Raphael
                      - text: University of Massachusetts Press, Amherst, Mass., 2000.
                      - text: "ISBN: 1-55849-245-3"
                      - text: "Dewey: B W11r 2000"
                      - text: This book was written by another stepper — the name 'Matthew Raphael' is a pen name — and it generally praises Bill Wilson and recites the standard party line about most things, but it also contains a bunch of surprises, like detailing Bill's sexual infidelities, his and Bob's spook sessions — talking to the 'spirits' in séances through the use of Ouija boards, spirit rapping, clairvoyance, and channeling, LSD use, and publicity-hound megalomania.
                    - paragraph [ref=e1029]:
                      - text: The Akron Genesis of Alcoholics Anonymous Dick B.
                      - text: Paradise Research Publications, Inc., Box 959, Kihei, HI 96753-0959, 1992, 1998.
                      - text: "ISBN: 1-885803-17-6"
                      - text: "Dewey: 362.2928 B111a 1998"
                    - paragraph [ref=e1030]:
                      - text: "The Soul of Sponsorship: The Friendship of Fr. Ed Dowling, S.J. and Bill Wilson in Letters Robert Fitzgerald, S.J."
                      - text: Hazelden Pittman Archives Press, Center City, MN, 1995.
                    - paragraph [ref=e1031]:
                      - text: "Alcoholics Anonymous: Cult or Cure? Charles Bufe"
                      - text: See Sharp Press, PO Box 1731, Tucson AZ 85702-1731, 1998.
                      - text: "ISBN: 1-884365-12-4"
                      - text: "Dewey: 362.29286 B929a 1998"
                      - text: "(This is the second edition; it has noticeably more information than the first edition. The first edition is: ISBN: 0-9613289-3-2, printed in 1991.)"
                    - paragraph [ref=e1032]:
                      - text: "More Revealed: A Critical Analysis of Alcoholics Anonymous and the Twelve Steps Ken Ragge"
                      - text: ALERT! Publishing, P.O. Box 50233, Henderson, Nevada 89016-0233, 1992.
                    - paragraph [ref=e1033]:
                      - text: The first chapter of More Revealed, which specifically covers Frank Buchman and the earliest days of A.A., is available free on the Internet at
                      - link "http://www.morerevealed.com/" [ref=e1034] [cursor=pointer]:
                        - /url: http://web.archive.org/web/20160315025904/http://www.morerevealed.com/
                    - paragraph [ref=e1035]:
                      - generic [ref=e1036]: AA Horror Stories
                      - text: Rebecca Fransway
                      - text: See Sharp Press, PO Box 1731, Tucson AZ 85702-1731, 2000.
                      - text: "ISBN: 1-884365-24-8"
                      - text: "Dewey: 362.2918 T971 2000"
                      - text: This book will curl your hair. One fair-minded 12-Stepper suggested that every new member should be issued copies of both the Big Book and this book when he or she walks in the door, to tell the newcomers about both the good and bad things that could happen to them in "the rooms." One of the most disturbing repeated themes is women who were the victims of rape or thirteenth-stepping being told to just shut up and find their part in it, and to not harbor any resentments against their attackers.
