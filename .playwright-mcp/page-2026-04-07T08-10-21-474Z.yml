                        - text: and infantile narcissism. God is not Santa Claus, and God is not a Genie who grants three wishes if you rub His lamp. You should learn to depend on yourself, and not expect God to be constantly pulling puppet strings and doing favors for you and answering your prayers. Very few religions believe in a God Who micro-manages the world and grants everybody's wishes. It is bad manners and bad theology to
