                    - paragraph [ref=e702]: Those who achieve this level of spiritual development show the greatest happiness in recovery and seem to have the greatest sobriety. They seem to have a special presence about them, a kind of light in their eyes that draws newly recovering alcoholics to them like a magnet. They are the role models for all who are serious about their recovery. The most effective sponsors come from their ranks. They inspire all who are resolutely working the steps as well as those who have newly entered AA and have not yet committed themselves to its program.
