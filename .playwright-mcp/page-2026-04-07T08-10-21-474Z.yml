                    - paragraph [ref=e610]: This is "Repeat Steps 4 through 9, in an infinite loop." You must continue to criticize yourself and denigrate yourself, forever. Note that it doesn't say anything about when you are right. You dwell on when you are wrong. And they call that neurotic behavior self-improvement. No wonder members relapse.
