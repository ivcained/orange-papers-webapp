                            - generic [ref=e789]: Looking at those who were only beginning and still doubting themselves, the rest of us were able to see the change setting in. From great numbers of such experiences, we could predict that the doubter who still claimed that he hadn't got the "spiritual angle," and who still considered his well-loved A.A. group the higher power, would presently love God and call Him by name.
