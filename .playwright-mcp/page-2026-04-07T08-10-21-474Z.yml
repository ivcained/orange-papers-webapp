                      - link "A. Orange" [ref=e42] [cursor=pointer]:
                        - /url: http://web.archive.org/web/20160315025904/mailto:orange@orange-papers.org
                    - paragraph [ref=e43]: There is quite a cottage industry of A.A. public relations hacks who proselytize for A.A., while hiding their membership in A.A. and pretending to just be neutral observers who cannot help but notice that "A.A. is wonderful for alcoholics..." They routinely plant pro-A.A. articles in magazines and journals.
                    - paragraph [ref=e44]: The following article is all too typical of the pseudo-science that the A.A. true believers are foisting on the public in the name of informing the public about effective treatment for alcoholism. This article pretends to show us how spirituality helps people to recover from excessive alcohol use, but all it really does is try to sell us a lot of Alcoholics Anonymous religious dogma, superstitions, and belief in A.A. "spirituality".
                    - paragraph [ref=e45]: In the following article, the black text is the original article, and the blue text is my comments and responses.
                    - paragraph
                    - separator [ref=e47]
                    - paragraph [ref=e48]:
                      - text: "Title: Spirituality: The key to recovery from alcoholism."
                      - text: "Source: Counseling & Values, April 1996, Volume 40, Issue 3, Page 196."
                      - text: "Authors: Warfield, Robert D.; Goldstein, Marc B."
                      - text: "AN: 9606215267"
                      - text: "ISSN: 0160-7960"
                      - text: "Database: MasterFILE Premier"
                      - text: Available on the Internet through your public library's EBSCO periodicals database.
                    - paragraph [ref=e49]
                    - 'heading "SPIRITUALITY: THE KEY TO RECOVERY FROM ALCOHOLISM" [level=2] [ref=e51]'
                    - paragraph [ref=e52]: The authors suggest that a condition of "negative spirituality" underlies and sustains alcoholism, and perhaps all addictions, and that a secure recovery is not possible unless a "spiritual awakening," such as is envisioned by Alcoholics Anonymous (AA), is achieved. A broadly applicable conceptual model of spirituality is inferred from the AA 12-Step rehabilitation program.
                    - paragraph [ref=e53]:
                      - generic [ref=e54]: "\"Negative spirituality,\" huh? That's just as good as Scientology's \"negative energy\" that infects MEST (Matter, Energy, Space-Time) and screws up the world. Can demon-hunters or exorcists expel that negative spirituality? How about Buffy the Vampire Slayer?"
                    - paragraph [ref=e55]:
                      - generic [ref=e56]: "The authors are introducing A.A. cult beliefs very rapidly. We got three just in this first paragraph. Besides the \"negative spirituality\", we also got the belief that \"a secure recovery is not possible\" without a \"spiritual awakening.\" William G. Wilson, one of the two co-founders of A.A., wrote this in the 'bible' of Alcoholics Anonymous, the book also named Alcoholics Anonymous,, but popularly called The Big Book:"
                    - blockquote [ref=e57]:
                      - generic [ref=e58]:
                        - generic [ref=e60]: If, when you honestly want to, you find you cannot quit entirely, or if when drinking, you have little control over the amount you take, you are probably alcoholic. If that be the case, you may be suffering from an illness which only a spiritual experience will conquer.
                        - generic [ref=e61]: The Big Book, 3rd and 4th Editions, page 44.
                    - generic [ref=e62]:
                      - paragraph [ref=e63]: Neither The American Medical Association nor The American Psychiatric Association recognizes the existence of any disease which only a spiritual experience will conquer, but Alcoholics Anonymous does. And, like the screwy Christian Science religion, A.A. says that only God or a "Higher Power" can cure that "spiritual disease".
                      - paragraph
                      - paragraph [ref=e64]: "Then, the authors stated that \"A broadly applicable conceptual model of spirituality is inferred from the AA 12-Step rehabilitation program.\" That sentence is loaded with implications:"
                      - list [ref=e65]:
                        - listitem [ref=e66]: The Twelve Steps are "spiritual". The authors will never define spirituality, or tell us what it is, or what it means to them; they will try to just sort of infer some vague meaning from the Twelve Steps.
                        - listitem [ref=e67]:
                          - text: The Twelve Steps are a rehabilitation program. The authors will repeat this claim all through this article, but will never support that claim with any actual evidence.
                          - list [ref=e68]:
                            - listitem [ref=e69]:
                              - text: The real evidence says that the Twelve Steps are a program for
                              - link "converting people into religious cult members" [ref=e70] [cursor=pointer]:
                                - /url: /content/rroot-030
                              - text: ", not a program for recovery from alcoholism."
                            - listitem [ref=e71]:
                              - text: The real evidence says that Alcoholics Anonymous is
                              - link "a total failure as a rehabilitation program" [ref=e72] [cursor=pointer]:
                                - /url: /content/effectiveness#Brandsma
                              - text: .
                    - paragraph [ref=e73]: Alcoholics Anonymous' "Big Book" states, "Rarely have we seen a person fail who has thoroughly followed our path. Those who do not recover are people who cannot or will not completely give themselves to this simple program... "(AA World Services, 1976, p. 58). The simple program referred to is AA's twelve steps. They represent the actions taken by the founders of AA to assure their own recovery from alcoholism. AA calls its twelve steps a program of "spiritual awakening" (AA World Services, 1976, p. 60).
                    - paragraph [ref=e74]:
                      - generic [ref=e75]:
                        - text: Yes, the authors are true believers, all right. They are quoting the Alcoholics Anonymous Big Book as an authoritive tome on alcoholism. Few professionals really do that, at least not in public, because it is so stupidly and bombastically written, not to mention the fact that it's
                        - link "totally insane" [ref=e76] [cursor=pointer]:
                          - /url: /content/funny-spirituality
                        - text: ". And their choice of what to quote from the Big Book is a classic — it is one of the worst paragraphs in the whole book:"
                    - paragraph
                    - blockquote [ref=e77]:
                      - generic [ref=e78]:
                        - generic [ref=e80]:
                          - text: RARELY HAVE we seen a person fail who has thoroughly followed our path. Those who do not recover are people who cannot or will not completely give themselves to this simple program, usually men and women who are constitutionally incapable of being honest with themselves. There are such unfortunates. They are not at fault; they seem to have been born that way. They are naturally incapable of grasping and developing a manner of living which demands rigorous honesty. Their chances are less than average. There are those, too, who suffer from grave emotional and mental disorders, but many of them do recover if they have the capacity to be honest.
                          - text: ...
                          - text: At some of these [steps] we balked. We thought we could find an easier, softer way. But we could not.
                        - generic [ref=e81]: The A.A. Big Book, Alcoholics Anonymous, 3rd and 4th Editions, Chapter 5, "How It Works", page 58.
                    - generic [ref=e82]:
                      - paragraph
                      - table [ref=e84]:
                        - rowgroup [ref=e85]:
                          - row "William Griffith Wilson" [ref=e86]:
                            - cell "William Griffith Wilson" [ref=e87]:
                              - generic [ref=e88]:
                                - img
                                - generic [ref=e89]: William Griffith Wilson
                      - text: That is one of the biggest lies in the Big Book. A.A. really has
                      - link "a failure rate that is between 95% and 100%" [ref=e90] [cursor=pointer]:
                        - /url: /content/effectiveness
                      - text: ", but A.A. just blames all of the victims, and says that they are all \"constitutionally dishonest\", and that the Twelve Step program is perfect —"
                      - generic [ref=e91]: "\"The program never fails anyone, it is just the alcoholics who fail the program.\""
                      - text: (==Popular A.A. slogan)
                      - paragraph
                      - paragraph [ref=e92]:
                        - text: The original A.A. members did not discover that the Twelve Steps worked to save alcoholics, or that no "easier, softer way" would work. Bill Wilson's original A.A. group had a horrendous relapse rate, one that
                        - link "Wilson lied about" [ref=e93] [cursor=pointer]:
                          - /url: /content/effectiveness#Bob_memorial
                        - text: .
                      - paragraph [ref=e94]: Like most typical cults, A.A. maintains that its guru and founder, William Griffith ('Bill') Wilson, and his teachings are without error and faultless, and it's just everybody else in the world who is crazy and doesn't understand, and who fails to live up to Bill's divinely-inspired teachings and vast wisdom...
                      - paragraph [ref=e95]: "Lastly, the authors wrote:"
                      - blockquote [ref=e96]: The simple program referred to is AA's twelve steps. They represent the actions taken by the founders of AA to assure their own recovery from alcoholism. AA calls its twelve steps a program of "spiritual awakening" (AA World Services, 1976, p. 60).
                    - paragraph [ref=e97]:
                      - generic [ref=e98]:
                        - text: Again, that is deceptive. The Twelve Steps are just a rewrite of
                        - link "the recruiting and indoctrination practices of Dr. Frank Buchman's Oxford Groups cult religion" [ref=e99] [cursor=pointer]:
                          - /url: /content/rroot-090
                        - text: . They are not the steps taken by the founders, because Bill Wilson didn't write them until four years after he quit drinking. A.A. may call the steps "a program of spiritual awakening", but that isn't what they really are. The Twelve Steps are better described as
                        - link "a program of religious conversion" [ref=e100] [cursor=pointer]:
                          - /url: /content/bait-switch
                        - text: ", or a program of thought reform ("
                        - link "Dr. Robert J. Lifton's terminology" [ref=e101] [cursor=pointer]:
                          - /url: orange-cultinfo.html#Liftons8
                        - text: ) — something that brainwashes people into true believers in some cause.
                    - paragraph [ref=e102]: THE AA REHABILITATION PROGRAM
                    - paragraph [ref=e103]: Alcoholics Anonymous is both a fellowship and a rehabilitation program. The fellowship provides alcoholics with a supportive peer group. It is designed to instill in them the level of trust necessary to risk exposing their vulnerable selves to honest examination and correction of their dysfunctional behaviors and beliefs (Kurtz, 1979).
                    - paragraph [ref=e104]:
                      - generic [ref=e105]:
                        - text: And unfortunately, that trust, that
                        - link "cultish instant intimacy" [ref=e106] [cursor=pointer]:
                          - /url: orange-cult_q1.html#cq_instant_intimacy
                        - text: ", makes it easy for"
                        - link "sexual predators and other sick personalities" [ref=e107] [cursor=pointer]:
                          - /url: orange-cult_a1.html#sexualpred
                        - text: to take advantage of newcomers. Since A.A. sponsors are not licensed or examined or held accountable for their actions in any way whatsoever, it's always open season on the newcomers. And since the newcomers who just quit drinking are still shaky, confused, cloudy-headed, and vulnerable, the predators who want fresh meat have an easy time of it.
                    - paragraph [ref=e108]: It is the twelve step program, not the fellowship, which is primarily responsible for the rehabilitation of the alcoholic (AA World Services, 1976).
                    - paragraph [ref=e109]:
                      - generic [ref=e110]: They claim to be quoting from the Big Book again. The Twelve Steps do the magic, huh, and not the fellowship? (Where? Which page says that? I have never found a page in the Big Book that says that.) Does that mean that we can all quit going to A.A. meetings now?
                    - paragraph [ref=e111]: This study investigated the spiritual implications of AA's twelve step program in an attempt to understand the value of spirituality in achieving a secure recovery from alcoholism.
                    - paragraph [ref=e112]: Calling this piece of preachy propaganda a "study" that "investigated" something is really stretching the English language.
                    - paragraph [ref=e113]: A better understanding of AA spirituality will aid those rehabilitation programs currently, but ineffectively, employing the twelve steps (Booth, 1984a; Kohn, 1984). It might also encourage recovering alcoholics to better use the AA program and thereby reduce their risk of relapse.
                    - paragraph [ref=e114]: We are going to understand "AA spirituality", are we? It would help a lot if they would define their terms, and tell us what they think spirituality actually is, but they don't. They just give us a lot of vague handwaving and then hope that we will go along with it.
                    - paragraph [ref=e115]: The authors complain that some Twelve-Step-based rehabilitation programs are not pushing the spirituality enough? How can that be? That sounds like an internal church problem to me.
                    - paragraph [ref=e116]:
                      - generic [ref=e117]:
                        - text: The authors claim that if alcoholics "better use the AA program", it will "reduce their risk of relapse." Where is the evidence for that?
                        - link "Every good test of A.A. has shown the opposite to be true" [ref=e118] [cursor=pointer]:
                          - /url: /content/effectiveness#scientific
                        - text: . Even a Trustee of Alcoholics Anonymous World Services, Inc., Professor George Vaillant of Harvard University,
                        - link "proved that A.A. treatment was totally ineffective and utterly useless" [ref=e119] [cursor=pointer]:
                          - /url: /content/effectiveness#Vaillant
                        - text: ", when he did an 8-year-long test of A.A. treatment, trying vainly to prove that A.A. does work. He found that A.A. had no better a recovery rate than the usual rate of spontaneous remission in alcoholics — which means that A.A. didn't make anybody quit drinking — but A.A. had a much higher death rate. A.A. had the highest death rate of any treatment program that he examined."
                    - paragraph [ref=e120]: Several studies reveal the success of AA in promoting recovery from alcoholism (Bradley, 1988; Cook, 1988; Emerick, 1987; Hoffmann, Harrison & Belille, 1983; McLatchie and Lomp, 1988; Shereen, 1988; Thurstin, Alfano & Nerviano, 1987). Gorski and Miller, among the foremost of relapse prevention specialists, asserted, "Alcoholics Anonymous is the single most effective treatment for alcoholism" (1986, p. 52).
                    - paragraph [ref=e121]: "That's quite a list of references. Lots of people agreeing that A.A. is perfect. It is a shame that all of those studies and reports fall into one of these categories:"
                    - list [ref=e122]:
                      - generic [ref=e123]:
                        - listitem [ref=e124]: The authors are also hidden members of this same A.A. boosters' club, and their articles aren't any better, or any more truthful, or any more scientific, than this pathetic piece of propaganda.
                        - listitem [ref=e125]: They are being misquoted.
                        - listitem [ref=e126]:
                          - link "They are just flat-out totally wrong" [ref=e127] [cursor=pointer]:
                            - /url: /content/effectiveness#test1
                          - text: ". Some of the reasons for this are:"
                          - list [ref=e128]:
                            - listitem [ref=e129]: The studies are methodologically flawed, and do not measure what they purport to measure.
                            - listitem [ref=e130]: There are no control groups, so the results are unclear, or even meaningless.
                            - listitem [ref=e131]:
                              - text: The so-called "studies" are merely the collected opinions of some A.A. enthusiasts, not the results of valid tests of treatment programs, or actual scientific experiments designed to test A.A.. (Again, what real testing has been done has shown A.A. to be
                              - link "completely ineffective, and even harmful" [ref=e132] [cursor=pointer]:
                                - /url: /content/effectiveness
                              - text: .)
                            - listitem [ref=e133]: The authors accept anecdotal evidence or unsubstantiated testimonials as proof of success.
                    - paragraph [ref=e134]:
                      - generic [ref=e135]:
                        - text: The truth is, Alcoholics Anonymous is not an effective treatment for alcoholism. A.A. does not have a success rate.
                        - link "A.A. has a horrendous failure rate" [ref=e136] [cursor=pointer]:
                          - /url: /content/effectiveness
                        - text: ", one that is between 95 and 100 percent, depending on how you count and measure things. Remember that the usual rate of"
                        - link "spontaneous remission (\"self-healing\") in alcoholics is approximately 5% per year" [ref=e137] [cursor=pointer]:
                          - /url: /content/effectiveness#ftnt06
                        - text: . All of the apparent success stories of A.A. can be explained as mere spontaneous remission — those people would have quit and recovered anyway, without the cult religion.
                    - paragraph [ref=e138]: Nevertheless, relapse (the unintended abuse of alcohol during recovery) even while involved with AA is a distressingly common phenomenon (Blum, 1991). Stories of relapse are often reported by alcoholics who claim to have been active in AA at the time of relapse. Upon questioning, it is usually found that they avoided step-work meetings and attended mostly large "fellowship" meetings at which they could risk less self-exposure. Even for those who claim to have had a "sponsor" to shepherd them through AA and its twelve steps, little effort was made in this vital area.
                    - paragraph [ref=e139]:
                      - generic [ref=e140]:
                        - text: For once, some A.A. true believers admit that their organization has a horrible relapse rate. Eventually, 99% or more of the people leave or relapse, but most A.A. enthusiasts are in denial, and claim that there is no problem.
                        - generic [ref=e142]: "\"It's just weak, sinful people who fail the program. There is nothing wrong with the program. RARELY HAVE we seen a person fail who has thoroughly followed our path...\""
                    - paragraph [ref=e143]:
                      - generic [ref=e144]: And note how the authors play "blame the victim." A.A. members supposedly relapsed because they didn't do the Steps properly, "little effort was made in this vital area". Note that there is no supporting reference or footnote pointing to any study that found that the relapsers didn't do the Steps properly.
                    - list [ref=e145]:
                      - generic [ref=e146]:
                        - listitem [ref=e147]: Where did that "information" come from?
                        - listitem [ref=e148]: Who conducted what study, survey, or poll to discover what kinds of Alcoholics Anonymous meetings the relapsers had been attending?
                        - listitem [ref=e149]: Who "usually found" that the people who relapsed had avoided the step-work kinds of A.A. meetings, and "attended mostly large 'fellowship' meetings at which they could risk less self-exposure"?
                        - listitem [ref=e150]: Who decided that "risking self-exposure" is necessary for recovery from alcoholism?
                        - listitem [ref=e151]:
                          - generic [ref=e152]: So now it isn't enough to go to A.A. meetings all of the time, now we have to attend just the RIGHT KIND of meetings?
                        - listitem [ref=e153]:
                          - text: Who decided that working the Steps is
                          - generic [ref=e154]: a vital area
                          - text: "?"
                    - generic [ref=e155]:
                      - text: "Or are they just taking Bill Wilson's word for it? In the Big Book, Bill hinted that you will relapse unless you do his Twelve Steps:"
                      - generic [ref=e156]: "\"If we skip this vital step, we may not overcome drinking.\""
                      - generic [ref=e157]: (The Big Book, 3rd and 4th Editions, page 72.)
                      - paragraph [ref=e158]: But Bill Wilson did not say that "risking self-exposure" in the right kind of meetings was necessary for recovery from alcoholism.
                    - paragraph [ref=e159]:
                      - generic [ref=e160]:
                        - text: "And the authors' definition of relapse is funny, too: Relapse is \"the unintended abuse of alcohol during recovery\"."
                        - text: What do you call the intentional use of alcohol during recovery? Is it not a relapse if you really did intend to party your brains out? Is intentionally buying a fifth of whiskey and guzzling it down not a relapse?
                    - paragraph [ref=e161]:
                      - text: Relapse Risk Factors in Alcoholism
                      - text: What is it about alcoholism that makes relapse such an ever-present risk?
                    - paragraph [ref=e162]:
                      - generic [ref=e163]:
                        - text: People want to feel good. People have very long memories about
                        - link "what made them feel good in the past" [ref=e164] [cursor=pointer]:
                          - /url: /content/addiction-monster
                        - text: . People tend to forget the negative details, and just remember the pleasure, and they want to feel good again...
                    - paragraph [ref=e165]: Khantzian and Mack (1989) referred to alcoholism as "a complex disorder in which problems of self-governance malignantly interact with other vulnerabilities such as disabilities in regulating feelings (i.e., affects) and self-care to cause biologically susceptible individuals and others to become hopelessly dependent on alcohol" (pp. 79-80). This definition recognizes the importance of personality and behavioral characteristics that are subject to change (AA World Services, 1976; Whitfield, 1984c) as well as biological and genetic factors for which effective treatment has not yet been developed (Blum, 1991; May, 1988).
                    - paragraph [ref=e166]:
                      - generic [ref=e167]: That is quite a complex definition of alcoholism. What's the matter with, "Alcoholism is habitually drinking far too much alcohol"?
                    - paragraph [ref=e168]: They are splitting the blame for alcoholism between psychological and biological/genetic factors. No "spiritual illnesses" yet...
                    - paragraph [ref=e169]:
                      - generic [ref=e170]: "But we are getting plenty of other A.A. tenets:"
                    - list [ref=e171]:
                      - generic [ref=e172]:
                        - listitem [ref=e173]:
                          - generic [ref=e174]: Alcoholics "become hopelessly dependent on alcohol."
                          - text: That is the Step One "powerless over alcohol" belief.
                        - listitem [ref=e175]:
                          - generic [ref=e176]: Alcoholics are "biologically susceptible individuals."
                          - text: That is the genetic factor. Alcoholics are supposedly born with a big problem. Other people may be able to drink all they want, but the situation for congenital alcoholics is "hopeless".
                          - generic [ref=e177]: "[Note that this is true for some alcoholics.]"
                        - listitem [ref=e178]:
                          - generic [ref=e179]: "\"...problems of self-governance malignantly interact with other vulnerabilities...\""
                          - text: "That means, alcoholics are incapable of running their own lives. They were incapable even before they started drinking, because they were born congenital alcoholics. That is the other half of Step One: \"our lives had become unmanageable.\" Alcoholics must have A.A. and their sponsor to run their lives for them, they say."
                    - paragraph [ref=e180]: Alcoholics suffer from what AA calls "character defects" (AA World Services, 1976, p. 59). These are feelings, beliefs, and behaviors that dispose them to seek a sense of well-being by abusing alcohol. Such "character defects" are frequently reflective of a pathological narcissism, in which those addicted to alcohol behave as though they were the center of their universe or their own God (Kurtz, 1979). Alcoholics also possess an underlying codependency involving an alienation from their true selves and an inability to establish functional relationships with significant others in their lives (Whitfield, 1989). The combination of these biological and character risk factors makes alcoholism difficult to treat and makes the recovering alcoholic vulnerable to relapse.
                    - paragraph
                    - table [ref=e182]:
                      - rowgroup [ref=e183]:
                        - row "A.A. cofounder Bill W. in 1949." [ref=e184]:
                          - cell "A.A. cofounder Bill W. in 1949." [ref=e185]:
                            - generic [ref=e187]:
                              - img
                              - text: A.A. cofounder Bill W. in 1949.
                    - generic [ref=e188]:
                      - text: This is nuts. This is just
                      - link "the standard A.A. stereotype of \"The Alcoholic\"" [ref=e189] [cursor=pointer]:
                        - /url: /content/us-stupid-drunks
                      - text: . It is quite untrue. The Alcoholics Anonymous cult founder and chief guru Bill Wilson was one of the few people for whom it was an accurate picture. And it really was an accurate picture of him. He really did think that he was the center of his own universe, or his own God. He had a really bad case of
                      - link "delusions of grandeur, or a narcissistic personality disorder" [ref=e190] [cursor=pointer]:
                        - /url: /content/funny-spirituality#diagnosis
                      - text: . Bill was so crazy that he thought he was in psychic communication with
                      - link "the spirits of dead priests" [ref=e191] [cursor=pointer]:
                        - /url: /content/heresy#Boniface
                      - text: and
                      - link "other dead people" [ref=e192] [cursor=pointer]:
                        - /url: /content/funny-spirituality#Nantucket
                      - text: ", and according to Henrietta Seiberling and Horace Crystal, Bill ended up claiming that he was"
                      - link "the reincarnation of Jesus Christ" [ref=e193] [cursor=pointer]:
                        - /url: /content/funny-spirituality#Henrietta
                      - text: . Henrietta wrote of Bill, "I don't know what is going on in the poor deluded fellow's mind." Bill Wilson's own psychiatrist, Dr. Harry Tiebout,
                      - link "said of Bill Wilson" [ref=e194] [cursor=pointer]:
                        - /url: /content/funny-spirituality#Tiebout_diagnosis
                      - text: ": \"he had been trying to live out the infantilely grandiose demands of 'His Majesty the Baby.'\" So Bill Wilson fits the authors' stereotype."
                    - paragraph
                    - paragraph [ref=e195]:
                      - generic [ref=e196]: "The authors' wording here is both confusing and deceptive: Alcoholics have \"character defects\" that are \"feelings, beliefs, and behaviors that dispose them to seek a sense of well-being by abusing alcohol.\""
                    - paragraph [ref=e197]: Why not just speak plain old English and say that they feel bad, and are trying to feel good? Some of those alcoholics are desperate to feel good, and they make the mistake of thinking that more alcohol will make them feel better...
                    - paragraph [ref=e198]:
                      - generic [ref=e200]:
                        - text: The authors are pulling
                        - link "another bait-and-switch stunt" [ref=e201] [cursor=pointer]:
                          - /url: /content/bait-switch#medical_moral
                        - text: on us here. They just said, in the preceding paragraph, that alcoholism was caused by a genetic factor. Now they are trying to tell us that alcoholism is caused by "character defects" — i.e., immorality.
                    - paragraph [ref=e202]:
                      - generic [ref=e203]: The authors use the term "character defects" here to mean something like "psychological factors" or "mental factors." Here, character defects are "feelings, beliefs, and behaviors". But Bill Wilson used the term "character defects" in the Big Book as a synonym for "sin". Bill didn't want to publicly use the words "sin" or "confession" because that would have created conflicts with the Catholic Church, and he would have lost all of the Catholic members. (And it would have revealed just how intensely religious this cult really is.) So instead of "confessing our sins" while doing Steps 4 and 5, we make a list of all of our "defects of character" and "moral shortcomings", and then we "admit ... the exact nature of our wrongs."
                    - paragraph [ref=e204]:
                      - generic [ref=e205]: "But note that when Bill Wilson wrote his next book, Twelve Steps and Twelve Traditions, published in 1952, 13 years after the Big Book, Bill reverted to using the words \"sin\" and \"confession\" throughout the book:"
                    - paragraph
                    - blockquote [ref=e206]:
                      - generic [ref=e207]:
                        - generic [ref=e208]: That is the measure of our character defects, or, if you wish, of our sins.
                        - generic [ref=e209]: Twelve Steps and Twelve Traditions, William Wilson, page 65.
                    - generic [ref=e210]:
                      - paragraph [ref=e211]: The authors' use of the term "character defects" here is just getting us accustomed to the term, before they pull a psychological-to-moral bait-and-switch redefinition stunt on us. By the time this article ends, "character defects" will be more moral than psychological.
                      - paragraph [ref=e212]:
                        - text: "Then the authors continue their hateful assault on the stereotypical alcoholic:"
                        - generic [ref=e213]: "\"Such 'character defects' are frequently reflective of a pathological narcissism, in which those addicted to alcohol behave as though they were the center of their universe or their own God.\""
                      - paragraph [ref=e214]:
                        - text: That was Bill Wilson's standard attack on alcoholics. Bill Wilson practiced psychological projection a lot. He would declare that all other alcoholics had the very character faults that he himself exemplified, like
                        - link "delusions of grandeur" [ref=e215] [cursor=pointer]:
                          - /url: /content/funny-spirituality#diagnosis
                        - text: or a
                        - link "narcissistic personality disorder" [ref=e216] [cursor=pointer]:
                          - /url: /content/funny-spirituality#Narcissistic
                        - text: ", and having an arrogant world-class inflated ego."
                      - paragraph [ref=e217]: Note that, in just one sentence, the authors went from saying that alcoholics feel bad, and want to feel good, to declaring that alcoholics have "a pathological narcissism" and "behave as though they were the center of their universe or their own God." There is actually no connection between those two things. It really is possible to feel bad, and want to feel good, without having delusions of grandeur and thinking that one is God.
                      - paragraph [ref=e218]:
                        - text: As I said before, Bill Wilson was the alcoholic who best exemplified the A.A. stereotypical "A.A. alcoholic". Bill Wilson had a vicious self-contempt, and lots of hatred and loathing of his own faults and shortcomings, and he projected all of those faults onto an imaginary standard alcoholic.
                        - link "Bill routinely taught contempt and hatred of that stereotypical alcoholic" [ref=e219] [cursor=pointer]:
                          - /url: /content/us-stupid-drunks#darkness
                        - text: . Then Bill declared that
                        - generic [ref=e220]:
                          - text: "\""
                          - link "We are all like that" [ref=e221] [cursor=pointer]:
                            - /url: /content/us-stupid-drunks
                          - text: ."
                        - text: The authors, like so many other 12-Step-indoctrinated drug and alcohol counselors, are just following Bill's teachings here.
                      - paragraph [ref=e222]: That statement, "Alcoholics behave as though they are the center of their universe or their own God" is very standard, often-repeated Wilsonism. And Wilson's next line was usually, "And that sick ego thinks it is too big and too good to need God." Those statements are also part of the A.A. rationale for why the newcomer alcoholics' egos, self-respect, and self-confidence have to be attacked and destroyed. Which, in turn, is part of why Alcoholics Anonymous is a harmful cult that inflicts psychological damage on its members.
                    - paragraph [ref=e223]:
                      - generic [ref=e224]:
                        - text: In the quote above, the authors also stated,
                        - generic [ref=e225]: "\"Alcoholics also possess an underlying codependency\"..."
                        - text: That is just another A.A. superstition — just another phony non-existent disease like
                        - generic [ref=e226]:
                          - text: "\""
                          - link "dry drunk" [ref=e227] [cursor=pointer]:
                            - /url: /content/dry-drunk
                          - text: "\""
                        - text: . Neither the American Medical Association nor the American Psychiatric Association recognize the existence of
                        - link "any such disease or condition as \"codependency\"" [ref=e228] [cursor=pointer]:
                          - /url: /content/snake-oil#codependency
                        - text: ", but A.A. does."
                    - paragraph [ref=e229]: SOME SPIRITUAL IMPLICATIONS OF ALCOHOLISM
                    - paragraph [ref=e230]: If alcoholism is to be effectively treated, the nature of well-being that is sought by the alcohol abuser, no less than by all human beings, must be understood. Well-being can be thought of as meeting one's basic needs. Some might say it means satisfying our wants. But, as many rich and "successful" people will agree, achieving our wants frequently results in a dissatisfying quest for more and more wants. If we were created for a positive purpose, and it makes little sense to think otherwise, satisfying our basic needs should produce a state of well-being.
                    - paragraph [ref=e231]: That sure is a lot of fancy double-talk to avoid saying that people want to feel good, and even need to feel good. Note how the authors suggest that we should not get what we want, because we will then only want more...
                    - paragraph [ref=e232]: Funny how the authors slip a little religion in there, suggesting that "we were created for a positive purpose", and "it makes little sense to think otherwise." Oh really? So now these authors claim to know the Will and Purposes of Our Creator, God? And it makes no sense to question their perceptions? Isn't that just a little bit presumptuous?
                    - paragraph [ref=e233]: What if God is an alien who does not think in human terms at all? Imagining that humans were created for a positive purpose is human logic, and might not be God's way of thinking at all.
                    - paragraph [ref=e234]:
                      - generic [ref=e235]: And, by the way, God definitely IS an alien. He, She, or It is not native to the planet Earth, or even to the Milky Way Galaxy, and probably not even to this Physical Universe... So it is very presumptuous and conceited to imagine that God thinks like humans do. It's the same old "God was created in Man's image" conceit.
                    - paragraph [ref=e236]:
                      - generic [ref=e237]: If you want to just try to imagine how God might think, try Kenneth Rexroth's line, "Your words are inside out."
                    - paragraph [ref=e238]: What, then, are our basic needs? Glasser (1984) seemed to be largely on target, with one exception, when he listed them as survival, belongingness, power, freedom, and fun (or more correctly, pleasure). The survival need, he said, is physical, but the concept could be broadened to include possession of the means to function effectively in the world. The other needs, he said, are psychological. In fact, with the exception of power, which seems culture-bound and compensatory, all the other needs seem to be spiritual in the broadest sense. It is highly likely that our Creator endowed us with these needs for our spiritual development.
                    - paragraph [ref=e239]: "There they go again. More strange religious nonsense. Our \"basic needs\" are all \"spiritual in the broadest sense\"? The authors' idea of what the word \"spiritual\" means seems to change from one paragraph to the next. And this is some strange theology: our basic needs for belongingness, power, freedom, and pleasure help our spiritual development? How? Please define spiritual development. Most preachers say that the pursuit of pleasure hinders spiritual development."
                    - paragraph [ref=e240]: Therefore, no less than for the rest of us, the quest of the alcoholic is for spiritual well-being.
                    - paragraph [ref=e241]: What incredible bull. The quest is for a pleasant buzz, to feel good.
                    - paragraph [ref=e242]:
                      - generic [ref=e243]: The only people who are really on a quest for "spiritual well-being" through chemicals are the users of LSD and other psychedelics. Acid can sometimes, if you are lucky and prepared, and in the right place at the right time, give you some very profound spiritual experiences. Alcohol never does. In fact, it is only alcohol withdrawal, not drinking, that comes even close. The hallucinations of delirium tremens will get you a lot closer to a spiritual state than alcohol ever will.
                    - paragraph [ref=e244]: Of all the basic needs--survival, belongingness, freedom, and pleasure--the most spiritual is belongingness, which can be described as enjoyment of loving, accepting, and trusting relationships with one's self, other people, the world in all aspects of life experiences, life itself, and the God of one's understanding. These relationships seem to be the primary means of achieving well-being for alcoholics and for us all.
                    - paragraph [ref=e245]: Oh? They never defined just what spirituality was, remember? They hinted that we would better understand it, and then they didn't define it. Now we are told that wanting to belong to a group and have trusting relationships is "spiritual". Not social or psychological? This is ridiculous.
                    - paragraph [ref=e246]: Of course it is social. And the drive to socialize is one of the basic human instincts. We have few genuine instincts, but the urge to socialize is one of them. We are intensely tribal animals. Solitary confinement is torture for a human.
                    - paragraph [ref=e247]: "Fish swim in schools, birds flock, horses herd, and so do cows, buffalo, antelope, gazelles, elephants, and on and on. And monkeys and humans live together in tribes. And a big part of our psychology relates to our social relationships: getting status in the tribe, competing with others of our own sex for mates, cooperating with other tribe members for our mutual survival, trading favors... And our need to belong to the tribe is certainly intense. Teenagers, in particular, really go bananas over social acceptance and being one of the gang. To be rejected, ostracized, and exiled from the tribe is often a fate worse than death. To declare that our most \"spiritual\" basic need is \"belongingness\" is not just wrong, it is just plain stupid. The need for companionship is psychological, and it's social, but it isn't \"spiritual\". Again, the authors cannot seem to figure out what the word \"spirituality\" really means."
                    - paragraph [ref=e248]: Alcoholism is best understood and treated holistically (Wegscheider, 1981). It affects every aspect of the human condition. Abuse of alcohol damages a person physically, mentally, emotionally, socially, and spiritually.
                    - paragraph [ref=e249]:
                      - generic [ref=e250]:
                        - text: Yes, that is the standard A.A. party line, "the patient must be treated physically, mentally, and spiritually." And the best "spiritual" treatment program always involves
                        - link "sending the patient to A.A. or N.A. meetings for the \"spiritual benefits\"" [ref=e251] [cursor=pointer]:
                          - /url: /content/coffee#recproc
                        - text: . (I guess the second-best treatment program would be some other cult religion, like The Church of Scientology, which also claims that its courses and "auditing" of members causes "spiritual" benefits.)
                    - paragraph [ref=e252]:
                      - generic [ref=e253]: Note how the Steppers hijack the term "holistic healing" and use it to mean, "You also have to treat the 'spiritual' dimension of people by sending them to A.A. meetings and making them do the Twelve Steps."
                    - paragraph [ref=e254]: The central element in holistic healing is spirituality (Chandler, Holden, & Kolander, 1992; Witmer & Sweeney, 1992). Unfortunately for the alcoholic, it is the spiritual aspect of well-being that is usually overlooked or deemphasized in most treatment programs.
                    - paragraph [ref=e255]:
                      - generic [ref=e256]:
                        - text: "That is a very funny complaint to be making: \"the spiritual aspect of well-being ... is usually overlooked or deemphasized in most treatment programs.\" Funny, considering that at least 90% of all of the treatment programs in the USA are based on the Twelve Steps. (The National Treatment Center Study conducted by the University of Georgia found that 93 percent of the more than 400 representative alcohol treatment programs surveyed were based on the twelve steps of AA."
                        - superscript [ref=e257]:
                          - link "2" [ref=e259] [cursor=pointer]:
                            - /url: "#ftnt02"
                        - text: ) So they should be very spiritual. What is the matter with all of the Alcoholics Anonymous and Narcotics Anonymous members who run those treatment programs?
