                        - text: They maintain that "You won't recover", and "Your life will be dominated by negative spirituality" if you don't join A.A. and do Bill Wilson's Twelve Steps (which he actually got from the fascist minister
                        - link "Dr. Frank Buchman" [ref=e345] [cursor=pointer]:
