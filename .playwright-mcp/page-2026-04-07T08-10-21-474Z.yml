                      - listitem [ref=e1017]:
                        - text: Note that the earlier editions of the A.A. book are available for free on the Internet. It seems that somebody was too 'sober' to remember to renew the copyright (if the original copyright was even ever valid,
                        - link "which is highly unlikely" [ref=e1018] [cursor=pointer]:
                          - /url: /content/bigbook
                        - text: ", because Bill Wilson stole the copyright for himself when the book was really written by more than 30 people)."
