                        - generic [ref=e597]: "\"The Lord helps those who help themselves.\""
                      - paragraph [ref=e598]: But if you learn to depend on yourself, you won't need Alcoholics Anonymous. You won't be addicted to A.A., and A.A. says that's really bad. "Willingness to depend on God" really means willingness to depend on the Alcoholics Anonymous cult, and willingness to surrender one's independence to the cult. That's the A.A. idea of holiness.
                    - paragraph [ref=e599]: Also note the progressive change in terminology that Wilson pulled in steps 4 through 7. In step 4, we were theoretically supposed to do an honest inventory, listing both good and bad things about ourselves. But in step 5, we "admitted our wrongs", only. Then, in step 6, those wrongs were renamed to "defects of character", and in step 7 they were called our moral "shortcomings". Labeling parts of ourselves as defective — so defective that only God can remove the defects — is good for instilling feelings of self-doubt and guilt, but that is not good for recovery.
                    - paragraph [ref=e600]:
                      - text: Steps 8 and 9. Made a list of all persons we had harmed and became willing to make amends to them all, and made direct amends to such people wherever possible, except when to do so would injure them or others.
                      - text: Positive spiritual growth is tested in the humble acceptance of responsibility for wrongs done to others. The making of amends, or just the willingness to do so, increases self-esteem as it erodes egocentricity and constructs positive spiritual connections with others.
                    - paragraph [ref=e601]:
                      - generic [ref=e602]:
                        - text: "More baloney: \"Positive spiritual growth is tested...\" Nobody has even established that the Twelve Steps have a positive influence on people's minds or spirituality, and yet the authors foist \"positive spiritual growth\" on us as a given. (That's the propaganda stunt called"
                        - link "petitio principii" [ref=e603] [cursor=pointer]:
                          - /url: /content/propaganda#petitio_principii
                        - text: — "assume facts not in evidence".) If anything is really being tested here, it is the degree of successful cult indoctrination and conversion to cultish behavior.
                    - paragraph [ref=e604]:
                      - generic [ref=e605]: There is nothing wrong with making amends, where it can be done. And making amends reduces guilt and paranoia, and may increase self-respect. But to claim that it "erodes egocentricity and constructs positive spiritual connections with others" is pretty far-fetched. It is just more of the A.A. religious hype, and voodoo medicine.
                    - paragraph [ref=e606]:
                      - generic [ref=e607]:
                        - text: What's the difference between a "positive spiritual connection" and a "positive social connection"? It looks like the authors are making
                        - link "Bill Wilson's standard mistake" [ref=e608] [cursor=pointer]:
