                    - paragraph [ref=e1008]:
                      - text: Twelve Steps and Twelve Traditions
                      - text: (written by William G. Wilson and
                      - link "Tom P." [ref=e1009] [cursor=pointer]:
                        - /url: /content/other-women#TomP
                      - text: ", published as 'anonymous'.)"
                      - text: Alcoholics Anonymous World Services, Inc. New York, NY, 2000.
                      - text: "ISBN: 0-916856-06-2 (smaller hard cover edition, 2000)"
                      - text: "ISBN: 0-916856-01-1 (larger hard cover edition, 1984)"
                      - text: Library of Congress catalog card number 53-5454
                      - text: "Dewey Dewey: 362.2928 T969 1965"
                      - text: This is one of the most insane and vicious books around. It is right down there with Mein Kampf as far as its ratio of lies to truth, and
                      - link "hate content" [ref=e1010] [cursor=pointer]:
                        - /url: /content/us-stupid-drunks#second_book
                      - text: ", is concerned. It is ostensibly Bill Wilson's explanation of his Twelve Steps and Twelve Traditions, but it is really"
                      - link "something quite dark and evil" [ref=e1011] [cursor=pointer]:
                        - /url: /content/us-stupid-drunks#darkness
                      - text: ", Bill Wilson's poisonous contempt for human nature masquerading as spirituality. It was written while Wilson was in the middle of his eleven-year-long bout of deep clinical depression, and it shows. It is really a brutal, hateful assault on the character of people who happen to have a drinking problem. Bill Wilson hated himself and his own character flaws, so he projected"
                      - link "all of his own weaknesses and character flaws" [ref=e1012] [cursor=pointer]:
                        - /url: /content/us-stupid-drunks#second_book
                      - text: onto the alcoholics around him, and also onto a mythical stereotypical alcoholic, and then said, "Look at him. Look at how disgusting he is. We are all like that." This whole book is non-stop guilt induction.
                    - paragraph [ref=e1013]: For the standard A.A. party line about everything, see the "Big Book", as it is nick-named.
                    - list [ref=e1014]:
                      - listitem [ref=e1015]:
                        - text: Alcoholics Anonymous, Third Edition, 1976, published as "anonymous", but really written by William G. Wilson, Henry Parkhurst, Joe Worth, and 31 or more other people.
