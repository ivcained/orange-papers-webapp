                        - listitem [ref=e592]:
                          - text: A.A. says that you have to destroy your ego to quit drinking. That is, of course, both bad psychology and bad religion. People drink to excess because they want to kill their pain and feel good, not because they think they are the center of the universe.
                          - text: (Personally, I never cared whether I was at the center of the Universe, or in an obscure neighborhood on the outer rim of the Milky Way Galaxy, just as long as the beer was cold and plentiful.)
