                    - paragraph [ref=e346]:
                      - generic [ref=e347]:
                        - text: And some people still claim that Alcoholics Anonymous is
                        - link "not an irrational cult religion" [ref=e348] [cursor=pointer]:
                          - /url: /content/spirrel
                        - text: ...
                    - paragraph [ref=e349]: Nevertheless, they seem to be constantly striving to realize the joys of positive spirituality, albeit through a substitute relationship with alcohol.
                    - paragraph [ref=e350]: They are trying to get a buzz on and feel good, you idiot.
                    - paragraph [ref=e351]: Unfortunately, their strivings are doomed to failure because the relationship with alcohol is unnatural and the problems alcohol abuse creates causes them increasing unhappiness.
                    - paragraph [ref=e352]: Excuse me? This just gets better and better. The last time I heard that "unnatural relationship" rap was in a denunciation of homosexuality by a rabid right-wing hatemonger fundamentalist Christian minister... You know, one of those TV evangelists... So now alcoholics have "unnatural relationships" with their bottles?
                    - paragraph [ref=e353]: So what position constitutes a "natural relationship" with a bottle?
                    - paragraph [ref=e354]: And of course alcohol has bad side effects, and if you drink too much it makes you feel sick. We figured that out for ourselves...
