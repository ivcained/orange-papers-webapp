                    - generic [ref=e60]: does not
                    - text: criticize the Founders, Bill Wilson and Doctor Bob, or their wonderful program. Bill Wilson's "Big Book" — really titled "Alcoholics Anonymous" — is cited as the ultimate answer for everything, a new Bible for contemporary alcoholics. If Bill said something, then it is automatically true. In the eyes of the A.A. faithful, Bill Wilson never made a mistake after he started A.A., and never gave bad advice to any A.A. member. Bill Wilson was a paragon of sanity, clarity, wisdom, and honesty.
                    - paragraph
                    - paragraph [ref=e61]:
                      - text: Many of the true believers in Alcoholics Anonymous actually believe that Bill Wilson's writings were inspired by God, just like the Bible. They say that Wilson wrote the Twelve Steps while
                      - link "receiving guidance" [ref=e62] [cursor=pointer]:
                        - /url: /content/rroot-030#Bill_guided
                      - text: from God. The faithful reverently pore over books like The Big Book, Twelve Steps and Twelve Traditions, and As Bill Sees It as if they were holy scriptures, rather than
                      - link "the ravings of a lunatic" [ref=e63] [cursor=pointer]:
                        - /url: /content/funny-spirituality
                      - text: . Bill's writings in the Big Book — "the first 164 pages" — are considered to be so sacred that they cannot ever be updated, fixed, or changed. The 4th edition of the Big Book was just released, and the first 164 pages are still unchanged. Not a single lie or error was corrected.
                    - paragraph [ref=e64]:
                      - text: The faithful stubbornly ignore the fact that the Big Book and Bill Wilson's other writings demonstrate all too clearly that he was suffering from
                      - link "Delusions of Grandeur" [ref=e65] [cursor=pointer]:
                        - /url: /content/funny-spirituality#diagnosis
                      - text: ", specifically \"Delusional (Paranoid) Disorder, Grandiose Type, mental disorder number 297.10\" as described in the Diagnostic and Statistical Manual of Mental Disorders of the American Psychiatric Association, on pages 200 to 203 in the third edition ("
                      - link "DSM-III-R" [ref=e66] [cursor=pointer]:
                        - /url: /content/bibliography#dsm3
                      - text: ), and on pages 297 to 301 in the fourth edition (
                      - link "DSM-IV" [ref=e67] [cursor=pointer]:
                        - /url: /content/bibliography#dsm4
                      - text: ).
                    - paragraph [ref=e68]:
                      - text: Bill Wilson was also a textbook case of
                      - link "\"Narcissistic Personality Disorder, mental disorder number 301.81\"" [ref=e69] [cursor=pointer]:
                        - /url: /content/funny-spirituality#Narcissistic
                      - text: — again, as described in the DSM-IV, on pages 658-661.
