                      - text: ") Humility: Twelve Steps and Twelve Traditions, page 72, says: \"That basic ingredient of all humility, a desire to seek and do God's will, was missing.\" So all of the appeals for humility are really appeals for obedience to God's will, as William Wilson saw it."
                    - paragraph [ref=e935]:
