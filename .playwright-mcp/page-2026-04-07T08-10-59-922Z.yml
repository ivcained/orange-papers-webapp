                    - paragraph [ref=e226]: "Also see these Cult Test items for more of the You Are Always Wrong routine:"
                    - list [ref=e227]:
                      - listitem [ref=e228]:
                        - link "13. Induction of guilt, and the use of guilt to manipulate group members." [ref=e229] [cursor=pointer]:
                          - /url: orange-cult_a1.html#ca_induce_guilt
