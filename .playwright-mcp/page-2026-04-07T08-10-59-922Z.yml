                              - img
                              - text: Dr. Robert Holbrook Smith
                              - text: August 8 1879 - November 16 1950
                              - text: "Born: Johnsbury, Vermont"
                    - text: "Likewise, the true believers ignore the evidence that Dr. Robert Smith, the other co-founder of A.A., had serious mental problems of his own. The faithful proclaim was Dr. Bob was a wise saint, in spite of the facts that:"
                    - paragraph
                    - paragraph
                    - list [ref=e100]:
                      - listitem [ref=e101]:
                        - text: Doctor Bob seems to have been a power-tripping neurotic dogmatic religious fanatic who got his kicks by having people
                        - link "surrender to God on their knees before him" [ref=e102] [cursor=pointer]:
                          - /url: orange-cult_a1.html#ca_surrender2cult
                        - text: ". He was so narrow-minded that he wrote in the Big Book that he feels sorry for you if you won't accept the religious proclamations of the Bill and Bob team:"
                        - paragraph
                        - blockquote [ref=e103]:
                          - generic [ref=e104]: If you think you are an atheist, an agnostic, a skeptic, or have any other form of intellectual pride which keeps you from accepting what is in this book, I feel sorry for you.
                          - generic [ref=e105]: The Big Book, 3rd & 4th Editions, Dr. Robert Holbrook Smith, Doctor Bob's Story, Page 181.
                        - paragraph
                      - listitem [ref=e106]:
                        - text: Doctor Bob was such an insane autocratic tyrant that he forced a 31-year-old alcoholic womanizer on his 17-year-old step-daughter Sue Smith in order to break up her high-school romance with her teenage boyfriend Ray Windows, whom Doctor Bob didn't like. The older alcoholic was "A.A. Number Four" — the constantly-relapsing, philandering,
                        - link "Ernie Galbraith" [ref=e107] [cursor=pointer]:
                          - /url: /content/cult-slogans#Galbraith
                        - text: — the author of the Big Book first edition story "The Seven-Month Slip". The 'seven-month slip' was not a small slip after seven months of sobriety; it was a full-blown seven-month-long hard-drinking relapse after a year of sobriety.
                        - paragraph [ref=e108]:
                          - text: You would think that Doctor Bob should have learned something about Ernie from reading his autobiographical story in the Big Book, but no, Doctor Bob didn't learn anything. Then, after Ernie took Susan for himself, Doctor Bob complained bitterly that Ernie Galbraith had "double-crossed him" by seducing Sue Smith.
                          - superscript [ref=e110]:
                            - link "2" [ref=e111] [cursor=pointer]:
                              - /url: "#ftnt02"
                      - listitem [ref=e112]:
                        - text: Dr. Bob was so damaged by alcohol that he was apparently incapable of supporting himself and his family while ostensibly still practicing medicine. Dr. Bob had to be supported by an A.A. handout for the rest of his life.
                        - generic [ref=e113]: What kind of a doctor is so incapable of earning his own keep that he has to be supported by charity?
                    - text: See
                    - link "Item 38, Disturbed Guru" [ref=e114] [cursor=pointer]:
                      - /url: /content/cult-slogans#ca_disturbed_guru
                    - text: ", for more information on these two sterling examples of sanity and wisdom."
                    - paragraph [ref=e115]:
                      - generic [ref=e116]:
                        - generic [ref=e118]:
                          - link "2" [ref=e119] [cursor=pointer]:
                            - /url: /content/cult-questions#cq_you_wrong
                          - text: . You are always wrong.
                        - text: The individual members of the cult are told that they are inherently small, weak, stupid, ignorant, and sinful, and are in no way qualified to judge the Guru or his church.
                      - text: A.A. scores a 10 on this one too.
                    - paragraph [ref=e120]: According to Bill Wilson and A.A., you are just a brain-damaged alcoholic, "powerless over alcohol", your thinking is "alcoholic", and you aren't qualified to judge A.A. or the teachings of Bill Wilson. If you disagree with any of the insanity of A.A., it just proves that you are diseased and in denial. Sober former drinkers who criticize A.A. are dismissed as "dry drunks."
                    - paragraph
                    - blockquote [ref=e121]:
                      - link "'When I expressed my feelings of resentment towards AA to a \"friend\" (who had introduced me to the program), he told me that \"criticizing AA is a loser behavior\".'" [ref=e123] [cursor=pointer]:
                        - /url: /content/letters-90#resentment
                    - paragraph [ref=e124]: "Applicable slogans include:"
                    - list [ref=e125]:
                      - listitem [ref=e126]: "\"The program is perfect; it's just people who are imperfect.\""
                      - listitem [ref=e127]: "\"Don't criticize the program.\""
                      - listitem [ref=e128]: "\"The program never fails; people just fail the program.\""
                      - listitem [ref=e129]: "\"You have a thinking problem, not a drinking problem.\""
                      - listitem [ref=e130]: "\"Your best thinking got you here.\""
                      - listitem [ref=e131]: "\"You need a checkup from the neck up.\""
                      - listitem [ref=e132]: "\"Stop Your Stinkin' Thinkin'.\""
                      - listitem [ref=e133]: "\"Stuff Your Feelings.\""
                      - listitem [ref=e134]: "\"Feelings Aren't Facts.\""
                      - listitem [ref=e135]: "\"Principles Before Personalities.\""
                      - listitem [ref=e136]: "\"A person with one eye on yesterday and one eye on tomorrow is living cockeyed.\""
                      - listitem [ref=e137]: "\"Be Part Of The Solution, Not The Problem.\""
                      - listitem [ref=e138]: "\"N.U.T.S. — Not Using the Steps.\""
                      - listitem [ref=e139]: "\"Have A Good Day Unless You've Made Other Plans.\""
                      - listitem [ref=e140]:
                        - text: "\"Let Go Of Old Ideas.\""
                        - superscript [ref=e142]:
                          - link "3" [ref=e143] [cursor=pointer]:
                            - /url: "#ftnt03"
                      - listitem [ref=e144]: "\"P.L.O.M. = Poor Little Old Me.\""
                      - listitem [ref=e145]: "\"You're only as sick as your secrets.\""
                      - listitem [ref=e146]: "\"We're All Here Because We're Not All There.\""
                      - listitem [ref=e147]: "\"Some people are so successful in recovery, they turn out to be almost as good as they thought they were while drinking.\""
                      - listitem [ref=e148]: "\"Take the cotton out of your ears and stick it in your mouth.\""
                      - listitem [ref=e149]: "\"Sit Down, Shut Up, and Learn Something.\""
                      - listitem [ref=e150]: "\"Alcoholics can't afford to have resentments.\""
                      - listitem [ref=e151]: "\"Opinions are like ass-holes — everybody's got one, and most of them stink.\""
                      - listitem [ref=e152]: "\"He suffers from terminal uniqueness.\""
                      - listitem [ref=e153]: "\"Get humble.\""
                      - listitem [ref=e154]: "\"There is a God and you are not Him.\""
                    - paragraph [ref=e155]:
                      - text: Members are shamed and
                      - link "made to feel small, weak, stupid and sinful" [ref=e156] [cursor=pointer]:
                        - /url: /content/us-stupid-drunks
                      - text: "by constantly making lists of all of their faults, wrongs, moral shortcomings, and defects of character, and confessing them both privately and publicly. Members are taught to beat up on themselves: the slogan is \"You can't save your ass and your face at the same time.\" And if they don't do a good enough job of it, their sponsors will fill in the gaps in the \"ego deflation,\" which is really destruction of the new member's self-confidence, self-esteem, self-respect, and ability to think and act independently."
                    - paragraph [ref=e157]: "And members are definitely taught to distrust their own minds and their own feelings:"
                    - paragraph
                    - blockquote [ref=e158]:
                      - generic [ref=e159]:
                        - text: "\"Stop your stinkin' thinking'.\""
                        - text: "\"Your best thinking got you here.\""
                        - text: "\"You have a thinking problem, not a drinking problem.\""
                        - text: "\"Stuff Your Feelings.\""
                        - text: "\"Feelings Aren't Facts.\""
                      - text: — Popular A.A. slogans
                      - paragraph [ref=e160]:
                        - generic [ref=e161]: "\"... no alcoholic ... can claim 'soundness of mind' for himself.\""
                        - generic [ref=e162]: Twelve Steps and Twelve Traditions, William Wilson, page 33.
                    - paragraph
                    - list [ref=e163]:
                      - listitem [ref=e164]:
                        - text: They will be told that
                        - link "their mind is useless" [ref=e165] [cursor=pointer]:
                          - /url: orange-cult_a6.html#ca_dont_trust_mind
                        - text: ", damaged by alcohol, and is a great liability. They will be told that"
                        - link "alcohol is cunning, baffling, and powerful" [ref=e166] [cursor=pointer]:
                          - /url: /content/bait-switch#cunning
                        - text: ", and that their minds are being controlled by their addiction to alcohol, and that their addiction wants to kill them."
                      - listitem [ref=e167]: They will be told that their old bad habits don't want to let go of them, so any deviation from the program is proof that they are diseased.
                      - listitem [ref=e168]: Any disagreement with the standard dogma, or any attempt to think and act independently, is interpreted as alcoholism dominating the member's mind, and defeating his attempts at sobriety.
                    - paragraph [ref=e169]:
                      - text: On top of all of that, Bill Wilson had a vicious hatred of alcoholics. That may seem unlikely, since he supposedly dedicated his life to unselfishly helping alcoholics and saving their lives, but it is true.
                      - link "Bill Wilson actually denigrated alcoholics and put them down at every opportunity." [ref=e170] [cursor=pointer]:
                        - /url: /content/us-stupid-drunks
                      - text: Bill dedicated the second half of his life to being a cult leader and making alcoholics into his slaves who supported him in comfort for the rest of his life, so that he never had to work again. Bill Wilson actually hated himself, and had a vicious contempt for his own faults and character flaws, so he projected his own failings onto everyone around him. He created a very negative stereotype of "The Alcoholic", and projected all of his faults onto that mythical character, and then he said, "Look at how disgusting he is. We are all like that."
                    - paragraph [ref=e171]: "Bill Wilson declared that:"
                    - list [ref=e172]:
                      - listitem [ref=e173]:
                        - text: Alcoholics' personalities are dominated by "
                        - link "character defects" [ref=e174] [cursor=pointer]:
                          - /url: /content/spirrecov#stereotype1
                        - text: "\" (meaning: sins), particularly the"
                        - link "Seven Deadly Sins" [ref=e175] [cursor=pointer]:
                          - /url: /content/us-stupid-drunks#darkness
                        - text: of Pride, Greed, Sloth, Gluttony, Lust, Anger, and Envy.
                      - listitem [ref=e176]:
                        - text: Alcoholics are very dishonest, and will
                        - link "\"wiggle out of\"" [ref=e177] [cursor=pointer]:
                          - /url: /content/funny-spirituality#wiggle
                        - text: the terms of a contract, if they can do it.
                      - listitem [ref=e178]:
                        - text: Alcoholics are
                        - link "very selfish" [ref=e179] [cursor=pointer]:
                          - /url: /content/heresy#mundane
                        - text: .
                      - listitem [ref=e180]:
                        - text: Alcoholics are
                        - link "full of resentments" [ref=e181] [cursor=pointer]:
                          - /url: /content/cult-answers#spiritual_disease
                        - text: .
                      - listitem [ref=e182]:
                        - text: Alcoholics are
                        - link "an argumentative lot" [ref=e183] [cursor=pointer]:
                          - /url: /content/us-stupid-drunks#alcoholic_defects
                        - text: .
                      - listitem [ref=e184]:
                        - text: Alcoholics are all
                        - link "stupid, superstitious, and cowardly" [ref=e185] [cursor=pointer]:
                          - /url: /content/us-stupid-drunks
                        - text: .
                      - listitem [ref=e186]:
                        - text: Alcoholics are
                        - link "manipulative" [ref=e187] [cursor=pointer]:
                          - /url: /content/funny-spirituality#manipulative
                        - text: ", and will always try to get their own way in some underhanded fashion."
                      - listitem [ref=e188]:
                        - text: Alcoholics are completely selfish and inconsiderate. For some of them, recruiting another member for A.A. was
                        - link "the first time in their lives" [ref=e189] [cursor=pointer]:
                          - /url: orange-Why_We_Were_Chosen.html#first_unselfish
                        - text: that they had ever committed an unselfish act.
                      - listitem [ref=e190]:
                        - text: Alcoholics are all alike, and all alcoholics have immensely inflated egos, and they are all
                        - link "pompous, self-important, strutting-peacock fools" [ref=e191] [cursor=pointer]:
                          - /url: /content/tiebout#stereotype
                        - text: . They think they are "the center of the Universe", and too big and "
                        - link "too good to need God" [ref=e192] [cursor=pointer]:
                          - /url: /content/other-women#too_good
                        - text: ."
                      - listitem [ref=e193]:
                        - text: Alcoholics even imagine that they are God (which is why Ernest Kurtz wrote a very pro-AA book named "
                        - link "Not God" [ref=e194] [cursor=pointer]:
                          - /url: /content/bibliography#Kurtz
                        - text: "\")."
                      - listitem [ref=e195]:
                        - text: Alcoholics
                        - link "don't want to be moral" [ref=e196] [cursor=pointer]:
                          - /url: /content/us-stupid-drunks#lash_of_alcoholism
                        - text: .
                        - list [ref=e197]:
                          - listitem [ref=e198]: They don't want to be good.
                          - listitem [ref=e199]: They don't want to do the right thing.
                          - listitem [ref=e200]: They don't want to do what will help them to recover.
                          - listitem [ref=e201]: They won't work the Twelve Steps until they "bottom out" and "the lash of alcoholism" beats them into submission.
                      - listitem [ref=e202]:
                        - text: The alcoholic doesn't like to live
                        - link "any place but in the past" [ref=e203] [cursor=pointer]:
                          - /url: /content/us-stupid-drunks#live_past
                        - text: .
                      - listitem [ref=e204]:
                        - text: See the file
                        - link "The 'Us Stupid Drunks' Conspiracy" [ref=e205] [cursor=pointer]:
                          - /url: /content/us-stupid-drunks
                        - text: for much, much more of Bill's ravings about how bad alcoholics are.
                    - paragraph [ref=e206]: All of which leaves us with one big question, "If alcoholics are all so bad, how could the leading alcoholic, Bill Wilson, be so 'spiritual'?"
