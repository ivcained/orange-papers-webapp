                    - text: The faithful even ignore the fact that
                    - link "Bill Wilson took sexual advantage of sick women" [ref=e90] [cursor=pointer]:
                      - /url: /content/other-women#screw_patients
                    - text: who came to A.A. seeking help to avoid death from alcohol. While women were still shaky, cloudy-headed, and confused from alcohol poisoning and alcohol withdrawal, Bill Wilson was scheming to get into their pants. That is an especially heartless kind of exploitation of vulnerable people.
                    - paragraph [ref=e91]
                    - table [ref=e93]:
                      - rowgroup [ref=e94]:
                        - 'row "Dr. Robert Holbrook Smith August 8 1879 - November 16 1950 Born: Johnsbury, Vermont" [ref=e95]':
                          - 'cell "Dr. Robert Holbrook Smith August 8 1879 - November 16 1950 Born: Johnsbury, Vermont" [ref=e96]':
