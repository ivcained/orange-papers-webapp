                    - paragraph [ref=e45]: "So how does A.A. score as a cult? On a scale of zero to ten, where zero means that it isn't like a cult at all, and ten means that A.A. is really like a cult, I score A.A. like this: (Feel free to grab a piece of paper, and make up your own scores. It isn't like I own a monopoly on the truth, or anything...)"
