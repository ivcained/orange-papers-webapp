                      - text: — "A.A. Number Four" — the constantly-relapsing older alcoholic philanderer whom the autocratic Doctor Robert Smith forced on his teenage daughter Sue Smith, relapsed all of his life.
                      - paragraph
                    - listitem [ref=e1959]:
                      - text: Pat C. of Los Angeles, the subject of the first-edition story "The Lone Endeavor", whose story was removed from the Big Book after he showed up in New York City more than a little intoxicated.
                      - paragraph
                    - listitem [ref=e1960]:
                      - text: And then there was Bill Wilson's own recruiter
                      - link "Ebby Thacher" [ref=e1961] [cursor=pointer]:
                        - /url: /content/rroot-780#Ebby_Thacher
                      - text: ", who sucked Bill into the Oxford Group cult religion and turned Bill into a religious fanatic, only to later relapse and leave the cult himself."
                      - paragraph
                    - listitem [ref=e1962]:
                      - text: The early A.A. members managed to keep
                      - link "Morgan Ryan" [ref=e1963] [cursor=pointer]:
                        - /url: /content/letters-8#Morgan_Ryan
                      - text: sober just long enough for him to appear on Gabriel Heatter's "We The People" radio program and tell all of America how a wonderful new organization called "Alcoholics Anonymous" had saved him from alcoholism, and then Morgan promptly relapsed afterwards.
                      - superscript [ref=e1965]:
                        - link "9" [ref=e1966] [cursor=pointer]:
                          - /url: "#ftnt09"
                      - paragraph
                    - listitem [ref=e1967]:
                      - text: And Lois Wilson's private secretary, Francis Hartigan, reported that fully
                      - link "50% of the authors" [ref=e1968] [cursor=pointer]:
                        - /url: "#BB_relapses"
                      - text: of the stories in the first edition of the Big Book relapsed and did not maintain long-term sobriety.
                      - paragraph
                    - listitem [ref=e1969]:
                      - text: In fact,
                      - link "Dick B. reports" [ref=e1970] [cursor=pointer]:
                        - /url: /content/funny-spirituality#org100
                      - text: that the whole New York group, run by Bill Wilson, had a very high rate of relapse. (Dr. Bob's group in Akron did better.)
                  - paragraph [ref=e1971]:
                    - text: "Aha! I just got it! Another qualifier:"
                    - generic [ref=e1972]: "\"those who stayed on with A.A..\""
                    - text: Those who relapsed and didn't
                    - generic [ref=e1973]: "\"Keep Coming Back\""
                    - text: didn't count either.
                  - paragraph [ref=e1974]: So, in the end, Bill Wilson only counted the success stories. That is how he managed to get a much, much higher success rate than anyone else in the whole world has ever gotten, before or since.
                  - paragraph [ref=e1975]: Bill Wilson was just doing some Enron-style accounting. Enron created the illusion of big profits by transferring all of its expenses, liabilities and losses "off of the books" and hiding them somewhere else, leaving nothing but immense profits in sight, thus creating the appearance of a very successful, highly profitable, company. Bill Wilson created the illusion of a very successful alcoholism treatment program by transferring all of his failures off of the books (and out of the Big Book) and ignoring them, leaving only success stories for everyone to see. So Bill turned a mere five percent success rate into a fifty percent success rate (or 75%, or more).
                  - paragraph
                  - table [ref=e1978]:
                    - rowgroup [ref=e1979]:
                      - 'row "Destructive narcissists categorized as \"Manipulative\" are particularly prone to use misleading statements and lies. Do they know they are lying? Yes. But, they feel they have the right to use any means available to achieve their ends. Further, some will have an assumption, much like that of \"Suspicious\" narcissists, that everyone is lying, and thus lying is fair play. Loving the Self-Absorbed, Nina W. Brown, Ed.D., LPC, NCC, page 67. Such a rationalization traps us in circular logic: It is okay to lie and exaggerate how many lives Alcoholics Anonymous really saves, in order to promote Alcoholics Anonymous — the end justifies the means — because Alcoholics Anonymous is such a wonderful organization that saves so many lives and it should be promoted..." [ref=e1980]':
