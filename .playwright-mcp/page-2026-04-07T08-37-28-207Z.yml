                                - row "Charlie's girls shaved their heads after the jury found him guilty" [ref=e1140]:
                                  - cell "Charlie's girls shaved their heads after the jury found him guilty" [ref=e1141]:
                                    - generic [ref=e1143]: Charlie's girls shaved their heads after the jury found him guilty
                  - paragraph [ref=e1144]: "Then Prof. Vaillant cited four studies that he hand-picked out of 40 years of the literature, one per decade, that supposedly demonstrated the successful application of Prof. Frank's \"natural healing principles\". Vaillant described them as: \"four alcohol treatment programs that fortuitously followed Frank's prescription and significantly facilitated remission from alcoholism.\""
                  - paragraph [ref=e1145]: Ridiculous. They did not "fortuitously follow Frank's prescription". They didn't even accidentally or coincidentally do the same things.
                  - paragraph [ref=e1146]: Vaillant cherry-picked four studies that he thought looked sort of like Prof. Frank's ideas, but there is really not much similarity there at all. In fact, two of the four studies were done before Prof. Frank came up with his "non-specific natural healing program" in 1961, and they used drugs, not natural healing.
                  - paragraph [ref=e1147]:
                    - text: Then Vaillant used just one of those four studies — an obscure report from Trinidad (
                    - link "Beaubrun 1967" [ref=e1148] [cursor=pointer]:
                      - /url: "#Beaubrun"
                    - text: ) — to try to show the effectiveness of Alcoholics Anonymous treatment.
                  - paragraph [ref=e1149]:
                    - text: Apparently, the only study of anything like A.A. treatment that Vaillant could find that showed better than average results (the only study that he cited) was some people in the boondocks of Trinidad and Tobago in the 1960s, who used "indigenous calypso singing", combined with some A.A. rituals, for group therapy. (Vaillant didn't say whether they also used some
                    - link "voodoo rituals" [ref=e1150] [cursor=pointer]:
                      - /url: /content/jokes#Dr_Ngobo
                    - text: in their program.)
                  - paragraph [ref=e1151]: Notice how Vaillant quietly discarded his own eight years of carefully-documented research which showed that A.A. didn't work at all, and Vaillant just grabbed at one study of calypso sing-alongs in the Caribbean as evidence that Alcoholics Anonymous and Jerome Frank's screwy mind-altering "placebo group therapy" really do work after all.
                  - paragraph
                  - table [ref=e1153]:
                    - rowgroup [ref=e1154]:
                      - row [ref=e1155]:
                        - cell [ref=e1156]:
                          - generic:
                            - img
                      - row "Spontaneous Calypso Singing" [ref=e1157]:
                        - cell "Spontaneous Calypso Singing" [ref=e1158]:
                          - generic [ref=e1160]:
                            - img
                            - text: Spontaneous Calypso Singing
                  - text: Vaillant hasn't bothered to explain just what the calypso music get-togethers in Trinidad and Tobago have to do with American A.A. meetings. I've never seen an American A.A. meeting break out in spontaneous calypso singing, like the people in the comic movie
                  - generic [ref=e1161]: Beetlejuice
                  - text: did. The fact that some natives in Trinidad and Tobago get a kick out of singing calypso songs at non-alcoholic parties is great — it sounds like a whole lot of fun and I'd like to go — but it doesn't prove that A.A. works in the USA. And the success of calypso singing hardly proves anything about Prof. Frank's so-called "placebo" treatment.
                  - paragraph
                  - paragraph [ref=e1162]: Remember that two of the four "successful" therapy programs that Vaillant cited as "proof" of Frank's "natural healing principles" actually used drugs — specifically emetine and disulfiram — to get their results, not Jerome Frank's psycho-babble nonsense about the wonderful benefits of placebos, brainwashing, and emotionally-charged group rituals.
                  - paragraph [ref=e1163]:
                    - text: And it's very strange that Vaillant cited the work of the Sobell and Sobell husband-and-wife team as "proof" that Frank's ideas work. The Sobells were so hated and vilified by the A.A. hierarchy (including hidden members and front groups) for advocating the teaching of controlled drinking that they were driven out of the USA, and had to move to Canada to continue their practice, because the A.A. faithful decided that teaching controlled drinking was against the A.A. dogma, and they accused the Sobells of killing alcoholics. (Talk about the pot calling the kettle black. Talk about psychological projection...) Vaillant's use of them as an example of successful treatment is also funny because their work had basically nothing to do with the irrational mind-altering emotionally-charged group rituals that Jerome Frank advocated. The Sobells used an approach more like,
                    - generic [ref=e1164]: "\"Look at this videotape of yourself last night. This is how stupid you look and act when you get smashed. Wouldn't you like to just have a few instead, and keep your wits about you, and not look like such a jerk?\""
                  - paragraph [ref=e1165]: (Ouch! That's really a rough treatment program, isn't it? Can you imagine waking up all hung over and sick and jittery, and having someone shove such a videotape in your face first thing in the morning? Talk about aversion therapy...)
                  - paragraph [ref=e1166]: "And lastly, note how Vaillant summed up his argument by declaring that Alcoholics Anonymous was a big success because had it followed Prof. Frank's \"natural healing principles\":"
                  - paragraph
                  - blockquote [ref=e1167]:
                    - generic [ref=e1168]: The success of Alcoholics Anonymous — and its reasonable facsimiles which are continuously being rediscovered — probably results from the fact that it conforms so well to the natural healing principles that Frank outlines and with Frank's general prescription for therapeutic group processes.
                  - paragraph [ref=e1169]:
                    - text: Vaillant had shown no such success for A.A. at all — he had in fact, with his eight years of research, clearly demonstrated just the opposite,
                    - generic [ref=e1171]: the total failure of A.A. treatment
                    - text: — yet he suddenly claimed success as a given, and stated that Frank's "natural healing principles" were "probably" the reason why. That is an example of the propaganda technique called "
                    - link "Assume the major premise" [ref=e1172] [cursor=pointer]:
                      - /url: /content/propaganda#assume
                    - text: "\" — just talk like something is true when you only wish it were true, and wish to fool other people into believing that it is true, and then quickly divert attention from that bogus assumption by arguing about something else, like whether Frank's principles were the reason why..."
                  - paragraph [ref=e1173]: Likewise, Vaillant also failed to show that Jerome Frank's "natural healing principles" were anything but a formula for brainwashing patients into joining a cult religion, and yet he claimed that they had produced great results, which they clearly had not done. The four examples that Vaillant cited didn't even come close to showing any efficacy for Frank's so-called "principles", or even much relevance. That is such a lame attempt to deceive the reader that it is pathetic.
                  - paragraph [ref=e1174]:
                    - text: And there are no
                    - generic [ref=e1175]: "\"reasonable facsimiles which are continuously being rediscovered\"."
                    - text: That is a complete fabrication, just some more wishful thinking, just another propaganda stunt —
                    - generic [ref=e1176]:
                      - text: assume facts not in evidence, assume facts which are yet to be proved, "
                      - link "petitio principii" [ref=e1177] [cursor=pointer]:
                        - /url: /content/propaganda#petitio_principii
                      - text: "\""
                    - text: ". And it isn't even good English: \"continuously being rediscovered\"? Like copies of Alcoholics Anonymous get discovered, and then get lost, and then get rediscovered, over and over again, continuously? What nonsense."
                  - paragraph [ref=e1178]: Obviously, Professor Vaillant suffers from something far more serious than just a little confusion, or a misunderstanding, or a slight error in the analysis of the facts. It appears to be willful gross dishonesty and deceit. And that's one of the leaders of Alcoholics Anonymous at work, telling us how to treat the deadly problem of alcoholism.
                  - paragraph [ref=e1179]: It wouldn't be so bad if those professional A.A. bozos were just writing bizarre science fiction for the late-night cable TV horror movies. But what they are doing is far more serious than that.
                  - list [ref=e1180]:
                    - listitem [ref=e1181]: They are lying to us about matters of life and death.
                    - listitem [ref=e1182]: They are deceiving and misleading sick and vulnerable people about how to survive and recover from alcoholism.
                    - listitem [ref=e1183]: They are taking people who are supposed to be receiving medical treatment and giving them cult religion instead.
                    - listitem [ref=e1184]: They are bilking health insurance programs out of billions of dollars, leaving less money for giving real, working, medical treatment to other sick people.
                    - listitem [ref=e1185]: Their lies are killing people.
                    - listitem [ref=e1186]: Their quack medicine is killing people.
                    - listitem [ref=e1187]: Their cult religion is killing people.
                  - text: It seems to me that it takes really immoral monsters to commit such heartless crimes.
                  - paragraph [ref=e1188]
                  - generic [ref=e1189]:
                    - img
                  - paragraph [ref=e1190]: "Michael Lemanski reported that the death rate in Vaillant's study was in line with other studies, and so was the inefficacy of 12-step treatment:"
                  - paragraph
                  - blockquote [ref=e1191]:
                    - generic [ref=e1192]:
                      - heading "Treatment and Mortality Rates" [level=3] [ref=e1194]
                      - text: "The high mortality rate of treated alcoholics within the Vaillant studies is supported by the results of a five-year mortality study of alcoholics conducted in conjunction with the DuPont Corporation. Of 76,687 employees of the corporation included in the survey, 922 were identified by physicians as alcoholic. The study included control groups in which each alcoholic employee was matched to another employee, known not to be alcoholic, by age, sex, payroll class (salary or hourly), and geographic location. The sample was segmented into three classifications: 1) known alcoholics; 2) suspected alcoholics; and 3) recovered/abstinent alcoholics. The average yearly mortality rate for the known alcoholics was 3.2% (versus .74% for the matched comparison group); for the suspected alcoholics it was 1.8% (versus, again, .74% for the matched comparison group); and for the recovered alcoholics it was 2.5% (versus .86% for the matched comparison group)."
                      - superscript [ref=e1196]: "21"
                      - text: But a more recent survey of 12 long-term longitudinal studies of mortality rates of (for the most part) treated alcoholics found an average mortality rate of a still very high 2.15% per annum for the treated alcoholics, while the mortality rate in the single study of untreated alcoholics included in the survey was only 1.7% per annum, a lower figure than for all but one of the studies of treated alcoholics.
                      - superscript [ref=e1198]: "22"
                      - heading "Confirmation of Vaillant's Findings" [level=3] [ref=e1200]
                      - text: "A one-year study published in 1985 confirms Vaillant's 1983 findings concerning the ineffectiveness of 12-step treatment. In a controlled clinical study, alcoholics were segregated into three treatment groups: 1) those who received medication only (disulfiram [antabuse] or chlordiazepoxide — drugs that produce physical discomfort when taken with alcohol); 2) those who received a complete addictions treatment program; and 3) those who received no treatment beyond a physical exam and a clinical interview once a month. The results were that the medication-only group had an 80% relapse rate; the treatment group had an 80% relapse rate; and the minimal-treatment group had a 74% relapse rate."
                      - text: "The study's authors concluded:"
                      - blockquote [ref=e1201]:
                        - generic [ref=e1202]:
                          - text: Patients provided with a minimum of services showed as much improvement as those provided with extensive treatment over the same period of time. The ineffectiveness of the interventions could not be explained by differences in pretreatment alcoholism severity.
                          - superscript [ref=e1204]: "23"
                      - separator [ref=e1205]
                      - generic [ref=e1206]:
                        - text: 21. "A Five-Year Mortality Study of Alcoholics," by Sidney Pell and C.A. D'Alonzo. Journal of Occupational Medicine, Volume 15 Number 2, February 1973, pp. 120-125.
                        - text: "22. \"The Long-Term Course of Treated Alcoholism: I. Mortality, Relapse, and Remission Rates and Comparisons with Community Controls,\" by Finney, John, and Moos, Rudolf. Journal of Studies on Alcohol, Volume 52, 1991, pp. 44-54."
                        - text: "23. \"Comparison of Three Outpatient Interventions: A Twelve-Month Follow-Up of Male Alcoholics,\" by Barbara Powell, et al. Journal of Studies on Alcohol, Volume 46, 1985, pp. 309-312."
                      - separator [ref=e1207]
                    - generic [ref=e1208]: A History of Addiction & Recovery in the United States, Michael Lemanski, pages 102-103 and 106.
                  - paragraph [ref=e1209]: "So the death rates in the test at the DuPont Corporation were:"
                  - paragraph
                  - table [ref=e1212]:
                    - rowgroup [ref=e1213]:
                      - row "Known alcoholics 3.2% per year" [ref=e1214]:
