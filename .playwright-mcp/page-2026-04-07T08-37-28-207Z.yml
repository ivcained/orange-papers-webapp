                  - paragraph [ref=e193]: "In his book on the treatment of alcoholism, Dr. Sheldon Zimberg surveyed the literature for reports of spontaneous remission of alcoholism:"
                  - paragraph
                  - blockquote [ref=e194]:
                    - generic [ref=e195]:
                      - generic [ref=e196]: Spontaneous Remission in Alcoholism
                      - paragraph [ref=e197]:
                        - text: A number of studies have found that a small percentage of alcoholics improve to the point of remission of problems associated with alcohol consumption. Bailey and Stewart (235) interviewed alcoholics after three years without treatment and found that about 27 percent of the former patients denied alcoholism. Cahalan (268) in a national drinking practices study noted that drinking problems decrease in men after age 50 and the amount of alcohol consumed also decreases. Cahalan, Cisin, and Crossley (11) in another national survey of drinking practices found that about one-third more individuals had problem drinking in a period before their three-year study period than during the study period itself, suggesting a tendency toward spontaneous remission of drinking problems. Goodwin, Crane, and Guze (269) found that on an eight-year follow-up with no treatment about 18 percent of the alcoholic felons had been abstinent for at least two years. Lemere (238) reported long-term abstinence in 11 percent of untreated alcoholics over an unspecified interval. Kendall and Staton (236) reported 15 percent abstinence in untreated alcoholics after a seven-year follow-up. Kissin, Platz, and Su (203) reported a 4 percent one-year improvement rate in untreated lower class alcoholics. Imber et al. (10) described a follow-up of 58 alcoholics who received no treatment for their alcoholism. It was noted that the rate of abstinence was 15 percent at one year and 11 percent after three years.
                        - text: In sum, the preponderance of these studies suggests that a spontaneous remission rate for alcoholism of at least one-year duration is about 4-18 percent.
                        - generic [ref=e198]: Successful treatment would, therefore, have to produce rates of improvement significantly above this probable range of spontaneous remission.
                      - separator [ref=e199]
                      - generic [ref=e200]:
                        - text: 10. Imber, S., Schultz, E., Funderburk, F., Allen, R. and Flamer, R. The Fate of the Untreated Alcoholic. J. Nerv and Ment. Dis., 1976, 162:238-247.
                        - text: "11. Cahalan, D., Cisin, I. H. and Crossley, H. M. American Drinking Practices: A National Survey of Drinking Behavior and Attitudes. New Brunswick, Rutgers Center for Alcohol Studies, 1974."
                        - text: 203. Kissin, B., Platz, A. and Su, W. H. Social and Psychological Factors in the Treatment of Chronic Alcoholics. J. Psychiat. Res., 1970, 8:13-27.
                        - text: 235. Bailey, M. B. and Stewart, S. Normal Drinking by Persons Reporting Previous Problem Drinking. Quart. J. Stud. Alc., 1967, 28:305-315.
                        - text: 236. Kendall, R. E. and Staton, M. C. The Fate of Untreated Alcoholics. Quart. J. Stud. Alc., 1966, 27:30-41.
                        - text: 238. Lemere, F. What Happens to Alcoholics. Amer. J. Psychiat., 1953, 109:674-675.
                        - text: "268. Cahalan, D. Problem Drinkers: A National Survey, San Francisco, Jossey-Bass, 1970."
                        - text: "269. Goodwin, W. W., Crane, J. B., and Guze, S. B. Felons Who Drink: An Eight-Year Follow-up. Quart. J. Stud. Alc., 1971, 32:136-147."
                      - separator [ref=e201]
                    - generic [ref=e202]: The Clinical Management of Alcoholism, Sheldon Zimberg, M.D., page 179, footnotes on pages 223 to 234.
                  - paragraph [ref=e203]: The key sentence is the last one — for a treatment program to claim success, it would have to produce recovery rates greater than the usual rate of spontaneous remission. Alcoholics Anonymous comes nowhere near exceeding a 4 to 18 percent per year recovery rate.
                  - paragraph [ref=e204]:
                    - text: Personally, I find the 18 percent number to be far too high to believe. (At that rate, 85% of all of the alcoholics in the country should have recovered in just the last 10 years. Obviously, that has not happened.) I agree with
                    - link "R. G. Smart" [ref=e205] [cursor=pointer]:
                      - /url: "#ftnt06"
                    - text: ", who calculated a spontaneous remission rate for alcoholism of between 3.7 and 7.4 percent per year. As a simple rule of thumb, the middle value of 5 or 5.5 percent per year is quite believable. Still, the claimed success rate of Alcoholics Anonymous does not even exceed that much lower rate of spontaneous remission."
                  - paragraph [ref=e206]
                  - generic [ref=e207]:
                    - img
                  - paragraph [ref=e208]: Some people are confused by the spontaneous remission rate and how it works. They imagine that if 5% of the alcoholics are recovering each year, then after 20 years there should not be any more drunk alcoholics left. Unfortunately, it doesn't work that way. The 5% number is five percent of the alcoholics in the original starting group who are still sick, so the actual number of people recovering each year declines as the size of the group shrinks. (It's a logarithmic curve, like a radioactive half-life.)
                  - paragraph [ref=e209]: "Imagine that we have 10,000 alcoholics, and they are spontaneously recovering at a rate of five percent per year. The math works out like this:"
