                            - blockquote [ref=e1125]:
                              - generic [ref=e1126]:
                                - text: Listening to Leslie [van Houten], we began to see clearly how Manson had manipulated his followers during their frequent LSD trips together by leading intense role-playing sessions and fantasy games for up to eight hours at a time which, as Leslie said, "took root" in their minds. Under Charlie's direction, they played pirates and maidens, cowboys and Indians, devils and witches, in scenes replete with violent and sadistic imagery. When it came time to play Helter Skelter, life in the Family had become a game with no borders on fantasy and reality, an extended "trip" that kept up long after any chemical effects had worn off. Moreover, using the same kinds of techniques employed in many cults, Manson guided and badgered his followers into lasting states of confusion and not thinking that laid them open to every suggestion and command he gave. At all times, and especially during the Family's psychedelic episodes, Charlie's adept wordplay hammered home the final spikes of snapping.
                                - text: "\"Being around Charlie during that time was like playing a game of Scrabble,\" Leslie told us, aptly characterizing Manson's method of inducing madness. \"He never labeled anything exactly like it was. He'd say, 'The question is in the answer,' and 'No sense makes sense' — things that would make your mind stop functioning. Then it wasn't a matter of questioning when things began to get bad. We'd stopped questioning months before.\""
                              - generic [ref=e1127]: "Snapping: America's Epidemic of Sudden Personality Change, Flo Conway and Jim Siegelman, page 203."
                            - paragraph [ref=e1128]: (Incidentally, did you know that Charles Manson was trained in Scientology techniques? One of the times that he was in prison, his cellmate was a Scientologist, and the two of them whiled away the years by practicing Scientology procedures on each other. That's where Charles Manson learned how to manipulate other people's minds. What a small cult world it really is, after all.)
                            - paragraph
                            - table [ref=e1131]:
                              - rowgroup [ref=e1132]:
                                - row [ref=e1133]:
                                  - cell [ref=e1134]:
                                    - generic [ref=e1136]:
                                      - img
                                  - cell [ref=e1137]:
