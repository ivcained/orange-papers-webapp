                  - paragraph [ref=e663]: In the period of 18 to 24 months after treatment, 80% of the A.A. group were still drinking. Once again, A.A. treatment had the worst outcome of any treatment method tested, and again, we see that the A.A. group required the most additional treatment in a hospital for uncontrolled drinking — far more than the other groups.
                  - paragraph [ref=e664]: "Dr. Walsh and associates concluded:"
                  - paragraph
                  - blockquote [ref=e665]:
                    - generic [ref=e666]: To a company or union counselor or a clinician advising patients, our findings argue for hospitalizing problem drinkers who are also using cocaine or other drugs. For other problem drinkers with reasonable job stability and no serious medical needs, an initial referral to AA (or the offer of a choice of treatment) is somewhat less costly (about 10 percent), but it entails extra risk. Employees sent only to AA, and those offered choices, are more likely to have their drinking problems resurface. The less costly intervention may be more efficient in the longer term if the money saved is spent to identify and refer more substance-abusing employees or if nonhospital options encourage seeking help. But if AA alone is mandated, or if choice is offered, our study shows that close monitoring is essential, because many employees have serious relapses in the first six months.
                    - text: (Page 781.)
                  - paragraph [ref=e667]: In other words, you have to watch them like a hawk because A.A. does not keep them sober.
                  - paragraph [ref=e668]: Unfortunately, this otherwise excellent study did not have a control group, so we cannot determine what the overall success rate of any kind of treatment was, compared to the normal rate of spontaneous remission.
                  - paragraph [ref=e669]: "And there was also no group that got only threats of firing. That is, take one group of employees aside and tell them in no uncertain terms that if they don't immediately cut way down on their drinking that they will lose their jobs. The people in that study were undoubtedly made to understand that (because 31 of the employees were fired during the 2-year follow-up period), but the study did not test for what percentage of the employees would cut down or quit drinking of their own accord, rather than get fired, without any \"treatment\". That number has to be greater than zero, and may, in fact, account for a significant percentage of the successes in all three groups, all of which \"improved during treatment\". The authors recognized the effect of threats of firing, and found it in all three groups, but lacking a control group, were unable to measure it:"
                  - paragraph
                  - blockquote [ref=e670]:
                    - generic [ref=e671]: We found no differences among the three groups in any job outcome, including being fired. All three groups evidently brought their drinking problems under sufficient control at work for group differences in job performance to be rendered statistically insignificant.
                    - text: (Page 780.)
                  - paragraph
                  - paragraph [ref=e672]
                  - generic [ref=e673]:
                    - img
                  - paragraph [ref=e674]: "A team of British researchers, lead by Doctors Jim Orford and Griffith Edwards, also tested the effectiveness of Alcoholics Anonymous treatment of alcoholics, and they also found it to be completely useless. Herbert Fingarette summarized their experiment in his landmark book Heavy Drinking:"
                  - paragraph
                  - table [ref=e677]:
                    - rowgroup [ref=e678]:
                      - row [ref=e679]:
                        - cell [ref=e680]:
                          - generic [ref=e681]:
                            - text: In the mid-1970s a team of reaserchers in Great Britain conducted a rigorously designed large-scale experiment to test the effectiveness of a treatment program that represented "the sort of care which might today be provided by most specialized alcoholism clinics in the Western world."
                            - superscript [ref=e683]: "11"
                            - paragraph [ref=e684]: "The subjects were one hundred men who had been referred for alcohol problems to a leading British outpatient program, the Alcoholism Family Clinic of Maudsley Hospital in London. The receiving psychiatrist confirmed that each of the subjects met the following criteria: he was properly referred for alcohol problems, was aged 20 to 65 and married, did not have any progressive or painful physical disease or brain damage or psychotic illness, and lived within a reasonable distance of the clinic (to allow for clinic visits and follow-up home visits by social workers). A statistical randomization procedure was used to divide the subjects into two groups comparable in the severity of their drinking and their occupational status."
                            - paragraph [ref=e685]: For subjects in one group (the "advice" group), the only formal therapeutic activity was one session between the drinker, his wife, and a psychiatrist. The psychiatrist told the couple that the husband was suffering from alcoholism and advised him to abstain from all drink. The psychiatrist also advised the husband to stay on his job (or return to it) and encouraged the couple to attempt to keep their marriage together. There was free-ranging discussion and advice about the personalities and particularities of the situation, but the couple was told that this one session was the only treatment the clinic would provide. They were told in sympathetic and constructive language that the "attainment of the stated goals lay in their own hands and could not be taken over by others."
                            - paragraph [ref=e686]: Subjects in the second group (the "treatment group") were offered a year-long program that began with a counselling session, an introduction to Alcoholics Anonymous, and prescriptions for drugs that would make alcohol unpalatable and drugs that would alleviate withdrawal suffering. Each drinker then met with a psychiatrist to work out a continuing outpatient treatment program, while a social worker made a similar plan with the drinker's wife. The ongoing counselling was focused on practical problems in areas of alcohol abuse, marital relations, and other social or personal difficulties. Drinkers who did not respond well were offered inpatient admission, with full access to the hospital's wide range of services.
                            - paragraph [ref=e687]:
                              - text: Twelve months after the experiment began, both groups were assessed. No significant differences were found between the two groups. Furthermore, drinkers in the treatment group who stayed with it for the full period did not fare any better than those who dropped out. At the twelve-month point, only eleven of the one hundred drinkers had become abstainers. Another dozen or so still drank but in sufficient moderation to be considered "acceptable" by both husband and wife. Such rates of improvement are not significantly better than those shown in studies of the spontaneous or natural improvement of chronic drinkers not in treatment. Or, as
                              - link "Vaillant" [ref=e688] [cursor=pointer]:
                                - /url: "#Vaillant"
                              - text: "once ironically remarked: \"The best that can be said for our exciting treatment is that we are certainly not interfering with the normal recovery process.\""
                              - superscript [ref=e690]: "12"
                            - paragraph [ref=e691]: "Though the sophistication and elaborateness of the design and resources of this British experiment have made it a land-mark project, a similar experiment with sixty alcoholics had been reported in 1969. There results were of the same kind: After one year there was no evident difference between drinkers who had received intensive treatment and those who had received minimal treatment and had been told that the patient, not the program, had to deal with the problem."
                            - paragraph [ref=e692]:
                              - text: Such experiments suggest that anything more than an hour or two of commonsense advice from an authoritative person may be a waste of time, money, and resources.
                              - superscript [ref=e694]: "13"
                            - paragraph
                            - separator [ref=e695]
                            - generic [ref=e696]:
                              - text: 11. Orford and Edwards (1977), 11. For the researchers' description of the experimental protocol summarized here, see pages 39-42; for their statement of their key findings, see pages 54-57.
                              - text: 12. Vaillant, "The Doctor's Dilemma" (1980), 18.
                              - text: 13. WHO Expert Committee on Problems Related to Alcohol Consumption, Problems Related to Alcohol Consumption (1980), 46.
                              - separator [ref=e697]
                              - text: Herbert Fingarette, Heavy Drinking, pages 78-80 and footnotes on page 94.
                              - text: "Also see:"
                              - text: "Jim Orford and Griffith Edwards, 1977, Alcoholism : a comparison of treatment and advice, with a study of the influence of marriage, Oxford [England] and New York : Oxford University Press, ISBN: 0-19-712148-9"
                  - paragraph [ref=e698]: Jim Ordford was, in 1977,
                  - list [ref=e699]:
                    - listitem [ref=e700]: M.A., DIP., PSYCH., PH.D.
                    - listitem [ref=e701]: Senior Lecturer in Clinical Psychology, University of Exeter
                    - listitem [ref=e702]: Principal Clinical Psychologist, Exe Vale Hospital, Exeter
                    - listitem [ref=e703]: previously Senior Lecturer and Research Worker, Institute of Psychiatry
                  - paragraph [ref=e704]: And Griffith Edwards was, in 1977,
                  - list [ref=e705]:
                    - listitem [ref=e706]: M.A., D.M., F.R.C.P., F.R.C., PSYCH., D.P.M.
                    - listitem [ref=e707]: Reader in Drug Dependence, University of London, Institute of Psychiatry
                    - listitem [ref=e708]: Honorary Consultant, Bethlem Royal Hospital and the Maudsley Hospital
                    - listitem [ref=e709]: Honorary Director, Addiction Research Unit, Institute of Psychiatry
                  - paragraph [ref=e710]: "You might notice that eleven out of one hundred is a rather high rate of success, when so many other tests and studies reported something closer to a five percent success rate — the usual rate of spontaneous remission in alcoholics. The two most obvious differences here are:"
                  - list [ref=e711]:
                    - listitem [ref=e712]:
                      - text: That all of these patients were married, while a random selection of alcoholics will include many singles. In test after test, an intact marriage has been shown to be a valuable asset. Married alcoholics recover at twice the rate of singles. As the Harvard Medical School pointed out,
                      - generic [ref=e713]:
                        - link "the support of a good spouse was more helpful" [ref=e714] [cursor=pointer]:
                          - /url: "#Harvard_Mental"
                        - text: than a treatment program or a support group.
                      - text: In addition, patients who are still married still have something left to lose. Another study found that the people who do the best in recovery are not those who have "hit bottom" and lost everything; it's those people who still have something left to lose, and who will work to save it.
                      - paragraph
                    - listitem [ref=e715]: That patients who were suffering from other serious mental or physical illnesses were filtered out and did not take part in this test. Some people who are terminally ill really are drinking to die, and there is little that can be done for them except give them better pain-killers. And many people who drink too much are actually suffering from other underlying disorders, either physical diseases or mental illnesses like depression or a bipolar disorder.
                  - paragraph [ref=e716]
                  - generic [ref=e717]:
                    - img
                  - paragraph [ref=e718]
                  - table [ref=e720]:
                    - rowgroup [ref=e721]:
                      - row "Prof. George E. Vaillant (at Harvard, old photograph)" [ref=e722]:
                        - cell "Prof. George E. Vaillant (at Harvard, old photograph)" [ref=e723]:
