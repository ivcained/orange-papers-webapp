                    - text: and
                    - link "here" [ref=e3044] [cursor=pointer]:
                      - /url: /content/effectiveness#Nell_Wing_3
                    - text: .
                  - paragraph
                  - paragraph [ref=e3045]:
                    - text: Bill W. A Biography of Alcoholics Anonymous Cofounder Bill Wilson Francis Hartigan
                    - text: Thomas Dunne Books, An imprint of St. Martin's Press, 175 Fifth Avenue, New York, NY 10010, 2000.
                    - text: "ISBN: 0-312-20056-0"
                    - text: "Dewey: B W11h 2000"
                    - text: Francis Hartigan was the secretary of and confidant to Bill Wilson's wife Lois. This book is pretty much a white-wash and tells the whole story from Bill's point of view. But it does contain a few surprises, like the chapter "The Other Woman" which details Bill's love affair with Helen Wynn, and hints at all of his other affairs where he cheated on Lois, both before and after sobriety, all of his married life.
                    - text: Note the interesting fact that Lois Wilson had her own private secretary. That doesn't quite jibe with the published image of Bill and Lois as a couple of desperately poor people who were always struggling just to survive. The A.A. propagandists fail to tell you that Bill Wilson managed to
                    - link "arrange A.A. finances" [ref=e3046] [cursor=pointer]:
                      - /url: /content/aacoa
                    - text: so that he and Lois lived like royalty in their A.A.-supplied house in the country, while driving an A.A.-supplied Cadillac car and being supported in comfort for the rest of their lives by the Alcoholics Anonymous organization, with private secretaries and
                    - link "mistresses" [ref=e3047] [cursor=pointer]:
                      - /url: /content/other-women
                    - text: even. (And Bill never worked a straight job again.) So much for the much ballyhooed "unselfish, constructive action" and "abandoning self-seeking" and "giving up selfishness" and "having no thought of the profit motive" that Wilson always promoted (for the other A.A. members).
                  - paragraph [ref=e3048]:
                    - text: AA Horror Stories, Rebecca Fransway, 2000.
                    - text: See Sharp Press, Tucson, AZ.
                    - text: "ISBN: 1-884365-24-8"
                    - text: "Dewey: 362.2918 T971 2000"
                    - text: This book will curl your hair. One fair-minded 12-Stepper suggested that every new A.A. member should be issued copies of both the Big Book and this book when he or she walks in the door, to tell the newcomers about both the good and the bad things that could happen to them in "the rooms." One of the most disturbing repeated themes is women who were the victims of rape or thirteenth-stepping being told to just shut up and find their part in it and go make some coffee, and to not harbor any resentments against their attackers.
                  - paragraph [ref=e3049]:
                    - text: "Snapping: America's Epidemic of Sudden Personality Change Flo Conway and Jim Siegelman"
                    - text: J. B. Lippencott Company, Philadelphia and New York, 1978.
                    - text: "ISBN: 0-397-01258-6"
                    - text: "LC: 698.2.C66"
                    - text: "LCCN: 78-6627"
                    - text: "Dewey: 155.25 C767s"
                    - text: Interesting, and makes some good points. The authors concentrate on the psychological phenomenon of "snapping" — sudden, dramatic personality changes accompanied by hallucinatory or unreal or otherworldly experiences and feelings, which are often called "religious experiences" (like Bill Wilson called his). The authors build up a theoretical foundation for the phenomenon, and then they do a good job of exploring how a variety of cults induce and use snapping experiences to convert people into true believer cult members.
                    - text: See
                    - link "the longer review in the Bibliography" [ref=e3050] [cursor=pointer]:
                      - /url: /content/bibliography#Snapping
                    - text: for more.
                  - paragraph [ref=e3051]: "Alcoholics Anonymous and the Counseling Profession: Philosophies in conflict Christine Le, Erik P. Ingvarson, and Richard C. Page, Journal of Counseling & Development, 07-01-1995"
                  - paragraph [ref=e3052]:
                    - text: Narcissism, Denial of the True Self Alexander Lowen, M.D.
                    - text: Macmillan Publishing Comany, New York, 1983, and
                    - text: Collier Macmillan Publishers, London, 1983.
                    - text: "ISBN: 0-02-575890-X"
                    - text: "LC: RC553.N36L38 1983"
                    - text: "LCCN: 83-18794"
                    - text: This is a great book, a real classic. Dr. Lowen advances the idea that narcissism is not falling in love with one's self, but rather with a false image of one's self. That small subtle difference actually makes a very large difference. In the original Greek mythology, Narcissus died — starved to death — because he was obsessed with his own image and stared at it endlessly. But as Narcissus approached death, his real emaciated appearance could not have been very attractive. Narcissus was seeing an illusion, not his true appearance.
                    - text: Dr. Lowen advances the idea that narcissism is often caused by child abuse and prolonged humiliation and pain in childhood. The child adopts a persona where he feels no pain and is powerful and invulnerable. The child thinks, "When I grow up, I'll be so powerful and strong that no one can hurt me or humiliate me ever again." Then the child, who grows into adulthood, spends the rest of his life pursuing and defending an illusion. Narcissists are obsessed with defending and preserving their image — they can't stand it if somebody "makes them look bad" — they can't stand criticism. They deny their true feelings and put on a mask of unfeeling, because they imagine that it will keep them from being hurt again. Likewise, they completely disregard other people's feelings. They are obsessed with power and control, so that they can control the world around them and prevent anyone from humiliating them again. Narcissists are often extremely seductive and manipulative people, often charismatic charmers, and occasionally high achievers as well. They lie habitually, without giving it a second thought. They fear insanity.
                    - text: In other words, Dr. Lowen was describing
                    - link "Bill Wilson" [ref=e3053] [cursor=pointer]:
                      - /url: /content/funny-spirituality#Narcissistic
                    - text: ", the abused son of an alcoholic father and a neurotic mother."
                  - paragraph [ref=e3054]:
                    - text: "Loving the Self-Absorbed: How to Create a More Satisfying Relationship with a Narcissistic Partner Nina W. Brown, Ed.D., LPC, NCC"
                    - text: New Harbinger Publications, Inc., Oakland, CA, 2003.
                    - text: "ISBN: 1-57224-354-6"
                    - text: "Dewey: 158.2 B879L"
                    - text: This book tells you how to cope with being married to an obnoxious narcissist. The one thing I couldn't see was, "Why bother?" Nina Brown makes narcissists sound so bad that you really don't want to be married to one. But if you are some kind of long-suffering masochist who really wants to go through it all, read this book.
