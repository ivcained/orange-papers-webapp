                  - paragraph
                  - blockquote [ref=e2983]:
                    - generic [ref=e2984]:
                      - text: AA's own statistics provide perhaps the most persuasive evidence that AA's success rate is minuscule. Since 1977, AA has conducted an extensive survey of its members every three years (though the survey scheduled for 1995 was conducted in 1996). These surveys measure such things as length of membership, age distribution, male-female ratio, employment categories, and length of sobriety. Following the 1989 survey, AA produced a large monograph, "Comments on A.A.'s Triennial Surveys,"
                      - superscript [ref=e2986]: "11"
                      - text: that analyzed the results of all five surveys done to that point. In terms of new-member dropout rate, all five surveys were in close agreement. According to the "Comments" document, the "% of those coming to AA within the first year that have remained the indicated number of months" is 19% after one month; 10% after three months; and 5% after 12 months.
                      - superscript [ref=e2988]: "12"
                      - text: In other words, AA has a 95% new-member dropout rate during the first year of attendance.
                      - separator [ref=e2989]
                      - generic [ref=e2990]:
                        - text: "11. \"Comments on A.A.'s Triennial Surveys,\" no author listed. New York: Alcoholics Anonymous World Services, n.d. (probably 1990)."
                        - text: 12. Ibid., p. 12, Figure C-1.
                      - separator [ref=e2991]
