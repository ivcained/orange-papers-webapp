                      - link "when Bill Wilson cheated Henry out of the Big Book money" [ref=e1948] [cursor=pointer]:
                        - /url: /content/aacoa#Parkhurst_cheated2
                      - text: and drove him out of Alcoholics Anonymous. Died drunk and broke.
