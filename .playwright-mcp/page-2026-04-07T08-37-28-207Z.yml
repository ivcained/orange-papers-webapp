                        - cell "86" [ref=e476]
                  - paragraph [ref=e477]: In every category, the people who got no treatment at all fared better than the people who got A.A. "treatment". Based on the records of re-arrests, only 31% of the A.A.-treated clients were deemed successful, while 44% of the "untreated" clients were successful. Clearly, Alcoholics Anonymous "treatment" had a detrimental effect. That means that A.A. had a success rate of less than zero. Not only was A.A.-based treatment a waste of time and money; A.A. was actually making it harder for people to get sober and stay sober.
                  - paragraph [ref=e478]: And the A.A. people got rearrested more often after many months of A.A. training — not in the beginning. The rate of rearrests was the same for the no-treatment and A.A. groups during the first month of treatment (22%), but the A.A. group's rearrest rate increased later, after months of A.A. indoctrination.
                  - paragraph [ref=e479]:
                    - text: And, strangely enough, the professional treatment program had the same problem. Their patients' rate of rearrests also increased with time, by the same amount. The more 'treatment' the patients got, the more they got rearrested.
                    - generic [ref=e480]:
                      - text: "Let me guess: The professional treatment program also included lots and lots of A.A. meetings. ("
                      - link "They almost always do" [ref=e481] [cursor=pointer]:
                        - /url: "#TC_study"
                      - text: .)
