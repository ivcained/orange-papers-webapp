                  - paragraph
                  - paragraph [ref=e2827]: Synanon was another one of those wonderful organizations that was "really good for some people", because it got them off of drugs and alcohol.
                  - paragraph [ref=e2828]:
                    - text: It started off as a utopian commune dedicated to saving the lives of drug addicts and alcoholics. The name "Synanon" was derived from the Alcoholics Anonymous name "Al-Anon" (Synanon = 'Sinners Anonymous'). Charles "Chuck" Dederich was a former member of Alcoholics Anonymous who claimed to have taken the best parts of A.A. and adapted them for use by drug addicts. In the beginning, Synanon really was
                    - link "a remarkable organization" [ref=e2829] [cursor=pointer]:
                      - /url: orange-cult_q2.html#Synanon1
                    - text: that got hundreds of people off of drugs and alcohol.
                  - paragraph [ref=e2830]:
                    - text: Dederich developed what he called "
                    - link "the Synanon Game" [ref=e2831] [cursor=pointer]:
                      - /url: /content/cult-questions#Yablonsky_gush
                    - text: "\", a confrontational style of group therapy where group members attack each other, ostensibly to expose all of their faults, \"for their own good\", of course."
                  - paragraph [ref=e2832]:
                    - text: To this day, Synanon and its methods are still used as a model for most of
                    - link "the \"tough love\" residential drug and alcohol rehabilitation facilities" [ref=e2833] [cursor=pointer]:
                      - /url: /content/gulags#Straight
                    - text: . The Seed, Straight, Inc., Delancy Street, Daytop, Phoenix House, and literally dozens more all claimed or claim to have taken the best features of Synanon for the design for their own programs.
                  - paragraph
