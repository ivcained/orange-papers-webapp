                  - paragraph [ref=e3130]
                  - paragraph [ref=e3131]
                  - heading "The Synanon and People's Temple CULTS:" [level=2] [ref=e3132]
                  - paragraph
                  - heading "Synanon:" [level=3] [ref=e3134]
                  - paragraph [ref=e3135]:
                    - text: "Escape from Utopia: My Ten Years in Synanon William F. Olin"
                    - text: Unity Press, Santa Clara, CA 1980.
                    - text: "ISBN: 0-913-30053-5"
                    - text: "Dewey: 362.293 O46e"
                    - text: "--This is the story of Synanon, as it degenerated from a utopian social organization and also a successful drug and alcohol rehabilitation program, into a nightmarish cult, ending with the arrest of the cult's leader Charles \"Chuck\" Dederich on charges of conspiracy to commit murder. This story is especially good because it is told by a man who was an idealist, a successful architect seeking a utopia, one of the \"life-stylers\" who joined Synanon purely out of choice, rather than one of the addicts fleeing from death by drugs. It gives his story a certain credibility, and it also means that it is the story of a life gradually going down-hill over a ten-year period, as the organization gradually turned into a cult. Where some ex-addicts might see even some of the worst parts of Synanon as improvements in their lives, Olin didn't."
                  - paragraph [ref=e3136]:
                    - text: The Tunnel Back, Synanon Lewis Yablonsky
                    - text: The Macmillan Company, New York, 1965.
                    - text: LCC 65-10664
                    - text: "Dewey: 362.29 Y12t"
                    - text: This is an earlier book about Synanon, from a very positive viewpoint. It is interesting to read this book second, and the one above first, and note the contrasts.
                    - link "Details here." [ref=e3137] [cursor=pointer]:
                      - /url: /content/bibliography#Yablonsky1
                  - paragraph [ref=e3138]:
                    - text: "The Light on Synanon: How a Country Weekly Exposed a Corporate Cult — And Won the Pulitzer Prize Dave Mitchell, Cathy Mitchell, and Richard Ofshe"
                    - text: Seaview Books, New York, 1980.
                    - text: "ISBN: 0-87223-613-7"
                    - text: "Dewey: 071.947 M681L"
                    - text: Fascinating, easy reading. This is the story of how a little weekly rural newspaper, run by the Mitchell husband-and-wife team, and the Berkeley University professor Richard Ofshe, managed to bring down the Synanon cult and win the Pulitzer prize in the process. What is really disturbing is how reluctant the California officials were to actually enforce the laws. For years, their attitude was, "Well okay, we'll file a report. But we can't press charges, or get a conviction, because it's just your word against theirs, and they have a thousand people, and 40 lawyers..." The authorities didn't raid Synanon, or make any arrests, until after Jim Jones' cult (also from northern California) committed mass suicide in Guyana. Only then did the authorities get scared and do something.
                  - paragraph [ref=e3139]:
                    - text: http://www.thestraights.com/synanon-story2.htm [Dead Link] — Information on Straight, and its precursors, the Seed and Synanon.
                    - text: "Try:"
                    - link "http://www.thestraights.com/" [ref=e3140] [cursor=pointer]:
                      - /url: http://web.archive.org/web/20161020131749/http://www.thestraights.com/
                  - paragraph [ref=e3141]:
                    - link "http://www.fornits.com/anonanon/" [ref=e3142] [cursor=pointer]:
                      - /url: http://web.archive.org/web/20161020131749/http://www.fornits.com/anonanon/
                    - text: — More information on Straight, the Seed, and Synanon.
                  - paragraph [ref=e3143]
                  - generic [ref=e3144]:
                    - separator [ref=e3145]
                    - paragraph [ref=e3146]
                    - heading "Jim Jones and Jonestown:" [level=3] [ref=e3147]
                  - paragraph [ref=e3148]:
                    - text: Awake In A Nightmare Ethan Feinsod
                    - text: W.W. Norton & Company, New York, NY, 1981.
                    - text: "ISBN: 0-393-01431-2"
                    - text: "Dewey: 289.9 F299a"
                    - text: This is a fascinating story that starts with people's lives in VietNam, Detroit, and San Francisco, and continues through their lives in Jim Jones' People's Temple commune in Guyana, down to the bitter end.
                  - paragraph [ref=e3149]:
                    - text: Journey to Nowhere, A New World Tragedy Shiva Naipaul
                    - text: Simon and Schuster, New York, 1980.
                    - text: "ISBN: 0-671-42471-8"
                    - text: "Dewey: 289.9 N157j"
                    - text: A rather depressing, but very accurate and colorful view of Guyana and The People's Temple of Jim Jones.
                  - paragraph [ref=e3150]:
                    - text: Seductive Poison, A Jonestown Survivor's Story of Life and Death in the People's Temple Deborah Layton
                    - text: Anchor Books, Doubleday, New York, 1998.
                    - text: "ISBN: 0-385-48983-8"
                    - text: "Dewey: B La 4547s 1998"
                    - text: The Layton family really got clobbered by Jim Jones' cult. The mother of the family, Mrs. Layton, died of lung cancer in Jonestown in spite of Jones' insistence that his faith healing was curing her. She also died without any pain pills because Jim Jones was gobbling them all up. Deborah's brother Larry was a true believer who helped to kill Congressman Ryan, and he's now doing life in a federal penitentiary. Only Deborah got out in time to live to tell the story.
                  - paragraph [ref=e3151]:
                    - text: In My Father's House, The Story of The Layton Family and the Reverend Jim Jones Min S. Yee & Thomas N. Layton
                    - text: Holt, Rinehart and Winston, New York, 1981
                    - text: "ISBN: 0-03-053396-1"
                    - text: "Dewey: B La455y"
                    - text: This is the story of the Layton family, told from the viewpoint of the father of the family. He refused to join the People's Temple and go to Guyana, but he couldn't stop the rest of his family from going.
                  - paragraph [ref=e3152]:
                    - text: Snake Dance, Unraveling the Mysteries of Jonestown Laurie Efrein Kahalas
                    - text: Red Robin Press, New York, 1998.
                    - text: "ISBN: 1-55212-207-7"
                    - text: "Dewey: 289.9 K12s"
                    - text: "This book is very pro-Jim-Jones. It is a disorganized mess of scraps of information mixed with conspiracy theories. It is a frightening example of the mind of a true believer, someone who believes in the Big Lie so intensely that not even the deaths of 914 innocent people will make the author see that Jones was evil. The author still maintains that Jones was a saint. The author chooses to believe that it was all a big plot by the CIA, and Jonestown was a paradise, and \"a peaceful community was targeted for destruction\" because the U.S. Government didn't like Jim Jones' radical left-wing politics. The author just will not face one simple fact: It was Jim Jones, and not the CIA or the U.S. Government, who ordered 914 men, women, children and babies to drink cyanide Flavor-Aid®."
                  - paragraph [ref=e3153]:
                    - text: Our Father Who Art in Hell, The Life and Death of Jim Jones James Reston, Jr.
                    - text: Times Books, New York, 1981.
                    - text: "ISBN: 0-8129-0963-1"
                    - text: "Dewey: 289.9 R439o"
                  - paragraph [ref=e3154]:
                    - text: Six Years with God Jeanne Mills
                    - text: A & W Publishers, New York, 1979.
                    - text: "ISBN: 0-894-79046-3"
                    - text: This book is sickening. It is very good, but it is still sickening. This book borders on the unbelievable — the depths of Jim Jones' depravity and evil are almost unimagineable. The continuous lies, vicious hatred, terrorism, physical and mental torture that Jones inflicted on his followers was so sickening that I didn't actually finish reading the whole book. I had to stop. And it is mind-boggling how many followers stayed for more abuse.
                    - text: Jeanne Mills, her husband, and their young daughter were all murdered in their home in Berkeley, California, in March of 1980, by People's Temple cult members, just months after she published this book exposing the inner workings of the cult. That happened shortly after the mass suicide in Guyana, and the murders were apparently committed by a few surviving members of the Temple goon squad, "The Angels", who then committed suicide.
                  - paragraph [ref=e3155]:
                    - text: Hearing the Voices of Jonestown Mary McCormick Maaga
                    - text: Syracuse University Press, Syracuse, New York, 1998
                    - text: "ISBN: 0-8156-0515-3"
                    - text: "Dewey: 289.9 M111h 1998"
                  - paragraph [ref=e3156]:
                    - text: The Children of Jonestown Kenneth Wooden
                    - text: McGraw-Hill, New York, 1981.
                    - text: "ISBN: 0-07-071641-2"
                    - text: "Dewey: 362.7044 W886c"
                    - text: Pays particular attention to the 267 children whom the Temple collected and killed. The Temple went into the foster parents business in California, taking care of wards of the court, and got a lot of kids off of drugs, permanently.
                  - paragraph [ref=e3157]:
                    - text: White Night, The Untold Story of What Happened Before — And Beyond — Jonestown John Peer Nugent
                    - text: Rawson, Wade Publishers, Inc., New York, 1979.
                    - text: "ISBN: 0-89256-116-5"
                    - text: "Dewey: B Jo7178n"
                  - paragraph [ref=e3158]:
                    - text: Gone From the Promised Land, Jonestown in American Cultural History John R. Hall
                    - text: Transaction Books, New Brunswick USA and Oxford UK, 1987
                    - text: "ISBN: 0-88738-124-3"
                    - text: "Dewey: 289.9 H177g"
