                            - text: — Charles Bufe
                  - paragraph [ref=e2841]: Unfortunately, the cult leader Chuck Dederich went crazy, really crazy, and took over control of all of the members' sex lives and marriages, and all of the men except the leader Chuck Dederich had to get vasectomies and the pregnant women had to get abortions, so that they wouldn't have any bothersome children around the place. Then everyone in Synanon had to get divorced, and marry someone else in Synanon. Then, The Game was used to persuade men to exchange even their new wives in evening auctions called Changing Partners.
