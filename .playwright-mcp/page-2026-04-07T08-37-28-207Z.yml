                                - paragraph [ref=e954]: The placebo effect is influenced by several factors, including a person's expectations of the treatment and their desire to feel better, the investigators point out. By showing that placebo and an opioid agonist activate the same brain regions, the findings suggest that some of these same factors may be involved in triggering the pain relief.
