                  - heading "\"It's a wonderful organization because it has helped so many people...\"" [level=2] [ref=e2731]
                  - paragraph [ref=e2732]: Whenever I talk about the effectiveness of the Twelve-Step program, or of the propriety of coercively sending people to A.A., it seems like someone always answers with something like, "Well, it's okay for some people. It has really helped some people."
                  - paragraph
                  - list [ref=e2733]:
                    - listitem [ref=e2734]:
                      - text: That is like saying that Scientology is okay for some people — that it is really a good organization because it got a few poster children off of drugs. It doesn't matter if it is a sleazy, lying, thieving con — it's okay for some people. Those poor, pathetic "pre-clears" just didn't know what to do with their lives until Scientology came along and told them to work day and night to get money to give to Scientology.
                      - paragraph
                    - listitem [ref=e2735]:
                      - text: That is like saying that The Seed, or
                      - link "Straight, Inc." [ref=e2736] [cursor=pointer]:
                        - /url: /content/gulags#Straight
                      - text: ", or any of the newer children's gulags which have been"
                      - link "killing children" [ref=e2737] [cursor=pointer]:
                        - /url: /content/gulags
                      - text: lately, are really okay for some people — they are really good drug and alcohol rehabilitation programs because they got some kids off of drugs or alcohol for a while.
                      - paragraph
                    - listitem [ref=e2738]: That is like saying that Reverend Jim Jones' People's Temple was okay for some people; that it was a good drug and alcohol rehab program because it really helped some people.
                  - paragraph [ref=e2739]: A little-publicized fact is that the People's Temple actually did get a bunch of people off of drugs and alcohol, for a while. It really did have a successful drug and alcohol rehab program going, for a while. In fact, Jim Jones ran such a popular and successful rehab program that he was named one of "The 100 Outstanding Clergymen in America" by the Foundation for Religion in American Life in 1975, and, in 1976, he was named "Humanitarian of the Year" by the Los Angeles Herald-Examiner. At the same time, San Francisco Mayor George Moscone appointed Jim Jones Chairman of the San Francisco Housing Authority. For a long while, the people in power in San Francisco thought that Reverend Jim Jones was just the greatest religious leader, a real crusader for "clean and sober living."
