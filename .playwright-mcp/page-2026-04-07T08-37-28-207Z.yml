                  - paragraph
                  - blockquote [ref=e2784]:
                    - generic [ref=e2785]: Mama died [of cancer] in Jonestown ten days before the massacre, with Larry never leaving her bedside. She died without pain medication because Jim [Jones] had consumed it himself. For two months Larry watched our mother drift away from life without any relief from her agony until she finally succumbed to her lung cancer.
                    - generic [ref=e2786]: Seductive Poison, Deborah Layton, 1998, page 297.
                  - paragraph [ref=e2787]: You mean Jim Jones took a dying woman's pain-killers so he could get high on them himself? In a word, yes. Now that is cold, really cold. (But so is making 914 people, including their children and babies, commit suicide for you.)
                  - paragraph [ref=e2788]:
                    - text: Jim Jones passed the People's Temple off as the most successful drug and alcohol rehabilitation program in California for a while, but in the end, Jim Jones was whacked out on stolen drugs all of the time.
