                      - generic [ref=e1093]:
                        - text: But what could emetine aversion conditioning in the 1940s, disulfiram coupled with group therapy in a world-famous clinic in the 1950s, the use of AA coupled with indigenous Calypso singing ex-alcoholics in the 1960s, and behavior therapy to return to controlled drinking in the 1970s have in common? First, they all maximized the placebo effect of medical treatment and effected significant attitude change.
                        - text: ...
                        - text: Second, consistent with Frank's suggestions, in each of the programs the illness of alcoholism was carefully explained to each patient.
                        - text: ...
                        - text: Third, consistent with altering ingrained behavior, all four treatments maximized attitude change in an emotionally charged setting.
                        - text: ...
                        - text: Fourth, rather than trying to alter attitude by threat or by rational advice, each program altered attitudes by affecting self-esteem. The Sobells' patients were shown videotapes of themselves drinking in control and out of control; they highly valued the mastery involved in their return to controlled drinking.
                        - text: ...
                        - text: The success of Alcoholics Anonymous — and its reasonable facsimiles which are continuously being rediscovered — probably results from the fact that it conforms so well to the natural healing principles that Frank outlines and with Frank's general prescription for therapeutic group processes.
                      - generic [ref=e1094]:
                        - text: "The Natural History of Alcoholism: Causes, Patterns, and Paths to Recovery, George E. Vaillant, Harvard University Press, Cambridge, MA, 1983, pages 288-291."
                        - text: The same text was reprinted in Vaillant's later book,
                        - generic [ref=e1095]: The Natural History of Alcoholism Revisited
                        - text: ", George E. Vaillant, Harvard University Press, Cambridge, MA, 1995, pages 354-357."
                        - text: "[See the Bibliography at the end of this file for the references that Vaillant cited above.]"
                  - paragraph [ref=e1096]:
                    - text: "Outrageous. First off, note that Vaillant and Frank openly advocate brainwashing the patients:"
                    - generic [ref=e1097]:
                      - text: Do not use "explanation of risk and rational advice by physicians."
                      - text: "Rather, use: \"systematic indoctrination and repetition\" to \"effect significant attitude change\"."
                    - text: Notice how they actually say that they want to "increase a person's susceptibility" to their mind-bending procedures, and then they want to use irrational "emotionally-charged group-ritual placebo" treatment to reinforce the effects. They don't even blush as they advocate using brainwashing and mind-control techniques on their patients.
                  - paragraph [ref=e1098]:
                    - text: "By the way, Vaillant and Frank really should know enough about medical terminology to know that if a treatment works, and yields a real, measurable, strongly positive effect, then it isn't a placebo. By definition, a placebo is a do-nothing medicine. Vaillant claims real cures from Prof. Frank's \"placebo\" \"natural healing principles\". That's a contradiction in terms. So is this nonsensical oxymoronic double-talk:"
                    - text: "\"they all maximized the placebo effect of medical treatment...\""
                    - text: — Which would supposedly mean that medical treatment does not work and has no effect other than fooling the patients into healing themselves psychosomatically.
                  - paragraph [ref=e1099]:
                    - text: Now I know full well that there is such a thing as a placebo effect. Sometimes, patients will show improvement or relief from symptoms even if they are only given do-nothing sugar pills, because they believe that the pills will work. But you sure can't count on that effect, and you can't base a treatment program on hoping that you will get enough of a placebo effect to heal the patients.
                    - generic [ref=e1100]: Vaillant got no such helpful placebo effect in his own 8-year-long study of A.A. treatment, remember?
                    - text: And plenty of people are not at all fooled by any placebo effect — junkies and other dopers being at the top of the list. When unscrupulous dope dealers cheat their customers by giving them powdered sugar instead of smack or other drugs, the junkies and dopers know it immediately. They don't get high on any "placebo effect". So to imagine that a "placebo effect" is going to magically cure all of the alcoholics is pathetically deluded wishful thinking. (Either that, or else it is deliberate deception. Either he's crazy, or he's lying. It has to be one or the other, because he sure isn't telling us the truth. You decide which it is.)
                  - paragraph [ref=e1101]:
                    - text: Next, Vaillant cited a study of the Stanford Heart Disease Prevention Program, which found that patients had been helped by a program that included
                    - generic [ref=e1102]: "\"opportunity for identification through peer support groups.\""
                    - text: "So Vaillant suddenly assumed that peer groups were essential for the treatment of alcoholism, and began gleefully discussing the mechanics of how we can shove people into groups:"
                    - generic [ref=e1103]: "\"One of the functions, then, of the medical-care system is to facilitate the transition of the isolated patient to group membership.\""
                    - text: "Yes, force them all into Alcoholics Anonymous meetings, is what Vaillant really means. And then you have to Keep Them Coming Back for more and more \"group ritual\" medicine:"
                    - text: "\"Finally, if attitude change is to be maintained, repetition of group rituals and the group support that they engender must be sustained after clinic discharge.\""
