                      - blockquote [ref=e1951]:
                        - generic [ref=e1952]: (The first woman in A.A. was Jane Sturdevant and she is listed by Dr. Bob with 12 months of sobriety, dating her entrance into AA in February of 1937. You can read about her in Doctor Bob and the Good Oldtimers. (Thanks, L.D., for that one.) Which leaves the question, "What happened to her? Why is there no further mention of her in the A.A. history books? Why isn't she a legend in the A.A. history? I can only guess that the reason that "A.A. History Lovers" do not wish to talk about her is that she relapsed and returned to drinking, too.)
                      - paragraph
