                  - paragraph [ref=e1883]:
                    - text: And even before that, in 1938, when the fledgeling group of nameless alcoholics created "The One Hundred Men Corporation"
                    - link "to finance, write and publish the 'Big Book'" [ref=e1884] [cursor=pointer]:
                      - /url: /content/aacoa
                    - text: ", Bill Wilson made similar grossly exaggerated claims of success in the prospectus for shares of that corporation (which made it a case of felony securities fraud):"
                  - paragraph
                  - blockquote [ref=e1885]:
                    - generic [ref=e1886]: In all, about two hundred cases of hopeless alcoholism have been dealt with. As will be seen, about fifty percent of these have recovered. This, of course, is unprecedented — never has such a thing happened before.
                    - link "THE ONE HUNDRED MEN CORPORATION Prospectus" [ref=e1888] [cursor=pointer]:
                      - /url: orange-prospectus.html#unprecedented
                  - paragraph
                  - blockquote [ref=e1889]:
                    - blockquote [ref=e1890]:
                      - generic [ref=e1891]:
                        - text: When Bill Wilson claimed that "never has such a thing happened before", he was pointedly ignoring all of
                        - link "the popular and successful sobriety movements and temperance unions" [ref=e1892] [cursor=pointer]:
                          - /url: /content/funny-spirituality#temperance_unions
                        - text: which had come before, like the Women's Christian Temperance Union (WCTU), the Washingtonian Society, Keswick, the Keeley League, the Emmanuel Clinic, and the Salvation Army.
                  - paragraph [ref=e1893]: "Likewise, in 1955, in the Foreword to the Second Edition of the Big Book, page XX, Bill Wilson wrote:"
                  - paragraph
                  - blockquote [ref=e1894]:
                    - generic [ref=e1895]:
                      - link "Of alcoholics who came to A.A. and really tried" [ref=e1896] [cursor=pointer]:
                        - /url: /content/propaganda#qualifiers
                      - text: ", 50% got sober at once and remained that way; 25% sobered up after some relapses, and among the remainder, those who stayed on with A.A. showed improvement. Other thousands came to a few A.A. meetings and at first decided they didn't want the program. But great numbers of these — about two out of three — began to return as time passed."
                  - paragraph
                  - table [ref=e1899]:
                    - rowgroup [ref=e1900]:
                      - row [ref=e1901]:
                        - cell [ref=e1902]:
                          - generic [ref=e1903]:
                            - text: We will discuss the
                            - generic [ref=e1904]: "\"really tried\""
                            - text: qualifier below, but first I want to point out that Bill Wilson claimed that he was somehow able to keep track of
                            - generic [ref=e1905]: thousands
                            - text: of people who came to only a few A.A. meetings, and disliked what they saw, and left. Bill declared that "great numbers of these — about two out of three — began to return." How could Bill know that? How could he possibly know that?
                            - paragraph [ref=e1906]: "Robert Thomsen wrote a biography of Bill Wilson that was based on a set of autobiographical tapes that Bill recorded before his death. Thomsen parroted Wilson's claim:"
                            - paragraph
                            - blockquote [ref=e1907]:
                              - generic [ref=e1908]: In the year 1941, membership jumped from fifteen hundred to eight thousand, which meant that they probably dealt with another ten or fifteen thousand who looked in the door, turned around, and went out. In time Bill was to learn that two-thirds of these would one day return.
                              - generic [ref=e1909]: Bill W., Robert Thomsen, footnote on page 315.
                            - paragraph
                            - list [ref=e1910]:
                              - listitem [ref=e1911]: How could Bill Wilson keep track of all of those thousands of visitors when they were all anonymous?
                              - listitem [ref=e1912]: How could he remember ten or fifteen thousand people who came to the A.A. meeting rooms just once or twice, and didn't like what they saw, and left?
                              - listitem [ref=e1913]: But that 10 or 15 thousand number is just the number of visitors who came to A.A. during the year 1941. Bill Wilson wrote his grand "75% sobered up" claim in 1955, in the Foreword to the Second Edition. By then, Bill would have had to have tracked literally hundreds of thousands of visitors, to see that two thirds of them eventually "began to return".
                              - listitem [ref=e1914]:
                                - text: And what's with that slick word game? —
                                - generic [ref=e1915]: "\"But great numbers of these — about two out of three — began to return as time passed\"?"
                                - text: Began to return? Either they returned or they didn't. How do great numbers of people "begin to return"?
                                - text: Did two-thirds of them really return, or did they only "begin to return"?
                                - paragraph
                                - table [ref=e1918]:
                                  - rowgroup [ref=e1919]:
                                    - row "One can imagine, \"Well, they began to return. They put on their shoes and socks and coats, and headed for the New York City A.A. clubhouse, and got as far as 42nd Street before they turned around and went back home...\" Or was it like, \"There was this immense tsunami wave of people beginning to return to A.A. — It was flowing towards the A.A. clubhouse. Three people actually made it inside the clubhouse door before the wave reversed itself and flowed back out to sea...\"" [ref=e1920]:
                                      - cell "One can imagine, \"Well, they began to return. They put on their shoes and socks and coats, and headed for the New York City A.A. clubhouse, and got as far as 42nd Street before they turned around and went back home...\" Or was it like, \"There was this immense tsunami wave of people beginning to return to A.A. — It was flowing towards the A.A. clubhouse. Three people actually made it inside the clubhouse door before the wave reversed itself and flowed back out to sea...\"" [ref=e1921]:
                                        - generic [ref=e1922]: One can imagine, "Well, they began to return. They put on their shoes and socks and coats, and headed for the New York City A.A. clubhouse, and got as far as 42nd Street before they turned around and went back home..."
                                        - paragraph [ref=e1923]:
                                          - generic [ref=e1925]: Or was it like, "There was this immense tsunami wave of people beginning to return to A.A. — It was flowing towards the A.A. clubhouse. Three people actually made it inside the clubhouse door before the wave reversed itself and flowed back out to sea..."
                                - paragraph [ref=e1926]: Bill's phrasing indicates that only a few people actually returned, and Bill tried to imply that they were the leading edge of a big wave of returnees. That makes the "two-thirds" number meaningless.
                                - paragraph [ref=e1927]: That is just such a typical Wilson Weasle — so much of what he wrote was such deceptive and misleading nonsense.
                              - listitem [ref=e1928]: How could Bill determine that two thirds of them eventually returned? (If they actually returned, rather than just "began to return"...)
                              - listitem [ref=e1929]: Did somebody keep attendance records?
                              - listitem [ref=e1930]: Who kept the records, and how could he keep accurate records without any last names, when everybody was "anonymous"?
                              - listitem [ref=e1931]:
                                - text: Or was Bill Wilson just fabricating tall tales again?
                                - paragraph [ref=e1932]: Of course he was.
                                - paragraph
                              - listitem [ref=e1933]:
                                - text: And will the Alcoholics Anonymous World Services, Inc. headquarters or the General Service Organization open up the locked and sealed archives of historical documents and let us see those original attendance records, to see how many people really returned?
                                - paragraph [ref=e1934]: No.
                  - paragraph [ref=e1935]: In the quote above, where Bill wrote, "Of alcoholics who came to A.A. and really tried, 50% got sober at once, and remained that way; 25% sobered up after some relapses", we get the impression that at A.A. worked on at least 25% of the alcoholics right away (50% of the claimed half who joined A.A.), and 37.5% later (75% of the claimed half who joined A.A.).
                  - paragraph [ref=e1936]: But the quote from Dr. Bob's memorial service reveals that Bill Wilson was cherry-picking. Bill culled hundreds of alcoholics to get just a few of the best prospects to join Alcoholics Anonymous — to "take the bait". That sounds like a one or two percent recruiting rate. If two percent of the alcoholics joined Bill's "spiritual fellowship", and half of them really kept coming back to A.A. for a long time, and 75% of those committed members eventually recovered and achieved long-term sobriety, then that would yield an over-all success rate for Alcoholics Anonymous of only 3/4 of one percent — less than one out of a hundred. That really is appalling. That is not what we would call a good alcoholism treatment program. That is a total failure. That "success rate" is far less than the normal rate of spontaneous remission from alcoholism (five percent per year). We will get better results with the alcoholics if we do nothing.
                  - paragraph [ref=e1937]:
                    - text: "Then Bill used that qualifier to filter out the failures:"
                    - generic [ref=e1938]: "\"Of alcoholics who came to A.A. and really tried...\""
                    - text: If they didn't join A.A., or they didn't "really try", then they didn't count.
                    - generic [ref=e1939]: But who decided whether they had really tried?
                    - generic [ref=e1940]: Well, Bill Wilson, of course.
                    - text: Oh heck, with that qualifier, Bill Wilson could make the numbers into anything he wanted them to be.
                  - paragraph [ref=e1941]: Presumably, if someone just relapsed repeatedly, and showed no improvement, then he wasn't really trying, so don't count him. So Bill didn't.
                  - paragraph [ref=e1942]: The way Bill that counted those success stories, there was not one person who didn't show improvement, if they just really tried. There was not one total failure in Bill's program.
                  - paragraph [ref=e1943]:
                    - text: But we know full well that there were plenty of early members — members of the so-called "
                    - link "First One Hundred" [ref=e1944] [cursor=pointer]:
                      - /url: /content/funny-spirituality#org100
                    - text: "\" — who totally relapsed, and just went out and died drunk:"
                  - paragraph
                  - list [ref=e1945]:
                    - listitem [ref=e1946]:
                      - link "Henry Parkhurst" [ref=e1947] [cursor=pointer]:
