                  - paragraph [ref=e2771]: Many people felt that they owed their lives to Jim Jones, because he had saved them from death by drugs and alcohol. Unfortunately, in the end, Rev. Jones collected on that debt by demanding that all of his followers commit suicide for him. And they were so brainwashed and indoctrinated and crazy that 914 of them actually did it. (Actually, not all of them did it voluntarily; those who refused were forcibly injected with cyanide or shot by the goon squad of true believers, "The Angels".)
