                  - paragraph [ref=e306]: Even after 21 years, one third of the alcoholics are still drinking. In addition, in those 21 years, another whole new younger generation of alcoholics has matured and started drinking (so, theoretically, we have at least another 10,000 new alcoholics added to the mix). So no way does the problem spontaneously disappear, even though almost two-thirds of the original group of alcoholics are no longer drinking.
                  - paragraph [ref=e307]: Many, many alcoholics do just recover spontaneously, and yet, the problem still never goes away.
                  - paragraph [ref=e308]: Actually, we haven't computed the deaths from alcoholism and subtracted them out. That will make the number of remaining alcoholics decline much faster. (And we haven't even considered the deaths from tobacco. Most alcoholics are also heavy smokers, and more than half of the time, tobacco kills them before the alcohol does.) The real numbers are more complex than this chart indicates, but it is accurate enough for you to see the principle at work.
                  - paragraph [ref=e309]: Likewise, the younger generation of alcoholics does not all start drinking at 21 years of age. They may start at any age from 12 to 35, or even later. So, in the real world, we have many successive waves of alcoholics starting and quitting simultaneously, producing very complex patterns of numbers. But the one simple, undeniable fact is that generation after generation, while all of the individual alcoholics do either quit drinking or die, the problem doesn't go away.
