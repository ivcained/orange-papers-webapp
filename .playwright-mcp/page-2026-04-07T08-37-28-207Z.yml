                  - paragraph [ref=e1991]: Bill Wilson also said of alcoholics that...
                  - paragraph
                  - blockquote [ref=e1992]:
                    - generic [ref=e1993]: Some of them may sink and perhaps never get up, but if our experience is a criterion, more than half of those approached will become fellows of Alcoholics Anonymous.
                    - generic [ref=e1994]: The A.A. Big Book Alcoholics Anonymous, William G. Wilson, page 163.
                  - paragraph [ref=e1995]:
                    - generic [ref=e1996]: More than half join?
                    - text: Hmmm... Bill Wilson seems to have been "
                    - link "mathematically challenged" [ref=e1997] [cursor=pointer]:
                      - /url: /content/religious-faith#math_education
                    - text: "\", to say it in a politically correct way. Bill wrote in the Big Book, in late 1938 or early 1939, that more than half of those approached became \"fellows of Alcoholics Anonymous.\" But later, in 1952, he admitted that they had to cull hundreds of drunks to get just a few to \"take the bait\" and join. And then in 1957 he stated that most of those new members relapsed —"
                    - generic [ref=e1998]: "\"At first nearly every alcoholic we approached began to slip, if indeed he sobered up at all. Others would stay dry six months or maybe a year and then take a skid.\""
                  - paragraph [ref=e1999]: "And Bill made more grand claims of success further on in the Big Book (written in December 1938):"
                  - paragraph
                  - blockquote [ref=e2000]:
                    - generic [ref=e2001]: RARELY HAVE we seen a person fail who has thoroughly followed our path. Those who do not recover are those who cannot or will not give themselves completely to this simple program, usually men and women who are constitutionally incapable of being honest with themselves. There are such unfortunates. They are not at fault; they seem to have been born that way.
                    - generic [ref=e2002]: A.A. Big Book, 3rd Edition, William G. Wilson, page 58.
                  - paragraph [ref=e2003]:
                    - text: Bill's claim that "RARELY HAVE we seen a person fail who has thoroughly followed our path" is simply ridiculous, and is not supported by any facts or evidence, or even by Bill Wilson's other writings, so you can ignore that. In fact, the situation was so bad that Bill Wilson should have written,
                    - generic [ref=e2005]:
                      - text: "\"RARELY HAVE we seen a person"
                      - generic [ref=e2006]: succeed
                      - text: by thoroughly following our path."
                  - paragraph [ref=e2007]: "Many people saw what Bill was doing with the numbers and corrected Bill's distortions. Nell Wing, Bill Wilson's personal secretary for many years (right up to his death), wrote:"
                  - paragraph
                  - blockquote [ref=e2008]:
                    - generic [ref=e2009]: Many members recall Bill's tendency to exaggerate. Ruth Hock, Bill's secretary and office manager, remembers that when talking before a meeting he was prone to be overgenerous in quoting the latest membership count or convention attendance. He might say, for example, "Well, folks, I'm glad to say there are now 150 members." Ruth, who like me could be quite literal-minded, would lean over and whisper, "No, Bill, it's only 95" or whatever the figure was. Afterward, Bill would complain good-naturedly, "Oh, Ruth, you're spoiling my fun." Bill always claimed the attendance at the 1955 International Convention was 5,000. Dennis, who handled the registrations, told me the true number was about 3,100, plus possibly a few hundred walk-ins. I recall myself that the crowd nowhere near filled Kiel Auditorium.
                    - generic [ref=e2010]: Grateful To Have Been There, Nell Wing, page 61.
                  - paragraph [ref=e2011]:
                    - generic [ref=e2013]:
                      - text: Lying and fudging the numbers in the critical life-or-death matter of recovery from alcohol addiction is
                      - generic [ref=e2014]: fun
                      - text: "?"
                      - text: Bill Wilson was really
                      - link "something else" [ref=e2015] [cursor=pointer]:
                        - /url: /content/funny-spirituality#Narcissistic
                      - text: .
                  - paragraph [ref=e2016]:
                    - generic [ref=e2017]:
                      - text: Like
                      - link "Dr. Alexander Lowen" [ref=e2018] [cursor=pointer]:
                        - /url: /content/funny-spirituality#Lowen2
                      - text: said,
                      - generic [ref=e2019]: The tendency to lie, without compunction, is typical of narcissists.
                      - generic [ref=e2020]: (Narcissism, Denial of the True Self, Alexander Lowen, M.D., page 54.)
                  - paragraph [ref=e2021]
                  - table [ref=e2024]:
                    - rowgroup [ref=e2025]:
                      - row [ref=e2026]:
                        - cell [ref=e2027]:
                          - generic [ref=e2028]:
                            - text: "Francis Hartigan was Lois Wilson's (Bill's wife's) private secretary. He wrote a biography of Bill Wilson where he described the difficulties that Bill Wilson and Doctor Bob experienced in the very early days of A.A., in 1935 in Akron, Ohio:"
                            - paragraph
                            - blockquote [ref=e2029]:
                              - generic [ref=e2030]: We have to wonder why both the Wilsons and the Smiths did not simply give up. Today the nation's best alcoholism treatment centers report success rates ranging from 25 percent to 50 percent. During Bill's stay in Akron, he and Bob calculated their success rate to be about 5 percent, and among the few who seemed to catch on, not all of them were able to maintain consistent sobriety. The first edition of AA's Big Book, published in 1939, contains the personal recovery stories of many of AA's earliest members. Some years later, Bill made notations in the first copy of the book to come off the press, indicating which individuals portrayed therein had stayed sober. A good 50 percent of them had not.
                              - generic [ref=e2031]:
                                - text: Bill W. A Biography of Alcoholics Anonymous Cofounder Bill Wilson,
                                - link "Francis Hartigan" [ref=e2032] [cursor=pointer]:
                                  - /url: "#Hartigan"
                                - text: ", pages 91-92."
                            - paragraph [ref=e2033]:
                              - text: So 50 percent of the first-edition Big Book authors relapsed and returned to drinking? That has to be another reason why Bill Wilson
                              - link "almost completely replaced the original set of autobiographical stories" [ref=e2034] [cursor=pointer]:
                                - /url: /content/bigbook#second_edition
                              - text: when he published the second edition.
                            - paragraph [ref=e2035]:
                              - generic [ref=e2037]: But Bill didn't bother to tell us about all of those relapses. He just floated a story about how the new biographies would be "more suitable for the times", while continuing his grossly dishonest "A.A. works great" song and dance.
                              - generic [ref=e2038]:
                                - text: And the policy of anonymity makes it impossible for us to check whether the more recent authors have relapsed. Who knows what the real success stories of those authors are, or
                                - link "whether the stories are in fact just fabrications, like the Indian \"Tall Man\" in the story Join The Tribe" [ref=e2039] [cursor=pointer]:
                                  - /url: /content/letters-9#Tall_Man
                                - text: .
                            - paragraph [ref=e2040]:
                              - text: Note that the treatment centers who report a 25 to 50 percent success rate — or more, sometimes even 80% — are
                              - link "basically lying" [ref=e2041] [cursor=pointer]:
                                - /url: "#rehab_center"
                              - text: ". They discount and ignore their dropouts, quitters, and relapsers, and only reveal what percentage of their program graduates stay sober (for a short while after graduation). They are also doing Enron-style accounting. Furthermore, most treatment centers demand that people be sober in order to \"graduate\", so that creates a circular definition of success: Only the sober people qualify as \"graduates\", so the treatment program must work great, because so many of its graduates are sober."
                          - paragraph [ref=e2042]:
                            - generic [ref=e2043]: Also note that Bill and Dr. Bob ostensibly got that same old 5 percent success rate, at least in initial recruiting. But that is just the normal rate of spontaneous remission of alcoholism, once again. The A.A. program still did not show any improvement over the usual rate of spontaneous remission. A.A. did not increase the number of sober people over the number who would have quit anyway, without A.A.'s "help". In fact, A.A. appears to have actually reduced the usual success rate from 5 percent down to 2.5 or 3.5 percent or so, when all of those Big Book authors eventually relapsed.
                  - paragraph [ref=e2044]: "In writing words of encouragement to Jennie B., the founding mother of A.A. in Boston, Bill Wilson described his own experiences in sobering up alcoholics like this:"
                  - paragraph
                  - blockquote [ref=e2045]:
                    - generic [ref=e2046]:
                      - text: What you say about your discouragement in working with alcoholics surely brings the past before me. I guess I told you the story of 182 Clinton Street, Brooklyn, where we took in alcoholics for two years without any result whatever. In those days, Lois and I used to blame ourselves, thinking that somehow we failed. Only the other night, she and I looked over a list of the people we worked with in those days, both at 182 Clinton Street and elsewhere. The number of them who have since dried up was truly astonishing. This made us realize that in God's economy, nothing is wasted. At the time of our failure, we learned a little lesson in humility which was probably needed, painful though it was.
                      - text: We now see so clearly that the immediate results are not so important. Some people start out working with others and have immediate success. They are likely to get cocky. Those of us who are not so successful at first get depressed. As a matter of fact, the successful worker differs from the unsuccessful one only in being lucky about his prospects. He simply hits cases who are ready and able to stop at once. Given the same prospects, the seemingly unsuccessful person would have produced almost the same results. In other words, you have to work on a lot of cases before the law of averages commences to assert itself.
                      - text: So cheerio, Jennie — it ain't your fault.
                    - generic [ref=e2047]: "'PASS IT ON', The story of Bill Wilson and how the A.A. message reached the world, Alcoholics Anonymous World Services, Inc. staff, 1984, pages 251-252."
                  - paragraph [ref=e2048]: What Bill Wilson was describing is normal spontaneous remission in alcoholics. A few alcoholics, like 5% of them, will be ready and able to quit now, or some time this year, because they are sick and tired of the drinking and being sick routine. Then 5% more will quit next year, and that many more the following year, and then the following... After a lot of years, you will see that half of the alcoholics have quit drinking. As Bill Wilson described it, "the law of averages commences to assert itself." The lucky A.A. recruiter "simply hits cases who are ready and able to stop at once." That recovery process has nothing to do with the efforts of any Alcoholics Anonymous missionaries, and it isn't caused by any Alcoholics Anonymous activities — not by the meetings, not by the 12 Steps, and not by the talk about God.
                  - paragraph [ref=e2049]:
                    - text: Bill Wilson was, in spite of his sanctimonious talk about humility, just
                    - link "presumptuously taking the credit for other peoples' hard work to quit drinking" [ref=e2050] [cursor=pointer]:
                      - /url: /content/propaganda#take_credit
                    - text: and save their own lives. There was zero evidence that anything Bill did at 182 Clinton Street made his house guests quit drinking several years later, but Bill still claimed the credit for their sobriety anyway, and implied that they were his success stories — that he had somehow caused them to quit drinking — that their sobriety was ultimately the fruit of his labors — "that in God's economy, nothing is wasted."
                  - paragraph [ref=e2051]:
                    - text: Bill Wilson did that again in
                    - link "the speech he gave at the memorial service for Doctor Bob" [ref=e2052] [cursor=pointer]:
                      - /url: orange-Dr_Bob_Memorial.html#Eddie
                    - text: ". Bill described a manic depressive alcoholic in Akron named Eddie, to whom Bill and Dr. Bob gave a pep talk about quitting drinking. Eddie didn't go for it. He continued drinking and ended up confined to the State mental asylum for a dozen or more years. Finally, Eddie decided to quit drinking, and he showed up at Doctor Bob's funeral sober. So Bill promptly took the credit for Eddie's sobriety:"
                  - paragraph
                  - blockquote [ref=e2053]:
                    - generic [ref=e2054]:
                      - text: Thereafter, Eddie was in the State Asylum for a period of a dozen or more years but believe it or not he showed up at the funeral of Dr. Bob in the fall of 1950 as sober as a judge and he had been that way for three years.
                      - text: So even that obscure little talk about Eddie made the grade.
                    - generic [ref=e2055]:
                      - text: Bill Wilson, at the memorial service for Dr. Bob, Nov. 15, 1952; file available
                      - link "here" [ref=e2056] [cursor=pointer]:
                        - /url: orange-Dr_Bob_Memorial.html
                      - text: .
                  - paragraph [ref=e2057]: The current Alcoholics Anonymous organization still uses that same faulty logic when it claims that it has sobered up millions of people. A few newcomers quit drinking in order to save their own lives and their health, and then the A.A. organization takes the credit for their sobriety, and claims that it somehow made them quit drinking — "The program works," they say.
                  - paragraph [ref=e2058]: And of course A.A. disavows any responsibility for all of those millions of other people who don't quit drinking — the relapsers and the dropouts and the deaths. A.A. proselytizers never admit that the relapsers and dropouts prove that the 12-Step program does not work. A.A. boosters never recognize that the program is no help to the vast majority of alcoholics.
                  - paragraph [ref=e2059]:
                    - text: Thus that routine is just another example of
                    - link "cherry-picking" [ref=e2060] [cursor=pointer]:
                      - /url: /content/propaganda#observational
                    - text: — just claim the credit for the few successes while ignoring the many more failures.
                  - paragraph
                  - table [ref=e2063]:
                    - rowgroup [ref=e2064]:
                      - 'row "The Sagan rule: \"Extraordinary claims require extraordinary evidence.\" The far-fetched claims of Bill Wilson that Frank Buchman''s cult religion could cure alcoholism have not been backed up by even a little ordinary evidence, never mind some extraordinary evidence." [ref=e2065]':
                        - 'cell "The Sagan rule: \"Extraordinary claims require extraordinary evidence.\" The far-fetched claims of Bill Wilson that Frank Buchman''s cult religion could cure alcoholism have not been backed up by even a little ordinary evidence, never mind some extraordinary evidence." [ref=e2066]':
                          - generic [ref=e2067]: "The Sagan rule: \"Extraordinary claims require extraordinary evidence.\""
                          - paragraph [ref=e2068]:
                            - generic [ref=e2069]: The far-fetched claims of Bill Wilson that Frank Buchman's cult religion could cure alcoholism have not been backed up by even a little ordinary evidence, never mind some extraordinary evidence.
                  - paragraph [ref=e2070]
                  - generic [ref=e2071]:
                    - img
                  - paragraph [ref=e2072]: "While we are talking about people cooking the books and faking the numbers, we shouldn't overlook Nan Robertson's statements in her popular book, Getting Better Inside Alcoholics Anonymous:"
                  - paragraph
                  - blockquote [ref=e2073]:
                    - generic [ref=e2074]: About 60 percent of all newcomers — some still drinking at first, most not — who go to A.A. meetings for up to a year remain in A.A. Usually, they stay sober for good. That means, of course, that 40 percent are lost to A.A. after trying out its program. These statistics refute the widely held notion of outsiders that Alcoholics Anonymous is successful with everyone.
                    - generic [ref=e2075]: Getting Better Inside Alcoholics Anonymous, Nan Robertson, 1988, page 94.
                  - paragraph [ref=e2076]:
                    - generic [ref=e2077]:
                      - text: Nan Robertson actually reported that
                      - generic [ref=e2078]: most of the newcomers to Alcoholics Anonymous had already quit drinking
                      - text: ", but A.A. was happy to take the credit for their sobriety anyway, and claim that it had somehow made them quit drinking or \"kept them sober\"."
                  - paragraph [ref=e2079]:
                    - text: Then Nan Robertson tried to imply that only 40 percent of the newcomers were "lost to A.A.", but she was just
                    - link "lying with qualifiers" [ref=e2080] [cursor=pointer]:
                      - /url: /content/propaganda#qualifiers
                    - text: . She actually stated that only 60 percent of those few who stay in A.A. for a whole year continue to go to A.A. after that.
                  - paragraph [ref=e2081]: We know from the preceding information that at least 95 percent of the newcomers drop out by the one-year point, so she was really saying that only six tenths (60%) of the five percent who were still in A.A. at the one-year point would remain in A.A. after 1 year. That is a mere three percent who stay longer than one year. So the truth is that at least 97 percent of the newcomers were "lost to A.A.", not 40 percent.
                  - paragraph [ref=e2082]:
                    - generic [ref=e2083]:
                      - text: And then the real truth is even worse than that — the attrition continues.
                      - link "Only one person per thousand newcomers to A.A. becomes a sober 20-year old-timer" [ref=e2084] [cursor=pointer]:
                        - /url: /content/letters-62#coin_table
                      - text: in Alcoholics Anonymous. So something like 99.9% of the newcomers are eventually "lost to A.A.".
                  - paragraph [ref=e2085]:
                    - text: Also notice Nan Robertson's use of the propaganda trick
                    - link "False Equality" [ref=e2086] [cursor=pointer]:
                      - /url: /content/propaganda#equality
                    - text: ":"
                  - list [ref=e2087]:
                    - generic [ref=e2088]:
                      - listitem [ref=e2089]: "\"Remaining in A.A. equals staying sober for good.\""
                      - listitem [ref=e2090]: "\"Leaving A.A. equals staying drunk forever.\""
                  - text: Nan Robertson just assumed that those who left A.A. did not ever get sober or stay sober on their own (which many do), and she also assumed that staying in A.A. means staying sober, rather than just relapsing repeatedly and
                  - link "doing a lot of binge drinking" [ref=e2091] [cursor=pointer]:
                    - /url: "#Brandsma"
                  - text: ", which is what actually happens more often."
                  - paragraph [ref=e2092]: Did Nan Robertson do any kind of survey or follow-up to find out how many A.A. dropouts sobered up later? Or how many A.A. members stayed in A.A. long-term, and also stayed sober? Ms. Robertson never reported any such survey or study.
                  - paragraph [ref=e2093]: "Further on in her book, Nan Robertson gave us some completely unverifiable declarations of A.A. successes, trying to imply that A.A. works. She described the work of Dr. Ruth Fox as:"
                  - paragraph
                  - blockquote [ref=e2094]:
                    - generic [ref=e2095]: She sent all her alcoholics into A.A. Those who stayed, she noted, often got sober for good; those who dropped out did not.
                    - generic [ref=e2096]: Getting Better Inside Alcoholics Anonymous, Nan Robertson, page 184.
                  - paragraph [ref=e2097]: Robertson implied that staying in A.A. makes people "get sober for good", and that dropping out of A.A. makes people drink. But she gave us no numbers at all — there is no indication whatsoever of what Dr. Fox's actual success rate might have been. Likewise, she didn't even give us a hint about how many people actually stayed in A.A. indefinitely. It's all vague hoopla. And there are no footnotes in Nan Robertson's book, nor any bibliography, nor any citations. None of her statements can be checked for accuracy, or verified, or traced back to their sources. She does not say anything about where she gets her statistics or other information.
                  - paragraph [ref=e2098]:
                    - text: And then Nan Robertson deceptively wrote that
                    - generic [ref=e2099]:
                      - text: "\"Those who stayed"
                      - generic [ref=e2100]: often
                      - text: got sober for good."
                    - generic [ref=e2101]:
                      - text: "\""
                      - generic [ref=e2102]: Often
                      - text: "\"."
                    - text: So sometimes the long-time A.A. members stayed sober, and sometimes they didn't. That is a meaningless statement, when you come right down to it. You can say the same thing about baseball — "Those people who kept coming back to more baseball games often stayed sober. (And, then again, often they didn't.)"
                  - paragraph [ref=e2103]: Nan Robertson tries to make us believe that staying in A.A. leads to prolonged sobriety. But how many successes did Dr. Ruth Fox really get from sending everybody to A.A.? Probably less than the usual five percent per year spontaneous remission rate.
                  - paragraph [ref=e2104]: And note how Robertson implied a cause and effect relationship between going to A.A. and getting sober, while actually giving us no evidence of that. We could just as easily say that prolonged sobriety caused a few people to stay in A.A., while those who continued to drink alcohol didn't feel inclined to waste their time on A.A. meetings.
                  - paragraph [ref=e2105]: And, more realistically, there is the distinct possibility that a few successful quitters got fooled into believing that A.A. was necessary for their sobriety, so they continued to attend meetings for many years. The drinkers, on the other hand, knew full well that A.A. wasn't necessary for drinking, so they didn't bother with A.A. meetings.
                  - paragraph
                  - table [ref=e2108]:
                    - rowgroup [ref=e2109]:
                      - row [ref=e2110]:
                        - cell [ref=e2111]:
                          - generic [ref=e2113]:
                            - text: Oh, last but not least, how could Dr. Ruth Fox be so sure that those people who dropped out of A.A. didn't eventually get sober by their own efforts, or through some other program? Did Dr. Fox track all of them for the rest of their lives to see what really happened with them? No, of course not. So she cannot possibly truthfully make a blanket declaration that the A.A. dropouts didn't get and stay sober later on.
                            - paragraph [ref=e2114]: When we consider the facts that the overwhelming majority — more than 95% — of the newcomers dislike A.A. and drop out, and that nevertheless, more than 50% of all alcoholics eventually successfully quit drinking anyway, it is obvious that approximately half of the A.A. dropouts do achieve sobriety on their own.
                            - paragraph [ref=e2115]: Heck, for that matter, how long did Dr. Fox track the sober A.A. members? Five years? Ten years? Twenty years? If she didn't track them for a lot of years, then she couldn't really know whether they stayed sober or not, either.
                          - paragraph [ref=e2116]:
                            - generic [ref=e2118]:
                              - text: Nan Robertson did not say anything about Dr. Fox having done a big, expensive, lengthy longitudinal controlled study to see who really stayed sober and who really stayed drunk, to see whether A.A. actually made more people get and stay sober. And there is no record or report of any such study in the professional literature, and
                              - link "Dr. Ruth Fox's own book" [ref=e2119] [cursor=pointer]:
                                - /url: /content/bibliography#Ruth_Fox
                              - text: failed to report any such test of the effectiveness of Alcoholics Anonymous treatment. So in the final analysis, Dr. Ruth Fox could not have known either whether the A.A. members stayed sober, or whether the A.A. dropouts stayed drunk.
                  - paragraph
                  - table [ref=e2122]:
