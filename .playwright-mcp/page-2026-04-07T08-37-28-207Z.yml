                  - paragraph [ref=e1727]: "In the yahoo group \"AAhistorylovers\", ny-aa wrote:"
                  - paragraph
                  - blockquote [ref=e1728]:
                    - generic [ref=e1729]:
                      - text: One hand-drawn graph in a paper summarizing the 1977 through 1989 Trennial Surveys has been misread by many people. The myth of a 95% drop-out in the first year comes because it reported the membership length of people who were in their first ever year of Alcoholics Anonymous. The x-axis scale of the graph was the percentage who had been coming for any given number of months, it was not the retention percentage.
                      - paragraph [ref=e1730]:
                        - link "http://health.groups.yahoo.com/group/AAHistoryLovers/message/2379" [ref=e1731] [cursor=pointer]:
                          - /url: http://web.archive.org/web/20161020131749/http://health.groups.yahoo.com/group/AAHistoryLovers/message/2379
                    - paragraph [ref=e1732]:
                      - generic [ref=e1733]:
                        - text: My AAHistoryLovers Post 2379 (with added comments by moderator Glenn C) presents the proper reading of the graph. The retention from any month to any other is the ratio of the number of members found. For every 100 people who were in their first year, 19 were in their first month and 5 were in their twelfth.
                        - text: 5 / 19 = 0.26 So 26% remain at the end of their first year. Newcomers often are told, "Try A.A. for three months and decide if you are an alcoholic." About half leave during that "test drive." The Survey found 9 in their fourth month. 5 / 9 = 0.56 So 56% of those staying beyond three months finish the year of their first ever A.A. experience.
                      - link "http://health.groups.yahoo.com/group/AAHistoryLovers/message/3374" [ref=e1735] [cursor=pointer]:
                        - /url: http://web.archive.org/web/20161020131749/http://health.groups.yahoo.com/group/AAHistoryLovers/message/3374
                  - paragraph [ref=e1736]: Sorry, "aany", but that math is broken.
                  - paragraph [ref=e1737]: What you are missing is the vast majority of the newcomers. You have not counted any of the newcomers who drop out in the first month, which is most of them.
                  - paragraph [ref=e1738]: "It's like this:"
                  - paragraph [ref=e1739]:
                    - generic [ref=e1740]: "[Please note: these numbers are from the previous way of interpreting the graph. If we use the second way of interpreting the graph, the dropout rate will be at least as bad.]"
                  - paragraph [ref=e1741]: You have a large group where 100 new people come each month. Some come out of curiosity, wondering if A.A. can help them to quit drinking. Others are court-ordered, or are sent by a treatment program. Whatever.
                  - paragraph [ref=e1742]: In the first month, 81% of them stop coming back. On the day that the triennial survey is done, there are 19 people remaining out of that 100, and they have 1 month of membership.
                  - paragraph [ref=e1743]: There are also present 13 who have been coming for 2 months, who are left over from the previous month's 100 newcomers.
                  - paragraph [ref=e1744]: Then there are 10 left from the 100 newcomers the month before that.
                  - paragraph [ref=e1745]: Then 9 are left from the month before that. And so on, down to the 5 who are left from the 100 newcomers who came 12 months ago.
