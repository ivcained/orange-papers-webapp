                      - 'row "From the newsgroup alt.recovery.from-12-steps, August 8, 2005: \"peacefulstar\" said: When i was in treatment we were told that only one of us would stay sober. I didnt believe it until 3 yrs ago. We started with 39 people that was in 1985. we kept in contact and this is the way they are today: 1 — 20 yrs sober 1 — with 4 yrs after having 15 (my Self) 7 — 1 yr or little more 2 — with 5 mon 1 — with 3 mon 12 — in jail 7 — unknown 8 — died (including my husband) Its sad when we look at it now but it helps me to remember. I Thank God every day that I made it back. I also pray for those who are still out there. I go to meetings in jail, if i only reach one I feel blessed. I am glad they told me what they did when i went in to treatment. I know today without AA and the tools they gave us i wouldnt be here." [ref=e2466]':
