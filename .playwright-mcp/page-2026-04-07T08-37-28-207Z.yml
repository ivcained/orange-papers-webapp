                  - paragraph
                  - paragraph [ref=e352]:
                    - text: In spite of the scarcity of good, properly run
                    - link "randomized longitudinal controlled studies" [ref=e353] [cursor=pointer]:
                      - /url: /content/letters-26#RLCS
                    - text: of the effectiveness of Alcoholics Anonymous, there are still several good tests and studies which were done properly, and give us a good idea of what is happening.
                  - paragraph [ref=e354]:
                    - text: There is experimental evidence that the A.A. doctrine of powerlessness leads to binge drinking. In a sophisticated controlled study of A.A.'s effectiveness (Brandsma et. al.), court-mandated offenders who had been sent to Alcoholics Anonymous for several months were engaging in
                    - generic [ref=e355]: FIVE TIMES as much binge drinking
                    - text: as another group of alcoholics who got no treatment at all, and the A.A. group was doing
                    - generic [ref=e356]: NINE TIMES as much binge drinking
                    - text: as another group of alcoholics who got rational behavior therapy.
                  - paragraph [ref=e357]: Those results are almost unbelievable, but are easy to understand — when you are drunk, it's easy to rationalize drinking some more by saying,
                  - blockquote [ref=e358]:
                    - generic [ref=e359]: "\"Oh well, A.A. says that I'm powerless over alcohol. I can't control it, so there is no sense in trying. I'm doomed, because I already took a drink. One drink, one drunk. I'm screwed, because I already lost all of my sober time, and I have to give back all of my sobriety coins. Might as well just relax and enjoy it now. Pass that bottle over here, buddy.\""
                  - paragraph [ref=e360]: It's also easy to rationalize taking the first drink with,
                  - blockquote [ref=e361]:
                    - generic [ref=e362]:
                      - text: "\"I'm powerless. I can't help it. The Big Book says that I have no defense against those"
                      - link "strange mental blank spots" [ref=e363] [cursor=pointer]:
                        - /url: "#blank_spot"
                      - text: when I'll drink again. Bottoms up!"
                  - paragraph [ref=e364]: "Dr. Jeffrey Brandsma and his associates Dr. Maxie Maultsby (co-inventor of Rational Behavior Therapy) and Dr. Richard J. Welsh did a study where they took some alcoholics who had been arrested for public drunkenness, and randomly divided them into three groups, which got one of:"
                  - list [ref=e365]:
                    - listitem [ref=e366]: A.A. treatment
                    - listitem [ref=e367]: Lay RBT (non-professional Rational Behavior Therapy, something invented by Dr. Maxie Maultsby and Dr. Albert Ellis, something very similar to SMART)
                    - listitem [ref=e368]: No treatment at all. This was the control group.
                  - paragraph [ref=e369]: "And the results were:"
                  - paragraph
                  - blockquote [ref=e370]:
                    - generic [ref=e371]:
                      - text: "The variables that showed significant differences at outcome could be organized into three categories: treatment holding power, legal difficulties, and drinking behavior. Treatment holding power was indicated by the percentage of dropouts between intake and outcome ("
                      - link "p = 0.05" [ref=e372] [cursor=pointer]:
                        - /url: /content/letters-11#p_values
                      - text: ), the mean number of treatment sessions attended (p = 0.05), and the mean number of days in treatment. Less than one-third (31.6%) of the clients assigned to the AA group qualified for outcome measures in contrast to almost 60% for the lay-RBT group, and this occurred with equivalent attempts by our social work staff to keep the men in treatment, whatever type it was. Table 32 highlights these differences.
                      - paragraph
                      - table [ref=e375]:
                        - rowgroup [ref=e376]:
                          - row "Table 32. Mean number of treatment sessions and days in treatment" [ref=e377]:
                            - cell "Table 32. Mean number of treatment sessions and days in treatment" [ref=e378]
                          - row "Group N at intake N at outcome Mean number of sessions Mean number of days treated" [ref=e379]:
                            - columnheader "Group" [ref=e380]
                            - columnheader "N at intake" [ref=e381]
                            - columnheader "N at outcome" [ref=e382]
                            - columnheader "Mean number of sessions" [ref=e383]
                            - columnheader "Mean number of days treated" [ref=e384]
                          - row "AA 38 12 20.9 203" [ref=e385]:
                            - cell "AA" [ref=e386]
                            - cell "38" [ref=e387]
                            - cell "12" [ref=e388]
                            - cell "20.9" [ref=e389]
                            - cell "203" [ref=e390]
                          - row "Lay-RBT 42 25 27.6 243" [ref=e391]:
                            - cell "Lay-RBT" [ref=e392]
                            - cell "42" [ref=e393]
                            - cell "25" [ref=e394]
                            - cell "27.6" [ref=e395]
                            - cell "243" [ref=e396]
                      - paragraph [ref=e397]: "There were two measures of legal difficulties, both self-reported during the last 3 months. The means for the number of arrests (p = 0.04) are: lay-RBT, 1.24; AA, 1.67; and control, 1.79. The results for convictions (p = 0.02) are very similar."
                      - paragraph [ref=e398]: The lay-RBT group had significantly fewer arrests and convictions than did the control group. ...
                      - paragraph [ref=e399]: All of the lay-RBT clients reported drinking less during the last 3 months. This was significantly better than the AA or the control groups at the 0.005 level. The lay-RBT group also reported on two variables (one a direct question, the other a summated series of questions) that it was less important to drink now to be sociable. In this regard the lay-RBT group was significantly different from the control group, whereas the AA group was not differentiated from either of the other two groups.
                    - paragraph [ref=e400]:
                      - generic [ref=e401]: Three months after terminating treatment the only variables that revealed differences concerned drinking behavior. ... In this analysis AA was five times more likely to binge than the control and nine times more likely than the lay-RBT. The AA group average was 2.4 binges in the last 3 months since outcome.
                      - generic [ref=e402]: Outpatient Treatment of Alcoholism, by Jeffrey Brandsma, Maxie Maultsby, and Richard J. Welsh. University Park Press, Baltimore, MD., page 105.
                  - paragraph [ref=e403]: That is a clear description of a real disaster. Alcoholics Anonymous greatly increased the amount of binge drinking that the alcoholics were doing. Their bingeing didn't just increase a little bit — it was FIVE TIMES higher than the alcoholics who got nothing, no help or treatment at all. On the other hand, Rational Behavior Therapy, as taught by laymen (amateurs, non-professional counselors), really did help the alcoholics to cut down on their drinking. They were doing less binge drinking than the control group.
                  - paragraph [ref=e404]: Notice the statement about "holding power".
                  - paragraph
                  - blockquote [ref=e405]:
                    - generic [ref=e406]: Less than one-third (31.6%) of the clients assigned to the AA group qualified for outcome measures in contrast to almost 60% for the lay-RBT group, and this occurred with equivalent attempts by our social work staff to keep the men in treatment, whatever type it was.
                  - paragraph [ref=e407]: A.A. couldn't "keep them coming back." A.A. seems to have been so repulsive to the alcoholics that more than two-thirds of them just walked out and didn't come back. Obviously, A.A. can't do much good if it just drives the alcoholics away.
                  - paragraph [ref=e408]: "And at the 12-month follow-up:"
                  - paragraph
                  - blockquote [ref=e409]:
                    - generic [ref=e410]: There were no significant results to report at 12-month follow-up. In certain cases where the data were inspected, part of the reason for this seemed to be the improvement of the control group.
                    - generic [ref=e411]: Outpatient Treatment of Alcoholism, by Jeffrey Brandsma, Maxie Maultsby, and Richard J. Welsh. University Park Press, Baltimore, MD., page 105.
                  - paragraph [ref=e412]: Over the long haul, the no-treatment control group did just as well as the others. That was spontaneous remission at work, again. A lot of people, even hard-core alcoholics, really do just quit drinking when they get sick and tired of being sick and tired.
                  - paragraph [ref=e413]: "Dr. Brandsma and co-authors concluded:"
                  - paragraph
                  - blockquote [ref=e414]:
                    - generic [ref=e415]:
                      - text: "DISCUSSION:"
                      - paragraph [ref=e416]:
                        - text: In general, it seems again that treatment has beneficial, if short-term, effects in contrast to no treatment. The superior holding power of the lay-RBT method with this population is a definite advantage for it. As Armor et al. (1978) have noted, "the single most important factor that consistently determines improvement is the amount of treatment. The greater the amount of treatment, the greater the improvement rate." In this sense lay-RBT was definitely superior to the AA group in our study and goes along with the suggestion from the
                        - link "Ditman et al. (1967) study" [ref=e417] [cursor=pointer]:
                          - /url: "#ftnt01"
                        - text: that compulsory AA does not work well with municipal court offenders. At the very least it would seem to be a reasonable alternative for those alcoholics who refuse AA or do not seem to benefit by it.
                    - paragraph [ref=e418]:
                      - generic [ref=e419]: The 3-month follow-up indicated that AA members had increased their binges and more often drank in order to feel superior. Perhaps the philosophy of total abstinence did not work well for these men — perhaps it led to depression and a tendency to go from one extreme to the other. This is admittedly speculative, but it adds a qualification to Emrick et al.'s (1977) suggestion that AA is more effective than professionals with regard to abstinence.
                      - generic [ref=e420]: Outpatient Treatment of Alcoholism, by Jeffrey Brandsma, Maxie Maultsby, and Richard J. Welsh. University Park Press, Baltimore, MD., page 105.
                  - paragraph [ref=e421]:
                    - text: In other words, Emrick was wrong when he suggested that the untrained lay therapists of A.A. — "
                    - link "sponsors" [ref=e422] [cursor=pointer]:
                      - /url: "#sponsorship"
                    - text: "\" — were better recovery counselors than the trained professionals."
                  - paragraph [ref=e423]: Again, RBT was far superior to A.A. because RBT was able to keep the majority of the its alcoholics — almost 60% of them — in the treatment program, while A.A. lost more than two-thirds of its people. And RBT reduced binge drinking, while A.A. increased it.
                  - paragraph [ref=e424]:
                    - text: And note how Doctor Brandsma reported that "The 3-month follow-up indicated that AA members had increased their binges and more often drank in order to feel superior." Bill Wilson repeatedly declared that all alcoholics must have their egos crushed.
                    - link "\"Getting rid of ego and self\"" [ref=e425] [cursor=pointer]:
                      - /url: /content/heresy#erase_self
                    - text: by humiliating people with constant self-criticism and confession sessions is a big part of the A.A. program. But what Dr. Brandsma saw was that people responded to such treatment by drinking to get their egos back.
                  - paragraph [ref=e426]: But of course. The urge to heal oneself, to fix whatever is broken, is one of the most deep-seated basic drives in life. Attack people's egos and selves, and they will respond by trying to repair their egos and sense of self. Many will drink so that they can feel good about themselves again. People will fight oppression however they can.
                  - paragraph [ref=e427]:
                    - generic [ref=e428]:
                      - text: "For another description of the Brandsma study, see the \"More Revealed\" web site:"
                      - link "http://www.morerevealed.com/library/resist/r_chap_2.htm" [ref=e429] [cursor=pointer]:
                        - /url: http://web.archive.org/web/20161020131749/http://www.morerevealed.com/library/resist/r_chap_2.htm
                  - paragraph [ref=e430]
                  - generic [ref=e431]:
                    - img
                  - paragraph [ref=e432]
                  - paragraph
                  - paragraph [ref=e433]:
                    - text: A controlled study of the effectiveness of Alcoholics Anonymous was conducted in San Diego in the mid-nineteen-sixties. It is described in "A Controlled Experiment on the Use of Court Probation for Drunk Arrests", by Keith S. Ditman, M.D., George C. Crawford, LL.B., Edward W. Forgy, Ph.D., Herbert Moskowitz, Ph.D., and Craig MacAndrew, Ph.D., in the American Journal of Psychiatry.
                    - superscript [ref=e435]:
                      - link "1" [ref=e436] [cursor=pointer]:
                        - /url: "#ftnt01"
                  - paragraph [ref=e437]: "In the study, 301 public drunkenness offenders were sentenced by the court to one of three \"treatment programs\". The offenders were randomly divided into three groups:"
                  - list [ref=e438]:
                    - listitem [ref=e439]: a control group that got no treatment at all,
                    - listitem [ref=e440]: a second group that was sent to a professional alcoholism treatment clinic,
                    - listitem [ref=e441]: and a third group that was sent to Alcoholics Anonymous.
                  - paragraph [ref=e442]: "All of the subjects were followed for at least a full year following conviction. Surprisingly, the no-treatment group did the best, and Alcoholics Anonymous did the worst, far worse than simply receiving no treatment at all. When the rates of re-arrest for public drunkenness were calculated, the following results were obtained:"
