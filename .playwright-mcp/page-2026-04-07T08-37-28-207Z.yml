                            - paragraph
                            - blockquote [ref=e2127]:
                              - generic [ref=e2128]: LSD does seem to make the patient more willing to undertake the total program necessary for his recovery. After LSD most of the patients who formerly refused to cooperate were willing to take disulfiram, attend group therapy and to affiliate with A.A.
                              - generic [ref=e2129]:
