                  - paragraph [ref=e143]: "The Harvard Mental Health Letter, from The Harvard Medical School, stated quite plainly:"
                  - paragraph
                  - blockquote [ref=e144]:
                    - generic [ref=e145]:
                      - generic [ref=e146]: On their own
                      - text: There is a high rate of recovery among alcoholics and addicts, treated and untreated. According to one estimate, heroin addicts break the habit in an average of 11 years. Another estimate is that at least 50% of alcoholics eventually free themselves although only 10% are ever treated. One recent study found that 80% of all alcoholics who recover for a year or more do so on their own, some after being unsuccessfully treated. When a group of these self-treated alcoholics was interviewed, 57% said they simply decided that alcohol was bad for them. Twenty-nine percent said health problems, frightening experiences, accidents, or blackouts persuaded them to quit. Others used such phrases as "Things were building up" or "I was sick and tired of it." Support from a husband or wife was important in sustaining the resolution.
                    - generic [ref=e147]:
                      - text: Treatment of Drug Abuse and Addiction — Part III, The Harvard Mental Health Letter, Volume 12, Number 4, October 1995, page 3.
                      - text: (See Aug. (Part I), Sept. (Part II), Oct. 1995 (Part III).)
                  - paragraph [ref=e148]:
                    - text: So much for the sayings that
                    - generic [ref=e149]: "\"Everybody needs a support group\""
                    - text: and
                    - generic [ref=e150]: "\"Nobody can do it alone\""
                    - text: . Most successful people do.
                  - paragraph
