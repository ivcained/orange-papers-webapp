                  - table [ref=e2843]:
                    - rowgroup [ref=e2844]:
                      - row "Charles \"Chuck\" Dederich \"Don't mess with us — you can get killed dead, physically dead.\" \"Yes, I do want an ear in a glass of alcohol, I really do.\" \"Nonviolence was just a position we took. We change positions all of the time.\" (Photo by Charlie Downs)" [ref=e2845]:
                        - cell "Charles \"Chuck\" Dederich \"Don't mess with us — you can get killed dead, physically dead.\" \"Yes, I do want an ear in a glass of alcohol, I really do.\" \"Nonviolence was just a position we took. We change positions all of the time.\" (Photo by Charlie Downs)" [ref=e2846]:
                          - generic [ref=e2848]:
                            - img
                            - text: Charles "Chuck" Dederich
                            - text: "\"Don't mess with us — you can get killed dead, physically dead.\""
                            - text: "\"Yes, I do want an ear in a glass of alcohol, I really do.\""
                            - text: "\"Nonviolence was just a position we took. We change positions all of the time.\""
                            - text: (Photo by Charlie Downs)
                  - text: Children were separated from their parents, and sometimes wouldn't see their parents for months on end, while they were beaten and abused, and those who tried to run away were beaten even more. And the courts would even return run-away children to Synanon, because their parents were there, even though the children hadn't seen their parents in months, and the parents presumably did not know how much their children were being beaten and abused...
                  - paragraph
                  - paragraph [ref=e2849]: For internal security, the Synanon "Church" had an armed militia — a goon squad — called The Imperial Marines. In the mid 1970s, the "church" of Synanon purchased a total of 152 pistols, rifles, and shotguns and more than 660,000 rounds of ammunition, reportedly including armor piercing projectiles.
                  - paragraph [ref=e2850]: The goon squad thugs brutally attacked and beat up Synanon members, splittees, critics, and even the occasional accidental trespasser, like people who had parked in their parking lot, or whose vehicle had skidded off of the road and onto Synanon property. The goon squad tracked down and ambushed one splittee, Phil Ritter, by attacking him from behind in the dark of night and smashing his skull with baseball bats. Ritter's skull was broken, brain fluid leaked into his spinal column, and he developed spinal meningitis, which put Ritter in a coma. Somehow he recovered.
                  - paragraph [ref=e2851]: After Synanon's former president, Jack Hurst, left Synanon, he says he received so many death threats that he bought an attack dog. One night, he came home to find his door open, all of his lights on, and his dog dead, hanging by a rope from a tree in his front yard.
                  - paragraph [ref=e2852]: Then the goon squad tried to kill Paul Morantz, a lawyer who was suing them, by putting a huge old rattlesnake in his mailbox, minus the rattle, so that there would be no warning buzz before the snake struck. The rattlesnake bit Morantz, and he nearly died. It took eleven vials of anti-toxin to save his life, and he suffered permanent damage to his arm.
                  - paragraph
                  - table [ref=e2854]:
                    - rowgroup [ref=e2855]:
                      - row [ref=e2856]:
                        - cell [ref=e2857]:
                          - generic:
                            - generic:
                              - img
                  - paragraph
                  - paragraph [ref=e2858]: Then, it was alleged on July 11, 1983, in U.S. District Court, by three former Synanon Foundation members, including Rodney Mullen, that Synanon officials had attempted to hire a professional hit man with "orders to have attorney Paul Morantz assassinated."
                  - paragraph [ref=e2859]:
                    - text: Charles Dederich was extremely drunk when the police finally came and arrested him — so drunk that he had to be carried out on a stretcher. He couldn't even walk. One witness reported that, at the end, Charles Dederich was drinking up to 2 quarts of Chivas Regal per day.
                    - superscript [ref=e2861]:
                      - link "13" [ref=e2862] [cursor=pointer]:
                        - /url: "#ftnt13"
                  - paragraph [ref=e2863]: Dederich pleaded no contest to charges of conspiracy to commit murder, and part of his sentence was to no longer run or have any contact with Synanon, at which point Synanon basically collapsed and disbanded. When the I.R.S. withdrew Synanon's charitable tax-exempt status, Synanon declared bankruptcy, and auctioned off the land to pay the taxes due. And that was the end of that.
                  - paragraph [ref=e2864]:
                    - text: "One more thing: before we leave Synanon behind, it is worth asking,"
                    - generic [ref=e2865]: "\"What was the success rate of Synanon? Really, just how effective was Chuck Dederich's 'confrontational attack therapy' program?\""
                  - paragraph [ref=e2866]:
                    - text: That question is important because there are so many
                    - link "\"tough love\" rehab programs for children" [ref=e2867] [cursor=pointer]:
                      - /url: /content/gulags
                    - text: "and adults, like Delancy Street, Daytop, Phoenix House, \"The Seed\", and Melvin and Betty Sembler's \"Straight, Inc.\" and \"Drug-Free America\" rackets, that are based on Charles Dederich's Synanon methods. Well, the experts say:"
                  - paragraph
                  - blockquote [ref=e2868]:
                    - generic [ref=e2869]:
                      - text: In 1964 a New Jersey Drug Study Commission opted not to give Synanon any funding after reviewing rehabilitation statistics supplied by Synanon Foundation. Out of 1,180 addicts who had entered Synanon in its first five years of operation, only 26 had graduated! World renowned Berkeley sociologist and "thought reform" expert Dr. Richard Ofshe used Synanon's own data to compute a cure rate for heroin addicts at Synanon of only 10%. This is the only available scientific study ever done on the effectiveness of Synanon.
                      - superscript [ref=e2871]: 9,10
                      - separator [ref=e2873]
                      - generic [ref=e2874]:
                        - text: 9. Mitchell, Dave, Mitchell, Cathy, Ofshe, Richard, The Light on Synanon, pp.143 — 145.
                        - text: Gerstel, David, Synanon, Paradise, Inc., p. 37.
                        - text: 10. Dr. Richard Ofshe and noted Berkeley psychologist and "cult expert" Dr. Margaret Thayer Singer were called in as expert witnesses in Ohio state's successful court action to close down Straight-Cincinnati.
                      - separator [ref=e2876]
                      - generic [ref=e2877]: — from the web page http://www.thestraights.com/synanon-story2.htm
                      - generic [ref=e2878]:
                        - text: Also note that the trio Cathy Mitchell, Dave Mitchell, and Dr. Richard Ofshe won the Pulitzer Prize for their journalistic work in exposing the evils of Synanon. See
                        - link "The Light on Synanon" [ref=e2879] [cursor=pointer]:
                          - /url: "#Ofshe_Light"
                        - text: ; it's good reading.
                  - paragraph [ref=e2880]: In addition, note that the only people whom Synanon kept off of drugs and alcohol were the people who stayed at Synanon (and then not all of them). Just like all of the other cults, you couldn't ever leave Synanon, and return to normal life, or else...
                  - paragraph [ref=e2881]: But hey, I guess we can cheerfully, mindlessly yammer the platitudes about how it was really a great organization because it really helped some people to get off of drugs and alcohol...
                  - paragraph [ref=e2882]: Or can we? If organizations like The People's Temple, Synanon, The Seed, or Straight, Inc. were really good organizations just because they got a few people off of drugs and alcohol, then we have horrendously low standards for just what constitutes "good".
                  - paragraph [ref=e2883]
                  - generic [ref=e2884]:
                    - img
                  - paragraph [ref=e2885]: Before we call Alcoholics Anonymous a "good" organization, because it is "good for some people", shouldn't we count both the harm done to the many, as well as the benefits for a few?
                  - list [ref=e2886]:
                    - listitem [ref=e2887]: Shouldn't we count the harm done to people who were promised some kind of medical treatment for alcoholism but who were given cult religion and voodoo medicine instead?
                    - listitem [ref=e2888]: Shouldn't we count the years of mental anguish and torment caused by bad counselling?
                    - listitem [ref=e2889]:
                      - text: Shouldn't we count the suicides caused by bad counselling and
                      - link "guilt induction" [ref=e2890] [cursor=pointer]:
                        - /url: orange-cult_a1.html#ca_induce_guilt
                      - text: "?"
                    - listitem [ref=e2891]: Shouldn't we count the "thirteenth stepping" — the sexual exploitation and the rapes — of the newcomers by the sponsors?
                    - listitem [ref=e2892]: Shouldn't we count the lives and the years wasted while people "Expect A Miracle" and wait for some delusional faith-healing steps to really work?
                    - listitem [ref=e2893]: Shouldn't we count the suicides, deaths, and other harm caused by sponsors telling their sponsees to quit taking the pills that the doctor gave them, and just trust the Twelve Steps to heal them?
                    - listitem [ref=e2894]:
                      - text: Shouldn't we count the harm done to the people who get turned into
                      - link "angry, frustrated religious fanatics or hateful true believers" [ref=e2895] [cursor=pointer]:
                        - /url: /content/letters-1#Bernie
                      - text: "?"
                    - listitem [ref=e2896]:
                      - text: Shouldn't we count the harm done to people who are badly misinformed and miseducated about alcoholism because all they ever got was the grossly unrealistic Alcoholics Anonymous religious dogma, and
                      - link "the grandiose delusions of Bill Wilson" [ref=e2897] [cursor=pointer]:
                        - /url: /content/funny-spirituality
                      - text: ", instead of the true facts about alcoholism?"
                    - listitem [ref=e2898]: Shouldn't we count the harm done to the people who get turned into irrational slogan-slinging dogma-yammering true-believer cult members?
                    - listitem [ref=e2899]: Shouldn't we count the harm done to the people who just give up on recovery because they have been fooled into thinking that Alcoholics Anonymous is all there is, and they clearly see that Alcoholics Anonymous is just an insane faith-healing religious cult, and they want no part of it?
                    - listitem [ref=e2900]: Shouldn't we count the dropout rate and the relapse rate and the suicide rate and the death rate from continued drinking?
                    - listitem [ref=e2901]:
                      - text: Shouldn't we count the divorce rate and
                      - link "the marriages wrecked and ruined" [ref=e2902] [cursor=pointer]:
                        - /url: /content/letters-97#na_cult
                      - text: by the A.A. practices of 13th-Stepping and encouraging members to dump their spouses and only associate with other A.A. members?
                  - paragraph
                  - table [ref=e2905]:
                    - rowgroup [ref=e2906]:
                      - 'row "Go read Rebecca Fransway''s book, AA Horror Stories, for a good look at some people who were harmed by A.A. and Twelve-Step \"therapy.\" Also see the list of horror stories that I have received at this web site. Then go visit some more web sites. And don''t miss these exposés of the \"tough-love\" children''s rehabilitation programs: Children''s Gulags http://www.thestraights.com/" [ref=e2907]':
