                              - generic [ref=e2471]:
                                - text: When i was in treatment we were told that only one of us would stay sober. I didnt believe it until 3 yrs ago.
                                - text: "We started with 39 people that was in 1985. we kept in contact and this is the way they are today:"
                            - paragraph [ref=e2472]:
                              - generic [ref=e2473]:
                                - text: 1 — 20 yrs sober
                                - text: 1 — with 4 yrs after having 15 (my Self)
                                - text: 7 — 1 yr or little more
                                - text: 2 — with 5 mon
                                - text: 1 — with 3 mon
                                - text: 12 — in jail
                                - text: 7 — unknown
                                - text: 8 — died (including my husband)
                          - paragraph [ref=e2474]:
                            - generic [ref=e2476]:
                              - text: Its sad when we look at it now but it helps me to remember.
                              - text: I Thank God every day that I made it back. I also pray for those who are still out there. I go to meetings in jail, if i only reach one I feel blessed.
                              - text: I am glad they told me what they did when i went in to treatment. I know today without AA and the tools they gave us i wouldnt be here.
                  - paragraph [ref=e2477]: That woman claims that her life was saved by "the AA tools", but she could not have given us any better evidence that the program didn't work at all. She talks about AA as if it did something good, but the statistics reveal a completely ineffective program. (And if the tools were so great, why did she relapse after 15 years of using them?)
                  - paragraph [ref=e2478]: Out of 39 people, after 20 years, only 2 people have multiple years of sobriety — even just two years. That is a success rate of only five percent, which is once again just the normal rate of spontaneous remission in alcoholics, nothing more.
                  - paragraph [ref=e2479]:
                    - text: Actually, it's
                    - generic [ref=e2480]: far worse
                    - text: than the normal rate of spontaneous remission, because a five percent per year remission rate would have produced 2 who have 20 years sober, and 1 with 19, and one with 18, and one with 17, and so on. Almost two-thirds of the still-living alcoholics should have quit drinking after 20 years.
                    - text: But they haven't.
                    - text: The reported numbers are nowhere near that. She was actually describing a real disaster.
                  - paragraph [ref=e2481]: Perhaps the people going into that treatment program were especially sick people. If not, then the treatment program did something terrible to them.
                  - paragraph [ref=e2482]
                  - generic [ref=e2483]:
                    - img
                  - paragraph [ref=e2484]: At one university, a bunch of doctors and professors were puzzling over the fact that all alcohol and drug rehabilitation programs seemed to have about the same rates of success and failure, no matter what the treatment was. All of the programs that they were studying had about a 93% failure rate (by their counting methods), which left about a 7% success rate. Those professors and doctors were trying to find what treatment methods worked best, and what would save the most lives, but with all of the treatment programs getting the same low scores, it didn't seem to matter what the treatment was.
                  - paragraph [ref=e2485]: "So, for a scientific experiment with a wacky sense of humor, the doctors and professors designed a new treatment program for drugs and alcohol, and put it to the test. The treatment program consisted of getting a bunch of alcoholics and drug addicts together for a weekly meeting, which started with playing patty cake with each other. You know, the children's nursery rhyme where you pat your hands together:"
                  - paragraph
                  - table [ref=e2488]:
                    - rowgroup [ref=e2489]:
                      - row "Patty cake, patty cake, baker man, Bake a cake as fast as you can..." [ref=e2490]:
                        - cell "Patty cake, patty cake, baker man, Bake a cake as fast as you can..." [ref=e2491]:
                          - generic [ref=e2493]:
                            - text: Patty cake, patty cake, baker man,
                            - text: Bake a cake as fast as you can...
                  - paragraph [ref=e2494]: "Then the participants spent the rest of the hour talking about whatever they felt like talking about: sports, television, and news, or drugs, sex, and rock and roll, or wine, women, and song, or whatever. There was no counselor to make them talk about the \"right\" stuff, or to say the \"right\" things, or to come to the \"right\" conclusions. Nevertheless, at the end of the year, the patty-cake treatment program had the same success rate as all of the other treatment programs, including Alcoholics Anonymous."
                  - paragraph [ref=e2495]: Now, to be fair, all of the treatment programs did score a percentage point or two better than the control group which got no treatment at all, which seems to indicate that just getting the alcoholics and drug addicts together in a room and letting them talk helped a little. The groups provided a sense of community and gave members some moral support, and encouragement to "make it", and succeed in abstaining. And sometimes they may have even shared their stories and given each other some helpful advice, now and then. But the inescapable conclusion was that all of the treatment programs were basically just taking the credit for the spontaneous remissions that were occurring anyway. The treatment programs were just taking the credit for the people's own hard work to save themselves.
                  - paragraph
                  - paragraph [ref=e2496]
                  - generic [ref=e2497]:
                    - img
                  - paragraph [ref=e2498]:
                    - text: People who believe in A.A. will often object to these statistics, and say something like,
                    - generic [ref=e2499]: "\"I have seen the program help people. I've seen it save lives. It saved my life.\""
                  - paragraph [ref=e2500]:
                    - text: There are always A.A. defenders who will swear that A.A. saved their lives, but all objective, fair tests of A.A. that have been performed show
                    - generic [ref=e2502]: no better success rate than no treatment at all.
                    - text: The only possible mathematical explanation is that A.A. kills one patient for each one that it saves, thus making the success rate balance out at zero.
                  - paragraph [ref=e2503]:
                    - text: That is a very strong damnation, but the numbers back it up. That accusation is, in fact, highly believable, given just how bad the "treatment program" really is. Just look at the death rate in
                    - link "Dr. Vaillant's A.A.-based treatment program" [ref=e2504] [cursor=pointer]:
                      - /url: "#Vaillant_deaths"
                    - text: . After 8 years of giving A.A. treatment to 100 alcoholics, Vaillant's score was 5 success stories, 29 deaths, and 66 people still drinking.
                  - paragraph [ref=e2505]:
                    - text: One of the biggest problems with the Twelve-Step program is the
                    - link "learned helplessness caused by the First Step" [ref=e2506] [cursor=pointer]:
                      - /url: /content/powerless
                    - text: ", where people are taught to confess that they are \"powerless over alcohol.\" This leads people to believe that they can't help but relapse, or, that once they have a drink, a full-blown relapse and total loss of self-control is inevitable and unavoidable:"
                  - paragraph
                  - generic [ref=e2507]: "\"One drink, One drunk.\""
                  - paragraph [ref=e2508]: "Dennis Daley summarized his work with alcoholics by writing:"
                  - paragraph
                  - blockquote [ref=e2509]:
                    - generic [ref=e2510]:
                      - text: "The author discusses the problem of relapse with alcoholics and other drug abusers from three perspectives: client-related variables, common erroneous beliefs and myths held by professionals regarding relapse, and treatment system problems that may contribute to relapse..."
                      - text: This article integrates clinical experience, relapse literature, and data collected on 150 patients who completed treatment...
                      - text: ...
                      - text: ERRONEOUS BELIEFS AND MYTHS
                      - text: 3. The person has not "hit bottom" yet. Believing a substance abuser must "hit bottom" is probably the most commonly held myth and is a major factor in failure to intervene with substance abusers. ... There is no empirical data to support the necessity to "hit bottom."
                      - text: ...
                      - text: 5. One substance use episode will lead to "loss of control" over all substance use. Teaching clients to expect one episode of use to lead to total loss of control may set the expectation that initial use cannot be curtailed before a full-blown relapse occurs. Many relapsers report periods of limited, controlled substance use prior to full-blown relapses and many report brief, short-term relapses. Marlatt has identified an "Abstinence Violation Effect," which refers to a person's perception of the initial drink or drug use following a period of abstinence.
                      - superscript [ref=e2512]: "18"
                      - text: If one experiences the Abstinence Violation Effect as a highly negative, permanent, and painful transgression and evaluates oneself as a "failure," an initial lapse can result in a full-blown relapse. In the course of treating hundreds of relapsed substance abusers, my colleagues and I found that our clients reported that they thought total loss of control was inevitable or that the initial substance use behavior meant that they could not recover.
                    - separator [ref=e2513]
                    - generic [ref=e2514]: "18. G. Marlatt, Relapse Prevention: A Self-Control Program for the Treatment of Addictive Behaviors, (Seattle: University of Washington, 1980)"
                    - separator [ref=e2515]
                    - generic [ref=e2516]: "Relapse Prevention with Substance Abusers: Clinical Issues and Myths, by Dennis Daley. Social Work, March-April 1987, pages 139-140."
                  - paragraph [ref=e2517]:
                    - text: Some A.A. members even believe that relapse is inevitable whenever cravings come along, because "We are powerless over alcohol."
                    - link "So if God doesn't remove your desire for drink" [ref=e2518] [cursor=pointer]:
                      - /url: /content/funny-spirituality#confession_list
                    - text: ", and stop the cravings, then you are doomed. Bill Wilson even wrote that alcoholics were powerless, once the desire to drink alcohol struck, and that \""
                    - link "will power and self-knowledge would not help" [ref=e2519] [cursor=pointer]:
                      - /url: "#blank_spot"
                    - text: in those strange mental blank spots."
                  - paragraph [ref=e2520]:
                    - text: Then we have to consider the issue of suicides in Alcoholics Anonymous. There are no good studies or surveys that reveal what the suicide rate in A.A. really is, but there is
                    - link "quite a lot of anecdotal evidence" [ref=e2521] [cursor=pointer]:
                      - /url: /content/letters-32#suicide_list
                    - text: that A.A. drives some people to suicide. A program that tells people that they are powerless over alcohol and hopeless and defective and sinful and full of moral shortcomings and cannot ever recover is just depressing enough to push some people over the edge into suicide.
                  - paragraph [ref=e2522]: And then the crazy, dogmatic, true-believer sponsors telling people with mental problems to stop taking their doctor-prescribed medications has caused a lot of deaths.
                  - paragraph [ref=e2523]
                  - generic [ref=e2524]:
                    - img
                  - paragraph [ref=e2525]: Many people will insist that A.A. caused them to quit drinking, that they could not have done it without A.A.. I always have to ask, "Which A.A.?"
                  - paragraph [ref=e2526]: "A.A. is different things to different people:"
                  - paragraph
                  - list [ref=e2527]:
                    - listitem [ref=e2528]:
                      - text: For some people, it's "group support" where people encourage each other to get and stay sober — it is a circle of friends who hold your hand and give you moral support, and cheer you on, and give you little coins at each milestone of sobriety, like 3 months, 6, 9, a year... That is good stuff, I heartily recommend it. (At least, it isn't likely to hurt.)
                      - paragraph
                    - listitem [ref=e2529]:
                      - text: For some people, A.A. is a meeting where people tell stories about alcoholism and recovery, and share their experiences.
                      - paragraph
                    - listitem [ref=e2530]:
                      - text: "For other people, A.A. is a system of pop psychology, transmitted in slogans:"
                      - list [ref=e2531]:
                        - listitem [ref=e2532]: Easy does it.
                        - listitem [ref=e2533]: Live and Let Live.
                        - listitem [ref=e2534]: Resign from the debating society.
                        - listitem [ref=e2535]: Just don't take that first drink.
                        - listitem [ref=e2536]: Just don't drink, no matter what.
                      - text: That isn't too bad, as long as you stay away from the
                      - link "vicious negative slogans" [ref=e2537] [cursor=pointer]:
                        - /url: /content/cult-slogans#slogan_list
                      - text: ", and it can be very helpful to some people."
                      - text: That
                      - generic [ref=e2538]: "\"Just Don't Take That First Drink\""
                      - text: rule is so good that if you just follow that one rule, you won't need any others, and you won't need the Twelve Steps or the Wilsonism religion.
                      - paragraph
                    - listitem [ref=e2539]:
                      - text: For some people, A.A. is a collection of helpful home-spun simple wisdom, like "Well, bad as it is, you still don't have to drink over it."
                      - paragraph
                    - listitem [ref=e2540]:
                      - text: For others, it's a non-drinking social club.
                      - paragraph
                    - listitem [ref=e2541]:
                      - text: And for others, A.A. is a package of old superstitions and misinformation about alcoholism.
                      - paragraph
                    - listitem [ref=e2542]:
                      - text: And for other people, A.A. is an intense one-on-one relationship with a sponsor (for better or worse).
                      - paragraph
                    - listitem [ref=e2543]:
                      - text: And for some other people, A.A. is a
                      - link "mind-controlling religious cult" [ref=e2544] [cursor=pointer]:
                        - /url: /content/cult
                      - text: with some
                      - link "very strange theology" [ref=e2545] [cursor=pointer]:
                        - /url: /content/cult-answers#ca_irrationality
                      - text: and lots of misinformation. It features intense indoctrination bordering on brainwashing,
                      - link "misinformation and deceit" [ref=e2546] [cursor=pointer]:
                        - /url: orange-cult_a3.html#ca_dishonesty
                      - text: ", deep immersion (90 meetings in 90 days), ego-destruction through self-criticism and confession sessions, thought-stopping clichés and slogans,"
                      - link "guilt induction" [ref=e2547] [cursor=pointer]:
                        - /url: orange-cult_a1.html#ca_induce_guilt
                      - text: ", wallowing in guilt, shame and self-contempt, suppression of your feelings (\"Stuff Your Feelings\"), pretending to get positive results (\"Fake It Until You Make It\"), and confessions of"
                      - link "powerlessness" [ref=e2548] [cursor=pointer]:
                        - /url: /content/powerless
                      - text: ", insanity, sinfulness, selfishness, resentments, and many other things. That can be very harmful. It has even driven people to suicide."
                      - paragraph
                    - listitem [ref=e2549]:
                      - generic [ref=e2551]:
                        - text: And for other people, A.A. is a very evil organization
                        - link "whose primary goal is the sexual exploitation of newcomers" [ref=e2552] [cursor=pointer]:
                          - /url: /content/letters-78#Q_group
                        - text: ", particularly very young women and under-age girls."
                  - paragraph [ref=e2553]: So when people say that A.A. helped them, I always want to ask, "Which A.A.?", and "Precisely How?"
                  - paragraph [ref=e2554]:
                    - text: Another problem with such testimonials is the cult-like behavior of many A.A. members. Many other cults, like Scientology, the Moonies, and the Hari Krishnas, will, for publicity purposes,
                    - link "show off a chorus line of \"poster children\"" [ref=e2555] [cursor=pointer]:
                      - /url: orange-cult_q2.html#chorus_line
                    - text: who will all swear that their cult is just the greatest thing in the world and the best thing that ever happened to them, and it just totally changed their lives for the better, and their leader is just the greatest genius in the world with the very best teachings. Why, the leader is so good that he was sent here by God Himself. Or,
                    - link "he is God Himself" [ref=e2556] [cursor=pointer]:
                      - /url: /content/cult-questions#glorify_leader
                      - text: he
                      - generic [ref=e2557]: is
                      - text: God Himself
                    - text: .
                  - paragraph [ref=e2558]: Obviously, you can't believe everything you hear. In fact, such testimonials are totally worthless for really getting to the truth of the matter, no matter how sincere the believers may be in praising their group.
                  - paragraph [ref=e2559]: Nevertheless, testimonials can sound very convincing. Imagine that you are talking to an A.A. member, and she says, "A.A. is just the greatest organization in the world. I wouldn't have made it without A.A."
                  - paragraph [ref=e2560]: "Well, that sounds good. You have to ask some more questions to get at the truth:"
                  - paragraph [ref=e2561]:
                    - text: "You: How much sober time do you have now?"
                    - text: "Her: A year."
                    - text: "You: Congratulations. Is this the first time you've quit?"
                    - text: "Her: No, I quit several times before, but always relapsed."
                    - text: "You: Did you go to A.A. all of those other times you quit, too?"
                    - text: "Her: Yes."
                    - text: "You: So what was different the last time you quit?"
                    - text: "Her: Well, I just got sick and tired of failing, and waking up sick and hung-over. I decided that I'd just had it with failing and being sick, and didn't want to do it any more."
                    - text: "You: So let's see, A.A. failed before, several times, but worked the last time."
                    - text: "Her: Oh, no, it wasn't A.A. that was failing, it was me. I didn't do it right before. I kept screwing up..."
                  - paragraph [ref=e2562]:
                    - text: This person's insistence that the program always worked is actually also good evidence that the program always failed. She didn't stay sober until she quit "screwing up" and got her act together and kept herself sober.
                    - generic [ref=e2563]: She kept herself sober.
                    - text: A.A. seems to have been irrelevant.
                  - paragraph [ref=e2564]: Often, people do not successfully quit drinking until they convince themselves that they really can't drink any more, not any at all — that they can't even just have a few now and then, without their drinking quickly spinning out of control. Once they learn that, they quit and stay quit. Until they learn that, they relapse. The Twelve Steps are irrelevant.
                  - paragraph [ref=e2565]
                  - generic [ref=e2566]:
                    - img
                  - paragraph [ref=e2567]:
                    - text: It's amazing how many of the true believers manage to reverse
                    - link "the cause-and-effect relationship" [ref=e2568] [cursor=pointer]:
                      - /url: /content/propaganda#correlation
                    - text: between doing the Twelve Steps and quitting drinking, without seeing what they are doing.
                  - paragraph [ref=e2569]: "The usual sequence of events for a lot of people is like this:"
                  - list [ref=e2570]:
                    - listitem [ref=e2571]: People drink until they crash and burn. They often end up sick and in the detoxification ward of a hospital or clinic.
                    - listitem [ref=e2572]: People quit drinking there.
                    - listitem [ref=e2573]: People are then introduced to Alcoholics Anonymous or Narcotics Anonymous, and required to go to a bunch of meetings as part of their "treatment program".
                    - listitem [ref=e2574]: After a while, people do the Twelve Steps. Sometimes it takes months or a year for them to do all twelve.
                    - listitem [ref=e2575]: People then claim that Alcoholics Anonymous and the Twelve Steps caused them to quit drinking.
                  - paragraph [ref=e2576]: Those people seem to be unable to see that they quit drinking first, and that caused them to go to meetings and do the Twelve Steps. They have reversed the cause-and-effect relationship in their minds. Well, their blindness is helped a lot by the true-believer cult members who surround them, telling them that the Twelve Steps are causing them to stay clean and sober.
                  - paragraph [ref=e2577]: Those believers are assuming a lot. Even if there were some apparent success, what proves that any observed success was caused by the Twelve Steps? How do you know it wasn't caused by the coffee and cigarettes at the meetings? Or the hard chairs? Or the social group? Or the horror stories?
                  - paragraph [ref=e2578]:
                    - text: It is ridiculous to suggest that the hard chairs may have had some effect in making people quit drinking, but it is no more ridiculous than suggesting that the Twelve Steps did it, when
                    - link "the Twelve Steps are a program for creating a cult religion" [ref=e2579] [cursor=pointer]:
                      - /url: /content/rroot-030
                    - text: ", not a formula for quitting drinking."
                  - paragraph
                  - table [ref=e2582]:
                    - rowgroup [ref=e2583]:
                      - row [ref=e2584]:
                        - cell [ref=e2585]:
                          - generic [ref=e2586]:
                            - blockquote [ref=e2587]:
                              - blockquote [ref=e2588]:
                                - generic [ref=e2589]:
                                  - text: When I was a child, I was never able to ride a bicycle. I just couldn't do it. I fell down every time I tried. I was powerless over bicycles.
                                  - paragraph [ref=e2590]: Then one day, Jimmy loaned me his lucky rabbit's foot, and I succeeded. I didn't fall down.
                                - paragraph [ref=e2591]: "That proves it: the rabbit's foot helped me to stay up on the bicycle. And now I can ride bicycles because I have a lucky rabbit's foot."
                            - paragraph [ref=e2592]: Walt Disney did the same routine with Dumbo and the Magic Flying Feather. Dumbo just could not fly until he got that magic feather; and then he could. The "magic feather" that the crow gave to Dumbo "made" Dumbo able to fly. Dumbo just "knew" that the feather was the cause of his success.
                            - paragraph [ref=e2593]: When people tell me that the Twelve Steps "made" them quit drinking, or "helped" them to quit, I always think about Dumbo's Magic Flying Feather.
                            - paragraph [ref=e2594]: Many A.A. members are convinced that their sobriety was caused by the 12 steps, or by going to meetings, or by some other part of the A.A. program, rather than by the fact that they are sober because they are not swallowing alcoholic drinks any more, and that was their own choice and their own accomplishment. They ignore obvious factors like that they quit drinking because they got tired of the down side, the horrible negative consequences of drinking. They got sick and tired of being sick and tired. They decided that they wanted to live. (And they also chose to start going to A.A. meetings for the same reasons.) They did all of the hard work and A.A. took all of the credit.
                          - paragraph [ref=e2595]:
                            - generic [ref=e2596]: And when people insist that they will die if they don't Keep Coming Back for more meetings, I think about the time when Dumbo lost that magic flying feather and went into a panic and started falling. It was everything that the crow could do to get Dumbo to fly anyway, without the "magic" feather...
                  - paragraph [ref=e2597]
                  - generic [ref=e2598]:
                    - img
                  - paragraph [ref=e2599]: "A question: \"Where is the benefit to society?\""
                  - paragraph [ref=e2600]: A.A. and its sister organization, N.A. (Narcotics Anonymous) have grown exponentially over the last 70 years, and they now claim to have a million or two members. And at least twenty times that many people have gone through the program, either voluntarily or by coerced attendance. Basically, almost everyone who qualifies as an alcoholic or drug addict has been to at least a few A.A. or N.A. meetings. If we were to believe those organizations' claimed success rates ("rarely fails" or "never fails"), they should have solved all of our drug and alcohol problems by now. Instead, the problems are far worse.
                  - paragraph [ref=e2601]: Back in the 1940s, Bill Wilson and Marty Mann went and testified before Congress, and declared that there might be 100,000 alcoholics in the USA, and that Bill and A.A. held the answer to that problem. Now A.A. says that there are many millions of alcoholics.
                  - paragraph [ref=e2602]: I can see the robot in the movie Lost in Space saying, "Danger, Will Robinson, Danger! Does not compute!"
                  - paragraph [ref=e2603]: For another detailed look at the effectiveness of Twelve-Step treatment, read the chapter on it in Charles Bufe's book, Alcoholics Anonymous, Cult or Cure? He also comes to the conclusion that the A.A. success rate is microscopic.
                  - paragraph [ref=e2604]
                  - generic [ref=e2605]:
                    - img
                  - paragraph [ref=e2606]: The enthusiastic supporters of twelve-step programs do not want to consider the idea that Twelve-Step treatment can be really harmful to people. But I seem, in my subjective opinion, to be seeing that.
                  - paragraph [ref=e2607]: One of the really disturbing things that I see is relative beginners, people with 6 months or less of clean and sober living, lecturing the newcomers about how alcoholism (or drug addiction) is a spiritual disease that requires a spiritual cure, and how the twelve-step programs are that kind of a spiritual cure. As if they could really know, from their few months of sobriety. But hey! Isn't 6 months of clean and sober living and going to meetings enough to make anybody a competent drug and alcohol rehabilitation counselor? Don't you know everything by then? Aren't you ready to start indoctrinating the newcomers, "the babies" and "the pigeons"?
                  - paragraph [ref=e2608]:
                    - text: And then there are those resident true believers, like the guy with 3 years of Time, who announces that the program gave him a new life — heck, going to meetings and being the resident old-timer IS his new life — and he declares that the answer to all beginners' problems — the answer to everything — is
                    - generic [ref=e2609]: "\"Do the Twelve Steps, Get a Sponsor, and Read the Big Book.\""
                    - text: And that is all of the advice and help that you are going to get out of him. He's actually that simple-minded. And it's really a drag to see the beginners relapse and disappear when that program doesn't work for them.
                  - paragraph [ref=e2610]:
                    - text: I also see people expecting the Steps to really work, to take away their cravings. And they don't understand why it won't work for them, why they relapse. They cry that they don't seem to be able to completely give themselves to the program. They think they have something unusual wrong with them, because the Steps seem to be working for everybody else. (The other people are doing the
                    - link "\"Fake It Until You Make It\" and \"Act As If\"" [ref=e2611] [cursor=pointer]:
                      - /url: /content/propaganda#act_as_if
                      - generic [ref=e2612]: "\"Fake It Until You Make It\""
                      - text: and
                      - generic [ref=e2613]: "\"Act As If\""
                    - text: routines. It's just another reenactment of the "Emperor's New Clothes" story.)
                  - paragraph [ref=e2614]:
                    - text: One problematic element of the A.A. and N.A. dogma is the idea that relapse is a normal part of the recovery process. Somehow, it is taught so much that people relapse and then talk about their relapses with a disturbing detachment, almost as if it happened to someone else, and as if it were to be expected anyway. "Some cravings just suddenly came along, and a relapse just happened." (God didn't take away their cravings, and "the drink problem," or "the drug problem" didn't just
                    - link "magically disappear" [ref=e2615] [cursor=pointer]:
                      - /url: /content/funny-spirituality#drink_disappear
                    - text: .)
                  - paragraph [ref=e2616]: Then they shrug and sadly say, "I hear that relapse is just a normal part of recovery." Or, "Oh well, I guess I'll quit when I'm ready..."
                  - paragraph [ref=e2617]: Unfortunately, some of the people in recovery here have not survived their relapses. When the drug of choice was heroin, some of the people here did not survive one night of relapse. Others were dead in two weeks. In their cases, relapse was definitely not part of the recovery process; it was part of the death process.
                  - paragraph [ref=e2618]:
                    - text: The stupid ideas that you are powerless over alcohol or drugs, that God will make the drink or drug problem just
                    - link "suddenly disappear" [ref=e2619] [cursor=pointer]:
                      - /url: /content/funny-spirituality#confession_list
                    - text: ", and that"
                    - link "Bill Wilson's \"spiritual principles\" will solve all of your problems" [ref=e2620] [cursor=pointer]:
                      - /url: /content/cult-answers#solve_all
                    - text: should be discarded. But that is what William Wilson wrote (about alcohol) in the Big Book (pages 59, 75 and 42, respectively,) so it must be true, and A.A. cannot discard that dogma. Bill Wilson's program is perfect, they maintain. (Some true believers even claim that Bill wrote the Big Book while being
                    - link "Guided by God" [ref=e2621] [cursor=pointer]:
                      - /url: /content/rroot-090#guidance
                    - text: ", so everything that he wrote is the"
                    - link "undeniable Word of God" [ref=e2622] [cursor=pointer]:
                      - /url: /content/funny-spirituality#pickled_brain
                    - text: ", and always correct.) They will not add or take away one single word from the sacred first 164 pages of the Big Book."
                  - paragraph [ref=e2623]: I cannot help but wonder, what if those people who died had been taught some real survival techniques, instead of wasting their time with twelve-step busy-work like admitting powerlessness, self-criticism, and confessions...
                  - paragraph
                  - list [ref=e2624]:
                    - listitem [ref=e2625]:
                      - text: What if we had used all of those hours spent at meetings to instead teach them to recognize the addictive voice as it tempted them to relapse, and to fight it (AVRT)?
                      - paragraph
                    - listitem [ref=e2626]:
                      - text: Or to recognize and resist cravings?
                      - paragraph
                    - listitem [ref=e2627]: Or to use Rational Emotive Behavior Therapy (REBT) to rationally think their way through the acts that they were about to commit?
                  - paragraph [ref=e2628]:
                    - text: How about a little more science and modern medicine, and a whole lot less
                    - link "cult religion" [ref=e2629] [cursor=pointer]:
                      - /url: /content/cult
                    - text: and quack medicine?
                  - paragraph [ref=e2630]
                  - generic [ref=e2631]:
                    - img
                  - paragraph [ref=e2632]: "This is unfortunately typical of the Big Book's lessons on how to not die from drinking:"
                  - paragraph
                  - blockquote [ref=e2633]:
                    - generic [ref=e2634]:
                      - text: ...we think we can render an even greater service to alcoholic sufferers and perhaps to the medical fraternity. So we shall describe some of the mental states that precede a relapse into drinking, for obviously this is the crux of the problem. ...
                      - text: "\"Suddenly the thought crossed my mind that if I were to put an ounce of whiskey in my milk it couldn't hurt me on a full stomach. ..."
                      - text: The experiment went so well that I ordered another whiskey and poured it into more milk. That didn't seem to bother me so I tried another." ...
                      - text: ...all reasons for not drinking were easily pushed aside in favor of the foolish idea that he could take whiskey if only he mixed it with milk! ...
                      - text: Whatever the precise definition of the word may be, we call this plain insanity. How can such a lack of proportion, of the ability to think straight, be called anything else?
                    - generic [ref=e2635]: The Big Book, 3rd and 4th Editions, William G. Wilson, Chapter 3, More About Alcoholism, pages 36-37.
                  - paragraph [ref=e2636]: "And a second drunkalogue:"
                  - paragraph
                  - blockquote [ref=e2637]:
                    - generic [ref=e2638]: As I crossed the threshold of the dining room, the thought came to mind that it would be nice to have a couple of cocktails with dinner. That was all. Nothing more.
                    - generic [ref=e2639]: The Big Book, 3rd and 4th Editions, William G. Wilson, Chapter 3, More About Alcoholism, page 41.
                  - paragraph [ref=e2640]:
                    - text: That's it. That's all of the psychoanalysis of relapse that we get from the Big Book. Two lousy little stories that teach us almost nothing.
                    - text: So much for describing
                    - generic [ref=e2641]: "\"some of the mental states that precede a relapse into drinking.\""
                    - text: So much for rendering
                    - generic [ref=e2642]: "\"an even greater service to alcoholic sufferers and perhaps to the medical fraternity.\""
                    - text: So much for preparing us to handle difficult situations.
                    - text: How are those stories supposed to help us maintain sobriety?
                  - paragraph [ref=e2643]: Well they aren't. Bill Wilson gave us those stories as evidence to support his Buchmanite religious belief that we are powerless over alcohol.
                  - paragraph [ref=e2644]: "More brain-damaged wisdom:"
                  - paragraph
                  - blockquote [ref=e2645]:
                    - generic [ref=e2646]: Job or no job — wife or no wife — we simply do not stop drinking so long as we place dependence upon other people ahead of dependence on God.
                    - generic [ref=e2647]: Big Book, 3rd Edition, William G. Wilson, Chapter 7, Working With Others, page 98.
                  - paragraph [ref=e2648]: Sorry, Bill, but you forgot "Depend On Yourself!"
                  - paragraph [ref=e2649]:
                    - text: Bill Wilson always teaches people NOT to depend on themselves, not to take care of themselves, not to heal themselves. Mr. Wilson's answer is always "His defense must come from a Higher Power."
                    - generic [ref=e2650]: (The "locus of control" is always outside of oneself.)
                  - paragraph
                  - blockquote [ref=e2651]:
                    - generic [ref=e2652]: He made a beginning, we have seen, when he commenced to rely upon A.A. for the solution to his alcohol problem. By now, though... he has become convinced that he has more problems than alcohol... His lone courage and unaided will cannot do it. Surely he must now depend upon Somebody or Something else.
                    - generic [ref=e2653]: Twelve Steps and Twelve Traditions, page 39.
                  - paragraph
                  - blockquote [ref=e2654]:
                    - generic [ref=e2655]: We had approached A.A. expecting to be taught self-confidence. Then we had been told that so far as alcohol is concerned, it was a total liability. Our sponsors declared that we were the victims of a mental obsession so subtly powerful that no amount of human willpower could break it.
                    - generic [ref=e2656]: Twelve Steps and Twelve Traditions, William G. Wilson, page 22.
                  - paragraph
                  - blockquote [ref=e2657]:
                    - generic [ref=e2658]: Remember that we deal with alcohol — cunning, baffling, powerful! Without help it is too much for us. But there is One who has all power — that One is God. May you find Him now!
                    - generic [ref=e2659]: The Big Book, 3rd Edition, William G. Wilson, pages 58-59.
                  - paragraph [ref=e2660]: "Then it gets worse. The milk-and-whiskey drinker continued:"
                  - paragraph
                  - blockquote [ref=e2661]:
                    - generic [ref=e2662]: As soon as I regained my ability to think, I went carefully over that evening in Washington. ... I now remembered what my alcoholic friends had told me, how they had prophesied that if I had an alcoholic mind, the time and place would come — I would drink again. They had said that though I did raise a defense, it would one day give way before some trivial reason for having a drink. Well, just that did happen and more, for what I had learned of alcoholism did not occur to me at all. I knew from that moment that I had an alcoholic mind. I saw that will power and self-knowledge would not help in those strange mental blank spots. I had never been able to understand people who said that a problem had them hopelessly defeated. I knew then. It was a crushing blow.
                    - generic [ref=e2663]: The Big Book, 3rd and 4th Editions, William G. Wilson, Chapter 3, More About Alcoholism, pages 41-42.
                  - paragraph [ref=e2664]: What pathetic, self-defeating drivel. And it's all untrue.
                  - paragraph [ref=e2665]: Wilson wrote that "will power and self-knowledge would not help". That is totally untrue and completely backwards. Will power and self-knowledge are two of the best tools that you can have in your toolbox for staying sober.
                  - paragraph [ref=e2666]: Bill Wilson wrote that those alcoholic friends (meaning himself and Doctor Bob) prophesied things, like Biblical prophets of old. They didn't just predict things, like ordinary seers and telephone psychics. A funny choice of words, yes?
                  - paragraph [ref=e2667]: Those friends "prophesied" that alcoholics would suffer from "strange mental blank spots", where the alcoholism would seize control of their minds and "will power and self-knowledge would not help," and they would be drunk before they even realized what was happening. That is a great excuse for relapsing whenever someone craves a drink, but it is totally untrue. It is ridiculous pseudo-science.
                  - paragraph
                  - generic [ref=e2669]: THERE IS NO BLANK SPOT, NONE AT ALL.
                  - paragraph [ref=e2670]: People may
                  - list [ref=e2671]:
                    - listitem [ref=e2672]:
                      - link "rationalize their actions" [ref=e2673] [cursor=pointer]:
                        - /url: /content/us-stupid-drunks#monster_we
                      - text: ","
                    - listitem [ref=e2674]: or minimize the danger for a few minutes,
                    - listitem [ref=e2675]:
                      - text: or make up all kinds of excuses for
                      - link "why it's okay to take that first drink, why it's okay to have just one" [ref=e2676] [cursor=pointer]:
                        - /url: /content/us-stupid-drunks#little_voice
                      - text: ;
                    - listitem [ref=e2677]: they may sometimes even just stubbornly refuse to think about the negative consequences of taking a drink because they really want that drink,
                    - listitem [ref=e2678]: and they may even lie to themselves about how it's okay to drink, to just have a few now,
                  - text: but there is no blank spot where the alcoholic is unable to see that he is deliberately lifting a drink to his mouth, choosing to drink, and that he is voluntarily swallowing it. There is no blank spot where he doesn't have a choice, and can't control his hands or his mouth.
                  - paragraph [ref=e2679]: But Bill Wilson insisted that there was, and that he just couldn't help but take a drink whenever he got some cravings.
                  - paragraph [ref=e2680]:
                    - text: Bill Wilson taught that he was "powerless" over every urge or craving he ever had, no matter whether it was a thirst for alcohol,
                    - link "cravings for cigarettes" [ref=e2681] [cursor=pointer]:
                      - /url: /content/funny-spirituality
                    - text: ","
                    - link "greed for money" [ref=e2682] [cursor=pointer]:
                      - /url: /content/aacoa
                    - text: ", or the urge to"
                    - link "cheat on his wife Lois" [ref=e2683] [cursor=pointer]:
                      - /url: /content/other-women
                    - text: by having sex with all of the pretty young women who came to the A.A. meetings looking for help for a drinking problem.
                  - paragraph [ref=e2684]:
                    - text: Bill Wilson just didn't want to be bothered with the hard work of resisting temptation. Like so many other phony gurus, he lived a life of hypocritical irresolute self-indulgence, preaching "spirituality" and self-sacrifice to others while indulging in all of the pleasures of the flesh himself — with the sole exception that he does appear to have finally quit drinking alcohol after it nearly killed him.
                    - generic [ref=e2685]:
                      - text: (Although some people even dispute that.
                      - link "Some claim" [ref=e2686] [cursor=pointer]:
                        - /url: /content/letters-67#Wilson_drunk
                      - text: that Bill Wilson never got more than a year of sobriety. And Bill Wilson died
                      - link "screaming for whiskey" [ref=e2687] [cursor=pointer]:
                        - /url: /content/letters-15#Cheever_book
                      - text: .)
                  - paragraph [ref=e2688]:
                    - text: In addition, Bill was just echoing the religious doctrine of Frank Buchman, who preached that everyone in the world had been
                    - link "defeated by sin" [ref=e2689] [cursor=pointer]:
                      - /url: /content/rroot-090#Buchman_insane
                    - text: ", and was powerless over it, and could only be saved by surrendering his will and life to God and coming under \"God-control\" (which really meant, under \"Frank-control\"). Bill Wilson just substituted the word \"alcohol\" for \"sin\". Bill wanted all of the alcoholics to believe that they were powerless over alcohol — completely defeated by alcohol — so that they would despair and surrender their wills and their lives to Bill's group."
                  - paragraph [ref=e2690]: "Bill continued:"
                  - paragraph
                  - blockquote [ref=e2691]:
                    - generic [ref=e2692]: "Once more: The alcoholic at certain times has no effective mental defense against the first drink. Except in a few rare cases, neither he nor any other human being can provide such a defense. His defense must come from a Higher Power."
                    - generic [ref=e2693]: The Big Book, 3rd Edition, William G. Wilson, Chapter 3, More About Alcoholism, page 43.
                  - paragraph [ref=e2694]:
                    - generic [ref=e2695]: No effective mental defense?
                    - text: You have to just hope that some Spirit or Holy Ghost or Higher Power will keep you from drinking?
                    - text: Yes.
                  - paragraph [ref=e2696]:
                    - text: And this is the program whose members claim is the best alcoholism recovery program in the world?
                    - text: Yes.
                  - paragraph [ref=e2697]: "Bill Wilson was sure of it:"
                  - paragraph
                  - blockquote [ref=e2698]:
                    - generic [ref=e2699]: We think this account of our experiences will help everyone to better understand the alcoholic. Many do not comprehend that the alcoholic is a very sick person. And besides, we are sure that our way of living has its advantages for all.
                    - generic [ref=e2700]: The Big Book, William G. Wilson, the Foreword to the First Edition, page xiii of the 3rd edition.
                  - paragraph [ref=e2701]:
                    - text: "Aha! There it is:"
                    - generic [ref=e2703]: And besides,
                    - generic [ref=e2704]: the real goal of our program is to get everyone in the world living according to the Buchman-and-Bill religion, "our way of living."
                  - paragraph
                  - blockquote [ref=e2705]:
                    - generic [ref=e2706]: At the moment we are trying to put our lives in order. But this is not an end in itself. Our real purpose is to fit ourselves to be of maximum service to God and the people about us.
                    - generic [ref=e2707]: The Big Book, 3rd and 4th Editions, page 77.
