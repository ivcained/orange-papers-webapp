                  - paragraph [ref=e2133]:
                    - generic [ref=e2134]:
                      - text: By the way, that Dr. Ruth Fox was the founder of ASAM — The American Society for Addiction Medicine —
                      - link "another A.A. front group" [ref=e2135] [cursor=pointer]:
                        - /url: orange-cult_a5.html#ca_front_groups
                      - text: that exists to promote A.A. and the 12-Step cult religion treatment of alcoholism, this one by pretending to give doctors helpful advice about what works to treat or cure alcoholism.
                    - generic [ref=e2136]:
                      - text: "And Dr. Ruth Fox was such a monster of a mad scientist that she gave her patients disulfiram and then alcohol, to deliberately make them very sick, in an attempt to build up an aversion to alcohol. Even after she discovered that the aversion therapy didn't work, and even after one patient nearly died from an almost fatal reaction to a single ounce of alcohol, she still insisted on giving each patient at least one session of being sick from the disulfiram/alcohol combination, before she released them from the hospital. (See:"
                      - link "Disulfiram (Antabuse) as an Adjunct in the Treatment of Alcoholism" [ref=e2137] [cursor=pointer]:
