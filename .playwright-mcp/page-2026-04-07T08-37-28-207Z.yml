                  - paragraph [ref=e69]: "At the beginning of every Alcoholics Anonymous meeting, someone reads out loud a plastic-laminated document that says, among other things, that this Twelve-Step program has rarely been known to fail, except for a few unfortunate people who are \"constitutionally incapable of being honest with themselves\":"
                  - paragraph
                  - blockquote [ref=e70]:
                    - generic [ref=e71]: RARELY HAVE we seen a person fail who has thoroughly followed our path. Those who do not recover are those who cannot or will not give themselves completely to this simple program, usually men and women who are constitutionally incapable of being honest with themselves. There are such unfortunates. They are not at fault; they seem to have been born that way.
                    - generic [ref=e72]: A.A. Big Book, 3rd & 4th Editions, William G. Wilson, page 58.
                  - paragraph [ref=e73]: Nothing could be further from the truth. Even the most ardent true believers who will be honest about it recognize that A.A. and N.A. have at least 90% failure rates. And the real numbers are more like 95% or 98% or 100% failure rates. It depends on who is doing the counting, how they are counting, and what they are counting or measuring.
                  - paragraph [ref=e74]:
                    - text: A 5% success rate is nothing more than the rate of spontaneous remission in alcoholics and drug addicts. That is, out of any given group of alcoholics or drug addicts, approximately 5% per year will just wise up, and quit killing themselves.
                    - superscript [ref=e76]:
                      - link "6" [ref=e77] [cursor=pointer]:
                        - /url: "#ftnt06"
                    - text: They just get sick and tired of being sick and tired, and of watching their friends die. (And something between 1% and 3% of their friends do die annually, so that is a big incentive.) They often quit with little or no official treatment or help. Some actually detox themselves on their own couches, or in their own beds, or locked in their own closets. Often, they don't go to a lot of meetings. They just quit, all on their own, or with the help of a couple of good friends who keep them locked up for a few days while they go through withdrawal. A.A. and N.A. true believers insist that addicts can't successfully quit that way, but they do, every day.
                  - paragraph [ref=e78]: Every disease has a spontaneous remission rate. The rate for the common cold is basically 100 percent — almost nobody ever dies just from a cold. People routinely just "get over it", naturally. Likewise, ordinary influenza — "the flu" — has a very high spontaneous remission rate, greater than 99%. Yes, some old people do die from the flu every year, but not very many. Most people just get over it.
                  - paragraph [ref=e79]: On the other hand, diseases like cancer and Ebola have very low spontaneous remission rates — left untreated, they are very deadly and few people recover from them.
                  - paragraph [ref=e80]:
                    - text: Alcoholism is in the middle.
                    - link "The Harvard Medical School" [ref=e81] [cursor=pointer]:
                      - /url: "#Harvard_Mental"
                    - text: reported that in the long run, the rate of spontaneous remission in alcoholics is slightly over 50 percent. That means that the annual rate of spontaneous remission is around 5 percent.
                  - paragraph [ref=e82]:
                    - text: Thus, an alcoholism treatment program that seems to have a 5% success rate probably really has
                    - generic [ref=e83]: a zero percent success rate
                    - text: — it is just taking credit for the spontaneous remission that is happening anyway. It is taking the credit for the people who were going to quit anyway. And a program that has less than a five percent success rate, like four or three, may really have a negative success rate — it is actually keeping some people from succeeding in getting clean and sober. Any success rate that is less than the usual rate of spontaneous remission indicates a program that is a real disaster and is hurting the patients.
                  - paragraph
                  - table [ref=e86]:
                    - rowgroup [ref=e87]:
                      - row [ref=e88]:
                        - cell [ref=e89]:
                          - generic [ref=e90]:
                            - text: "It's like this:"
                            - paragraph [ref=e91]: Imagine that there is a nasty disease that kills 50% of the people who get it. A pharmaceutical company has a new medicine that they want to test. So they give the drug to a bunch of the people who have the disease, and 50% of them get better.
                            - paragraph [ref=e92]:
                              - text: The drug manufacturer cheers and brags,
                              - generic [ref=e93]: "\"Look at how great our new medicine is! We saved half of the patients!\""
                            - paragraph [ref=e94]: Wrong. The new drug saved nobody. The half who survived were the ones who were going to survive anyway. The drug had an effective zero percent cure rate, above and beyond normal spontaneous remission.
                            - paragraph [ref=e95]: To compute the success rate of any medicine or treatment program, you have to subtract the normal rate of spontaneous remission from the apparent success rate. In this example, fifty percent minus fifty percent yields a zero percent success rate for the new medicine. The new medicine didn't make anybody recover.
                          - paragraph [ref=e96]:
                            - generic [ref=e97]: (And if the survival rate of the patients who were taking the new medicine was less than half, then the new medicine was actually poisoning people and keeping them from recovering.)
                  - paragraph [ref=e98]: When one of those people who is going to quit drinking anyway, or who did already just quit, walks into an A.A. meeting, A.A. is happy to take all of the credit for that success story, while disavowing any responsibility for all of those other people who walk in, are disgusted by what they see, and walk right back out, and relapse. That is grossly dishonest.
                  - paragraph [ref=e99]: A.A. is also more than happy to convince the person who just quit that it is all due to A.A. and the Twelve Steps. And many of them will believe it. At meetings, you will sometimes hear testimonials like "I tried everything, the V.A. program, the Christian Brotherhood, and finally, A.A. is what worked."
                  - paragraph [ref=e100]: "The speaker is forgetting one of the famous corollaries to Murphy's Law:"
                  - generic [ref=e102]: "\"The thing you seek always seems to be in the last place that you look.\""
                  - paragraph [ref=e103]: Many people who are in recovery require one or more relapses to convince themselves that they really can't drink or dope any more, not even just a little bit, now and then. They will think that they can just nibble, or "just have one", and that it will be okay. They will go through a lot of programs while they experiment and fail. It's a learning process. In the end, when some of them finally quit, really totally quit and stay quit, rather than die, they often give the credit to whichever program they just happen to be in when they finally quit. (All of them tend to overlook the fact that they stopped examining other programs after they successfully quit drinking. They just stuck with the program that they were in.)
                  - paragraph [ref=e104]: Thus the Christian sects have a bunch of totally convinced true believers who say that Jesus saved them, and the Veteran's Administration has some veterans who believe that the V.A. program is the best, and Alcoholics Anonymous has a bunch of people who insist that A.A. and the Twelve Steps are the only answer.
                  - paragraph
                  - table [ref=e107]:
                    - rowgroup [ref=e108]:
                      - row "In 1964, Dr. Milton A. Maxwell (who eventually became a member of the Board of Trustees of Alcoholics Anonymous World Services, Inc.) did a study of the relations between doctors and other treatment professionals and Alcoholics Anonymous. He wrote:" [ref=e109]:
                        - cell "In 1964, Dr. Milton A. Maxwell (who eventually became a member of the Board of Trustees of Alcoholics Anonymous World Services, Inc.) did a study of the relations between doctors and other treatment professionals and Alcoholics Anonymous. He wrote:" [ref=e110]:
                          - generic [ref=e111]:
                            - text: "In 1964, Dr. Milton A. Maxwell (who eventually became a member of the Board of Trustees of Alcoholics Anonymous World Services, Inc.) did a study of the relations between doctors and other treatment professionals and Alcoholics Anonymous. He wrote:"
                            - paragraph
                            - blockquote [ref=e112]:
                              - generic [ref=e113]: "Another root of Professional-AA strains consists of the very human tendency to be loyal to the therapy which has been successful in one's own case — and rather uncritically to adopt the ideological framework within which the help has come. We see this phenomenon in other areas. For example, the benefits of religious faith and personal integration can come through many different theological frames of reference — Roman Catholic, Pentacostal, Christian Science, Theosophy, Zen Buddhism, you name it. And, so often, the help found is taken as absolute proof of the truth of the accompanying theological framework. Or, witness what happens when a patient has shopped around from doctor to doctor, and finally finds one that helps: he becomes very loyal to the successful therapist — and to the successful therapeutic program. Why should the behavior of alcoholics be so different? I've been in alcoholism clinic and hospital settings where I've heard: \"I tried the 'cure' over there. I tried AA. None of it worked. But this place has got the answers.\" And I've heard alcoholics talk who had boxed the professional compass and finally made it in AA. In either case, the reason for the success of the particular treatment may have been due more to the patient's by-now greater pain and desperation than to the nature of the treatment or the context of beliefs. But few patients can see this at the time and they become loyal to the \"successful therapy\" — and, unfortunately, sometimes antagonistic or unfavorable in their attitude toward other therapeutic programs. Now, I submit that this is quite standard human behavior. But it is one of the roots of misunderstanding, distrust, and strain in AA-professional relations."
                              - generic [ref=e114]: PROFESSIONAL and ALCOHOLICS ANONYMOUS RELATIONS IN OREGON; An Exploratory Study Report, Milton A. Maxwell, Ph.D., 1965, page 10.
                  - paragraph [ref=e115]:
                    - text: "Yes:"
                    - generic [ref=e116]: "\"they become loyal to the 'successful therapy' — and, unfortunately, sometimes antagonistic or unfavorable in their attitude toward other therapeutic programs.\""
                    - text: That is the mind-set of A.A. members in a nutshell.
                  - paragraph [ref=e117]:
                    - text: The Harvard Medical School says that the vast majority of the people who successfully quit drinking for a year or more — eighty percent of them —
                    - link "do it alone, all by themselves" [ref=e118] [cursor=pointer]:
                      - /url: "#Harvard_Mental"
                    - text: ", without any treatment program or \"support group\". Naturally, those do-it-yourselfers will also insist that they have the sure-fire solution that really works:"
                    - generic [ref=e119]: "\"Just don't drink any more alcohol, not ever, no matter what.\""
                  - paragraph [ref=e120]: When you are at an A.A. meeting, you are in a self-selecting group. You won't hear from the Jesus-freak Christians, or the gung-ho V.A. guys, or the do-it-yourself guys, because they aren't there. You will only hear from the A.A. true believers, who will be happily reassuring each other that they are doing the only thing that really works.
                  - paragraph
                  - table [ref=e123]:
                    - rowgroup [ref=e124]:
                      - row "Not! That goofy logic is the same logic as A.A. uses to insist that it's a proven fact that going to A.A. meetings and doing the Twelve Steps causes people to quit drinking. Many A.A. members are confusing causation with correlation, or causation with coincidence. They fail to see that they go to A.A. meetings because they want to quit drinking, not that they want to quit drinking because they go to A.A. meetings. And the reason that they finally quit drinking is because they really want to quit — want it so strongly that they finally really do it. And the commonest reason for quitting is because people just get sick and tired of being sick and tired, and wish to avoid death." [ref=e125]:
