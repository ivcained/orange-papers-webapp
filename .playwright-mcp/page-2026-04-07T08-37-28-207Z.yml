                  - paragraph
                  - blockquote [ref=e875]:
                    - generic [ref=e876]:
                      - text: "The Natural History of Alcoholism: Causes, Patterns, and Paths to Recovery, George E. Vaillant, Harvard University Press, Cambridge, MA, 1983, pages 283-286."
                      - text: The same text was reprinted in Vaillant's later book,
                      - generic [ref=e877]: The Natural History of Alcoholism Revisited
                      - text: ", George E. Vaillant, Harvard University Press, Cambridge, MA, 1995, pages 349-352."
                      - text: "[See the Bibliography at the end of this file for the references that Vaillant cited above.]"
                  - paragraph [ref=e878]: What Professor Vaillant, a Trustee of Alcoholics Anonymous World Services, Inc. — in other words, one of the highest-ranking A.A. leaders — is candidly, clearly describing is a zero-percent success rate for his A.A.-based treatment program.
                  - paragraph [ref=e879]: "The A.A. meetings and the Twelve Steps and all of the rest of A.A. program did not help the alcoholics at all. Zero improvement. Zilch. And it was even worse than no help:"
                  - list [ref=e880]:
                    - paragraph
                    - listitem [ref=e881]:
                      - text: Look at the "Abstinent or social drinking" and "Improved" columns of Table 8.1. You have to add the numbers together to get the over-all improvement rate for that item. So, for "A.A.", "no treatment", and "other treatment", we get 33%, 32%, and 37% over-all improvement rates, respectively. Those numbers are basically the same. There is no statistically significant difference between 33 and 32 percent, and hardly any between 33 and 37 percent. So A.A. treatment was no better than either "other treatment" or no treatment at all, and conversely, "other treatment" wasn't a whole lot better than either A.A. or "no treatment", either. After two years of A.A. treatment, "other treatment", or "no treatment", roughly two-thirds of the patients in all of those groups were still abusing alcohol. That's a dismal result.
                      - paragraph
                    - listitem [ref=e882]:
                      - text: Look at the "Abstinent or social drinking" and "Improved" columns of Table 8.2. Again, you have to add the numbers together to get the over-all improvement rate for that item. The A.A. "Clinic sample" scored 45 percent improved over-all, while the other programs ranged from 35 to 47 percent. Two of the programs, those in the Bratfos and Voetglin-Broz studies, seem to have been much worse than average, but all of the rest of the programs, including A.A., show approximately the same results. (The Voetglin-Broz study used something called "Conditioned Reflex Treatment". What caused the poor results in the Norwegian Bratfos study is unknown.)
                      - paragraph
                    - listitem [ref=e883]:
                      - text: Look at the "Dead" column of Table 8.2. The A.A.-treated group, the "Clinic sample", with the death rate of 29%, had the highest death rate of any kind of program, significantly higher than all of the other programs.
                      - paragraph
                    - listitem [ref=e884]:
                      - text: And those five people out of the hundred in the A.A.-treated "Clinic sample" who successfully stayed sober for 8 years are just the result of that same old five percent spontaneous remission rate at work, again.
                      - paragraph
                    - listitem [ref=e885]: As Professor Vaillant reported, the A.A. treatment program did not alter the natural history (the usual course) of alcoholism, except for yielding a higher death rate than doing nothing. A.A. did not save the alcoholics; it didn't even help them; it just killed them.
                  - paragraph [ref=e886]: Remember that these terrible numbers were reported by a Trustee of Alcoholics Anonymous World Services, Inc., by a real true believer in A.A., by one of the highest-ranking A.A. insiders, by someone who loves A.A. and was trying hard to make it look good, not by some harsh critic of A.A. who might be suspected of bias, or of fudging the numbers to make A.A. look bad...
                  - paragraph [ref=e887]:
                    - text: Remember this the next time you hear somebody say
                    - generic [ref=e888]: "\"Keep coming back! It works! (If you make it work...)\""
                  - paragraph
                  - separator [ref=e890]
                  - paragraph [ref=e891]:
                    - text: So why does Professor Vaillant so enthusiastically recommend A.A. for everyone who has a drinking problem, when the A.A. program obviously doesn't work? The answer seems to be that Vaillant is a member of
                    - link "the Buchmanite / Alcoholics Anonymous religion" [ref=e892] [cursor=pointer]:
                      - /url: /content/rroot-030
                    - text: . He is "under God-control", and he's trying to get everyone else under God-control too. Even if A.A. won't save people from alcoholism, it will make
                    - link "Buchmanites" [ref=e893] [cursor=pointer]:
                      - /url: /content/rroot-060#FrankB
                    - text: out of them, and make them "Seek and Do the Will of God."
                  - paragraph [ref=e894]: "Prof. Vaillant's own words on the subject were:"
                  - paragraph
                  - blockquote [ref=e895]:
                    - generic [ref=e896]:
                      - text: Recently the Annals of Internal Medicine editorialized that "the treatment of alcoholism has not improved in any important way in twenty-five years" (Gordis 1976). Alas, I am forced to agree. Perhaps the best that can be said for our exciting treatment effort at Cambridge Hospital is that we were certainly not interfering with the normal recovery process. How can I, a clinician, reconcile my enthusiasm for treatment with such melancholy data?
                      - paragraph [ref=e897]: The answer derives from addressing the second horn of the dilemma. The problem of alcoholism is too immense and the pain it causes too severe to suggest that hospitals once again hang out signs that read "alcoholics need not apply." The demands alcoholism places on the health-care system are too pervasive to tell government bodies that it is useless to fund large-scale treatment programs. It is not a step forward to say that alcoholism is the sole responsibility of families, of the church, and of the police. Therefore, if treatment as we currently understand it does not seem more effective than natural healing processes, then we need to understand those natural healing processes. We need also to study the special role that health-care professionals play in facilitating those processes.
                      - paragraph [ref=e898]:
                        - text: Consider tuberculosis as an analogy. In 1940 a well-known textbook of medicine advised, "Since there is no known specific cure for tuberculosis, treatment rests entirely on recognition of the factors contributing to the resistance of the patient." (Cecil 1940). In saying this the textbook did not recommend that the government and doctors get out of the business of treating tuberculosis; nor did it suggest that because genes and socioeconomic factors were etiologically just as important as contagion tuberculosis was really just a social problem and not a medical disorder. Rather, the text suggested that doctors learn more about natural healing processes.
                        - text: ...
                        - text: Throughout history, physicians faced with disease that they can neither comprehend nor cure have played invaluable roles in capturing these natural forces. In his classic monograph, Persuasion and Healing, Jerome Frank, professor of Psychiatry at Johns Hopkins University, offered a transcultural model for healing that is nonspecific for disease or patient; but Frank's model maximizes both the relief of suffering and — of special importance in alcoholism — attitude change. Frank acknowledges the paradox that demand for therapy may seem increasingly insatiable at the very time of mounting complaint that such therapy may represent expensive fraud. What feeds such demand is not the patient's need for cure as much as his need to elevate his morale.
                      - paragraph [ref=e899]: First, alcoholics feel defeated, helpless, and without ability to change. If their lives are to change, they need hope as much as relief of symptoms. Second, alcoholics often have an ingrained habit that is intractable to reason, threat, or willpower. To change a maladaptive habit, be it smoking or getting too little exercise or drinking too much alcohol, we cannot "treat" or compel or reason with the person. Rather, we must change the person's belief system and then maintain that change. Time and time again, both evangelists and behavior therapists have demonstrated that if you can but win their hearts and minds, their habits will follow. In other words, if we can but combine the best placebo effects of acupuncture, Lourdes, or Christian Science with the best attitude change inherent in the evangelical conversion experience, we may be on our way to an effective alcoholism program. I shall describe Frank's view in general terms and then illustrate his points with four relatively successful programs.
                      - paragraph [ref=e900]:
                        - text: Frank's prescription for an effective "placebo" therapy (that is, for a modern-day Lourdes) has as its goal to raise the patient's expectation of cure and to reintegrate him with the group.
                        - text: ...
                        - text: The sanctioned healer should have status and power and be equipped with an unambiguous conceptual model of the problem which he is willing to explain to the patient.
                        - text: ...
                        - text: The common ingredients of such a program include group acceptance, an emotionally-charged but communally shared ritual, and a shared belief system. Such a ritual should be accompanied by a cognitive learning process that "explains" the phenomenon of the illness. The point is that if one cannot cure an illness, one wants to make the patient less afraid and overwhelmed by it.
                    - paragraph [ref=e901]:
                      - generic [ref=e902]: Frank's prescription for attitude change is initially interrogation by and confession of sins to a high-status healer.
                      - generic [ref=e903]:
                        - text: "The Natural History of Alcoholism: Causes, Patterns, and Paths to Recovery, George E. Vaillant, Harvard University Press, Cambridge, MA, 1983, pages 286-288."
                        - generic [ref=e904]:
                          - text: The same text was reprinted in Vaillant's later book,
                          - generic [ref=e905]: The Natural History of Alcoholism Revisited
                          - text: ", George E. Vaillant, Harvard University Press, Cambridge, MA, 1995, on pages 352-354."
                        - text: "[See the Bibliography at the end of this file for the references that Vaillant cited above.]"
                  - paragraph [ref=e906]: Essentially, Vaillant is saying that we can't just give up and do nothing. We should keep on trying something. I totally agree. And he wants the government to keep on funding his programs. That's understandable. (I don't necessarily agree, but it's understandable.)
                  - paragraph [ref=e907]:
                    - text: Then Vaillant wrote,
                    - generic [ref=e908]: "\"Perhaps the best that can be said for our exciting treatment effort at Cambridge Hospital is that we were certainly not interfering with the normal recovery process.\""
                    - text: "I disagree. Vaillant clearly demonstrated that that was exactly what they were doing: interfering with spontaneous remission, causing his group, his \"Clinic Sample\", to have a much higher death rate than anybody else was getting."
                  - paragraph [ref=e909]:
                    - text: "Then Vaillant asked the key question:"
                    - generic [ref=e910]: "\"How can I, a clinician, reconcile my enthusiasm for treatment with such melancholy data?\""
                    - generic [ref=e911]: Yes indeed, why send anybody else to A.A., when the results are so bad?
                  - paragraph [ref=e912]:
                    - text: Notice how Vaillant slickly equated A.A. with "treatment", without quite saying so. That is a deceptive word game. "Treatment" and "mandatory Alcoholics Anonymous meetings" are not necessarily the same thing. (That is an example of the propaganda stunt
                    - generic [ref=e913]:
                      - text: "\""
                      - link "False Equality" [ref=e914] [cursor=pointer]:
                        - /url: /content/propaganda#equality
                      - text: "\""
                    - text: — imply that two different things are equivalent, when they are not.) If you want "treatment", why not send the alcoholics to any of the other treatment programs that had the same dismal failure rate as Alcoholics Anonymous, but much lower death rates?
                  - paragraph [ref=e915]:
                    - text: In trying to answer that question, Vaillant went, by some lengthy, tortured logic, from admitting that A.A. doesn't work, to recommending that we send more alcoholics to a program that is exactly like A.A. anyway,
                    - text: — because it might start to have a beneficial effect, maybe later after we learn more;
                    - text: — because we might get lucky and accidentally learn how to harness some "natural healing processes".
                    - generic [ref=e916]: (Yes, and I might get lucky and win the lottery tonight, too, but I'm not holding my breath.)
                    - text: Vaillant wants us to send more people to the program that had the highest death rate of any of the programs that he examined. Where is the sense in that?
                  - paragraph [ref=e917]: I smell a rat. And I think that the rat is the reason why Vaillant was on the Board of Trustees of AAWS (Alcoholics Anonymous World Services, Inc.). Vaillant has cards he isn't showing, beliefs he isn't revealing to us, like religious beliefs that A.A. is good for something besides treating alcoholism...
                  - paragraph [ref=e918]: Vaillant is a true believer in Alcoholics Anonymous. All through the rest of his book, Vaillant described how he used A.A. teachings, practices, and philosophy on his patients, and he told how wonderful he considered A.A. to be. The eight-year study described here is just a summation of that on-going program. Vaillant's enthusiasm for A.A. was hardly dampened by his discovery that it didn't work.
                  - paragraph [ref=e919]:
                    - text: How can that be? The answer is,
                    - text: "\"Easy. You don't have to be an alcoholic to join a cult religion. Just look at the Moonies, or Scientology, or the Hari Krishnas... They aren't alcoholics or drug addicts, but they are still irrational true-believer cult members, as crazy as a loon, as buggy as a flop-house blanket. And, occasionally, they even have members who are doctors. The People's Temple had a doctor and a nurse who mixed up and dispensed the cyanide drinks at Jonestown. And Synanon had a doctor who performed vasectomies on all of the men.\""
                  - paragraph [ref=e920]:
                    - text: In A.A., before Prof. George Vaillant, there was
                    - link "Dr. Harry Tiebout" [ref=e921] [cursor=pointer]:
                      - /url: /content/tiebout
                    - text: ", who was also not an alcoholic — he was a real, certified, psychiatrist — and he also abandoned his training and became a true believer in using Alcoholics Anonymous \"treatment\" to force his patients to \"surrender\"."
                  - paragraph [ref=e922]:
                    - text: And then there is
                    - link "Dr. G. Douglas Talbott" [ref=e923] [cursor=pointer]:
                      - /url: /content/tiebout#Talbott
                    - text: ", the previous President of ASAM (the American Society for Addiction Medicine, another A.A. front), who drove other doctors to suicide with his A.A.-based \"therapy\"."
                  - paragraph [ref=e924]:
                    - text: So there is no shortage of insane doctors, mad scientists, and other sick "therapists" who love to torture their patient-prisoners with fascist medicine. (
                    - link "See Straight, Inc." [ref=e925] [cursor=pointer]:
                      - /url: /content/gulags#Straight
                    - text: for more.)
                  - paragraph [ref=e926]:
                    - text: Notice that Vaillant used
                    - link "the same old stereotype of \"The Alcoholic\"" [ref=e927] [cursor=pointer]:
                      - /url: /content/us-stupid-drunks
                    - text: "as A.A. does:"
                    - generic [ref=e928]: "\"They are all crazy and you can't reason with them, so you have to fool them and brainwash them into doing The Right Thing.\""
                    - generic [ref=e929]:
                      - text: "\"Change their belief systems to change their behavior.\""
                      - text: "\"If you can win their hearts and minds, then their habits will follow.\""
                  - paragraph [ref=e930]:
                    - text: It's just
                    - link "another example of standard cult behavior" [ref=e931] [cursor=pointer]:
                      - /url: orange-cult_a3.html#ca_newcomers_wrong
                    - text: — the arrogant belief that
                    - generic [ref=e933]:
                      - text: "\""
                      - link "Newcomers can't think right" [ref=e934] [cursor=pointer]:
                        - /url: orange-cult_q3.html#cq_newcomers_wrong
                      - text: ", so we will have to do their thinking for them.\""
                    - text: "Also:"
                    - generic [ref=e936]:
                      - text: "\"Newcomers can't think right,"
                      - text: — so it doesn't matter what they think — it's irrelevant anyway,
                      - text: — so
                      - link "it's okay if we deceive them" [ref=e937] [cursor=pointer]:
                        - /url: orange-cult_q2.html#cq_deceptive_recruiting
                      - text: in order to help them."
                  - paragraph [ref=e938]:
                    - text: Deliberately changing someone's belief system, possibly without his knowledge or permission, smacks of brainwashing and mind control, but
                    - link "that's what cults do" [ref=e939] [cursor=pointer]:
                      - /url: orange-cult_q3.html#heavenly_deception
                    - text: .
                    - link "Deceptive recruiting" [ref=e940] [cursor=pointer]:
                      - /url: orange-cult_q2.html#cq_deceptive_recruiting
                    - text: is also what cults do.
                  - paragraph [ref=e941]: Deliberately giving people a treatment program that is a proven failure (Vaillant himself proved it), while calling that failed program a "placebo", and then telling the patients that they are in the greatest, most exciting, alcoholism treatment program in the world, sounds like a good way to bring on a host of malpractice lawsuits. I don't know how anyone can call that ethical behavior, especially considering that people's lives are at stake.
