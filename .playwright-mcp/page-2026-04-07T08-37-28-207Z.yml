                  - paragraph [ref=e2797]: Obviously, some of the pundits didn't check the facts very closely before handing out the accolades. With drug and alcohol rehab programs, it seems like they rarely do. They seem to believe that if you are working with alcoholics and drug addicts, then you must be a saint, because nobody else wants that stinking job.
