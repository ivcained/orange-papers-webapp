                                      - text: "Subject: Success Rate in The First Year"
                                      - paragraph [ref=e1651]: Following the 1989 Triennial Survey of Alcoholics Anonymous, a paper was written for A.A. providing some analysis of the of the 1977, 1980, 1983, 1986 and 1989 Surveys. One graph has been misiniterpreted by some A.A. critics as showing a low 5% recovery rate. That is NOT what it shows at all. Actually, 56% of those who stay for three months stay for a full year.
                                      - paragraph [ref=e1652]: C-1 "Percent of Those Coming to AA Within the First Year Who Have Remained the Indicated Number of Months."
