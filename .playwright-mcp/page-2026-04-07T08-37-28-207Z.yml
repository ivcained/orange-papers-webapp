                                      - paragraph [ref=e1655]: The second (percent) column is the distribution of the people who were present at the randomly selected groups on the day of the survey. The first column is what month "number" they were in. For example Line "3" says that 10% of the people in the sample (attending A.A. for less than a year) had been coming for two months but less than three months.
                                      - paragraph [ref=e1656]: You can see the attrition here but the second column is not the percent those staying that length of time. If nobody dropped out, every number of months would have 1/12th or 8.3% of the people. Since we often tell newcomers to take three months to decide if they are alcoholics, I multiply by 11.1 to create a third column with 100 in the 4th month.
