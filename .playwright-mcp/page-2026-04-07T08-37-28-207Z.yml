                  - paragraph [ref=e3040]:
                    - text: Comments on A.A.'s Triennial Surveys, no author listed.
                    - text: Alcoholics Anonymous World Services, New York, no date (probably 1990).
                    - text: The document has an A.A.W.S. identification number of "5M/12-90/TC", and was produced for A.A. internal use only.
                    - text: "It reveals the information that five successive triennial surverys, from 1977 to 1989, showed that newcomers to A.A. dropped out at a staggering rate: 81% are gone after 1 month; 90% are gone after 3 months, and 95% are gone at the end of one year. (Page 12, diagram C-1.) That gives A.A. a maximum possible success rate of only 5%, even if you define \"success\" as staying sober for only one year."
                    - text: But not all of those five percent who keep coming back are continuously sober. Many of them relapse repeatedly. And then the attrition continues.
                    - text: A.A. old-timers with 20 years sober are as rare as hen's teeth, and are treated like visiting royalty when they show up to speak at meetings.
                  - paragraph
                  - paragraph [ref=e3041]:
                    - text: Grateful To Have Been There Nell Wing
                    - text: Parkside Publishing Corporation, Park Ridge, Ill, 1992.
                    - text: "ISBN: 0-942421-44-2"
                    - text: "Dewey: 362.2928 WING"
                    - text: This is an interesting book, even if it is a complete whitewash and gloss-over. Nell Wing was Bill Wilson's secretary for about 35 years, so it is understandable. And we can see the obvious fingerprints of the other true believers, helping Nell to tell the standard stories in exactly the same way as others have, like Bill's conversations with the ghosts of Nantucket. (Page 56.)
                    - text: "Quotes:"
                    - link "here" [ref=e3042] [cursor=pointer]:
