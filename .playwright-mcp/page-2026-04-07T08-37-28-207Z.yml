                                      - paragraph [ref=e1659]: Of those who were in their first month, about half decided they were not alcoholics or that A.A. was not for them and didn't stay for three months. It is reasonable to say that those who stay three months are interested in our program of recovery. Of these, over half stay active in A.A. at least a year.
                                    - paragraph [ref=e1660]:
                                      - generic [ref=e1661]:
                                        - text: Visiting an A.A. meeting does not mean someone is an alcoholic.
                                        - text: Leaving A.A. does not mean someone has returned to drinking.
                                        - text: _______
                                        - text: Tom E
                            - paragraph [ref=e1662]: Tom claims that we completely misunderstand the chart, and that "Actually, 56% of those who stay for three months stay for a full year."
                            - paragraph [ref=e1663]: By our previous interpretation of the chart, exactly half of those present at the three-month point (10%) are still around at the end of a year. We say 50%, and he says 56%. That hardly amounts to a major revision of the numbers, no matter how you look at them.
                            - paragraph [ref=e1664]:
                              - text: "The kicker is this line:"
                              - text: "\"Since we often tell newcomers to take three months to decide if they are alcoholics, I multiply by 11.1 to create a third column with 100 in the 4th month.\""
                            - paragraph [ref=e1665]: There is no logic to that. He might as well say, "Since we tell beginners to eat lots of ice cream and candy bars to overcome cravings, I multiply all of the numbers by 17."
                            - paragraph [ref=e1666]: Making the numbers look bigger does not change reality.
                            - paragraph [ref=e1667]: Nevertheless, even after he finishes with his mathematical gyrations, all he is saying is that a hair over one half of those few people who stay for three months will end up staying for a whole year.
                            - paragraph [ref=e1668]: That's almost exactly what we all said earlier.
                            - paragraph [ref=e1669]: Furthermore, even if the numbers are what Tom describes — just asking the people present how many months they have been coming back — then the numbers still show a huge attrition rate. The fact that so many people are in their first months of sobriety, and so few at 10, 11, and 12 months, shows a large dropout rate.
                            - paragraph [ref=e1670]: "Look at the numbers grouped into quarters:"
                            - paragraph
                            - table [ref=e1673]:
                              - rowgroup [ref=e1674]:
                                - row "First 3 months 19 + 13 + 10 43" [ref=e1675]:
                                  - cell "First 3 months" [ref=e1676]
                                  - cell "19 + 13 + 10" [ref=e1677]
                                  - cell "43" [ref=e1678]
                                - row "Second 3 months 9 + 8 + 7 24" [ref=e1679]:
                                  - cell "Second 3 months" [ref=e1680]
                                  - cell "9 + 8 + 7" [ref=e1681]
                                  - cell "24" [ref=e1682]
                                - row "Third 3 months 7 + 6 + 6 19" [ref=e1683]:
                                  - cell "Third 3 months" [ref=e1684]
                                  - cell "7 + 6 + 6" [ref=e1685]
                                  - cell "19" [ref=e1686]
                                - row "Fourth 3 months 6 + 6 + 5 17" [ref=e1687]:
                                  - cell "Fourth 3 months" [ref=e1688]
                                  - cell "6 + 6 + 5" [ref=e1689]
                                  - cell "17" [ref=e1690]
                            - paragraph [ref=e1691]: Almost half of all of the new people present are in their first three months of sobriety. (And 52% of the newcomers are in their first third of a year.) That isn't right. If people were staying in, then the numbers in the third column should all be the same — 25.
                            - paragraph [ref=e1692]: And the greatest part of the attrition is hidden and not shown by those numbers. Such a survey won't tell you anything about all of the people who dropped out in their first few weeks and were not around to answer the questionnaire.
                            - paragraph [ref=e1693]: We know from personal experience that plenty of people drop out in their first month. Many, many people go to just a few A.A. meetings, and don't like what they see, and don't come back. The number of "one-timers" or "two-timers" is immense. If you go to A.A. meetings for just a few months you will see a zillion beginners who just show up once, and you will never see them again. They were not counted. All of those A.A. numbers that are obtained by only questioning those people who "keep coming back" are skewed and biased.
                            - paragraph [ref=e1694]: That problem actually immensely biases the numbers.
                            - paragraph [ref=e1695]: Do a simple thought experiment. Imagine that you have one first-time newcomer who comes to a meeting each day. He only comes once, and is disgusted by what he sees, and leaves, and the next day, it's somebody else who does the same thing. There are 365 days in a year, and 1095 days in 3 years. (Those A.A. surveys are triennial surveys.) So, in 3 years, there are 1095 one-day visitors who don't like what they see, and leave.
                            - paragraph [ref=e1696]: Assume that there are also a whole bunch of people who only come two times, and a bunch who only come three times, and some only four times, and so on.
                            - paragraph [ref=e1697]: There will be only 1 of those "one-timers" present on the day that the survey is done, so only one of them will be counted. In a triennial survey that is done on just one day every three years, which essentially just takes a snap-shot picture of the people in attendance on that day, the odds of a one-timer getting counted are actually count less than one in a thousand.
                            - paragraph [ref=e1698]:
                              - text: Likewise, the odds of a "two-timer" getting counted in the survey are only 1 in 547.
                              - text: And only 1 in 365 for the "three-timers",
                              - text: and only 1 in 273 for the "four-timers",
                              - text: and so on.
                            - paragraph [ref=e1699]: There are an immense number of A.A. drop-outs who don't get counted in such a triennial survey.
                            - paragraph [ref=e1700]: "So there is a row of numbers missing from the table. The chart should really look something more like this:"
                            - paragraph
                            - table [ref=e1703]:
                              - rowgroup [ref=e1704]:
                                - row "First days 100 (a rough guess) 100" [ref=e1705]:
                                  - cell "First days" [ref=e1706]
                                  - cell "100 (a rough guess)" [ref=e1707]
