                        - 'cell "\"Tough Love: Abuse of a type particularly gratifying to the abuser, in that it combines the pleasures of sadism with those of self-righteousness. Commonly employed and widely admired in 12-step groups and treatment.\" — Charles Bufe" [ref=e2839]':
