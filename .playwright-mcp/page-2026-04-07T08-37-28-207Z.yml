                  - paragraph [ref=e1226]: That 3.2% per year death rate is very close to the 3% per year death rate that Prof. Vaillant reported in his A.A.-based treatment program. And Vaillant called that death rate "appalling".
                  - paragraph [ref=e1227]: Then, while the study by Finney and Moos reported lower death rates over-all, the untreated alcoholics still had a noticeably lower death rate than those who got treatment — 1.7% per year dead in the untreated alcoholics' group versus 2.15% per year dead in the treated alcoholics.
                  - paragraph [ref=e1228]: "And the study by Dr. Powell showed once again that the group that got no 12-Step treatment or \"help\" at all had a lower relapse rate than the people that got the expensive treatment program:"
                  - paragraph
                  - table [ref=e1231]:
                    - rowgroup [ref=e1232]:
                      - row "Medications only 80% relapsed" [ref=e1233]:
                        - cell "Medications only" [ref=e1234]
                        - cell "80% relapsed" [ref=e1235]
                      - row "Complete treatment program 80% relapsed" [ref=e1236]:
                        - cell "Complete treatment program" [ref=e1237]
                        - cell "80% relapsed" [ref=e1238]
                      - row "No treatment 74% relapsed" [ref=e1239]:
                        - cell "No treatment" [ref=e1240]
                        - cell "74% relapsed" [ref=e1241]
                  - paragraph [ref=e1242]: That means that the so-called "treatment" was actually harming the patients and making matters worse, and keeping people from getting sober, and occasionally even causing them to die. The alcoholics who never went near that 12-Step treatment center were actually better off.
                  - paragraph [ref=e1243]
                  - generic [ref=e1244]:
                    - img
                  - paragraph [ref=e1245]:
                    - text: In 1996, The National Longitudinal Alcoholism Epidemiological Survey was designed by the NIAAA and conducted by the US Bureau of the Census. The survey was large, both in terms of people, tens of thousands, and in terms of time, 20 years. Deborah A. Dawson, of the NIAAA, filtered out 4585 subjects who had displayed standard
                    - link "DSM-IV" [ref=e1246] [cursor=pointer]:
                      - /url: "#dsm"
                    - text: Alcohol Abuse and Dependency symptoms, and analyzed those people. There were populations of people who had not received any treatment, and those who had. The commonest treatment modality by far was the A.A. Twelve-Step "spiritual therapy." The treatments were a cross section of all of the standard treatments used in the USA, which means that at least 85% — probably 93%
                    - superscript [ref=e1248]:
                      - link "11" [ref=e1249] [cursor=pointer]:
                        - /url: "#ftnt11"
                    - text: "— of the treatment programs were based on the A.A. Twelve-Step program. The results were: 20 years after the onset of alcoholism symptoms, 80% of those who had undergone treatment were either abstinent, or \"drinking without abuse or dependence.\" But, of those who had never received any treatment, 90% were either abstinent or drinking non-problematically."
                  - paragraph [ref=e1250]:
                    - text: "When we flip those numbers around, expressing them as failure rates rather than as success rates, we get: After 20 years, 10% of the untreated people still had drinking problems, while 20% of the treated people still had drinking problems. It would appear that the treatment programs actually had a"
                    - generic [ref=e1251]: negative
                    - text: effect, with twice as many treated people as untreated people still having drinking problems after 20 years.
                  - paragraph [ref=e1252]: "But there is one critical mitigating factor: the people who got treatment were in worse condition than the others, to start with. That's why they got treated. And after treatment, they were still in worse condition. So we cannot, just from this analysis, assume that the treatment had a negative effect. The most reasonable analysis of the effectiveness of the treatment of alcoholism with Twelve-Step programs is to say that the treatment had no effect. It didn't work, it didn't fix the alcoholics."
                  - paragraph [ref=e1253]:
                    - text: Both groups — the treated and the untreated people — were slowly but steadily improving as time passed. That was the spontaneous remission at work, again.
                    - generic [ref=e1254]: "(See \"Correlates of Past-Year Status Among Treated and Untreated Persons with Former Alcohol Dependence: United States, 1992,\" by Deborah A. Dawson, Alcoholism: Clinical and Experimental Research, Vol. 20, No. 4, June 1996, p. 773.)"
                  - paragraph [ref=e1255]:
                    - text: Remember this the next time you hear someone say,
                    - generic [ref=e1256]: "\"Nobody can do it alone.\""
                    - text: The truth is, more people do it alone than do it in any group therapy treatment program, or any treatment program of any kind. The acting President of the United States, G. W. Bush, is one of them.
                    - link "He says he just quit doping and drinking — quit cocaine and whiskey" [ref=e1257] [cursor=pointer]:
                      - /url: /content/dry-drunk#Bisbort
                    - text: — when it got to be too much and became a big liability. He says he did no A.A., no meetings, no Twelve Steps, no sponsor, no Big Book. Bush says that he just said a prayer, asking for the Lord's help, then he quit, and that was the end of that...
                  - paragraph [ref=e1258]
                  - generic [ref=e1259]:
                    - img
                  - paragraph [ref=e1260]: One of the most interesting pieces of new "recovery" research has shown that newcomers do not benefit at all from getting sponsors. In a recent controlled study, a group of new Narcotics Anonymous and Alcoholics Anonymous members who got sponsors did no better than another group who didn't get sponsors. But strangely enough, the elder members who chose to become sponsors did better than the other members who did not choose to act as sponsors. (The sponsors were a self-selected group; not randomly chosen.) It seems that getting their egos stroked by acting as puffed-up, all-wise, all-knowing sponsors, ordering the wimpy newcomers around, helped some sponsors to stay clean and sober, even though it didn't help the newcomers any.
                  - paragraph
                  - blockquote [ref=e1261]:
                    - generic [ref=e1262]: Examined the relationship between sponsorship and abstinence in 12-step treatment of injection drug users. 500 former and current injection drug users (median age 39 yrs) reported sponsorship in Narcotics Anonymous (NA) and Alcoholics Anonymous (AA) at baseline and at 6-mo and 1-yr follow-ups. Results show that having a sponsor in NA/AA was not associated with any improvement in 1-yr sustained abstinence rates compared to non-sponsored controls. However, being a sponsor over the same time period was strongly associated with substantial improvements in sustained abstinence rates, even after controlling for involvement with community organizations, NA/AA meeting attendance, marital status, employment, participation in drug and alcohol treatment centers, and HIV status.
                    - generic [ref=e1263]:
                      - text: "See: \"The effects of sponsorship in 12-step treatment of injection drug users\", Byron L. Crape, Carl A. Latkin, Alexandra S. Laris, Amy R. Knowlton (all of the Johns Hopkins University, School of Hygiene and Public Health, Baltimore, MD, USA), [Journal of] Drug & Alcohol Dependence, Vol 65(3), Feb 2002, pp. 291-301."
                      - text: "URL:"
                      - link "http://www.elsevier.com/inca/publications/store/5/0/6/0/5/2/" [ref=e1264] [cursor=pointer]:
                        - /url: http://web.archive.org/web/20161020131749/http://www.elsevier.com/inca/publications/store/5/0/6/0/5/2/
                  - paragraph [ref=e1265]: "Traditionally, the sponsor is supposed to say that he isn't doing it for the newcomer; that he's doing it for his own sobriety. The Big Book actually instructs recruiters to tell new prospects:"
                  - paragraph
                  - blockquote [ref=e1266]:
                    - generic [ref=e1267]: Outline the program of action, explaining how you made a self-appraisal, how you straightened out your past and why you are now endeavoring to be helpful to him. It is important for him to realize that your attempt to pass this on to him plays a vital part in your recovery. Actually, he may be helping you more than you are helping him.
                    - generic [ref=e1268]: The Big Book, 3rd Edition, William G. Wilson, chapter 7, "Working With Others", page 94.
                  - paragraph [ref=e1269]: But who would have imagined that it was literally true that the recruiters were not doing it for the benefit of the newcomers, and that the newcomers would not benefit from the sponsors' so-called "help"?
                  - paragraph [ref=e1270]
                  - generic [ref=e1271]:
                    - img
                  - paragraph [ref=e1272]: Many, perhaps most, A.A. groups have a custom of giving out sobriety "medallions", or "coins", or "tokens" — choose whichever name you prefer. Beginners with no sober time get an aluminum "Just For Today" coin. Then the members collect coins for 30 days sober, 60 days, 90 days, 6 months, a year, and then multiple years. The count of how many of those coins are given away reveals that Alcoholics Anonymous has a horrendous dropout rate. Barely one percent of the newcomers get a 10-year coin, and only one in a thousand gets the 20-year coin.
