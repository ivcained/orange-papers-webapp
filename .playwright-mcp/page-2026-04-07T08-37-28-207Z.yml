                  - paragraph [ref=e962]:
                    - text: Note that Vaillant didn't give us even a vague hint of treating alcoholics like adults who are responsible for their own lives or deaths, which they really are, in the final analysis — they will live or die by their own hands. Vaillant just displays an arrogant, condescending attitude of
                    - generic [ref=e963]:
                      - text: "\""
                      - link "We'll fool those alcoholics into being good by playing mind games on them" [ref=e964] [cursor=pointer]:
                        - /url: orange-cult_q3.html#heavenly_deception
                      - text: ."
                  - paragraph [ref=e965]: And then Vaillant actually recommends using a hocus-pocus witches' brew mixture of "the placebo effects of acupuncture, Lourdes, or Christian Science" combined with "the attitude change of an evangelical conversion experience" to manipulate people's minds. Unbelievable.
                  - paragraph [ref=e966]:
                    - text: Also note that you are supposed to get a religious "evangelical" conversion experience from this A.A. organization that says that
                    - link "it isn't a religion" [ref=e967] [cursor=pointer]:
                      - /url: /content/spirrel
                    - text: and
                    - link "it doesn't do religious conversions" [ref=e968] [cursor=pointer]:
                      - /url: /content/spirrecov#no_conversion
                    - text: .
                  - paragraph [ref=e969]:
                    - text: Vaillant chose Jerome Frank's "transcultural model for healing that is nonspecific for disease or patient". What that means in plain English is that it is a generic cure-all. It's a cure-all that was designed with no particular disease or patients in mind; it's just supposed to be a general-purpose cure-all that is good for curing whatever ails you, just like good old-fashioned
                    - link "snake oil" [ref=e970] [cursor=pointer]:
                      - /url: /content/snake-oil
                    - text: . It's just like the Twelve Steps, which are supposedly
                    - link "able to cure anything and everything from alcoholism to compulsive shopping to schizophrenia" [ref=e971] [cursor=pointer]:
                      - /url: /content/snake-oil#group_list
                    - text: . And it's almost comical how Prof. Frank admits that such "therapy" suffers from "mounting complaints that such therapy may represent expensive fraud."
                  - paragraph [ref=e972]:
                    - text: One wonders whether Jerome Frank's cure-all model was deliberately patterned after the A.A. program. It sure resembles A.A.. The similarity is far too much of a coincidence to assume that Prof. Frank did not write up his "model" in order to recommend the A.A. program.
                    - text: (What was it I said, "There is no shortage of insane doctors, mad scientists, and other sick 'therapists' who love to torture their patient-prisoners with fascist medicine"?)
                  - paragraph [ref=e973]: "Vaillant describes Prof. Frank's ideal therapy program as: There should be a \"sanctioned healer ... with an unambiguous conceptual model of the problem which he is willing to explain to the patient.\" In other words, there should be a leader with some simplistic dogmatic explanations that he is happy to shove on the newcomers. The explanations don't have to be true, just \"unambiguous\". The program should offer \"group acceptance, an emotionally-charged but communally-shared ritual, a shared belief system\", and some phony dogma that \"explains\" the phenomenon of the illness. In other words, the program should be Alcoholics Anonymous, with its groups, ritualistic meetings, shared beliefs, and dogma."
                  - paragraph [ref=e974]: "Note how Vaillant put quotes around the word \"explains\" when he wrote:"
                  - paragraph
                  - blockquote [ref=e975]: Such a ritual should be accompanied by a cognitive learning process that "explains" the phenomenon of the illness.
                  - paragraph [ref=e976]:
                    - link "The dogma" [ref=e977] [cursor=pointer]:
                      - /url: orange-cult_a1.html#ca_dogma
                    - text: isn't supposed to really explain "the phenomenon of the illness"; it is just supposed to mollify the stupid patient with some unambiguous simplistic fairy tales. (
                    - link "Cult true believers" [ref=e979] [cursor=pointer]:
                      - /url: orange-cult_q1.html#True_Believer
                    - text: really like
                    - link "black-and-white thinking" [ref=e980] [cursor=pointer]:
                      - /url: orange-cult_q9.html#black_and_white
                    - text: "and simple, \"absolutely-true\" statements.) Vaillant clearly states that the goal is to use emotionally-charged rituals and \"unambiguous\" misinformation to play games with the patient's mind, and he rationalizes it this way:"
                  - paragraph
                  - blockquote [ref=e981]: The point is that if one cannot cure an illness, one wants to make the patient less afraid and overwhelmed by it.
                  - paragraph [ref=e982]:
                    - text: So that he can die comfortably, I guess — die comfortably as a "less afraid and overwhelmed" member of Vaillant's religion. Likewise, Prof. Frank said that the goal was not to cure the patient, but rather it was just to "elevate his morale." So that he can die with a smiley face on his head?
                    - text: Apparently so, because that is what the real results are.
                  - paragraph [ref=e983]:
                    - text: Personally, I'd rather really fix the problem, and I'd call quitting drinking, and staying quit, a workable cure. So some kind of a "cure"
                    - generic [ref=e984]: is
                    - text: possible, so there is no need to yammer about how we can't cure the illness, so let's play mind games on the patients.
                  - paragraph [ref=e985]:
                    - text: "Speaking of mind games, did you notice how Professor Vaillant's mind jumped from:"
                    - generic [ref=e986]: "\"A.A. and the other treatment programs that I examined all failed to cure or noticeably help the alcoholics\""
                    - text: ","
                    - text: "to:"
                    - generic [ref=e987]: "\"Therefore no cure is possible, so let's play mind games on the patients and give them hocus-pocus pseudo-religious faith-healing placebos, like the A.A. program. That program might capture some 'natural healing process'.\""
                    - text: (Now I can see why they say that "Ph.D." means that the B.S. is "Piled High and Deep".)
                  - paragraph [ref=e988]: Vaillant's plan for a treatment program is another example of The Enlightened Counselor's Deception, where "enlightened" counselors will tell public officials, "Of course we know that this nutty religious or spiritual or superstitious stuff that is at the heart of the A.A. and N.A. programs doesn't really work, but it offers a wonderful placebo effect, and if the patients think that it works, and it helps to keep the patients off of drugs and alcohol, then the illusion is a good thing. It might save their lives. So let's encourage it."
                  - paragraph [ref=e989]: That is how the counselors who are true believers in the A.A./N.A. 12-step religion succeed in getting the government to financially support and promote their cult religion with public tax dollars and health insurance money, and that is how they talk judges into sentencing people to 12-step-based "treatment programs".
                  - paragraph [ref=e990]:
                    - text: And finally, Frank and Vaillant want to get the patient to confess his sins to a "high-status healer" to get an "attitude change".
                    - generic [ref=e991]: What?!
                    - generic [ref=e992]:
                      - text: Just who or what on Earth is a "high-status healer"?
                      - text: A sponsor who reputedly has a lot of status?
                      - text: A lot of status, according to whom?
                  - paragraph [ref=e993]:
                    - generic [ref=e994]: Since Vaillant already showed that Alcoholics Anonymous doesn't work, and doesn't heal anybody, an A.A. sponsor doesn't qualify as a "healer".
                  - paragraph [ref=e995]:
                    - generic [ref=e996]:
                      - text: And why should the patient confess his sins to that "healer"?
                      - text: Because it will make him quit drinking?
                  - paragraph [ref=e997]:
                    - text: No. Of course not. Vaillant knows full well that that doesn't really work. Vaillant has already candidly reported that the A.A. 12-step program, with all of its guilt-inducing
                    - link "listing of sins" [ref=e998] [cursor=pointer]:
                      - /url: /content/interpreted#moral_inventory
                    - text: ", and"
                    - link "confessing of sins" [ref=e999] [cursor=pointer]:
                      - /url: orange-cult_q3.html#cq_confessions
                    - text: ", and \""
                    - link "admitting the exact nature of your wrongs" [ref=e1000] [cursor=pointer]:
                      - /url: /content/spirrecov#Step5
                    - text: "\", doesn't work at all. Eight years of thorough testing showed A.A. treatment to be completely ineffective and utterly useless, and even downright harmful — it raises the death rate. And yet Vaillant wants to send all of the alcoholics to A.A. to confess their sins anyway, obviously for some other reason than the effective treatment of alcoholism."
                  - paragraph [ref=e1001]:
                    - text: The real reason for such confessions is because Vaillant is a thinly-veiled
                    - link "Buchmanite" [ref=e1002] [cursor=pointer]:
                      - /url: /content/rroot-060#FrankB
                    - text: ", or an A.A. true believer (same thing, really), who can't wait to get people on their knees, confessing their sins, because"
                    - link "his cult religion" [ref=e1003] [cursor=pointer]:
                      - /url: /content/rroot-030
                    - text: tells him that people must confess their sins to each other in order to be holy. So, in order to better serve God, Vaillant has given himself the task of trying to get as many people as possible to confess their sins to each other, as well as to convert to his religion.
                  - paragraph [ref=e1004]:
                    - generic [ref=e1005]: What does any of this have to do with curing alcohol abuse?!
                    - text: Nothing. This is cult religion, not the treatment of alcoholism.
                  - paragraph [ref=e1006]: What Vaillant has done is pick out a "treatment model" — Jerome Frank's model — that matches his own Buchmanite religious beliefs, so that he can then recommend a religious program, specifically the Alcoholics Anonymous program, while pretending to be recommending a psychologically-oriented alcoholism treatment program.
                  - paragraph [ref=e1007]:
                    - text: Vaillant wants to send more people to A.A. in spite of the simple fact that when he tested the A.A. program, it didn't work. It was a disaster. The best thing that Vaillant could say for A.A. was that it did
                    - generic [ref=e1008]: nothing
                    - text: ". But, the truth is, A.A. was far worse than nothing. Over-all, A.A. had the highest death rate of any treatment or \"non-treatment\" program tested. Look at the \"Dead\" column in Table 8.2 again. Vaillant clearly demonstrated that A.A. kills: Over an 8-year period, the A.A.-treated \"Clinic sample\" had a 29% death rate. That really is appalling. That is nearly one out of every three patients, dead. That's"
                    - link "the Bataan Death March" [ref=e1009] [cursor=pointer]:
                      - /url: /content/not-good#Bataan_Death
                    - text: . Compared to the other programs, the A.A. death rate was anything from 128% to 580% of the other programs' death rates.
                  - paragraph [ref=e1010]:
                    - text: So there is absolutely no sane reason to be sending more patients to Alcoholics Anonymous, or any program based on Alcoholics Anonymous, or any program that is even
                    - generic [ref=e1011]: like
                    - text: Alcoholics Anonymous, when
                    - generic [ref=e1013]: all of the other treatment programs killed fewer patients.
                  - paragraph [ref=e1014]:
                    - text: But there is a dishonest, ulterior religious motive for doing so, if you are a
                    - link "Buchmanite" [ref=e1015] [cursor=pointer]:
                      - /url: /content/rroot-060#FrankB
                    - text: or a member of
                    - link "Moral Re-Armament" [ref=e1016] [cursor=pointer]:
                      - /url: /content/rroot-270#MoralReArm
                    - text: ", or perhaps a hidden member of"
                    - link "the Alcoholics Anonymous religion" [ref=e1017] [cursor=pointer]:
                      - /url: /content/spirrel
                    - text: . Then, you would want to send people to A.A. to make them do the Twelve Steps, and confess their sins, and Seek and Do the Will of God, because you believe it will please God...
                  - paragraph [ref=e1018]:
                    - text: The A.A. saying is,
                    - generic [ref=e1019]:
                      - text: "\"If you keep on doing what you've always been doing,"
                      - text: You will keep on getting what you've always been getting.
                      - text: To expect anything different is insane."
                  - paragraph [ref=e1020]:
                    - text: Yes. And if you keep on sending patients to A.A. and N.A., you will keep on getting the same failure rate, and the same death rate.
                    - generic [ref=e1021]: To expect anything different is insane.
