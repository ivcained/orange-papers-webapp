                  - generic [ref=e1815]:
                    - img
                  - paragraph [ref=e1816]: "When the A.A. founder Bill Wilson wrote his history of Alcoholics Anonymous in 1957, he admitted that the early A.A. program had been a disaster:"
                  - paragraph
                  - blockquote [ref=e1817]:
                    - generic [ref=e1818]: At first nearly every alcoholic we approached began to slip, if indeed he sobered up at all. Others would stay dry six months or maybe a year and then take a skid. This was always a genuine catastrophe. We would all look at each other and say, "Who's next?"
                    - generic [ref=e1819]:
                      - text: Alcoholics Anonymous Comes Of Age, William G. Wilson, (1957), page 97.
                      - text: "As Bill Sees It: The A.A. Way of Life, William G. Wilson, (1967), page 154."
                  - paragraph
                  - table [ref=e1821]:
                    - rowgroup [ref=e1822]:
                      - row "Nell Wing" [ref=e1823]:
