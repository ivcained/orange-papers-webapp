                                - text: NEW YORK (Reuters Health) Feb 08 [2002] — Placebo treatment appears to activate the same part of the brain that is activated by opioids, Scandinavian investigators report.
                                - paragraph [ref=e953]:
                                  - text: Dr. Martin Ingvar, of the Cognitive Neurophysiology Research Group in Stockholm, and colleagues compared regional cerebral blood flow measured by positron emission tomography while inducing pain or a control stimulation in nine subjects. Their findings appear in the February 7th issue of Sciencexpress, the online edition of the journal Science.
                                  - text: ...
