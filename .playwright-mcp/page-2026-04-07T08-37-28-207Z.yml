                      - 'row "And note that the Harvard Medical School says that the support of a good spouse is more important than that of a 12-step group. But A.A. says just the opposite: \"Dump your spouse and marry the A.A. group, because A.A. is The Only Way.\" And a rehash of the Big Book that is targeted at youths tells this story of an allegedly-successful recovery: The husband is less important than A.A.? He rates third in importance? That is good for destroying a lot of marriages. And it does. Psychology Today magazine reported that the divorce rate of couples where one partner joined A.A. was 25% in just the first year alone, which is sky-high." [ref=e155]':
