                  - paragraph [ref=e2919]:
                    - text: So how do monsters and madmen like Jim Jones and Chuck Dederich get away with it? How did Bill Wilson get away with it? How does Alcoholics Anonymous get away with selling cult religion and voodoo medicine for 70 years? The answer is, "Very easily." Far too many people just consider the drug and alcohol rehabilitation field to be a dirty business, and they don't want to look at it, or have any dealings with it.
                    - generic [ref=e2920]: "\"If someone says that they are taking care of the problem, then fine, let them have it. They are welcome to it.\""
                    - text: And while they are doing it,
                    - generic [ref=e2921]: "\"There is no sense in looking too closely, or in giving them a hard time about how they are doing their jobs. What are we going to do, fire them? Nobody else wants the job.\""
                    - text: It should then come as no surprise to find that there have been many scoundrels caught with their hands in the proverbial cookie jar, taking public tax money, ostensibly to rehabilitate addicts and alcoholics, while really pursuing some other agenda or having some ulterior motive, like theft, sexual exploitation, ego aggrandizement, or promoting cult religion, or any combination thereof.
                  - paragraph [ref=e2922]: What's that old saying, "Power Corrupts, and Absolute Power Corrupts Absolutely"? Therapists and sponsors have a lot of power over the newly-detoxed patients. And those newcomers are often sick, physically and mentally wrecked, confused, and cloudy-headed, so it's an easy set-up. Abuse of the system is to be expected, as long as mere mortals run the system.
                  - paragraph [ref=e2923]:
                    - text: And when some leader starts to claim that he is a prophet of God, or has a wonderful new system of sobriety from God, then
                    - generic [ref=e2924]: don't expect the abuse to decrease.
                  - paragraph [ref=e2925]
                  - generic [ref=e2926]:
                    - img
                  - paragraph [ref=e2927]: As long as you believe in the A.A. Step Seven, that God must remove all of your defects of character and shortcomings, you are in great danger of relapse. What if you find that God hasn't bothered to fix you? Then you are dead meat. You are helpless, because you already confessed in Step One that you are powerless over your problem. And in Step Two, you confessed that you are insane, and in Step Three you turned your will over to God. You have left yourself no escape route, no way to save yourself. And sure enough, sooner or later, you will find that you are still just you, and you have the same cravings and temptations as before, and you still want to feel good, just like before.
                  - paragraph [ref=e2928]: The only way I can see to save myself is to assume that I will have to do all of the heavy lifting myself. Pardon me if I offend someone's religious beliefs, but I don't believe that God will take away all of my problems, and neither will Santa Claus, the Easter Bunny, or the Tooth Fairy. And Cinderella's Fairy Godmother has been AWOL lately, too. And I can't find Aladdin's lamp. So forget about Steps 1, 2, and 3, and forget about Step 7. Forget about all twelve of them, in fact.
                  - paragraph [ref=e2929]: "Make up some new steps, like:"
                  - paragraph
                  - list [ref=e2930]:
                    - generic [ref=e2931]:
                      - listitem [ref=e2932]:
                        - text: 1. I admit that drinking and smoking has gotten to be a real drag, and I am suffering so much that it isn't any fun any more.
                        - paragraph
                      - listitem [ref=e2933]:
                        - text: 2. I quit, and I'm staying quit forever.
                        - paragraph
                      - listitem [ref=e2934]:
                        - text: 3. Some of my friends may help me occasionally, but I'm mainly going to count on myself.
                        - paragraph
                      - listitem [ref=e2935]: 4. Whenever I am tempted to relapse, I will think about step one again, and remember why I quit in the first place. I will also remember what happened the last time I relapsed.
                  - paragraph [ref=e2936]: I think that might do it for starters. Maybe we will make up some more steps later, but those four will certainly be a good start. They work for me.
