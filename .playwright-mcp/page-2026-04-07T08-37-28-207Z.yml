                  - paragraph [ref=e1792]: Now it is true that there are 10 remaining at the three-month point, and 5 at the end of a year, so 50% of those who stay for 3 months do end up staying for a whole year. That statistic does not conflict with the fact that there is still only a 5% retention rate for 1 year.
                  - paragraph [ref=e1793]: "Now are there any holes in this logic? Yes. Just one, but it's a big one:"
                  - paragraph [ref=e1794]: It is that we do not know for sure how many newcomers come each month. If it is 200, then that group only has a 2.5% annual retention rate. On the other hand, if it is 50, then the group has a 10% annual retention rate.
                  - paragraph [ref=e1795]: Has anyone else studied this problem? Can we learn anything from them?
                  - paragraph [ref=e1796]: "Yes. The Australian A.A. organization has. They found that A.A. in Australia also had only a 5% annual retention rate:"
