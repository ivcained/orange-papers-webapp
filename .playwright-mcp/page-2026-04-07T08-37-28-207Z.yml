                  - paragraph [ref=e1438]: Now there are still a few problems with these numbers, like inventorying.
                  - paragraph [ref=e1439]: Look at the strange breaks in the chart at 10 years, 20 years, and 30 years. It appears that they lose one third of their members between 10 and 11 years, and half of their members between 20 and 21 years, and they lose more than two-thirds of their members — almost 3/4 — between 30 and 31 years.
                  - paragraph [ref=e1440]: No, not really.
                  - paragraph [ref=e1441]: What is really happening there is that the various clubs, groups, and intergroups stockpile and keep in inventory the coins for the lower numbers of years, so that they have them immediately on hand to give out to celebrants. But the numbers of people actually picking up the higher-numbered years' coins are so few that the groups do not inventory coins for the very high years. They special-order those coins one at a time when one of their oldtimer members has an upcoming birthday.
                  - paragraph [ref=e1442]: Where a given group will stop inventorying coins is a function of the size of the group. Small groups may stop inventorying the coins at 10 years. Larger groups, at 20 years. Very large groups, or intergroups, stop inventorying the coins at 30 years. It's pretty much human nature that they would pick round numbers like 10, 20 or 30. Hence the big non-linearities and apparent huge drop-out rates at 11, 21 and 31 years. We are just looking at sales of coins here, not actual membership numbers.
                  - paragraph [ref=e1443]: So the sales of a lot of the higher-years' coins do not represent success stories at all. Those coins have been purchased by clubs and groups, but not earned by anybody. They are just coins that were sold to the groups, and which are sitting in a box at the clubhouse, waiting for somebody to earn them. It appears that almost half of the 10-year coins, and fully half of the 20-year coins, and almost 3/4 of the 30-year coins fall into that category — just sitting in inventory, not yet earned by anybody.
                  - paragraph [ref=e1444]: Inventorying has a non-linear effect in distorting the numbers. Inventorying a moderate surplus of the coins for the first few years does not warp the numbers a lot, because so many of them are given out. But having just one spare 20- or 25- or 30-year coin sitting in the coin boxes of clubs and intergroups all over the USA may double the purchases of that particular denomination of coins. That is apparent from the huge discontinuities at 11, 21 and 31 years, where various groups cease inventorying.
                  - paragraph [ref=e1445]: Also notice the strange non-linearity between 7 and 10 years. They actually have 31 per thousand people getting 7-year coins, and then the numbers decline from there. But then they jump back up again at 10 years. I can only guess that maybe some people don't bother to pick up 8 or 9-year coins, but feel like 10 is a milestone that they want. But that would mean that they would have a zero-percent drop-out rate from 7 to 10 years, and only for those few years. Strange. I have no explanation for that anomaly.
                  - paragraph [ref=e1446]: "[Later: one correspondent suggested that the answer is people picking up multiple coins at the 10-year point. Some people getting 10-year coins are so proud of themselves that they go to meetings all over town, picking up another coin at another meeting and enjoying the crowd applauding and cheering for them, again and again. And of course the same thing can happen with the other higher-year coins, especially the 20- and 30-year coins.]"
                  - paragraph [ref=e1447]: "I didn't bother to continue the last chart beyond 37 years because the following numbers are unreliable. That is, the sample size is too small. We are down into the noise level of the signal, where we can easily count all of the individual people in the state who have that many years, because such oldtimers are so rare. And the number of oldtimers jumps around randomly: 1, 2, 4, 8, 1, 8, 7... We need sales figures for the whole USA to see a smooth trend for those years."
                  - paragraph [ref=e1448]: Again, this is a very good indication of the A.A. attrition rate, but it is non-scientific and not 100% reliable. A.A. boosters who don't like these numbers are more than welcome to send in their state's total sales figures — preferably xeroxes or computer scans of the invoices for all of the purchases of coins from the manufacturers.
                  - paragraph [ref=e1449]: It would be especially nice to get the sales figures for the monthly coins during the first year, to fill out that part of the chart.
