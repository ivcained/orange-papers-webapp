                  - paragraph [ref=e1024]
                  - paragraph [ref=e1025]: "For a final laugh, you might be curious to know where Vaillant was going with his argument. We stopped quoting him at the point where Prof. Frank was advocating sending all alcoholics to some program where they would confess their sins to \"a high-status healer.\" Well, after that, Vaillant declared that dogmatic cult religion is the best cure for alcoholism. Now, he never used those exact words, \"dogmatic cult religion\"; he just said:"
                  - paragraph
                  - blockquote [ref=e1026]:
                    - generic [ref=e1027]:
                      - text: "Frank's prescription for attitude change is initially interrogation by and confession of sins to a high-status healer. This process involves four components: indoctrination, repetition, removal of ambiguity, and opportunity for identification. It has been demonstrated that the patient's active participation in such a process \"increases a person's susceptibility especially if the situation requires him to assume some initiative\" for his own attitude change (p. 112). In the Stanford Heart Disease Prevention Program, internist John Farquhar (1978) and his colleagues (Farquhar et al. 1977) have examined different models of reducing smoking, altering diet, and increasing exercise. In their efforts to reduce coronary risk in large populations of patients, they found that"
                      - generic [ref=e1028]: explanation of risk and rational advice by physicians are less useful than systematic indoctrination and repetition using mass media and opportunity for identification through peer support groups.
                      - paragraph [ref=e1029]: "Frank writes: \"the greatest potential drawback of therapy groups is their tendency not to supply sufficient support, especially in early meetings, to enable members to cope with the stresses they generate\" (p. 190). One of the functions, then, of the medical-care system is to facilitate the transition of the isolated patient to group membership. Finally, if attitude change is to be maintained, repetition of group rituals and the group support that they engender must be sustained after clinic discharge."
                      - paragraph [ref=e1030]: Table 8.3 presents four alcohol treatment programs that fortuitously followed Frank's prescription and significantly facilitated remission from alcoholism. The table reflects the early treatment results reported by the Shadel clinic using emetine (Shadel 1944; Voetglin and Broz 1949), by the Menninger Clinic using disulfiram (Antabuse) and group therapy (Wallerstein 1956), by Beaubrun (1967) using an imaginative combination of indigenous paraprofessionals and medically sanctioned Alcoholics Anonymous, and by Sobell and Sobell using behavior modification (1973, 1976). Because they were adequately controlled, the Wallerstein and Sobell studies are especially convincing. Each program employed the newest method of its decade, was led by competent investigators, and found results that were clearly superior to those usually reported.
