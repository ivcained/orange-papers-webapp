                            - generic [ref=e2150]:
                              - text: Special Report On AA Work At The Philadelphia General Hospital
                              - text: December 13, 1940
                            - paragraph [ref=e2151]: The following is the complete experience of the Philadelphia A.A. Group with patients of the Philadelphia General Hospital since March 15. On this list are included only those men who have attended at least two or three A.A. meetings and have signified their intention of following the A.A. program.
                            - paragraph [ref=e2152]: "Brief notes on the various individuals follow:"
                            - paragraph [ref=e2153]:
                              - text: Joseph A. - Dry seven months, no trouble.
                              - text: Frank B. - Dry five months, one slip after he left group one month ago.
                              - text: Herbert C. B. - Dry four months, no trouble.
                              - text: Joshua D. B. - Probably psychopathic; continuous slips.
                              - text: Charles J. C. - Dry nine months, no trouble.
                              - text: John D. - Dry four months through Philadelphia General Hospital and Byberry.
                              - text: Joseph D. - Dry four months, no trouble.
                              - text: George G. - Dry one month, no trouble.
                              - text: John H. H. - Continuous slips before and after hospitalization.
                              - text: William K. - Dry four months, no trouble.
                              - text: Alfred K. - Dry four months, no trouble.
                              - text: Arthur T. McM. - Dry eight months, no trouble.
                              - text: William P. - Continuous after two hospitalizations, only attended five meetings, no work.
                              - text: Harry McC. - Dry eleven months, one slip two months ago, hospitalization then.
                              - text: James S. - Continuous slips before and after hospitalization.
                              - text: George K. - Continuous trouble up to two months ago, first hospital May.
                              - text: C. M. M. - Dry nine months, no trouble.
                              - text: Hugh O'H. - Dry two months, no trouble.
                              - text: Edmonds P. - Dry nine months, hospitalization recent, trouble since.
                              - text: William J. P. - Dry three months, no trouble.
                              - text: James R. - Dry five months, no trouble.
                              - text: William R. - Dry six weeks, no trouble.
                              - text: Carl R. - Dry eight weeks.
                              - text: Biddle S. - Dry four months, hospital trouble now dry one month.
                              - text: Thomas S. - Dry four months, one slip.
                              - text: David W. - Dry seven months, no trouble.
                              - text: William W. - Dry nine months, no trouble.
                              - text: Margery W. - Dry three months, no trouble.
                            - paragraph [ref=e2154]: Nineteen out of twenty-eight who have come through the Philadelphia General Hospital have had no trouble. Of the nine who have had trouble, five have been with the group and had trouble previous to hospitalization.
                            - paragraph [ref=e2155]: This list was made at the request of Jack Alexander, writer for the Saturday Evening Post.
                          - paragraph [ref=e2156]:
                            - generic [ref=e2157]:
                              - text: (Signed) A. W. Hammer M. D. - Surgeon
                              - text: (Signed) C. D. Saul, M. D. - Chief resident, Saint Luke's Hospital
                              - text: "(Signed) Philadelphia General Hospital, By: John F. Stouffer M. D. - Chief Psychiatrist"
                  - paragraph [ref=e2158]: This is merely anecdotal evidence, and not even convincing anecdotal evidence. Twenty-eight alcoholic men were detoxed and treated in Philadelphia General Hospital, and then they stayed sober for one or more months afterwards. Apparently, the doctors gave those alcoholics hell and told them that they would die if they didn't quit drinking, so most of them (68%) stayed sober for a few months after their hospitalization.
                  - paragraph [ref=e2159]: Oh, and they also attended at least two or three A.A. meetings.
                  - paragraph [ref=e2160]: So what?
                  - paragraph
                  - table [ref=e2163]:
                    - rowgroup [ref=e2164]:
                      - row "Strange that the doctors didn't give any credit for the patients' sobriety to the hospital or to medical treatment. They tried to give all of the credit for successes to Alcoholics Anonymous, even when some of the patients had only gone to 2 or 3 A.A. meetings. (Well actually, it isn't that strange. The doctors were apparently A.A. members, and on a holy mission to spread Alcoholics Anonymous everywhere...)" [ref=e2165]:
                        - cell "Strange that the doctors didn't give any credit for the patients' sobriety to the hospital or to medical treatment. They tried to give all of the credit for successes to Alcoholics Anonymous, even when some of the patients had only gone to 2 or 3 A.A. meetings. (Well actually, it isn't that strange. The doctors were apparently A.A. members, and on a holy mission to spread Alcoholics Anonymous everywhere...)" [ref=e2166]
                  - paragraph [ref=e2167]:
                    - text: Notice the funny fumbling word game where the authors tried to explain away (
                    - link "minimize and deny" [ref=e2168] [cursor=pointer]:
                      - /url: /content/propaganda#minimize
                    - text: ") the failures: \"Of the nine who have had trouble, five have been with the group and had trouble previous to hospitalization.\""
                    - generic [ref=e2169]: Excuse me, but by definition, ALL alcoholics have had trouble with alcohol "previous to hospitalization".
                  - paragraph [ref=e2170]
                  - table [ref=e2173]:
                    - rowgroup [ref=e2174]:
                      - row [ref=e2175]:
                        - cell [ref=e2176]:
                          - generic [ref=e2177]:
                            - text: "From:"
                            - text: AA
                            - text: Philadelphia Group
                            - text: Post Office Box 332
                            - text: William Penn Annex
                            - paragraph [ref=e2178]:
                              - text: "To:"
                              - text: Alcoholic Foundation
                              - text: 30 Vesey Street
                              - text: New York, N. Y.
                            - paragraph [ref=e2179]: December 14, 1940
                            - paragraph [ref=e2180]: "Gentlemen:"
                            - paragraph [ref=e2181]: We believe that the time has arrived when we can give you a preliminary statement of the results of the work of Alcoholics Anonymous in Philadelphia since its inception in this city on February 20, 1940. This in effect is a ten months' report but for all practical purposes it can be considered only nine months because about a month was occupied in working out methods of prosecuting the activities.
                            - paragraph [ref=e2182]: According to the records of the Group, which have been kept with reasonable accuracy, ninety-nine men and women have during this period attended at least two meetings of the A. A. Group. In other words, they have had a fair opportunity to familiarize themselves with the A. A. program of recovery as given at the Thursday night meetings held at Saint Luke's and Children's Hospital.
                            - paragraph [ref=e2183]: Of the ninety-nine, seventy have remained dry without any slip at all; thirteen others are recovering from one or more slips, and sixteen have slipped without recovery up to the present time. It is not impossible that some of these sixteen may yet return to the Group.
                            - paragraph [ref=e2184]: Of the seventy, who have been dry without slips, thirty-nine have been dry from one to three months; seventeen from three to six months; twenty-five from six months to a year, and five from one to three years.
                            - paragraph [ref=e2185]: Obviously these five were not dried up through the activities of the Philadelphia A. A. Group but have recovered from alcoholism in other localities and through other means.
                            - paragraph [ref=e2186]: You can see that the Philadelphia A. A. Group has a core of thirty men who, we have every reason to believe, will never drink again. Seventeen more have gotten by the three months' critical period. It has been our observation that the first three months are the most difficult and that the man who gets by that period has every reason to believe that he is on the road to complete recovery.
                            - paragraph [ref=e2187]: We are even more sanguine of results which shall be achieved since we succeeded in opening our clubhouse about one month ago. It is being used extensively, especially by the unmarried men and is proving helpful not only as a social center but as a base for the spreading of the A. A. message.
                            - paragraph [ref=e2188]: We can testify as physicians to the increasing interest in A. A. work among members of the medical fraternity and are grateful for the opportunity that the A. A. has given us of assisting in the recovery of the unfortunate victims of alcoholism.
                          - paragraph [ref=e2189]:
                            - generic [ref=e2190]:
                              - text: (Signed) A. W. Hammer M. D. - Surgeon
                              - text: (Signed) C. Dudley Saul, Chief Resident Saint Luke's Hospital
                  - paragraph [ref=e2191]: Geez Louise. Somebody attends two lousy A.A. meetings, and A.A. is taking the credit for their sobriety? What a hoax.
                  - paragraph [ref=e2192]: "If we take a closer look at the numbers, we get, of the 99 members:"
                  - list [ref=e2193]:
                    - listitem [ref=e2194]: 16 total failures
                    - listitem [ref=e2195]: 13 slipping
                    - listitem [ref=e2196]: 39 dry 1 to 3 months
                    - listitem [ref=e2197]: 17 dry 3 to 6 months
                    - listitem [ref=e2198]: 25 dry 6 to 12 months
                    - listitem [ref=e2199]: 5 dry 1 to 3 years
                  - paragraph [ref=e2200]: Anything less than a year of sobriety is merely a short pause in someone's drinking career. There were only 5 men out of the 99 who had a year or more of sobriety. That means that the Philadelphia group actually had a five percent success rate.
                  - paragraph [ref=e2201]:
                    - text: Not coincidentally, five percent is also
                    - link "the usual rate of spontaneous remission" [ref=e2202] [cursor=pointer]:
                      - /url: /content/effectiveness#remission_rate
                    - text: in untreated alcoholics. So the real success rate of the Philadelphia A.A. group, above and beyond normal spontaneous remission, was zero.
                  - paragraph [ref=e2203]:
                    - text: "But then the real kicker is this line talking about the 5 people with more than a year of sobriety:"
                    - generic [ref=e2204]: "\"Obviously these five were not dried up through the activities of the Philadelphia A. A. Group but have recovered from alcoholism in other localities and through other means.\""
                  - paragraph [ref=e2205]:
                    - text: Hammer and Saul admitted that the five success stories were not actually sobered up by Alcoholics Anonymous — the successes got themselves sober long before they ever came to A.A. — but Hammer and Saul included them in the statistics anyway, as part of the 70 who were staying sober. I can only conclude that they did that to improve the appearance of the so-called "A.A. results" — so that the authors could be
                    - generic [ref=e2206]: "\"even more sanguine of results\""
                    - text: .
                  - paragraph [ref=e2207]:
                    - text: "Oh, by the way, these two numbers-fudging doctors appear to have actually been A.A. members — they authored those letters as the Philadelphia A.A. group, and included this line:"
                    - generic [ref=e2208]: "\"we succeeded in opening our clubhouse about one month ago...\""
                    - text: OUR clubhouse?
                  - paragraph [ref=e2209]: Now in fairness to those authors and the Philadelphia group, we must consider the fact that the group was new, and had not been together for enough years to have accumulated a bunch of old-timers with many years of sobriety. So those reported results were at best premature... So let's see what happened later...
                  - paragraph [ref=e2210]: The next letter is undated, but must have been written at least a year later, because the membership of the Philadelphia group had increased to over 200.
                  - paragraph
                  - table [ref=e2213]:
                    - rowgroup [ref=e2214]:
                      - row [ref=e2215]:
                        - cell [ref=e2216]:
                          - generic [ref=e2217]:
                            - generic [ref=e2218]: Statistical Record of Philadelphia Alcoholics Anonymous Group
                            - paragraph [ref=e2219]: The Philadelphia A. A. Group was formed February 27, 1940, with seven men as a nucleus. Six of these are definitely recovered cases.
                            - paragraph [ref=e2220]: We consider a man or woman an active member of A. A. when they have been dry in the group two months and have attended at least six general meetings.
                            - paragraph [ref=e2221]: We now have an ACTIVE MEMBERSHIP of one hundred and thirteen alcoholics, eighty-three of whom have not had a drink since their first A. A. meeting. Five of these have been dry from two to four years, twenty-seven dry from one to two years, forty-one dry from six to twelve months and twenty-six dry three to six months.
                            - paragraph [ref=e2222]: Twenty-three of these active members came directly from the Philadelphia General Hospital, thirteen from other hospitals and institutions.
                            - paragraph [ref=e2223]: There have been only twenty-three active members who do not appear to be recovering. These are not included in the above figures. Neither are the fifty other men and women who are now in the process of becoming members.
                            - paragraph [ref=e2224]: This gives us a total general membership of Two Hundred men and women.
                            - paragraph [ref=e2225]: To the best of our knowledge, the foregoing is correct.
                          - paragraph [ref=e2226]:
                            - generic [ref=e2227]:
                              - text: (Signed) Dr. A. Weise Hammer
                              - text: (Signed) Dr. C. Dudley Saul
                              - text: Medical directors
                  - paragraph [ref=e2228]: The authors were cherry-picking. By using the qualifier that they considered someone a member of A.A. when he has been dry in the group for two months, they quickly discounted most of the A.A. failures and dropouts. None of the chronic relapsers or dropouts were counted as members. Only the more successful people were counted. That, of course, created the illusion that the A.A. program was much more successful than it really was.
                  - paragraph
                  - table [ref=e2231]:
                    - rowgroup [ref=e2232]:
                      - 'row "It also creates invalid circular logic: Someone will be counted as an A.A. member only if he quits drinking and stays sober. A.A. obviously works great, because so many of its members are sober." [ref=e2233]':
                        - 'cell "It also creates invalid circular logic: Someone will be counted as an A.A. member only if he quits drinking and stays sober. A.A. obviously works great, because so many of its members are sober." [ref=e2234]':
                          - generic [ref=e2235]:
                            - text: "It also creates invalid circular logic:"
                            - list [ref=e2236]:
                              - listitem [ref=e2237]: Someone will be counted as an A.A. member only if he quits drinking and stays sober.
                              - listitem [ref=e2238]: A.A. obviously works great, because so many of its members are sober.
                  - paragraph [ref=e2239]: Then the authors raised the bar a little — six meetings were required to qualify as a member. It was still pretty presumptuous to imagine that a mere six meetings could make someone get and stay sober — that A.A. deserved the credit for someone's sobriety just because of six meetings.
                  - paragraph [ref=e2240]:
                    - text: Then the authors admitted that they had 23 other active members who were not staying sober, but that
                    - generic [ref=e2241]: the authors did not include them in the provided numbers
                    - text: . They were cherry-picking again.
                  - paragraph [ref=e2242]: "And notice the quibbling over \"active members\" versus \"general members\":"
                  - list [ref=e2243]:
                    - listitem [ref=e2244]: "\"We now have an ACTIVE MEMBERSHIP of one hundred and thirteen alcoholics\"..."
                    - listitem [ref=e2245]: "\"This gives us a total general membership of Two Hundred men and women.\""
                  - text: But they only wanted to talk about the 113 "active" members while computing the success rate of Alcoholics Anonymous. That's cherry-picking, again.
                  - paragraph
                  - table [ref=e2248]:
                    - rowgroup [ref=e2249]:
                      - 'row "And it''s also mixing apples and oranges: Is the goal to produce active A.A. members who will \"Keep Coming Back\" to more A.A. meetings, or is the goal to get people to quit drinking themselves to death? If it''s the later, then you have to count all of the alcoholics in computing the success rate." [ref=e2250]':
                        - 'cell "And it''s also mixing apples and oranges: Is the goal to produce active A.A. members who will \"Keep Coming Back\" to more A.A. meetings, or is the goal to get people to quit drinking themselves to death? If it''s the later, then you have to count all of the alcoholics in computing the success rate." [ref=e2251]':
                          - generic [ref=e2252]:
                            - text: And it's also
                            - link "mixing apples and oranges" [ref=e2253] [cursor=pointer]:
                              - /url: /content/propaganda#apples_to_oranges
                            - text: ":"
                            - list [ref=e2254]:
                              - listitem [ref=e2255]: Is the goal to produce active A.A. members who will "Keep Coming Back" to more A.A. meetings,
                              - listitem [ref=e2256]: or is the goal to get people to quit drinking themselves to death?
                            - text: If it's the later, then you have to count all of the alcoholics in computing the success rate.
                  - paragraph [ref=e2257]: So what else did the authors say? They stated that out of the 113 members about whom they would speak, 83 had stayed continuously sober. So 30 did not. So we know that they had 53 members (23 + 30) who were not staying sober.
                  - paragraph [ref=e2258]: "Then they restated the numbers in another way, giving us a bunch of numbers which do not add up to either 83 or 113 or 200:"
                  - list [ref=e2259]:
                    - listitem [ref=e2260]: 5 sober 2 to 4 years
                    - listitem [ref=e2261]: 27 sober 1 to 2 years
                    - listitem [ref=e2262]: 41 sober 6 to 12 months
                    - listitem [ref=e2263]: 26 sober 3 to 6 months
                    - listitem [ref=e2264]: "---------------"
                    - listitem [ref=e2265]: 99 total
                  - paragraph [ref=e2266]:
                    - text: That leaves 14 out of the 113 "active" members who had less than 3 months sober. And we know that there were also 23 more failing members whom the authors just did not feel like including in the statistics. And we know that the authors simply did not count any of the unmentioned failing people who just never got two months of continuous sobriety in the group —
                    - generic [ref=e2267]: "\"They weren't members because they didn't have two months of sobriety in A.A.\""
                    - text: It seems that they really had 111 out of the 200 "general" members who weren't sober.
                  - paragraph [ref=e2268]:
                    - text: So what was the apparent success rate of the Philadelphia group, based on this report?
                    - text: They had 32 members (5 + 27) who had a year or more of sobriety, out of the 136 (113 + 23) total "fully qualified" members on whom they reported. That yielded a 24 percent success rate.
                  - paragraph [ref=e2269]: And the 5 oldtimers with multiple years must be the same 5 people who got sober on their own before A.A. came along. If we ignore them, we get 27 successes out of 131 members, which yields an apparent 21 percent success rate.
                  - paragraph [ref=e2270]: Or, if we remember that they actually had 200 "general members", then they had an apparent success rate of only 13.8%. (27 divided by 195. That is, the 27 A.A. successes divided by the 200 general members minus the 5 oldtimers who quit on their own before A.A. was started.)
                  - paragraph [ref=e2271]: But we know that even that lower success rate is grossly inflated — that the real A.A. success rate with alcoholics was a lot lower than that because of all of the dropouts and chronic relapsers who were not counted as "members".
                  - paragraph [ref=e2272]:
                    - text: If they only had a 75 percent dropout rate after one year (which is much, much better than today's 95 percent dropout rate), then their real success rate would have been a mere five percent. (Or worse, if we take the 13.8% number and divide it by 4. That yields a mere 3.46% success rate.) Again, five percent per year is just the normal rate of spontaneous remission in untreated alcoholics. (And five percent is
                    - link "what Dr. Bob Smith and Bill Wilson calculated their success rate to be" [ref=e2273] [cursor=pointer]:
                      - /url: "#BB_relapses"
                    - text: in Akron, Ohio.) So the real success rate of Alcoholics Anonymous in Philadelphia, above and beyond the normal rate of spontaneous remission, appears to have been zero, or even less than zero.
                  - paragraph [ref=e2274]:
                    - generic [ref=e2275]:
                      - text: Also note how the authors, Hammer and Saul, began that letter by saying,
                      - generic [ref=e2276]: "\"The Philadelphia A. A. Group was formed February 27, 1940, with seven men as a nucleus. Six of these are definitely recovered cases.\""
                      - text: But we know that five of those six "definitely recovered cases" were the oldtimers with multiple years of sobriety who got sober on their own before A.A. was started in Philadelphia.
                  - paragraph [ref=e2277]: So it looks like the A.A. promoters were taking credit for someone else's sobriety, yet again.
                  - paragraph
                  - separator [ref=e2279]
                  - paragraph [ref=e2280]:
                    - text: On the basis of the fraudulent statistics in the last two letters,
                    - link "one A.A. enthusiast's web site" [ref=e2281] [cursor=pointer]:
                      - /url: http://web.archive.org/web/20161020131749/http://www.barefootsworld.net/aaphila4041.html
                    - text: "triumphantly declares:"
                  - paragraph
                  - blockquote [ref=e2282]:
                    - generic [ref=e2283]: The above letters bear out the statistics of early A.A., that 3 out of 4 alcoholics that attend meetings and apply the Steps of the A.A. Program and the Ideals contained in the BigBook to their lives, recover from the scourge of alcoholism and a seemingly hopeless state of mind and body.
                    - link "http://www.barefootsworld.net/aaphila4041.html" [ref=e2285] [cursor=pointer]:
                      - /url: http://web.archive.org/web/20161020131749/http://www.barefootsworld.net/aaphila4041.html
                  - paragraph [ref=e2286]: What a load of bull.
                  - paragraph [ref=e2287]
                  - generic [ref=e2288]:
                    - img
                  - paragraph [ref=e2289]
                  - table [ref=e2292]:
                    - rowgroup [ref=e2293]:
                      - row [ref=e2294]:
                        - cell [ref=e2295]:
                          - generic [ref=e2296]:
                            - paragraph [ref=e2297]: An A.A. enthusiast exclaimed, "AA keeps millions sober and saved my life!!!"
                            - paragraph [ref=e2298]:
                              - link "Michael" [ref=e2299] [cursor=pointer]:
                                - /url: http://web.archive.org/web/20161020131749/http://www.geocities.com/sanegallery/
                              - text: "(no_never_met_him@hotmail.com) came up with this excellent answer:"
                            - paragraph [ref=e2300]: I can accept that having some people around you in AA who also had former drinking problems may have been helpful in some way, but YOU saved your life. Now let's review some numbers pertaining to those sober millions.
                            - paragraph [ref=e2301]: Alcoholics Anonymous surveys show that about 5% of newcomers stay for their first year. This figure includes those newcomers who remain sober and those who do not. This figure indicates an approximate 95% attrition rate among newcomers in a one year period.
                            - paragraph
                            - blockquote [ref=e2302]:
                              - generic [ref=e2304]:
                                - text: "\"The membership figures listed below are based on reports to the General Service Office as of January 1, 2001, plus an average allowance for groups that have not reported their membership\":"
                                - paragraph
                                - table [ref=e2307]:
                                  - rowgroup [ref=e2308]:
                                    - row "AA Members in U.S. 1,162,112" [ref=e2309]:
                                      - cell "AA Members in U.S." [ref=e2310]
                                      - cell "1,162,112" [ref=e2311]
                                    - row "Total worldwide AA membership 2,160,013" [ref=e2312]:
                                      - cell "Total worldwide AA membership" [ref=e2313]
                                      - cell "2,160,013" [ref=e2314]
                            - generic [ref=e2315]:
                              - paragraph [ref=e2316]: AA was founded in 1935. After 66 years of Alcoholics Anonymous, the most accurate current worldwide membership figure we have is approximately 2.2 million. AA does not provide data on their web page to show how many of these 2.2 million are currently sober or have enjoyed permanent abstinence.
                              - paragraph [ref=e2317]: But a 1998 AA membership survey conducted by GSO shows that 47% were sober more than 5 years, 26% were sober between 1 and 5 years, and 27% were sober less than 1 year. So the most accurate figures we have show that 53% of AA membership have been sober less than 5 years. So just how many people is AA keeping sober? Evidently during the period from 1993 to 1998 AA was not keeping many people sober for long. It is safe to assume that the figures from 1998 haven't changed much because AA hasn't changed much. And this turns your "millions" into something closer to 1 million, maybe.
                              - paragraph [ref=e2318]: "Let's look at something else from the 1998 survey:"
                              - paragraph
                              - table [ref=e2321]:
                                - rowgroup [ref=e2322]:
                                  - row "Ages of Members" [ref=e2323]:
                                    - columnheader "Ages of Members" [ref=e2324]
                                  - row "Under age 21 2%" [ref=e2325]:
                                    - cell "Under age 21" [ref=e2326]
                                    - cell "2%" [ref=e2327]
                                  - row "Age 21 through 30 9%" [ref=e2328]:
                                    - cell "Age 21 through 30" [ref=e2329]
                                    - cell "9%" [ref=e2330]
                                  - row "Age 31 through 40 28%" [ref=e2331]:
                                    - cell "Age 31 through 40" [ref=e2332]
                                    - cell "28%" [ref=e2333]
                                  - row "Age 41 through 50 30%" [ref=e2334]:
                                    - cell "Age 41 through 50" [ref=e2335]
                                    - cell "30%" [ref=e2336]
                                  - row "Age 51 through 60 18%" [ref=e2337]:
                                    - cell "Age 51 through 60" [ref=e2338]
                                    - cell "18%" [ref=e2339]
                                  - row "Age 61 through 70 9%" [ref=e2340]:
                                    - cell "Age 61 through 70" [ref=e2341]
                                    - cell "9%" [ref=e2342]
                                  - row "Over 70 4%" [ref=e2343]:
                                    - cell "Over 70" [ref=e2344]
                                    - cell "4%" [ref=e2345]
                              - paragraph [ref=e2346]: The average age of an A.A. member is 45 years. We see a huge drop (12%) in membership from the rage 41-50 to 51-60. And fewer and fewer members in the later ranges. This suggests a large attrition factor for people who have been around AA for a while and left. You can observe this at meetings. Just look around and ask where all the old timers are. Where are all the people with 10, 20, 30 years or more sobriety? There should be a hell of a lot more than you are seeing if AA is keeping them sober.
                              - paragraph [ref=e2347]: So, Dave. Let's be careful in our claims about just how many people AA keeps sober. Of those 2.2 million who claim membership, we just don't know how many have actually stayed sober, the numbers suggest less than half. And how many struggle, how many will drink again, how many will leave AA? There is much in the statistics to suggest that AA is not exactly what you want it to be. Though I am not a statistician and there others on this list who I would rather trust to crunch numbers, your statement about AA keeping millions sober is demonstrably untrue and very misleading.
                              - paragraph [ref=e2348]: The larger problem with your view of AA's success is that it is shared by so many people. But the numbers don't lie. And when the courts and hospitals and religions and doctors and you and me have this notion that AA is the best game in town, we create a sadly misinformed culture where many people who need help and cannot benefit from AA are sent to AA. And when these people don't fare well, they are forced to take the blame upon themselves.
                            - paragraph [ref=e2349]: — Michael
                          - paragraph
                  - paragraph [ref=e2350]: Once again, we see that the A.A. failure rate is at least 95%, because 95% of all newcomers are gone at the end of the first year. Those who remain do not all stay sober, so the real success rate has to be even less. We definitely have an upper ceiling of 5% for the maximum possible success rate. But 5% is the normal rate of spontaneous remission in alcoholics. Five percent of them will quit if we send them all to A.A., and five percent of them will quit if we do nothing. That makes the real effective A.A. cure rate zero. It just does not improve on the rate of spontaneous remission. Alcoholics Anonymous does not increase the rate of sobriety in alcoholics.
                  - paragraph [ref=e2351]: "An interesting note on that survey: Someone asked, \"By what formula did they select the respondents? How did the GSO get their data? For all we know, they might have just grabbed the first couple of hundred people who were handy.\""
                  - paragraph [ref=e2352]: That is a great question. I must confess that the results were so bad that at first glance I accepted the numbers at face value. It didn't occur to me that the survey may have been biased, and that the truth might be even worse than the GSO was reporting.
                  - paragraph [ref=e2353]:
                    - generic [ref=e2354]:
                      - text: "(F.Y.I.: GSO = General Service Organization, the headquarters of the non-profit service half of the A.A. organization."
                      - text: AAWS = Alcoholics Anonymous World Services, Inc., the headquarters of the money-making, book publishing half.)
                  - paragraph [ref=e2355]:
                    - text: But that is actually highly likely. The survey is going to be contaminated with
                    - link "Observational Selection" [ref=e2357] [cursor=pointer]:
                      - /url: /content/propaganda#observational
                    - text: ", a.k.a. \"cherry-picking\". Who will fill out a questionnaire? The people who are present at a meeting — the people who keep coming back. Who won't answer the questions? Someone who isn't there. (Like the people who are attending the meeting at the local bar.)"
                  - paragraph
                  - table [ref=e2360]:
                    - rowgroup [ref=e2361]:
                      - 'row "The Alcoholism Report said: That is not a random sampling of members. It is fake random. The original group of answered questionaires was biased — answered only by those members who Keep Coming Back — so any subgroup of questionaires randomly selected from that group will also be biased. Randomly selecting a set of items out of a biased sample just yields another (smaller) biased sample." [ref=e2362]':
                        - 'cell "The Alcoholism Report said: That is not a random sampling of members. It is fake random. The original group of answered questionaires was biased — answered only by those members who Keep Coming Back — so any subgroup of questionaires randomly selected from that group will also be biased. Randomly selecting a set of items out of a biased sample just yields another (smaller) biased sample." [ref=e2363]':
                          - generic [ref=e2364]:
                            - text: "The Alcoholism Report said:"
                            - paragraph
                            - blockquote [ref=e2365]:
                              - generic [ref=e2366]: The analysis, distributed by the AA General Service Office (GSO), explained that the 1989 survey was done through a random sampling process that produced a sample of 9,394 completed questionnaires from AA members of the population of groups registered at GSO.
                              - generic [ref=e2367]: The Alcoholism Report, Feb 1991 v19 n7 p8(2).
                          - paragraph [ref=e2368]:
                            - generic [ref=e2369]: That is not a random sampling of members. It is fake random. The original group of answered questionaires was biased — answered only by those members who Keep Coming Back — so any subgroup of questionaires randomly selected from that group will also be biased. Randomly selecting a set of items out of a biased sample just yields another (smaller) biased sample.
                  - paragraph [ref=e2370]: So those numbers that show that 47% of the members have more than five years of sobriety, while 53% have less, are highly suspect. The truth may well be that 75% or 85% or 95% of the members have less than five years, and that a lot of the short-timers are just missing meetings (relapsing, out getting drunk) and not filling out questionaires for the surveys.
                  - paragraph [ref=e2371]: Then there is the issue of honesty in reporting. Someone who just lost five or more years of sober Time by going on a binge may not be at all eager to report it to the gossips in his home group. (I keep hearing stories of A.A. old-timers who aren't really "old-timers" at all — they secretly drink — but they won't admit it because they don't want to lose all of their old-timer status in A.A..)
                  - paragraph [ref=e2372]:
                    - text: And one more complication in that GSO survey of members is the question of just who is a member. We were not told by exactly what criteria people were declared to qualify as "members who should fill out a survey". As mentioned earlier, Charles Bufe pointed out that, in a 1965 article in the Quarterly Journal of Studies on Alcohol, Bill C. considered anyone who had attended 10 or more meetings to be a member.
                    - superscript [ref=e2374]:
                      - link "5" [ref=e2375] [cursor=pointer]:
                        - /url: "#ftnt05"
                    - text: But, as Bufe pointed out, that limits the "membership" to those people who show a high degree of motivation to "keep coming back". It conveniently eliminates all of those people who came to a few meetings looking for help, but who were so put off by the fundamentalist religiosity, guilt induction, or superstitious faith-healing atmosphere that they didn't come back. If all of those "revolving door" people were included in the surveys, the success rate of A.A. would be revealed as truly minuscule.
                  - paragraph [ref=e2376]: "The \"millions of members\" claim is probably exaggerated for another reason, too: Since everyone is anonymous, and there is no official membership list, there is no way to eliminate duplicates. If someone goes to two or three different meetings around town each week, which a lot of people do, then they will almost certainly get counted as two or three people when the group secretaries at the various meetings count their members. It is possible for someone who is doing 90 meetings in 90 days to get counted as seven different people, one for every day of the week, if that person is going to seven different meetings per week. And then consider that some obsessed people do two or three meetings per day... There are plenty of opportunities for duplication and overlap."
                  - paragraph [ref=e2377]: (Theoretically, A.A. members are supposed to have just one "home group", even if they regularly attend several different meetings, and they are only supposed to be counted in, and vote in, that one home group. But lots of people have two or three "home groups.")
                  - paragraph [ref=e2378]: And for that matter, just counting everyone at the meetings and calling them all members is a bit presumptuous. The A.A. rules say that someone is a member when he says he is a member, not when the group secretary counts him, but I have been counted as a member often. The group secretary obviously counts the membership, pointing at the people present at the meeting one by one, and silently mouthing the numbers, while someone else "shares" his story. It happens at lots of meetings. But, as you might have guessed, I do not declare myself to be a member of Alcoholics Anonymous. But I'm counted as one in their inflated membership statistics.
                  - paragraph [ref=e2379]: And what about all of the people who are just visiting, or just checking it out, or just doing the minimum number of meetings that the judge sentenced them to? What about the people who only show up once a year to collect another coin? It's a bit much to claim that A.A. is keeping all of them sober.
                  - paragraph [ref=e2380]: When you consider all of those complicating factors, it is apparent that the real number of unique members that A.A. is "keeping sober" must be just a fraction of the advertised number. It's very hard — basically impossible — to say what the real number is when A.A. is an anonymous organization with no actual membership list.
                  - paragraph [ref=e2381]
                  - generic [ref=e2382]:
                    - img
                  - paragraph [ref=e2383]: When A.A. members try to convince me that A.A. really works, they almost invariably point to a large A.A. meeting and say something like, "Just look at all of those sober A.A. members. We have thousands of years of sobriety in this room."
                  - paragraph [ref=e2384]: But what those people in that meeting room actually prove is merely that A.A. has managed to get a bunch of people to meet in a room. (We do not even know for sure how long they have been sober, or if they really are continuously sober.)
                  - paragraph
                  - list [ref=e2385]:
                    - listitem [ref=e2386]:
                      - text: There is no evidence that meeting in a room and telling stories made those people quit drinking.
                      - paragraph
                    - listitem [ref=e2387]:
                      - text: There is no evidence that doing the Twelve Steps caused people to quit drinking.
                      - paragraph
                    - listitem [ref=e2388]:
                      - text: And there isn't even any evidence that all of the sober people have actually done the 12 Steps. Lots of sober A.A. members have never bothered with the 12 Steps. After all, the Big Book says that the 12 Steps are only "suggested".
                      - paragraph
                    - listitem [ref=e2389]:
                      - text: There is no evidence that those people who successfully quit drinking didn't really quit for some other reason that has nothing to do with Alcoholics Anonymous, like that
                      - list [ref=e2390]:
                        - listitem [ref=e2391]: They were sick and tired of being sick and tired, and finally really decided that they didn't want to die that way.
                        - listitem [ref=e2392]: They decided that they wanted to be healthy and happy.
                        - listitem [ref=e2393]: They finally just decided that they really couldn't and wouldn't drink any more.
                        - listitem [ref=e2394]: They wanted to save their marriage.
                        - listitem [ref=e2395]: They wanted to keep or regain custody of their children.
                        - listitem [ref=e2396]: They wanted to save their job and career.
                        - listitem [ref=e2397]: They wanted their self-respect back.
                        - listitem [ref=e2398]: They wanted to accomplish something in their lives besides suicide by bottle.
                        - listitem [ref=e2399]: They wanted to stop hurting their loves ones.
                        - listitem [ref=e2400]: They decided that alcoholism was too expensive, in too many ways.
                      - paragraph
                    - listitem [ref=e2401]: The A.A. boosters merely assume a cause-and-effect relationship between going to A.A. meetings and quitting drinking, when there isn't really any evidence to support such a belief.
                  - paragraph [ref=e2402]:
                    - text: It is false logic to say that a few sober people in a room prove that A.A. works. It is just
                    - link "Observational Selection" [ref=e2403] [cursor=pointer]:
                      - /url: /content/propaganda#observational
                    - text: ", i.e., \"Cherry Picking\". What the A.A. promoters never do is look at the A.A. failures. They never get together all of the A.A. failures and dropouts in another, much, much larger, room, and point at them and say, \"Look at all of those drunk people. They prove that A.A. does not work very well at all.\""
                  - paragraph [ref=e2404]:
                    - text: No, the A.A. true believers just ignore the failures and continue to incant, at the start of every A.A. meeting,
                    - text: "\"RARELY have we seen a person fail, who has thoroughly followed our path...\""
                  - paragraph [ref=e2405]:
                    - text: "(And if you point out the failures, the true believers just weasle out of it with that qualifier, and blame the victims:"
                    - generic [ref=e2406]: "\"Well, they don't count. They didn't thoroughly follow our path... They drank alcohol.\""
                    - text: )
                  - paragraph [ref=e2407]
                  - generic [ref=e2408]:
                    - img
                  - paragraph [ref=e2409]: One person asked, "When AA/NA or a particular rehab center claims an X% 'success rate' what exactly does that mean? I have seen some places boast 85-90%."
                  - paragraph [ref=e2410]: "There are at least a couple of answers:"
                  - list [ref=e2411]:
                    - listitem [ref=e2412]:
                      - text: "Basically, what they do is: Just ignore everybody who fails or drops out or is kicked out of their program early."
                      - generic [ref=e2413]: "\"They don't count because they didn't complete the program,\""
                      - text: the counselors say. That conveniently eliminates all of the failures, relapsers, and dropouts from the statistics. That produces numbers that are as biased as can be, of course. It isn't the successful abstainers who drop out of the programs; it's the people for whom the program was no help and are relapsing. The treatment centers are just engaging in some more Enron-style accounting. They create the illusion of great success by hiding all of their failures "off of the books".
                      - paragraph [ref=e2414]: So if 100 people start the program, and at the end there are 10 left who actually graduate, and 8 of them are still clean and sober a month later, then the treatment center claims an 80% success rate.
                      - paragraph [ref=e2415]: The treatment centers also almost never do longer-term follow-ups, like checking to see how many of their clients are still sober and drug-free a year after graduation. If the treatment centers ever did that, they would discover that their real success rate was nothing more than the usual rate of spontaneous remission.
                      - paragraph [ref=e2416]: It seems to me that all of those treatment centers are guilty of criminal fraud and false advertising. Why doesn't someone sue and sic the Fair Trade Commission on them?
                      - paragraph
                    - listitem [ref=e2417]:
                      - text: "Cora Finch (corafinch@yahoo.com) gave this answer:"
                      - paragraph
                      - blockquote [ref=e2418]:
                        - text: It comes down to two things, baseline and outcome. Both can be defined in a variety of ways, or left undefined.
                        - paragraph [ref=e2419]: The "best" numbers come from studies with the highest baseline. Take highly-paid professionals who have had a DIU and get a lot of hangovers. In 1940 they would have been considered ordinary people. But now we can count them as alcoholics and put them in a diversion program with the threat of losing their jobs and — Wow, what a success rate!
                  - paragraph [ref=e2420]: "We find the same deceptive claims of success in many reports. For instance, the Addiction Letter, May 1994, gives us an article by Scott McMillin, \"THE UNFORTUNATE HISTORY OF ADDICTIONS TREATMENT ALSO MAY BE THE UNFORTUNATE FUTURE OF ADDICTIONS TREATMENT\". In spite of the title, the author brags about having established an A.A.-based treatment program in the psychiatric unit of a hospital:"
                  - paragraph
                  - blockquote [ref=e2421]:
                    - generic [ref=e2422]:
                      - text: When I started as a counselor, almost 25 years ago, every psych unit had its ration of alcoholics and drug addicts. They seemed a little crazy on admission, but within a few days it was clear they were different from the rest of our patients. For one thing, they got better fast. A few days after admission, we were using them to round up the other patients for art therapy.
                      - paragraph [ref=e2423]: But the bloom wore off quickly. The issue was recidivism. Alcoholics and addicts were so clearly not mentally ill that the staff couldn't understand why they kept going back to alcohol and drugs.
                      - paragraph [ref=e2424]: For alcoholics, the psychiatric unit became a sort of failure machine. Once, in the mid-1970s, I did an informal phone survey of forty alcoholics and addicts treated during the preceding year at the psych unit where I worked. These were mostly employed persons. Of the thirty I managed to locate, twenty-five had returned to alcohol or drugs. Two died. Another was committed to the state asylum. Two found their way to Alcoholics Anonymous and seemed to be doing okay. Which left us with a recovery rate of 7 percent.
                      - paragraph [ref=e2425]: "I brought this to the attention of several of our psychiatrists. They reacted in a way I've seen a great deal of, over the years: first with excuses, then with medication. \"We're just not getting a good class of patients,\" complained one, as if our hospital wasn't located in one of the nation's richest counties. Then, since they assumed alcoholism was a symptom of some underlying mental illness (anxiety, depression, etc.), they passed out a lot of tranquilizers and antidepressants. An impressive effort, but a year later, repeating the phone survey on twenty-odd additional patients, I found our success rate had reached... 4 percent."
                    - paragraph [ref=e2426]:
                      - generic [ref=e2427]: Eventually, the physicians (both medical and psychiatric) complained so much that the hospital decided to appease them by giving those irritating addicts a unit of their own. They hired a recovering alcoholic as head nurse, and she in turn hired a bunch of other recovering people as counselors. Of course, none had ever worked in a treatment center. But they were smart enough to concentrate on two things. First, wherever they could, they harassed the psychiatrists into taking the patients off tranquilizers. Second, they made sure everybody went to AA, and if possible, got a sponsor. By modern standards, this was a bad treatment program. Yet one year later, when I did my survey, 45 percent of our graduates were sober.
                      - generic [ref=e2428]:
                        - text: "\"THE UNFORTUNATE HISTORY OF ADDICTIONS TREATMENT ALSO MAY BE THE UNFORTUNATE FUTURE OF ADDICTIONS TREATMENT\", Scott McMillin, Addiction Letter, May 1994, Vol. 10, Issue 5, p3."
                        - text: Full text available on EBSCO
                        - link "here" [ref=e2429] [cursor=pointer]:
                          - /url: http://web.archive.org/web/20161020131749/http://search.epnet.com/direct.asp?an=6647900&db=f5h&loginpage=cpidlogin.asp?custid=s9187380
                        - text: .
                  - paragraph [ref=e2430]:
                    - text: This counselor who implies that he knows so much more than the doctors (25 years of experience) is playing numbers games with us, and he is
                    - link "lying with qualifiers" [ref=e2431] [cursor=pointer]:
                      - /url: /content/propaganda#qualifiers
                    - text: . The first two numbers, the 7% and 4% success rates, described the success rate that the hospital got with all of the alcoholic patients — the good, the bad, and the ugly — but then the author only tells us what percentage
                    - generic [ref=e2432]: of those who graduated from his program
                    - text: were still sober a year later — 45%. (It's just like Bill Wilson's claims of great success with
                    - link "those who really tried" [ref=e2433] [cursor=pointer]:
                      - /url: "#really_tried"
                    - text: .) This author does not tell us what percentage of his clients actually graduated from his program. Why not? Would it reveal a completely ineffective treatment program? How many of his patients didn't "graduate"?
                  - paragraph
                  - list [ref=e2434]:
                    - generic [ref=e2435]:
                      - listitem [ref=e2436]: Oh, and precisely what were the requirements for "graduation"?
                      - listitem [ref=e2437]: How long did someone have to be in the author's program in order to "graduate"?
                      - listitem [ref=e2438]:
                        - text: Was complete and uninterrupted sobriety a requirement for "graduation"? That would really be
                        - link "cherry-picking" [ref=e2439] [cursor=pointer]:
                          - /url: /content/propaganda#observational
                        - text: just the success stories.
                      - listitem [ref=e2440]: Certainly, a fair amount of sobriety must have been required for "graduation". Nevertheless, more than half of the author's very best pupils relapsed anyway.
                  - paragraph [ref=e2441]: If the author's A.A-based treatment program got the same nominal 10% graduation rate that most such A.A.-based treatment centers get, and a year later 45% of the program graduates were still sober, then that would yield an over-all long-term success rate of only 4.5%. But the normal rate of spontaneous remission in untreated alcoholics is 5% per year. It would appear that the author's program didn't improve on nature at all.
                  - paragraph [ref=e2442]: Also notice how the author disavows all responsiblity for the hospital's declining success rate. He nagged the doctors until they put the alcoholic patients on tranquilizers, but it was all the stupid doctors' fault, the author implies. The hospital originally had a 7% success rate with alcoholics, but due to this Stepper's determined meddling, the success rate dropped to 4%.
                  - paragraph [ref=e2443]:
                    - text: Then he and his fellow Steppers "harrassed" the psychiatrists to get the patients off of medications.
                    - generic [ref=e2444]:
                      - text: Notice the typical
                      - link "Steppers' prejudice against medications" [ref=e2445] [cursor=pointer]:
                        - /url: /content/cult-answers#no_medications
                      - text: ", as well as the arrogant attitude that"
                      - link "Steppers know more than real doctors and psychiatrists" [ref=e2446] [cursor=pointer]:
                        - /url: orange-cult_a1.html#baffle
                      - text: .
                  - paragraph [ref=e2447]: Then the Steppers set up an A.A. program and forced all of the alcoholic patients into it. And what was the result? The hospital originally had a 7% success rate, but due to the Steppers' determined work, the final success rate was what? 4.5%?
                  - paragraph [ref=e2448]: What's wrong with this picture?
                  - paragraph [ref=e2449]: Besides the obvious facts that...
                  - list [ref=e2450]:
                    - generic [ref=e2451]:
                      - listitem [ref=e2452]: It is illegal to force hospital patients into a cult religion...
                      - listitem [ref=e2453]: It is illegal to foist quack medicine and cult religion on patients, and then charge their health insurance for "treatment"...
                      - listitem [ref=e2454]: This Stepper was practicing medicine without a license, arrogantly interfering with the work of real doctors... which is also illegal...
                      - listitem [ref=e2455]: The author just assumed that old alcoholics who are "recovering" (which is code language for being 12-Step group members), like the head nurse and the other counselors, were more qualified than anybody else when it comes to treating alcoholism. There is no evidence to support that assumption.
                      - listitem [ref=e2456]: This Stepper never told us what his program's graduation rate was, so he never revealed what his program's success rate was...
                      - listitem [ref=e2457]:
                        - text: The author just tried to foist on us the groundless assumption that A.A. worked great, and was effective in treating alcoholism — an assumption that has never been demonstrated in any
                        - link "fair, valid, clinical test or controlled experiment or medical study" [ref=e2458] [cursor=pointer]:
                          - /url: "#Brandsma"
                        - text: . Quite the contrary. The valid medical tests all show that A.A. is a complete failure.
                  - paragraph [ref=e2459]
                  - generic [ref=e2460]:
                    - img
                  - paragraph [ref=e2461]: "Reports of the inefficacy of treatment programs are everywhere (and so is the denial about the failure rate). This report showed up in a newsgroup on the Internet just recently:"
