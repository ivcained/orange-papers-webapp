                  - paragraph [ref=e3022]:
                    - text: PROFESSIONAL and ALCOHOLICS ANONYMOUS RELATIONS IN OREGON; An Exploratory Study Report, No. 1, 1965, Milton A. Maxwell, Ph.D.
                    - text: Mental Health Division, Oregon State Board of Control, Alcohol Studies and Rehabilitation Section
                    - text: "LC: HV5278.A78M3"
                    - text: A very small (20 page) report on Alcoholics Anonymous in Oregon in 1965, and its relations with alcoholism treatment professionals. He observed many of the failings of A.A. that are commonplace today, like resistance to taking medications even when needed, territorial jealousy, stubbornly clinging to outmoded and dogmatic ideas of alcoholism, and refusal to study treatment failures and revise the A.A. program. Dr. Maxwell hoped that those things would be changed and that A.A. would grow into a valuable ally for the professionals. Alas, none of that came to be.
                    - text: "(Note: Dr. Milton A. Maxwell eventually became a member of the Board of Trustees of Alcoholics Anonymous World Services, Inc..)"
