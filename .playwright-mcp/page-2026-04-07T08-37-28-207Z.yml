                    - rowgroup [ref=e180]:
                      - row "The National Institute on Alcohol Abuse and Alcoholism of the National Institutes of Health, performed the 2001-2002 National Epidemiologic Survey on Alcohol and Related Conditions. For it, they interviewed over 43,000 people. Using the criteria for alcohol dependence found in the DSM-IV, they found:" [ref=e181]:
                        - cell "The National Institute on Alcohol Abuse and Alcoholism of the National Institutes of Health, performed the 2001-2002 National Epidemiologic Survey on Alcohol and Related Conditions. For it, they interviewed over 43,000 people. Using the criteria for alcohol dependence found in the DSM-IV, they found:" [ref=e182]:
