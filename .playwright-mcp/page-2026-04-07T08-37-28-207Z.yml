                  - paragraph [ref=e1811]: And then other people, like Nell Wing, Bill Wilson's secretary, and Francis Hartigan, Lois Wilson's secretary, also reported that A.A. only had a 5% success rate. Read on.
                  - paragraph [ref=e1812]:
