                  - paragraph
                  - paragraph [ref=e1827]: "And Nell Wing, who was a secretary of Alcoholics Anonymous for 35 years, and Bill Wilson's personal secretary for many of those years, as well as A.A.'s first archivist, reported:"
                  - paragraph
                  - blockquote [ref=e1828]:
                    - generic [ref=e1829]: "\"There were alcoholics in the hospitals of whom A.A. could touch and help only about five percent. The doctors started giving them a dose of LSD, so that the resistance would be broken down. And they had about fifteen percent recoveries. This was all a scientific thing.\""
                    - generic [ref=e1830]: Alcoholics Anonymous Comes Of Age, William G. Wilson, (1957), page 370.
                  - paragraph [ref=e1831]:
                    - generic [ref=e1832]:
                      - text: It would appear that LSD was three times as effective as Alcoholics Anonymous for treating alcoholism. Unfortunately,
                      - link "that doesn't work either" [ref=e1833] [cursor=pointer]:
                        - /url: "#LSD_Toronto"
                      - text: ", in the long run."
                      - generic [ref=e1834]:
                        - text: (Also see ASAM founder
                        - link "Dr. Ruth Fox's use of LSD on her alcoholic patients" [ref=e1835] [cursor=pointer]:
                          - /url: "#LSD_therapy"
                        - text: ", to make them more compliant. ASAM == the American Society for Addiction Medicine, the A.A. front group founded by Dr. Ruth Fox to promote the 12-Step quack cure among doctors.)"
                  - paragraph [ref=e1836]: "Nan Robertson reported:"
                  - paragraph
                  - blockquote [ref=e1837]:
                    - generic [ref=e1838]: "[Bill Wilson] had only scattered luck with those he tried to sober up personally..."
                    - generic [ref=e1839]: Getting Better Inside Alcoholics Anonymous, Nan Robertson, pages 67-68.
                  - paragraph [ref=e1840]: "In a letter of encouragement to a founding member of the Chicago A.A. group, Earl T., Bill Wilson wrote:"
                  - paragraph
                  - blockquote [ref=e1841]:
                    - generic [ref=e1842]:
                      - text: Above all, don't get discouraged if the going is slow at first — that seems to be part of our education along this line. The summer I worked in Akron with Doc Smith, we tore about frantically and only bagged two who made the grade, Ernie G_____ [Galbraith] and Bill D_____ [Dotson].
                      - superscript [ref=e1844]:
                        - link "10" [ref=e1845] [cursor=pointer]:
                          - /url: "#ftnt10"
                      - text: Here in New York, it was the same story. I went along six months talking to a lot of them before any permanent results were obtained...
                    - generic [ref=e1846]: PASS IT ON, The story of Bill Wilson and how the A.A. message reached the world, Alcoholics Anonymous World Services, Inc., pages 225-226.
                  - paragraph
                  - blockquote [ref=e1847]:
                    - blockquote [ref=e1848]:
                      - generic [ref=e1850]:
                        - text: "[NOTE: Ernie Galbraith did not \"make the grade\"."
                        - link "He seduced Dr. Bob's daughter Susan and relapsed constantly" [ref=e1851] [cursor=pointer]:
                          - /url: /content/cult-slogans#Galbraith
                        - text: ", and then quit A.A., and drank on and off for the rest of his life."
                      - paragraph [ref=e1852]:
                        - generic [ref=e1854]:
                          - text: And in New York, Bill's first recruit was Henry Parkhurst, who helped to co-author the Big Book, but who relapsed and quit A.A. after
                          - link "Bill Wilson cheated Henry out of any share of the credit or royalties for the Big Book" [ref=e1855] [cursor=pointer]:
                            - /url: /content/aacoa#screw_Hank
                          - text: . Funny that Bill Wilson didn't mention any of that, while talking about how hard it was to "bag" some "permanent results".]
                  - paragraph [ref=e1856]: "At a memorial service for Dr. Bob, Bill Wilson actually bragged about the pathetically low success rate of the whole A.A. program. (Bill was making himself out to be a long-suffering hero, working tirelessly to promote Alcoholics Anonymous.) Bill described the early days of A.A. this way:"
                  - paragraph
                  - blockquote [ref=e1857]:
                    - generic [ref=e1858]: You have no conception these days of how much failure we had. You had to cull over hundreds of these drunks to get a handful to take the bait.
                    - generic [ref=e1859]:
                      - text: Bill Wilson, at the memorial service for Dr. Bob, Nov. 15, 1952; file available
                      - link "here" [ref=e1860] [cursor=pointer]:
                        - /url: orange-Dr_Bob_Memorial.html
                      - text: .
                  - paragraph [ref=e1861]: If you have to cull hundreds of drunks to get a few success stories, then that sounds like a one or two percent success rate. But wait! That was only the ones who were gullible enough to "take the bait", as Bill called it. That was just the recruiting success rate. How many of those new recruits stayed sober for a good long time, like several years? Even less, for sure. But that was far less than the usual five percent rate of spontaneous remission that we get with a bunch of alcoholics if we just do nothing with them. How could the numbers be so far off?
                  - paragraph [ref=e1862]: "Simple: even among those alcoholics who would soon quit drinking all on their own, there were plenty of people who were not receptive to the A.A. message, people who didn't want to become religiomaniacs. Quitting drinking and joining Bill Wilson's Alcoholics Anonymous version of Frank Buchman's cult religion were two very different things."
                  - paragraph [ref=e1863]: "That gives the lie to Bill's claims of great success in sobering up drunks that he wrote in the Big Book. Bill actually wrote this in the original manuscript of the A.A. \"Big Book\", Alcoholics Anonymous, before it was ever published:"
                  - paragraph
                  - blockquote [ref=e1864]:
                    - generic [ref=e1865]: We, of ALCOHOLICS ANONYMOUS, know one hundred men who were once just as hopeless as Bill. All have recovered. They have solved the drink problem.
                    - generic [ref=e1866]: The A.A. "Big Book" — Alcoholics Anonymous, William G. Wilson, first edition multilith page 8 and the 1st edition hardback on page 27.
                  - paragraph [ref=e1867]:
                    - text: But there were only about 40 sober members of Alcoholics Anonymous altogether — whom Bill Wilson grandly called the "
                    - link "First 100" [ref=e1868] [cursor=pointer]:
                      - /url: /content/funny-spirituality#org100
                    - text: "\" — including all of the members of the groups in New York, Akron, and Cleveland, when Bill started writing the Big Book in late 1938; and there were only 70 sober members of A.A. worldwide when Bill Wilson finished writing his chapters in early 1939. (And most of them eventually relapsed and returned to a life of drinking.) The \"hundred\" number is a shameless self-promoting barefaced lie."
                    - superscript [ref=e1870]:
                      - link "12" [ref=e1871] [cursor=pointer]:
                        - /url: "#ftnt12"
                  - paragraph
                  - table [ref=e1874]:
                    - rowgroup [ref=e1875]:
                      - row "An alcoholic who was a doctor [\"Doctor Bob\", Dr. Robert Holbrook Smith] came to see me. He didn't talk like a preacher at all. ... This doctor had imparted his knowledge to just a few other men at that time — not more than four or five — and now they number more than 70 persons* * Written in 1939 The A.A. \"Big Book\" — Alcoholics Anonymous, Joe Doppler, \"The European Drinker\", page 235 of the 3rd Edition." [ref=e1876]:
