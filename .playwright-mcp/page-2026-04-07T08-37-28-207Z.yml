                  - paragraph [ref=e1452]: "Reid K. Hester and William R. Miller (UNM, Albuquerque — Center for Alcohol, Substance Abuse and Addictions, Dept. of Psychology, University of New Mexico) rated the various alcoholism treatments in their book Handbook of Alcoholism Treatment Approaches: Effective Alternatives. A.A. 12-Step treatment went so far down the list that it almost disappeared. The best treatment was Brief Interventions, and it got a positive score of 390. A.A. got a negative score, MINUS 82, way below zero."
                  - paragraph [ref=e1453]:
                    - text: "See:"
                    - link "http://www.behaviortherapy.com/whatworks.htm" [ref=e1454] [cursor=pointer]:
                      - /url: http://web.archive.org/web/20161020131749/http://www.behaviortherapy.com/whatworks.htm
                  - paragraph [ref=e1455]: Brief intervention is number one, and A.A. is number 38.
                  - paragraph [ref=e1456]:
                    - text: "Also see:"
                    - link "http://www.addictioninfo.org/articles/53/1/What-works-A-summary-of-alcohol-treatment-research/Page1.html" [ref=e1457] [cursor=pointer]:
                      - /url: http://web.archive.org/web/20161020131749/http://www.addictioninfo.org/articles/53/1/What-works-A-summary-of-alcohol-treatment-research/Page1.html
                    - text: == The same statistics in a different format.
                  - paragraph [ref=e1458]: "\"Brief Intervention\" consists of a real doctor talking to the patient for usually less than one hour, questioning him about all of the ugly details of his drinking and telling him that he will die if he doesn't quit drinking. One time. That's it. No long counseling sessions, no great guidance, no on-going advice, no shoulder to cry on. And no 28-day treatment program. Just one \"Dutch Uncle\" session and it's over. And that's the most effective thing going."
                  - paragraph [ref=e1459]: That kind of puts the whole expensive "drug-and-alcohol treatment industry" to shame, doesn't it?
                  - paragraph [ref=e1460]: Brief Intervention is what I got. Less than an hour of the doctor asking pointed questions about all of the bad aspects of my drinking, and summing it all up by saying, "Quit drinking or die. Choose one." And it seems to have worked. I have almost 10 years sober now. Also almost 10 years off of cigarettes and any other drugs too.
                  - paragraph [ref=e1461]: But please understand that they just shove all of the work back on you. You have to choose to quit drinking and live, and then you have to do it. They never said that their "Brief Intervention treatment" would make you quit drinking.
                  - paragraph [ref=e1462]
                  - generic [ref=e1463]:
