                  - paragraph
                  - paragraph [ref=e512]: "The authors concluded:"
                  - paragraph
                  - blockquote [ref=e513]:
                    - generic [ref=e514]:
                      - text: The failure of both Alcoholics Anonymous and the alcoholism clinic to produce fewer recidivists than did no treatment at all ought to be of great concern. Some of the present writers were quite optimistic about the possibilities of enforced referral to treatment, but the early encouraging anecdotal reports are not borne out by present data.
                      - text: ...
                      - text: ... the present data offer no support for a general policy of forced referrals to brief treatment.
                      - text: ...
                      - generic [ref=e515]: Forced referrals to Alcoholics Anonymous and to an alcoholism clinic treatment program failed to reduce the likelihood of recidivism among a population of convicted chronic drunk offenders.
                    - generic [ref=e516]: "\"A Controlled Experiment on the Use of Court Probation for Drunk Arrests\", Keith S. Ditman, M.D., George G. Crawford, LL.B., Edward W. Forgy, Ph.D., Herbert Moskowitz, Ph.D., and Craig MacAndrew, Ph.D., American Journal of Psychiatry, 124:2, August 1967, Page 163."
                  - paragraph [ref=e517]:
                    - generic [ref=e518]:
                      - text: "For another description of the Ditman study, see the \"More Revealed\" web site:"
                      - link "http://www.morerevealed.com/library/resist/r_chap_2.htm" [ref=e519] [cursor=pointer]:
                        - /url: http://web.archive.org/web/20161020131749/http://www.morerevealed.com/library/resist/r_chap_2.htm
                  - paragraph [ref=e520]
                  - generic [ref=e521]:
                    - img
                  - paragraph [ref=e522]: "Similarly, Stanton Peele wrote:"
                  - blockquote [ref=e523]:
                    - text: A 1999 study of Texas' correctional substance abuse treatment programs found that those who participated in an in-prison [Twelve-Step] program had the same recidivism rates as non-participants. Although those who completed the program did better than untreated offenders, those who entered but did not complete the program did worse. Moreover, probationers enrolled in treatment in Texas had an overall higher recidivism rate than non-participants.
                    - paragraph [ref=e524]:
                      - generic [ref=e525]: Two explanations could account for such findings. One possibility is that, while treatment and non-treatment groups are equally likely to be recidivist, those who quit treatment are those who were more likely to relapse anyway. Thus, counting only those who remain in treatment and aftercare is cherry-picking those most likely to succeed in the first place. The other possibility, which would scandalize A.A. zealots like [Oklahoma Governor Frank] Keating, is that those who have a negative reaction to A.A. and its 12-step approach are actually driven to relapse by the experience.
                      - generic [ref=e526]: "\"Drunk with Power\", Stanton Peele, Reason, May 2001, Vol. 33, Issue 1, p34, 5pp."
                  - paragraph [ref=e527]: "Peele also wrote:"
                  - blockquote [ref=e528]:
                    - generic [ref=e529]:
                      - text: The two randomized studies in which AA treatment was assigned found AA to yield worse outcomes than other forms of treatment — or no treatment at all.
                      - paragraph [ref=e530]:
                        - text: "(See Brandsma et al., The Outpatient Treatment of Alcoholism: A Review and Comparative Study, Baltimore: University Park Press, 1980;"
                        - text: Ditman et al., "A controlled study on the use of court probation for drunk arrests," American Journal of Psychiatry, 124:160-163, 1967.)
                    - paragraph [ref=e531]:
                      - generic [ref=e532]: But Walsh et al. ("A randomized trial of treatment options for alcohol-abusing workers", The New England Journal of Medicine, 325:775-782, 1991) allowed alcoholics limited choices, and those who chose AA still did worst (about as bad as those assigned to AA).
                      - generic [ref=e533]:
                        - text: AA's role in society — more negative than positive?
                        - link "http://www.peele.net/faq/aarole.html" [ref=e534] [cursor=pointer]:
                          - /url: http://web.archive.org/web/20161020131749/http://www.peele.net/faq/aarole.html
                  - paragraph [ref=e535]: There, the success rate of A.A. was again negative — worse than zero. A.A. was hurting people by making it harder for them to quit and stay sober. Those patients who got no A.A. "treatment" at all were better off.
                  - paragraph [ref=e536]:
                    - text: In addition, Stanton Peele has argued, in an article in The Sciences, that the most widely used alcoholism treatments (Twelve-Step) are the least effective. "This is seen in Deborah Dawson's (1996) analysis of data from the 1992 National Longitudinal Alcohol Epidemiologic Survey." Peele suggests that the "brief intervention" and "motivational enhancement" treatments are more successful alternatives.
                    - generic [ref=e537]: (Peele, Stanton. The Sciences, 1998, vol. 38, no. 2, Mar-Apr, pp. 17-21.)
                  - paragraph [ref=e538]
                  - generic [ref=e539]:
                    - img
                  - paragraph [ref=e540]: "This is the study by Dr. Walsh and associates that Stanton Peele referred to:"
                  - paragraph
                  - table [ref=e543]:
                    - rowgroup [ref=e544]:
                      - row "A RANDOMIZED TRIAL OF TREATMENT OPTIONS FOR ALCOHOL-ABUSING WORKERS" [ref=e545]:
                        - columnheader "A RANDOMIZED TRIAL OF TREATMENT OPTIONS FOR ALCOHOL-ABUSING WORKERS" [ref=e546]
                      - row [ref=e547]:
                        - cell [ref=e548]:
                          - generic [ref=e550]:
                            - generic [ref=e552]:
                              - heading "Abstract" [level=2] [ref=e553]
                              - generic [ref=e554]: Background.
                              - text: Employee-assistance programs sponsored by companies or labor unions identify workers who abuse alcohol and refer them for care, often to inpatient rehabilitation programs. Yet the effectiveness of inpatient treatment, as compared with a variety of less intensive alternatives, has repeatedly been called into question. In this study, anchored in the work site, we compared the effectiveness of mandatory in-hospital treatment with that of required attendance at the meetings of a self-help group and a choice of treatment options.
                              - paragraph [ref=e555]:
                                - generic [ref=e556]: Methods.
                                - text: "We randomly assigned a series of 227 workers newly identified as abusing alcohol to one of three rehabilitation regimens: compulsory inpatient treatment, compulsory attendance at Alcoholics Anonymous (AA) meetings, and a choice of options. Inpatient backup was provided if needed. The groups were compared in terms of 12 job-performance variables and 12 measures of drinking and drug use during a two-year follow-up period."
                              - paragraph [ref=e557]:
                                - generic [ref=e558]: Results.
                                - text: All three groups improved, and no significant differences were found among the groups in job-related outcome variables. On seven measures of drinking and drug use, however, we found significant differences at several follow-up assessments. The hospital group fared best and that assigned to AA the least well; those allowed to choose a program had intermediate outcomes. Additional inpatient treatment was required significantly more often (P<0.0001) by the AA group (63 percent) and the choice group (38 percent) than by subjects assigned to initial treatment in the hospital (23 percent). The differences among the groups were especially pronounced for workers who had used cocaine within six months before study entry. The estimated costs of inpatient treatment for the AA and choice groups averaged only 10 percent less than the costs for the hospital group because of their higher rates of additional treatment.
                              - paragraph [ref=e559]:
                                - generic [ref=e560]: Conclusions.
                                - text: Even for employed problem drinkers who are not abusing drugs and who have no serious medical problems, an initial referral to AA alone or a choice of programs, although less costly than inpatient care, involves more risk than compulsory inpatient treatment and should be accompanied by close monitoring for signs of incipient relapse.
                              - paragraph
                              - paragraph [ref=e561]:
                                - generic [ref=e562]:
                                  - text: Diana Chapman Walsh, Ph.D.,
                                  - text: Ralph W. Hingson, SC.D.,
                                  - text: Daniel M. Merrigan, S.J., Ed.D., M.P.H.,
                                  - text: Suzette Morelock Levenson, M.P.H.,
                                  - text: L. Adrienne Cupples, Ph.D.,
                                  - text: Timothy Heeren, Ph.D.,
                                  - text: Gerald A. Coffman, M.S.,
                                  - text: Charles A. Becker, M.S.,
                                  - text: Thomas A. Barker, M.P.H.,
                                  - text: Susan K. Hamilton,
                                  - text: Thomas G. McGuire, Ph.D.,
                                  - text: and Cecil A. Kelly, C.A.C.
                                  - text: "\"A RANDOMIZED TRIAL OF TREATMENT OPTIONS FOR ALCOHOL-ABUSING WORKERS\","
                                  - text: The New England Journal of Medicine, Volume 325, pages 775-782, September 12, 1991
                            - paragraph
                  - paragraph [ref=e563]: "The reported results included:"
                  - paragraph
                  - blockquote [ref=e564]:
                    - generic [ref=e565]:
                      - text: Drinking Outcomes
                      - text: ... On four of the measures of drinking (mean number of daily drinks, number of drinking days per month, binges, and serious symptoms), we found no significant differences among the three groups at any follow-up point.
                      - text: On the remaining eight measures of drinking and drug use (any drinking, intoxication, blackouts, Iowa stage, Rand impairment score, definite alcoholism, cocaine use, and time to additional treatment), however, there were statistically significant differences among the three groups at one to four follow-up points. In terms of all but two of these measures, the hospital group had the fewest problems... ... On most, the compulsory A.A. group did the least well. ... The hospital group was significantly more likely to include continuous abstainers (37 percent vs. 17 percent for the choice group and 16 percent for AA only).
                    - paragraph [ref=e566]:
                      - generic [ref=e567]:
                        - text: Other Drugs and Group Outcomes
                        - text: The compulsory AA group fared the least well overall. In addition, patients who were abusing cocaine, together with alcohol, did especially poorly in the AA group... ... The 30 cocaine users who were assigned to the AA group had the most evidence of problems on these measures of drinking, and they were the most likely, at every follow-up assessment, to report continued use of cocaine...
                      - text: (Page 778.)
                  - paragraph
                  - paragraph [ref=e568]:
                    - text: Note that most of the people who were sent to A.A. (63%) ended up requiring hospitalization anyway. In addition, they actually got worse while they were in A.A., so that they ended up requiring higher rates of expensive follow-up treatment in the hospital. The total cost savings from sending people to the "free" A.A. treatment, instead of hospitalizing them right away, was only 10%. This contradicts the often-repeated A.A. declaration that A.A. is
                    - generic [ref=e569]: "\"the most cost-effective treatment program\""
                    - text: ", because it is free. It isn't cost-effective or \"free\" when all it does is make the patients worse, and make it more expensive for some hospital to clean up the mess later on. Walsh et. al. wrote:"
                  - paragraph
                  - blockquote [ref=e570]:
                    - generic [ref=e571]: When we compared the costs of treatment for the A.A. and hospital groups, we found that the costs for the A.A. group averaged $1,200 less per person, a savings of just 10 percent. Even though the initial referral to AA was free, the AA group had much higher rates of additional treatment; 63 percent of subjects randomly assigned to AA eventually required hospitalization.
                    - text: (Page 780.)
                  - paragraph [ref=e572]: "And using A.A. to treat patients who were abusing both alcohol and cocaine was a total disaster:"
