                    - text: ) They were Ernie Galbraith the relapsing womanizer, and Bill Dotson the lawyer. Ernie Galbraith was another disaster in the long run, so he doesn't count as any kind of an A.A. victory either. Ernie ended up seducing Doctor Bob's daughter Susan, and relapsing constantly. In the end, Doctor Bob wished he had never recruited Ernie.
                    - text: Ernie G. wrote the story "The Seven-Month Slip" for the first edition of the Big Book. That "slip" was a full-blown seven-month-long relapse, not some little slip at the end of seven months of sobriety. Ernie never achieved anything like lasting sobriety, in or out of A.A.. See the Cult Test item,
                    - link "Disturbed Guru" [ref=e2998] [cursor=pointer]:
                      - /url: /content/cult-slogans#Galbraith
                    - text: ", for more about Ernie, Susan, and Doctor Bob."
                  - paragraph [ref=e2999]:
                    - link "11" [ref=e3000] [cursor=pointer]:
                      - /url: "#ftnt11_ret"
                    - text: ") The National Treatment Center Study conducted by the University of Georgia found that 93 percent of the more than 400 representative alcohol treatment programs surveyed were based on the twelve steps of A.A.. See:"
                    - text: "Alcohol Treatment: When Faith-based Options Aren't Enough, By: Fletcher, Anne M., Humanist, 00187399, Nov/Dec2001, Vol. 61, Issue 6."
                    - text: "Also see: National Treatment Center Study Report by Paul Roman and Terry Blum, Institute for Behavioral Research, Athens, Georgia, 1997."
                    - text: Michael Lemanski, in his book History of Addiction and Recovery in the United States, gives us a few more details on page 121 — that 96% of the inpatient facilities use 12-step treatment, but that over 90% of the facilities in the USA (both inpatient and outpatient, but mostly outpatient) are 12-step. The 93% number would appear to be an average of the inpatient and outpatient facilities' numbers.
                  - paragraph
                  - blockquote [ref=e3001]:
                    - generic [ref=e3002]:
                      - text: "UPDATE: 2012.08.28: For many years now, I have been quoting the National Treatment Center in Atlanta, Georgia, which found in 1996 that 93% of the treatment centers in the country used the 12-Step model. Well, it turns out that they did another study in 2005, and found that only 75% of the treatment centers are now using the 12-Step model. That is a big drop."
