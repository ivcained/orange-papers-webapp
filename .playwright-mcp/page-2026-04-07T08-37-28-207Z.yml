                  - paragraph [ref=e1464]:
                    - text: The entire back two thirds of the Big Book, the collection of autobiographical stories, is just one long demonstration of the propaganda technique called
                    - generic [ref=e1465]:
                      - text: "\""
                      - link "Proof by Anecdote" [ref=e1466] [cursor=pointer]:
                        - /url: /content/propaganda#anecdote
                      - text: ."
                    - text: That's the stunt where you tell one or more individual stories that appear to support your grand generalization, and then you triumphantly conclude that your point is proven.
                  - paragraph [ref=e1467]: "For example: President Ronald Reagan gave a speech on TV where he told of Sandinista soldiers tying a priest to a tree and beating him. Reagan concluded that this story was proof enough of the evils of the Sandinistas to justify the USA waging an undeclared, illegal, war against Nicaragua for several years, the war that ended with the treasonous Iran-Contra Arms-for-Hostages and the Oliver-North-Contra Cocaine-for-Guns fiascoes. (President Reagan didn't bother to give any TV speeches complaining about how many Nicaraguan civilians were killed by the Contras, or how many American inner-city black kids were killed by the Contras' cocaine. Just a few stories of Sandinista soldiers' misbehavior was all of the anecdotal evidence that Reagan needed or wanted...)"
                  - paragraph [ref=e1468]:
                    - text: Likewise, Bill Wilson pointed to some people who had quit drinking while attending A.A. meetings, and printed a bunch of their testimonial stories in the Big Book, "Alcoholics Anonymous", and then said that they proved that the Twelve Steps work. He gave no evidence that those people would not have just quit anyway without A.A.; that they weren't cases of spontaneous remission — people who quit drinking because they just got sick and tired of being sick and tired. Wilson claimed that the "spiritual" A.A. program had made them quit, and then tried to use Proof By Anectode to "prove" it. And then Bill said absolutely nothing when
                    - link "most of those Big Book authors later relapsed" [ref=e1469] [cursor=pointer]:
                      - /url: "#BB_relapses"
                    - text: .
                  - paragraph [ref=e1470]: "Barry L. Beyerstein, Ph.D., wrote an article, Why Bogus Therapies Often Seem to Work, where he explained how informal testimonials are erroneously accepted as proof of the success of bogus therapies:"
                  - paragraph
                  - blockquote [ref=e1471]:
                    - generic [ref=e1472]:
                      - text: "Many dubious methods remain on the market primarily because satisfied customers offer testimonials to their worth. Essentially, these people say: \"I tried it, and I got better, so it must be effective.\" The electronic and print media typically portray testimonials as valid evidence. But without proper testing, it is difficult or impossible to determine whether this is so."
                      - text: ...
                      - text: Many diseases are self-limiting. If the condition is not chronic or fatal, the body's own recuperative processes usually restore the sufferer to health. Thus, to demonstrate that a therapy is effective, its proponents must show that the number of patients listed as improved exceeds the number expected to recover without any treatment at all (or that they recover reliably faster than if left untreated). Without detailed records of successes and failures for a large enough number of patients with the same complaint, someone cannot legitimately claim to have exceeded the published norms for unaided recovery.
                      - text: ...
                      - text: Buyer Beware!
                      - text: The job of distinguishing real from spurious causal relationships requires well designed studies and logical abstractions from large bodies of data. Many sources of error can mislead people who rely on intuition or informal reasoning to analyze complex events.
                    - paragraph [ref=e1473]:
                      - generic [ref=e1474]: Before agreeing to any kind of treatment, you should feel confident that it makes sense and has been scientifically validated through studies that control for placebo responses, compliance effects, and judgmental errors. You should be very wary if the "evidence" consists merely of testimonials, self-published pamphlets or books, or items from the popular media.
                      - generic [ref=e1475]:
                        - text: "See:"
                        - link "http://www.quackwatch.org/01QuackeryRelatedTopics/altbelief.html" [ref=e1476] [cursor=pointer]:
                          - /url: http://web.archive.org/web/20161020131749/http://www.quackwatch.org/01QuackeryRelatedTopics/altbelief.html
                  - paragraph [ref=e1477]: "Dr. David Duncan has an interesting story about anecdotal evidence and testimonials:"
                  - paragraph
                  - blockquote [ref=e1478]:
                    - generic [ref=e1479]:
                      - text: That some of the people who receive ineffective or even harmful treatment will recover anyway and will in most cases credit the treatment for their recovery is the rule rather than the exception in all areas of treatment.
                      - paragraph [ref=e1480]: We have known for several decades now that having single coronary bypass surgery lowers a patient's life expectancy rather than making them less likely to have another heart attack, but it continues to be one of the most common surgical procedures in America and you will find many thousands of patients who believe it saved their life. (It does provide pain relief for heart patients who suffer from angina pectoris, but most who have the surgery don't suffer from angina.)
                      - paragraph [ref=e1481]: Quite a few years ago a friend of mine was involved in closing down a group of "kidney specialists" who were impostors with no medical training at all. They ran a clinic, infirmary and pharmacy for end state renal disease cases, where they sold their patients placeboes and performed surgery that consisted only in cutting the patient's skin and then suturing the wound. When they were shut down after several years, my friend surveyed their surviving patients and the families of those (the majority) who had died. A majority of both groups rated the care provided as excellent ("best possible" was the median rating), and only a few families felt that their deceased relative had received less than adequate care. Of those who were still alive, most were still sick but some had recovered and many credited the phoney doctors and their fake treatment with having saved their lives.
                      - paragraph [ref=e1482]: That is why researchers like myself are totally unimpressed by patient testimonials. Effective treatments and ineffective treatments are equally likely to produce ample numbers of satisfied patients, some of whom really have recovered, whether because of or despite the treatment they received. Of course, a smaller percentage of the patients who undergo the ineffective treatment will recover, but if that is a common form of treatment then the numbers of those recovered patients who endorse it will be large. If it is the most common type of treatment, then the ineffective treatment may be credited with more cures than the effective. Such has often been the case.
                    - paragraph [ref=e1483]:
                      - generic [ref=e1484]:
                        - text: David F. Duncan, DrPH, CAS, FAAHB
                        - text: President
                        - text: Duncan & Associates
                        - link "http://www.duncan-associates.com" [ref=e1485] [cursor=pointer]:
                          - /url: http://web.archive.org/web/20161020131749/http://www.duncan-associates.com/
                        - text: Clinical Associate Professor
                        - text: Brown University Medical School
                        - text: http://center.butler.brown.edu
                        - text: Chair
                        - text: Council on Illicit Drugs
                        - text: Nat'l. Ass'n. for Public Health Policy
                        - link "http://www.illicit-drugs.org" [ref=e1486] [cursor=pointer]:
                          - /url: http://web.archive.org/web/20161020131749/http://www.illicit-drugs.org/
                  - paragraph [ref=e1487]: "When I wrote to Dr. Duncan, asking for details of the story, and the name of his friend who shut down the quacks, he replied:"
                  - paragraph
                  - blockquote [ref=e1488]:
                    - generic [ref=e1489]:
                      - text: His name was Mike Deckler and I believe it was in the late '50s or early '60s — he told me the story in 1973. He was working in the South at the time of the event and it was in North or South Carolina I think.
                      - paragraph [ref=e1490]: Accounts of patients who are very pleased with completely phoney treatments are commonplace. In blind controlled trials the patients receiving a placebo treatment are typically as satisfied as those who get a real treatment and those who recover spontaneously in the control group usually credit the sugar pills with curing them. When the trial is double-blind the clinicians are typically as unable as the patients to tell whether the treatment was real or not.
                    - paragraph [ref=e1491]:
                      - generic [ref=e1492]: David F. Duncan, DrPH, CAS, FAAHB
                  - paragraph [ref=e1493]
                  - generic [ref=e1494]:
                    - img
                  - paragraph [ref=e1495]: "We do not have nearly enough properly-done scientific tests of the various popular alcoholism treatment programs. Alcoholics Anonymous has a reputation for not liking scientists poking too deeply into its affairs. The very nature of the A.A. organization makes measurement of success very difficult. Everyone is anonymous; people are members if they say they are, and aren't if they say they aren't. Also, when someone relapses and disappears, he is then assumed to not be a member. Thus any casual glance at A.A. will be biased by cherry-picking: only the success stories are around to be counted. So we must be very careful about statistics and surveys, and ask who is doing the counting, and what they are counting, and how they are counting, and how they are defining success."
                  - paragraph [ref=e1496]: "Le, Ingvarson, and Page put it well:"
                  - blockquote [ref=e1497]:
                    - generic [ref=e1498]: Research is less clear as to whether working the AA program is helpful in achieving sobriety. Outcome studies have attempted to assess AA's effectiveness by investigating the relationship between AA attendance and length of abstinence. Several studies have found that AA members report greater abstinence than nonmembers (Cross, Morgan, Mooney, Martin, & Rafter, 1990; Hoffman, Harrison, & Belille, 1983; Thurstin, Alfano, & Nerviano, 1987), and that the longer the membership in AA the greater the length of sobriety (McBride, 1991). Unfortunately, these studies are methodologically flawed due to the voluntary nature of AA membership. With the only criterion for membership being "a desire to stop drinking" (AAWS, 1984, p. 2), it is likely that those attending AA recognize their drinking problem and are motivated to change. Because of this self-selection it becomes impossible to know whether it is AA efficacy or member motivation that is being measured (Bebbington, 1976). Additional problems involved in the scientific research of AA include member anonymity, lack of control groups, and the confounding effects of other treatment programs. These difficulties have led researchers to conclude that the effectiveness of AA has yet to be proven (Bebbington, 1976; Bufe, 1991; Glaser & Ogbome, 1982; Vaillant, 1983) and that the study of AA may need "unprecedented standards of measurement not appropriate to other treatment programs" (Leach, 1973, p. 277).
                    - generic [ref=e1499]:
                      - text: "Alcoholics Anonymous and the Counseling Profession: Philosophies in conflict by Christine Le, Erik P. Ingvarson, and Richard C. Page, Journal of Counseling & Development, 07-01-1995, page 603."
                      - generic [ref=e1500]:
                        - text: "[See the bibliography at the end of this file for"
                        - link "the list of references" [ref=e1501] [cursor=pointer]:
                          - /url: "#Le_references"
                        - text: cited here.]
                  - paragraph [ref=e1502]: As Christine Le said, those people who wish to quit drinking go to A.A. meetings, while those who do not desire to quit drinking go someplace else, like to the bar. So of course the people in an A.A. meeting will report (somewhat) greater abstinence from alcohol than the other alcoholics. But that does not prove or even hint that Alcoholics Anonymous has somehow caused the alcoholics to drink less. Their own desire to quit drinking has caused them to drink less.
                  - paragraph [ref=e1503]:
                    - text: Something else to watch for is improper or biased testing. In
                    - link "a study of the use of LSD in therapy for alcoholism" [ref=e1504] [cursor=pointer]:
                      - /url: "#LSD_Toronto"
                    - text: ", the authors also studied the methods that other studies had used. Their observations were disconcerting — it seems that people have an unfortunate tendency to see whatever they wish to see whenever tests are not rigidly controlled:"
                  - paragraph
                  - blockquote [ref=e1505]:
                    - generic [ref=e1506]: Unfortunately, the absence of control groups in research on new psychiatric treatments seems to be the rule rather than the exception. To illustrate, Foulds (1958) found that 72 per cent of the research studies of new treatments reported in psychiatric journals (1951-1956) lacked controls. Moreover, he found that 83 per cent of the uncontrolled studies, but only 25 per cent of the controlled studies, reported that the treatments were successful. In addition, Glick and Margolis (1962), after reviewing the literature on chlorpromazine, found significantly lower clinical improvement rates in double-blind controlled studies than in non-blind uncontrolled studies, such as those discussed here, to yield a considerably higher number of positive results. The larger proportion of positive results in uncontrolled studies exists despite the lack of the very elements of design which would allow any firm conclusion.
                    - generic [ref=e1507]:
                      - text: Lysergic Acid Diethylamide (LSD) In The Treatment Of Alcoholism; An Investigation of its Effects on Drinking Behavior, Personality Structure, and Social Functioning, by Reginald G. Smart, Ph.D., Thomas Storm, Ph.D., Earle F. W. Baker, M.D., F.R.C.P.(C), Lionel Solursh, M.D., F.R.C.P.(C), 1967, page 48.
                      - text: "References cited:"
                      - text: "Foulds, G.: Clinical research in psychiatry, J. Ment. Sc., 104, 259-65, 1958."
                      - text: "Glick, B., & Margolis, R.: A study of the influence of experimental design on clinical outcome in drug research, Am. J. Psychiat., 118, 1087-96, 1962."
                    - paragraph
                  - paragraph
                  - paragraph [ref=e1508]: So, the various treatments being tested were successful in 83 percent of the uncontrolled studies, but only in 25 percent of the controlled studies? How curious. It would seem that looking too closely, and measuring too carefully, makes the medicines or treatments suddenly stop working.
                  - paragraph [ref=e1509]: That's a good example of researcher bias. The researchers just really wanted their experiments to be successes, so that's what they tended to see. But when their studies were rigorously controlled, the researchers were forced to be more objective, and the "observed" success rate dropped sharply.
                  - paragraph [ref=e1510]:
                    - text: That Reginald Smart, et. al. study was done in 1967, but the situation does not seem to have changed much since then, if at all. Project MATCH was a $27 million study of alcoholism treatment programs funded by the U.S. Government (actually, the NIAAA) which also had no control groups, and at the end of it, the researchers happily announced that "treatment works", without having anything with which to compare the treated group to determine whether the treatment had actually had any effect at all. The whole project was just a huge waste of money. Such flawed testing of drug addiction and alcoholism treatment programs is all too typical. All too often, they simply measure the spontaneous remission rate once again, and then erroneously claim that the observed cases of recovery were caused by the treatment.
                    - generic [ref=e1511]: "(For the report on Project MATCH see: Matching Alcoholism Treatments to Client Heterogeneity; Project MATCH Posttreatment Drinking Outcomes, by Project MATCH Research Group, Journal of Studies on Alcohol, January 1997, pp. 7-29.)"
                  - paragraph [ref=e1512]: "ScienceNOW magazine analyzed the results of Project MATCH, and concluded:"
                  - paragraph
                  - blockquote [ref=e1513]:
                    - generic [ref=e1514]:
                      - text: You can toss out the window any convictions about the best form of psychotherapy to get alcoholics to quit drinking. Contrary to a leading theory, it doesn't seem to matter which kind of technique you use. That's the bottom line of a 6-year, $27 million study whose findings were announced by the National Institute on Alcohol Abuse and Alcoholism (NIAAA) at a press conference here today.
                      - paragraph [ref=e1515]: In recent years, a number of clinical studies have suggested that "matching" particular types of alcoholics with particular treatments — for example, teaching someone with poor impulse control how to think through actions before taking them — would help them quit drinking. Indeed, that was the premise behind NIAAA's Project MATCH, the most rigorous and extensive clinical trial ever of therapies for alcoholics.
                      - paragraph [ref=e1516]: "The study involved 25 research institutions and 1726 alcoholics who were randomly assigned to 12 weekly sessions of one of three types of individual psychotherapy: cognitive-behavioral therapy (which seeks to teach new ways of thinking), motivational therapy (in which the patient is encouraged to take responsibility for his own recovery), and a spiritually oriented therapy derived from the philosophy of Alcoholics Anonymous (AA). The researchers' hypothesis was that people with \"high cognitive impairment\" would benefit from the first therapy, unmotivated people from the second, and \"meaning-seeking\" people from the third."
                      - paragraph [ref=e1517]: All therapies, however, appeared to be equally effective — a year later, the average number of drinking days per month among all participants had declined from 25 to six. "Outcomes were not substantially improved by patient matching," says Gerard J. Connors of the New York State Research Institute on Addictions. The main exception was that patients with few psychiatric problems and "meaning-seekers" did better with the AA-based therapy. They also went to more AA meetings.
                    - paragraph [ref=e1518]:
                      - generic [ref=e1519]: The results show that "we're not yet at the core of what the pathophysiological changes are in alcoholism," says NIAAA director Enoch Gordis. Nonetheless, he says, the findings also suggest that "competently run programs" work.
                      - generic [ref=e1520]: Rewriting the Book on How to Treat Alcoholics, the editorial staff, ScienceNOW magazine, 12-17-1996.
                  - paragraph [ref=e1521]:
                    - text: Note that many doctors and researchers strongly disagree with Mr. Gordis' optimistic statement that treatment works. Project MATCH lavished so much money and attention on the patients that what they received was anything but a usual treatment program. The subjects were even paid money to come to treatment sessions. That's sure to make them
                    - generic [ref=e1522]: "\"Keep Coming Back!\""
                    - text: ", even if it doesn't work at all."
                    - generic [ref=e1523]: ("I'll go to 'treatment' and get paid, then we can buy a big jug of wine and go sit under the bridge and get smashed...")
                  - paragraph [ref=e1524]: Also, there was a lot of cherry-picking and bias in the selection of the patients. Basically, the unmotivated losers were filtered out because the doctors wanted people who would complete the programs, so that they could get some test results. So of course the hand-picked, highly motivated patients showed a lot of improvement — much more than is "normal" or usual.
                  - paragraph [ref=e1525]:
                    - text: "And again, there was no control group, so we cannot do a side-by-side comparison to see just how well the treatment really worked. And obviously, the very first thing we would have to do is subtract out the usual spontaneous remission rate from the successes, to see what else, if anything, was going on there. We have to ask the big important question:"
                    - generic [ref=e1526]: "\"What percentage of those hand-picked, pampered, paid, and highly motivated patients would have quit drinking on their own anyway — especially if they were just paid and pampered, but got no 'treatment'?\""
                  - paragraph [ref=e1527]:
                    - generic [ref=e1528]:
                      - text: (For that matter, why didn't they test just paying the patients not to drink? Other researchers have found that to work. See
                      - link "Herbert Fingarette, Heavy Drinking" [ref=e1529] [cursor=pointer]:
                        - /url: /content/bibliography#Fingarette
                      - text: .)
                  - paragraph [ref=e1530]: But without a control group, we can't calculate the rate of spontaneous remission among that particular set of patients, so most of the measurements are rendered meaningless. There is no standard against which to compare them.
                  - paragraph [ref=e1531]:
                    - text: "In any case, the results show that the A.A. claim of having the only working program is false. Project MATCH showed that all treatments were basically the same. It's like that goofy fried chicken commercial on TV:"
                    - generic [ref=e1532]: "\"Parts is parts.\""
                    - text: Well, "Treatment is treatment."
                  - paragraph [ref=e1533]: Obviously, if all treatment programs score about the same, and none of them score any better than the rate of spontaneous remission in the long run, then "treatment" of alcoholism doesn't really work at all, and is just a big waste of time and money.
                  - paragraph
                  - table [ref=e1536]:
                    - rowgroup [ref=e1537]:
                      - row [ref=e1538]:
                        - cell [ref=e1539]:
                          - generic [ref=e1540]:
                            - text: "Even though there was no control group in Project MATCH, a couple of doctors managed to get a close equivalent to a control group, and the results showed that treatment didn't really work:"
                            - paragraph
                            - blockquote [ref=e1541]:
                              - generic [ref=e1542]:
                                - text: Cutler and Fishbain reanalyzed data from a clinical trial known as Project MATCH, which included 1,726 alcohol-dependent volunteers who each received one of three alcoholism approaches.
                                - paragraph [ref=e1543]: Treatment included cognitive behavioral therapy, which focused on things like dealing with thoughts about alcohol and urges to drink or motivational enhancement therapy, which aimed to strengthen patients' commitment to change and feelings of personal responsibility. The third approach was a program that introduced the first few "steps" of the Alcoholics Anonymous 12-step approach.
                                - paragraph [ref=e1544]: At the time the original study results were reported in the late 1990s, they were hailed as demonstrating the success of all three strategies, because there were no clear differences in patients' outcomes regardless of which therapy they received.
                                - paragraph [ref=e1545]: But Culter and Fishbain looked at the data in a different way, comparing the outcomes of participants who immediately dropped out of treatment with those of men and women who completed treatment.
                                - paragraph [ref=e1546]: They found that in the months following treatment, study participants who attended no therapy sessions did nearly as well as those who went to all sessions. On average, those who received no treatment were abstinent for 72 percent of the days the original investigators followed them.
                                - paragraph [ref=e1547]: Cutler and Fishbain found that patients who stuck with treatment made most of their improvement in the first week, before they had received the bulk of their therapy.
                                - paragraph [ref=e1548]: All of this, according to the researchers, suggests that motivated people entered the trial and that's why all the treatment approaches were successful.
                              - paragraph [ref=e1549]:
                                - generic [ref=e1550]: Enrolling in a study, they write, "suggests that the alcoholic has crystallized a decision to reduce or abstain from drinking."
                                - generic [ref=e1551]:
                                  - text: Alexander DeLuca, M.D., Study Questions Effectiveness of Alcoholism Therapy,
                                  - link "http://www.doctordeluca.com/Library/AbstinenceHR/EffectivenessAlcRx05.htm" [ref=e1552] [cursor=pointer]:
                                    - /url: http://web.archive.org/web/20161020131749/http://www.doctordeluca.com/Library/AbstinenceHR/EffectivenessAlcRx05.htm
                            - paragraph [ref=e1553]: "That study brings up a very interesting question:"
                            - paragraph [ref=e1554]: If treatment is necessary or even somehow helpful for quitting drinking, then how can treatment centers and treatment programs demand that the patients stop drinking at Day One of the program, before the patients have gotten any treatment?
                            - paragraph [ref=e1555]: How can the so-called therapists and counselors demand that the patients act like they have gotten the full course of treatment — in other words, keep themselves sober — when the patients haven't actually gotten any "treatment" yet?
                            - paragraph [ref=e1556]: I can't think of another medical treatment where the doctor demands that the patients recover before they get the medicine.
                          - paragraph [ref=e1557]:
                            - generic [ref=e1558]: And if the patients really can quit drinking before getting the treatment, then the treatment is unnecessary, and is probably just a waste of time and money.
                  - paragraph [ref=e1559]
                  - table [ref=e1562]:
                    - rowgroup [ref=e1563]:
                      - row [ref=e1564]:
                        - cell [ref=e1565]:
                          - generic [ref=e1566]:
                            - text: The original idea behind Project MATCH was that some patients would do better in free A.A. meetings, while others needed professional treatment. It was also an attempt to explain why A.A. failed every test of the effectiveness of A.A. treatment. The logic was,
                            - generic [ref=e1567]: "\"Well I know that some people recover in A.A.; I've seen it. So there must be some other people who respond to A.A. very poorly, and they are pulling down the averages. Their failures are masking the other peoples' sucesses. If we can match the patients to the treatment, we will get better results.\""
                            - paragraph [ref=e1568]:
                              - text: The first mistake was in assuming that because some people recover in A.A. rooms, that they recover because of Alcoholics Anonymous. That is assuming a cause-and-effect relationship where none may exist. We can, with equal validity, say,
                              - generic [ref=e1569]: "\"I know that people recover in hospital rooms that are painted green — I've seen it with my own eyes. So the healing effects of green rooms are an established fact.\""
                            - paragraph [ref=e1570]:
                              - text: And we could also continue with that flawed logic like this,
                              - generic [ref=e1571]: "\"So if we separate the patients who will respond well to green rooms from those who will do poorly, and just put the first group in the green rooms, then we can improve the healing rate of our patients.\""
                            - paragraph [ref=e1572]:
                              - text: Unfortunately, such a strategy is just as flawed as saying,
                              - generic [ref=e1573]: "\"If we can separate out the times that the roulette wheel will hit on red from the times that it will hit on black, and then only bet red when red is coming up, then we can make a whole lot of money.\""
                              - text: Alas, no one has ever been able to do it.
                            - paragraph [ref=e1574]: One person has come up with what looks like an interesting approach. For her Doctoral thesis, Barbara Ann Wilmes explored the concept of locus of control and its applicability to choosing an A.A-based recovery program or a Rational Recovery (or SMART) program. The idea behind locus of control is that some people see their lives as being controlled by external forces; they feel like they are just leaves getting blown around in the wind. They see the center of control of their lives as being outside of themselves. They have an external locus of control.
                            - paragraph [ref=e1575]: Other people feel that they are very much in control of their own lives; they see what happens to them as being caused by their own actions. They have an internal locus of control.
                            - paragraph [ref=e1576]: Wilmes found that people who felt that external forces controlled their lives, and that they were "powerless over alcohol", preferred A.A., where they felt that an external "Higher Power" or "Power Greater Than Themselves" would make them quit drinking.
                            - paragraph [ref=e1577]: "On the other hand, the internal-locus people preferred Rational Recovery or SMART where they were taught to control their own behavior themselves. And in fact, many of the A.A. dropouts left because they strongly disagreed with the A.A. philosophy of powerlessness. They went and joined R.R. or SMART:"
                            - paragraph
                            - blockquote [ref=e1578]:
                              - generic [ref=e1579]: "\"Twenty-two of the 24 RR/RSN subjects who left Alcoholics Anonymous reported doing so because they explicitly disagreed with the philosophy of the Alcoholics Anonymous program and were strongly dissatisfied with their experience there.\""
                              - generic [ref=e1580]:
                                - text: "Wilmes, Barbara Ann, ALCOHOLICS ANONYMOUS & RATIONAL RECOVERY: A COMPARISON OF LOCUS OF CONTROL AND ITS IMPLICATIONS IN TREATMENT PLANNING, page 99."
                                - text: Submitted in partial fulfillment of the Requirements for the degree of Doctor of Social Welfare in the Adelphi University School of Social Work, Spring 1988.
                                - text: Printed by UMI Dissertation Services, 300 North Zeeb Road, P.O. Box 1346, Ann Arbor, Michigan 48106-1346.
                                - text: 1-800-521-0600 734-761-4700
                                - link "http://www.umi.com/" [ref=e1581] [cursor=pointer]:
                                  - /url: http://web.archive.org/web/20161020131749/http://www.umi.com/
                                - text: This book is available through an interlibrary loan from Adelphi University Libraries, Garden City, New York.
                          - paragraph [ref=e1582]: Note that Wilmes did not find that matching people with recovery groups by their locus of control produced greater abstinence or sobriety. (She didn't test for that; she didn't have the resources for such a long-term test.) She just found that they liked their groups better.
                  - paragraph [ref=e1583]
                  - generic [ref=e1584]:
                    - img
                  - paragraph [ref=e1585]
                  - paragraph [ref=e1586]:
                    - text: "For many years in the 1970s and 1980s, the AA GSO (Alcoholics Anonymous General Service Organization) conducted triennial surveys where they counted their members and asked questions like how long members had been sober. Around 1990, they published a commentary on the surveys: Comments on A.A.'s Triennial Surveys [no author listed, published by Alcoholics Anonymous World Services, Inc., New York, no date (probably 1990)]. The document has an A.A. identification number of \"5M/12-90/TC\". ("
                    - link "There is a copy here" [ref=e1587] [cursor=pointer]:
                      - /url: triennial.pdf
                    - text: .) The document was produced for A.A. internal use only. It has a graph on page 12 (Diagram C-1) that shows that newcomers drop out, relapse, leave, or disappear at a staggeringly high rate.
                    - superscript [ref=e1589]:
                      - link "8" [ref=e1590] [cursor=pointer]:
                        - /url: "#ftnt08"
                  - paragraph
                  - table [ref=e1593]:
                    - rowgroup [ref=e1594]:
                      - 'row "Figure C-1 from page 12 of the Commentary on the Triennial Surveys (from 1977 to 1989), A.A. internal document number 5M/12-90/TC Also see: Addiction, Change & Choice; The New View of Alcoholism, Vince Fox, M.Ed. CRREd., page 66" [ref=e1595]':
                        - 'cell "Figure C-1 from page 12 of the Commentary on the Triennial Surveys (from 1977 to 1989), A.A. internal document number 5M/12-90/TC Also see: Addiction, Change & Choice; The New View of Alcoholism, Vince Fox, M.Ed. CRREd., page 66" [ref=e1596]':
                          - generic [ref=e1598]:
                            - img
                            - text: Figure C-1 from page 12 of the Commentary on the Triennial Surveys (from 1977 to 1989),
                            - link "A.A. internal document number 5M/12-90/TC" [ref=e1599] [cursor=pointer]:
                              - /url: triennial.pdf
                            - generic [ref=e1600]: "Also see: Addiction, Change & Choice; The New View of Alcoholism, Vince Fox, M.Ed. CRREd., page 66"
                  - paragraph [ref=e1601]: The first analysis of the graph that I got was the statement that the percentages that are shown in the graph are the percentages of newcomers remaining after the indicated number of months. But after a few years of thinking about it, I came to the conclusion that it isn't so. That would require a "longitudinal study", which means that you have to track people through time, and keep track of how they were doing, and see if they were still going to A.A.
                  - paragraph [ref=e1602]: Several critics have pointed out that the graph merely indicates how many months the people had been in A.A. when the triennial survey was done.
                  - paragraph [ref=e1603]:
                    - text: So what really happened was, some group secretary announced,
                    - generic [ref=e1604]: "\"Your attention please! All of you people with a year or less in A.A., listen up, because these questions are for you. Now, how many of you are in your first month in A.A.? Let's see a show of hands.\""
                    - text: And some hands go up.
                  - paragraph [ref=e1605]:
                    - generic [ref=e1606]: "\"Now, how many of you are in your second month in A.A.? Let's see a show of hands.\""
                    - text: And fewer hands go up.
                  - paragraph [ref=e1607]:
                    - generic [ref=e1608]: "\"Now, how many of you are in your third month in A.A.? Let's see a show of hands.\""
                    - text: And fewer hands go up.
                  - paragraph [ref=e1609]:
                    - text: And so on, until,
                    - generic [ref=e1610]: "\"Now, how many of you are in your twelfth month in A.A.? Let's see a show of hands.\""
                    - text: And far fewer hands go up.
                  - paragraph [ref=e1611]: Then they graphed the results as percentages of the total number of people counted. So the graph simply shows what percentage of the counted newcomers were in their first or second month, or seventh or twelfth month, or whatever.
                  - paragraph [ref=e1612]: Now some A.A. defenders have claimed that this chart shows really good results for A.A., like that 56% of the people who stayed for three months stayed for a full year. That appears to be true, but that is nothing to brag about, because the survey does not show a good retention rate for A.A., far from it.
                  - paragraph [ref=e1613]: "As a way of measuring the A.A. retention rate, the way that they did the survey is fatally flawed. Here is the big gotcha: The survey did not count the huge number of people who dropped out before the survey was done. They never asked, \"Will all of the people who are not here please raise your hand?\""
                  - paragraph [ref=e1614]: They counted almost none of the people who came to A.A., and didn't like what they saw, and walked out after a few meetings, and didn't come back. Those people were not around to be counted in the survey. So the numbers are worthless for determining the A.A. retention rate.
                  - paragraph [ref=e1615]: For instance, the graph does not show what percentage of the newcomers actually stayed for three months. All we know is that a large number of people came to A.A. and then dropped out, and some small fraction of them were left still attending meetings three months later.
                  - paragraph [ref=e1616]: The numbers do have some limited usefulness for determining the dropout rate though. It's one of those funny mathematical things that isn't reversible. We can use those numbers to determine that the A.A. dropout rate is at least as bad as some number, or worse, but we cannot determine that the A.A. retention rate is any better than some number, just because of all of those uncounted people.
                  - paragraph [ref=e1617]: Oh, and reinterpreting the results does not improve the case for A.A., just the opposite. The results may be even worse for A.A.
                  - paragraph [ref=e1618]:
                    - text: Note that we are not told exactly how the GSO decides who is a member. The most likely criterion is the one used by Bill C. in 1965. Charles Bufe pointed out that in a 1965 article in the Quarterly Journal of Studies on Alcohol, Bill C. considered anyone who had attended 10 or more meetings to be a member.
                    - superscript [ref=e1620]:
                      - link "5" [ref=e1621] [cursor=pointer]:
                        - /url: "#ftnt05"
                    - text: But that eliminates from the statistics all of those people who came looking for help, and attended a few or several meetings, but who were so put off by the religiosity and cultishness and faith-healing atmosphere that they stopped coming back, so such a selective process biases the numbers. It's
                    - link "cherry-picking" [ref=e1622] [cursor=pointer]:
                      - /url: /content/propaganda#observational
                    - text: .
                  - paragraph [ref=e1623]
                  - generic [ref=e1624]:
                    - img
                  - paragraph [ref=e1625]
                  - table [ref=e1628]:
                    - rowgroup [ref=e1629]:
                      - row "Please note that my opinion of the following document has changed over the years. The original interpreters of this document felt that it was a longitudinal study that tracked new members over time, to see how long they stayed in. A.A. defenders have been insisting that it was merely a one-day snap-shot of the composition of the population of new members with less than a year of membership. I have come to the conclusion that the second opinion is the correct one. Note that it doesn't matter which way you look at the study; the numbers still show a very high drop-out rate. In fact, interpreting the chart as a one-day chart actually makes the numbers worse, not better, because a one-day snapshot fails to count all of the dropouts who just came to a few meetings, disliked what they saw, and walked away, and did not come back to get counted in a survey." [ref=e1630]:
                        - cell "Please note that my opinion of the following document has changed over the years. The original interpreters of this document felt that it was a longitudinal study that tracked new members over time, to see how long they stayed in. A.A. defenders have been insisting that it was merely a one-day snap-shot of the composition of the population of new members with less than a year of membership. I have come to the conclusion that the second opinion is the correct one. Note that it doesn't matter which way you look at the study; the numbers still show a very high drop-out rate. In fact, interpreting the chart as a one-day chart actually makes the numbers worse, not better, because a one-day snapshot fails to count all of the dropouts who just came to a few meetings, disliked what they saw, and walked away, and did not come back to get counted in a survey." [ref=e1631]:
