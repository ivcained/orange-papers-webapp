                            - text: "We have developed a new alcohol treatment program: the Cheech'n'Chong Treatment Program. It works like this: whenever you get cravings for alcohol, you put on a ballerina's tutu and slippers, and Mickey Mouse ears, just like Cheech and Chong in the movie \"Up in Smoke.\" Then you jump up and down on one foot, while juggling five tennis balls, and reciting Shakespeare sonnets. Continue this procedure for as long as the cravings last."
                            - paragraph [ref=e2718]: This simple program has rarely been known to fail, except for a few unfortunates who are constitutionally incapable of being honest with themselves while wearing a tutu.
                            - paragraph [ref=e2719]: It works, if you work it.
                            - paragraph [ref=e2720]: "And so does my magical ice cream cure that I just invented: Every time you get cravings for alcohol, you just go to Baskin Robbins and eat ice cream instead of drinking alcohol."
                            - paragraph [ref=e2721]: I particularly recommend the French Vanilla. Definitely avoid the Rum Raisin.
                            - paragraph [ref=e2722]: This simple program does not and can not ever fail, if you completely give yourself to this simple program. RARELY HAVE we seen somebody fail this simple program, except for a few people who are constitutionally incapable of being honest with their ice cream. There are such unfortunates among us. They seem to have been born that way.
