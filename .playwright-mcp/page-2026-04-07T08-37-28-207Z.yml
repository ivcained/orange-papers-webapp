                            - paragraph [ref=e1634]: Note that it doesn't matter which way you look at the study; the numbers still show a very high drop-out rate. In fact, interpreting the chart as a one-day chart actually makes the numbers worse, not better, because a one-day snapshot fails to count all of the dropouts who just came to a few meetings, disliked what they saw, and walked away, and did not come back to get counted in a survey.
