                      - text: ", Dr. Ruth Fox, in Alcoholism: Behavioral Research, Therapeutic Approaches, edited by Ruth Fox, M.D., foreword by 'Mrs.' Marty Mann, Springer Publishing Company, Inc., New York, 1967.)"
                  - paragraph [ref=e2138]
